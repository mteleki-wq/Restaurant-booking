  });
  if(del) del.addEventListener('click', function(){
    PHOTO.file = null; PHOTO.remove = true;
    prev.style.backgroundImage = '';
    $('picNote').textContent = 'Photo will be removed when you save.';
    del.style.display = 'none';
    if(pick) pick.textContent = 'Add photo';
  });
  $('saveItem').addEventListener('click', function(){
    var qty=$('fQty').value.trim();
    var body={
      name:$('fName').value.trim(),
      description:$('fDesc').value.trim()||null,
      price_cents:toCents($('fPrice').value),
      category_id:$('fCat').value,
      station_id:$('fStation').value||null,
      dietary:chosenOf('diet'), allergens:chosenOf('allerg'), badges:chosenOf('badge'),
      remaining_qty: qty===''?null:Math.max(0,parseInt(qty,10)||0),
      visible:$('fVis').checked,
      allow_note:$('fNote').checked,
      gst_free:$('fGst')?$('fGst').checked:false
    };
    if(!body.name){ toast('Give the dish a name'); return; }
    if(!body.category_id){ toast('Choose a section'); return; }
    var wanted=chosenOf('groups');
    this.disabled=true;
    var p, itemId=i?i.id:null;
    if(i){ p=api('/rest/v1/rd_items?id=eq.'+i.id,{method:'PATCH',
        headers:{Prefer:'return=minimal'},body:JSON.stringify(body)}); }
    else{
      body.venue_id=VENUE.id;
      var sib=ITEMS.filter(function(x){ return x.category_id===body.category_id; });
      body.sort=(sib.length?Math.max.apply(null,sib.map(function(x){return x.sort||0;}))+1:1);
      p=api('/rest/v1/rd_items',{method:'POST',headers:{Prefer:'return=representation'},
        body:JSON.stringify(body)}).then(function(rows){ itemId=rows&&rows[0]&&rows[0].id; });
    }
    p.then(function(){ return syncGroups(itemId, wanted); })
     .then(function(){
       /* The photo path uses the item id, so a brand-new dish has to exist
          before its picture can be filed under it. */
       if(PHOTO.remove && i){
         return api('/rest/v1/rd_items?id=eq.'+itemId, {method:'PATCH',
           headers:{Prefer:'return=minimal'},
           body: JSON.stringify({photo_url:null, thumb_url:null})});
       }
       if(!PHOTO.file || !itemId) return;
       $('saveItem').textContent = 'Uploading photo...';
       return uploadPhoto(itemId).then(function(urls){
         return api('/rest/v1/rd_items?id=eq.'+itemId, {method:'PATCH',
           headers:{Prefer:'return=minimal'}, body: JSON.stringify(urls)});
       });
     })
     .then(function(){ closeModal(); return reload(); })
     .then(function(){ toast('Saved'); })
     .catch(function(e){
       /* Distinguish a failed photo from a failed dish - the dish itself
          may well have saved, and saying "that did not save" would be a lie. */
       if(e && e.status && String(e.raw||'').length){
         toast('The dish saved, but the photo did not upload. Try the photo again.');
         closeModal(); reload(); return;
       }
       toast(apiErr(e)); $('saveItem').disabled=false;
       $('saveItem').textContent = 'Save';
     });
  });
}
function syncGroups(itemId, wanted){
  if(!itemId) return Promise.resolve();
  var have=LINKS.filter(function(l){ return l.item_id===itemId; }).map(function(l){ return l.group_id; });
  var add=wanted.filter(function(g){ return have.indexOf(g)<0; });
  var rm =have.filter(function(g){ return wanted.indexOf(g)<0; });
  var jobs=[];
  if(add.length){
    jobs.push(api('/rest/v1/rd_item_modifier_groups',{method:'POST',
      headers:{Prefer:'return=minimal'},
      body:JSON.stringify(add.map(function(g,ix){ return {item_id:itemId,group_id:g,sort:ix+1}; }))}));
  }
  rm.forEach(function(g){
    jobs.push(api('/rest/v1/rd_item_modifier_groups?item_id=eq.'+itemId+'&group_id=eq.'+g,
      {method:'DELETE',headers:{Prefer:'return=minimal'}}));
  });
  return Promise.all(jobs);
}


/* ===================================================================
   MENU IMPORT — parser based on the Restaurant Deluxe template's, with
   repairs added. Two paths:
     * a .docx states its own structure (headings, bold items, a bar
       before the price) and is trusted as given
     * a PDF or pasted text is ambiguous, so column detection and the
       repair passes below do the reconstructing
   =================================================================== */
var MenuParser = (function(){
var MI_SECTIONS = /^(entr[\u00e9e]es?|starters?|to (start|share|begin|finish|drink)|small plates?|large plates?|snacks?|nibbles?|raw|oysters?|salads?|soups?|mains?|main courses?|from the (grill|land|sea)|grill|seafood|meat|pizze?a?s?|pastas?|risotto|sides?|vegetables?|desserts?|sweets?|cheeses?|drinks?|beverages?|cocktails?|wines?|beer|kids?|children|set menu|tasting menu|degustation|breakfast|brunch|lunch|dinner|supper|specials?)\b/i;
  var MI_FOOTER   = /(allerg|dietar|surcharge|include[ds]? gst|prices? (are|include|subject)|public holiday|service charge|gratuit|10%|15%|please (advise|inform|note)|subject to)/i;
  var MI_PRICE    = /^([\s\S]*?)(\$\s?\d[\d.,]*(?:\s?(?:ea|each|pp|dozen|doz|per person))?|\bMP\b|\bP\.?O\.?A\.?\b|market price)\s*$/i;
  var MI_PRICEISH = /^(\$|mp$|p\.?o\.?a|\d)/i;

  function itemsToWords(items){
    var out = [];
    (items || []).forEach(function(it){
      var s = it.str; if(s == null || !/\S/.test(s)) return;
      var tr = it.transform || [1,0,0,1,0,0];
      var x = tr[4] || 0, y = -(tr[5] || 0), w = it.width || 0;
      out.push({ x:x, y:y, xM:x + w, t:s.replace(/\s+/g,' ').trim() });
    });
    return out;
  }
  function groupRows(ws){
    var rows = [];
    ws.slice().sort(function(a,b){ return a.y - b.y || a.x - b.x; }).forEach(function(w){
      var r = null;
      for(var i=0;i<rows.length;i++){ if(Math.abs(rows[i].y - w.y) <= 4){ r = rows[i]; break; } }
      if(!r){ r = { y:w.y, ws:[] }; rows.push(r); }
      r.ws.push(w);
    });
    return rows;
  }
  function rowText(ws){
    return ws.slice().sort(function(a,b){ return a.x - b.x; }).map(function(w){ return w.t; }).join(' ').replace(/\s+/g,' ').trim();
  }
  /* columns are found from where NAMES/DESCRIPTIONS start (prices are ignored,
     since they're right-aligned and would masquerade as extra columns) */
  function detectColumnStarts(words){
    var edges = [];
    groupRows(words).forEach(function(r){
      var ws = r.ws.slice().sort(function(a,b){ return a.x - b.x; });
      ws.forEach(function(w){
        if(MI_PRICEISH.test(w.t)) return;
        var hasLeft = ws.some(function(o){ return o.x < w.x && Math.abs(w.x - o.xM) < 14; });
        if(!hasLeft) edges.push(w.x);
      });
    });
    edges.sort(function(a,b){ return a-b; });
    var clusters = [];
    edges.forEach(function(x){
      var c = null;
      for(var i=0;i<clusters.length;i++){ if(Math.abs(clusters[i].x - x) <= 6){ c = clusters[i]; break; } }
      if(!c){ c = { x:x, xs:[] }; clusters.push(c); }
      c.xs.push(x); c.x = c.xs.reduce(function(a,b){ return a+b; },0)/c.xs.length;
    });
    if(!clusters.length) return [0];
    clusters.sort(function(a,b){ return b.xs.length - a.xs.length; });
    var top = clusters[0].xs.length, starts = [];
    clusters.forEach(function(c){
      if(c.xs.length >= Math.max(3, 0.25*top) && starts.every(function(s){ return Math.abs(c.x - s) > 120; })) starts.push(c.x);
    });
    starts.sort(function(a,b){ return a-b; });
    return starts.length ? starts : [0];
  }
  function wordsToLines(words){
    if(!words.length) return [];
    var starts = detectColumnStarts(words);
    function colOf(x){ var idx = 0; for(var i=0;i<starts.length;i++){ if(x >= starts[i]-8) idx = i; } return idx; }
    var byCol = {};
    words.forEach(function(w){ var c = colOf(w.x); (byCol[c] = byCol[c] || []).push(w); });
    var lines = [];
    Object.keys(byCol).forEach(function(c){
      groupRows(byCol[c]).forEach(function(r){ lines.push({ col:+c, y:r.y, text:rowText(r.ws) }); });
    });
    return lines;
  }
  function textToLines(text){
    var lines = [];
    String(text || '').split(/\r?\n/).forEach(function(l, i){
      l = l.replace(/[ \t]+/g,' ').trim();
      if(l) lines.push({ col:0, y:i, text:l });
    });
    return lines;
  }
  function tidyTitle(t){
    /* A word-boundary regex treats an accent as a boundary, so ENTREES with
       an accent came back as "EntreEs". Capitalise the first character of
       each word instead. */
    return t.replace(/\s+/g,' ').trim().toLowerCase().split(' ').map(function(w){
      return w ? w.charAt(0).toUpperCase() + w.slice(1) : w;
    }).join(' ');
  }
  function isAllCapsShort(l){
    var letters = l.replace(/[^A-Za-z]/g,'');
    return letters.length >= 3 && l.length <= 34 && !/\d/.test(l) && l.indexOf('$') < 0 && l === l.toUpperCase();
  }
  function normPrice(p){ return p.replace(/\s+/g,' ').trim().replace(/\$\s+/,'$').replace(/^mp$/i,'MP'); }
  function mapDish(d){ return { name:d.name, desc:d.desc, price:d.price }; }

  function linesToMenu(lines){
    lines = (lines || []).slice();
    lines.forEach(function(ln){
      var t = ln.text;
      ln.priceM = t.match(MI_PRICE);
      ln.footer = MI_FOOTER.test(t) && !ln.priceM;
      ln.hdr = (MI_SECTIONS.test(t) || isAllCapsShort(t)) && !ln.priceM && t.length <= 40;
    });
    lines.sort(function(a,b){ return a.y - b.y || a.col - b.col; });
    var headers = lines.filter(function(l){ return l.hdr && !l.footer; });
    var started = null;
    for(var i=0;i<lines.length;i++){ if(!lines[i].footer && (lines[i].hdr || lines[i].priceM)){ started = lines[i].y; break; } }

    function sectionFor(d){
      /* On a two-column menu, ENTREES sits on the left and MAIN COURSES on
         the right at almost the same height. Choosing the nearest heading
         above by height alone puts every dish on the page under whichever
         of the two happens to sit a fraction lower - which is how a menu
         ends up as one enormous section with the wrong descriptions.
         A heading in the dish's OWN column always wins. */
      var sameCol = null, anyCol = null;
      headers.forEach(function(h){
        if(h.y > d.y + 0.5) return;                      /* must sit above the dish */
        if(anyCol === null || h.y > anyCol.y) anyCol = h;
        if(h.col === d.col && (sameCol === null || h.y > sameCol.y)) sameCol = h;
      });
      return sameCol || anyCol;
    }

    var dishes = [], cols = {};
    lines.forEach(function(l){ cols[l.col] = true; });
    Object.keys(cols).map(Number).sort(function(a,b){ return a-b; }).forEach(function(col){
      var cur = null;
      lines.filter(function(l){ return l.col === col; }).forEach(function(ln){
        if(started !== null && ln.y < started - 0.5) return;   /* skip the title block */
        if(ln.footer) return;
        if(ln.hdr){ cur = null; return; }
        if(ln.priceM){
          var name = ln.priceM[1].replace(/[.\s\-\u2013\u2014]+$/,'').trim();
          var price = normPrice(ln.priceM[2]);
          if(!name && cur && !cur.price){ cur.price = price; return; }   /* price on its own line */
          cur = { col:col, y:ln.y, name:name || 'Dish', price:price, desc:'' };
          dishes.push(cur);
        } else {
          if(cur) cur.desc = cur.desc ? (cur.desc + ' ' + ln.text) : ln.text;   /* description */
          else { cur = { col:col, y:ln.y, name:ln.text, price:'', desc:'' }; dishes.push(cur); }
        }
      });
    });

    dishes.forEach(function(d){ d.sec = sectionFor(d); });
    var seen = [], out = [];
    headers.slice().sort(function(a,b){ return a.y - b.y || a.col - b.col; }).forEach(function(h){ if(seen.indexOf(h) < 0) seen.push(h); });
    var orphans = dishes.filter(function(d){ return !d.sec; });
    if(orphans.length){ orphans.sort(function(a,b){ return a.col - b.col || a.y - b.y; }); out.push({ title:'Menu', dishes:orphans.map(mapDish) }); }
    seen.forEach(function(h){
      var ds = dishes.filter(function(d){ return d.sec === h; });
      ds.sort(function(a,b){ return a.col - b.col || a.y - b.y; });
      if(ds.length) out.push({ title: tidyTitle(h.text), dishes: ds.map(mapDish) });
    });
    return { categories: out };
  }

function itemsToWords(items){
    var out = [];
    (items || []).forEach(function(it){
      var s = it.str; if(s == null || !/\S/.test(s)) return;
      var tr = it.transform || [1,0,0,1,0,0];
      var x = tr[4] || 0, y = -(tr[5] || 0), w = it.width || 0;
      out.push({ x:x, y:y, xM:x + w, t:s.replace(/\s+/g,' ').trim() });
    });
    return out;
  }

  /* ===== repair pass =====
     The line parser handles "Name  description  $price" well. It gets the
     two-line layout backwards:

         Kingfish Crudo
         green apple, cucumber, lemon myrtle    $24

     leaving "Kingfish Crudo" as a stray description and the ingredient
     list as the dish name. Fix it afterwards rather than complicating the
     parser, which does the harder job well. */
  function looksLikeDescription(s){
    if(!s) return false;
    var first = s.replace(/^[^A-Za-z]+/,'').charAt(0);
    if(!first) return false;
    /* ingredient lists start lower case; dish names are capitalised */
    if(first === first.toLowerCase() && first !== first.toUpperCase()) return true;
    /* or they are simply long and comma-heavy */
    return s.length > 46 && (s.match(/,/g)||[]).length >= 2;
  }
  function looksLikeName(s){
    return !!s && s.length <= 46 && !looksLikeDescription(s);
  }
  function repairDishes(cats){
    (cats||[]).forEach(function(cat){
      /* Case A: the name sat alone on its own line, so it became a dish
         with no price, and the following line carries description+price. */
      var out=[];
      cat.dishes.forEach(function(d){
        var prev = out[out.length-1];
        if(prev && !prev.price && !prev.desc && d.price && looksLikeDescription(d.name)){
          prev.desc  = d.desc ? (d.name + ' ' + d.desc) : d.name;
          prev.price = d.price;
          return;
        }
        out.push(d);
      });

      /* Case B: the same layout, but the previous dish already had a price,
         so the stray name was swallowed as ITS description instead:

             Sydney Rock Oysters  mignonette   $6      <- desc = "Kingfish Crudo"
             Kingfish Crudo
             green apple, cucumber            $24      <- name = "green apple..."

         A trailing description that reads like a name, followed by a dish
         whose name reads like a description, is that mistake every time. */
      for(var i=0;i<out.length-1;i++){
        var a=out[i], b=out[i+1];
        if(a.price && a.desc && looksLikeName(a.desc) &&
           b.price && looksLikeDescription(b.name)){
          b.desc = b.desc ? (b.name + ' ' + b.desc) : b.name;
          b.name = a.desc;
          a.desc = '';
        }
      }
      /* Case C: name and description ran together on one line, which is
         normal in plain text where the printed menu used spacing to
         separate them. The seam is the first genuinely lower-case word -
         but only when what follows actually reads like an ingredient list.
         "Focaccia della Casa" and "Arancini ai Funghi" are whole dish
         names, not a name plus a description, and splitting them was
         wrong. */
      var JOIN = /^(and|with|of|the|in|on|or|per|a|an|&|n'|de|del|della|delle|dei|degli|di|da|dal|al|ai|alla|alle|allo|con|e|la|le|lo|il|du|des|aux|au|en|sur|à|the)$/i;
      out.forEach(function(d){
        if(d.desc || !d.name) return;
        var words = d.name.split(' ');
        if(words.length < 3) return;
        for(var w=1; w<words.length; w++){
          var t = words[w].replace(/^[^A-Za-zÀ-ÿ]+/,'');
          if(!t || JOIN.test(words[w].replace(/[^A-Za-zÀ-ÿ']/g,''))) continue;
          var c = t.charAt(0);
          if(c === c.toLowerCase() && c !== c.toUpperCase()){
            var name = words.slice(0,w).join(' ').replace(/[\s,\-\u2013]+$/,'');
            var desc = words.slice(w).join(' ');
            /* The connector list above is what protects "Focaccia della
               Casa" and "Fish and Chips" - the seam never lands on a
               joining word, and the word after it is capitalised, so no
               split happens. Requiring the tail to look like a list as
               well was belt-and-braces that cost real cases such as
               "Sydney Rock Oysters finger lime mignonette". A short tail
               like "glass" is still left alone. */
            if(name.length >= 3 && desc.length >= 8){
              d.name = name; d.desc = desc;
            }
            break;
          }
        }
      });

      cat.dishes = out;
    });
    return cats;
  }
  /* A leading block with no prices anywhere is the venue name and address,
     not a course. Flag it so the preview can leave it unticked. */
  function markLikelyNotFood(cats){
    (cats||[]).forEach(function(cat, i){
      var priced = cat.dishes.filter(function(d){ return d.price; }).length;
      cat.suspect = (priced === 0);
      if(i === 0 && priced === 0) cat.suspect = true;
    });
    return cats;
  }

  /* ===== line normalisation, before parsing =====
     Two habits of printed menus defeat the price matcher:

        Garlic Bread ...................... 9.50     (dot leaders, no $)
        Flat White 5.50                              (bare number)

     Rather than loosen the price pattern - which would start matching
     "300g" and years - tidy the line first and put the $ back. A bare
     integer is only treated as a price when it is plausible as one, so
     "Black Angus Striploin 300g" is left alone. */
  function normaliseMenuLine(t){
    var s = String(t||'');
    var hadLeader = /[.\u2026]{3,}/.test(s);
    s = s.replace(/[.\u2026]{3,}/g, '  ').replace(/[ \t]+/g,' ').trim();
    if(/\$/.test(s)) return s;                       /* already priced */
    if(/\b(MP|P\.?O\.?A\.?|market price)\s*$/i.test(s)) return s;
    var m = s.match(/^(.*[A-Za-z].*?)[\s\-\u2013\u2014]+(\d{1,4}(?:[.,]\d{2})?)$/);
    if(!m) return s;
    var num = m[2].replace(',', '.');
    var hasDecimals = /[.,]\d{2}$/.test(m[2]);
    var value = parseFloat(num);
    /* Decimals or dot leaders are strong evidence. A bare integer is only
       a price if it is in a believable range for a dish. */
    if(!hasDecimals && !hadLeader && !(value >= 1 && value <= 199)) return s;
    if(value <= 0) return s;
    return m[1].replace(/[\s.,\-\u2013]+$/,'') + ' $' + num;
  }
  function normaliseLines(lines){
    (lines||[]).forEach(function(l){ l.text = normaliseMenuLine(l.text); });
    return lines;
  }

  /* ===== structured Word documents =====
     A .docx carries its own outline: Heading 1, Heading 2, bold menu
     items, plain descriptions. Reading it as flat text throws all of that
     away and leaves the parser guessing - which is how an eight-wine list
     ends up as one paragraph, because "Australian Wine" is title case and
     does not look like a heading to a text parser.

     mammoth's HTML keeps h1/h2/h3 and <strong>, so use them. */
  function htmlBlocks(html){
    var out = [];
    var re = /<(h[1-6]|p|li)\b[^>]*>([\s\S]*?)<\/\1>/gi;
    var m;
    while((m = re.exec(html))){
      var tag = m[1].toLowerCase();
      var inner = m[2];
      var strong = /<(strong|b)\b/i.test(inner);
      var text = inner
        .replace(/<br\s*\/?>/gi, ' ')
        .replace(/<[^>]+>/g, '')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
        .replace(/&#(\d+);/g, function(_, d){ return String.fromCharCode(+d); })
        .replace(/&quot;/gi, '"').replace(/&#39;/gi, "'")
        .replace(/\s+/g, ' ').trim();
      if(!text) continue;
      if(/^h[1-6]$/.test(tag)) out.push({ kind:'h', level:+tag.charAt(1), text:text });
      else out.push({ kind:strong ? 'item' : 'p', text:text });
    }
    return out;
  }

  /* "Sydney Rock Oysters  |  $28"            -> name, $28
     "Australian Sparkling | $14 glass / $58 bottle"
        -> name, $14, and the whole price phrase kept so the bottle price
           is not silently lost                                            */
  function splitItemLine(text){
    var name = text, priceText = '';
    var bar = text.indexOf('|');
    if(bar > 0){
      name = text.slice(0, bar).trim();
      priceText = text.slice(bar + 1).trim();
    } else {
      var m = text.match(MI_PRICE);
      if(m){ name = m[1].trim(); priceText = m[2].trim(); }
    }
    name = name.replace(/[\s.\-\u2013\u2014|]+$/, '').trim();

    var prices = priceText.match(/\$\s?\d[\d.,]*/g) || [];
    var first = prices.length ? prices[0] : '';
    if(!first && /\b(MP|P\.?O\.?A\.?|market price)\b/i.test(priceText)) first = priceText;

    return {
      name: name,
      price: first,
      /* more than one price means glass/bottle or house/premium - worth
         carrying through rather than dropping */
      extraPrice: prices.length > 1 ? priceText : ''
    };
  }

  /* The repair passes exist to rescue an ambiguous text layout. A Word
     document states its structure outright - heading levels, bold items, a
     bar between name and price - so running them here does harm rather
     than good: "250g Grass-Fed Sirloin" starts with a digit and gets
     mistaken for a description. Structured input is trusted as given. */
  function fromHtmlBlocks(blocks){
    var cats = [], cur = null, dish = null;

    function openSection(title){
      /* A Heading 1 like "DRINKS / BAR" followed by Heading 2 subsections
         should give the subsections, not one bucket. If the open section
         has collected nothing yet, the deeper heading replaces it. */
      if(cur && !cur.dishes.length){
        cur.title = title;
        return;
      }
      cur = { title: title, dishes: [] };
      cats.push(cur);
      dish = null;
    }

    blocks.forEach(function(b){
      if(b.kind === 'h'){ openSection(tidyTitle(b.text)); return; }

      if(b.kind === 'item'){
        var parsed = splitItemLine(b.text);
        /* a bold line before any heading, with no price, is the venue name */
        if(!parsed.price && !cur) return;
        if(!cur) openSection('Menu');
        dish = { name: parsed.name || 'Dish', price: parsed.price, desc: '',
                 extraPrice: parsed.extraPrice };
        cur.dishes.push(dish);
        return;
      }

      /* plain paragraph */
      if(MI_FOOTER.test(b.text)) return;          /* allergy and surcharge notes */
      if(!cur) return;                            /* title block */
      if(dish) dish.desc = dish.desc ? (dish.desc + ' ' + b.text) : b.text;
    });

    /* fold a second price into the description so nothing is lost */
    cats.forEach(function(c){
      c.dishes.forEach(function(d){
        if(d.extraPrice){
          d.desc = d.desc ? (d.desc + ' \u00b7 ' + d.extraPrice) : d.extraPrice;
        }
        delete d.extraPrice;
      });
    });

    return cats.filter(function(c){ return c.dishes.length; });
  }

  return {
    /* structured Word documents */
    fromHtml: function(html){
      return markLikelyNotFood(fromHtmlBlocks(htmlBlocks(html)));
    },
    /* ambiguous text and PDFs */
    fromText: function(text){
      return markLikelyNotFood(repairDishes(
        linesToMenu(normaliseLines(textToLines(text))).categories));
    },
    fromLines: function(lines){
      return markLikelyNotFood(repairDishes(
        linesToMenu(normaliseLines(lines)).categories));
    },
    itemsToWords: itemsToWords,
    wordsToLines: wordsToLines
  };
})();


/* ================= MENU IMPORT ================= */
var IMPORT = null;   /* { cats:[{title, station, include, dishes:[...] }] } */

/* pdf.js and mammoth are fetched only when a file actually needs them, so
   the manager stays light for the far more common jobs. */
function loadScript(src){
  return new Promise(function(res, rej){
    if(document.querySelector('script[data-lib="'+src+'"]')) return res();
    var s=document.createElement('script');
    s.src=src; s.async=true; s.setAttribute('data-lib',src);
    s.onload=function(){ res(); };
    s.onerror=function(){ rej(new Error('offline')); };
    document.head.appendChild(s);
  });
}
var PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var MAMMOTH_URL='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';

function readPdf(file){
  return loadScript(PDFJS_URL).then(function(){
    if(window.pdfjsLib && pdfjsLib.GlobalWorkerOptions)
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    return file.arrayBuffer();
  }).then(function(buf){
    return pdfjsLib.getDocument({data:buf}).promise;
  }).then(function(pdf){
    var pages=[]; for(var i=1;i<=pdf.numPages;i++) pages.push(i);
    return pages.reduce(function(chain,n){
      return chain.then(function(acc){
        return pdf.getPage(n).then(function(pg){ return pg.getTextContent(); })
          .then(function(tc){
            return acc.concat(MenuParser.wordsToLines(MenuParser.itemsToWords(tc.items)));
          });
      });
    }, Promise.resolve([]));
  });
}
function readDocx(file){
  /* HTML, not raw text. extractRawText discards every heading level, which
     is what turned an eight-wine list into one paragraph: "Australian Wine"
     is title case and does not look like a heading once the styling is
     gone. convertToHtml keeps h1/h2 and the bold item lines. */
  return loadScript(MAMMOTH_URL)
    .then(function(){ return file.arrayBuffer(); })
    .then(function(buf){ return mammoth.convertToHtml({arrayBuffer:buf}); })
    .then(function(r){ return r.value; });
}

/* "$52" -> 5200, "$6 each" -> 600, "MP"/"POA" -> null (no usable price) */
function priceToCents(p){
  var s=String(p||'').trim();
  if(!s) return null;
  if(/^(mp|p\.?o\.?a\.?|market price)$/i.test(s)) return null;
  var m=s.match(/(\d+(?:[.,]\d{1,2})?)/);
  if(!m) return null;
  var n=parseFloat(m[1].replace(',','.'));
  return isNaN(n)?null:Math.round(n*100);
}
function guessStation(title){
  var t=String(title||'').toLowerCase();
  var find=function(key){
    var s=null; STATIONS.forEach(function(x){ if(x.key===key) s=x.id; }); return s;
  };
  if(/drink|bar|wine|beer|cocktail|beverage|spirit|cider/.test(t)) return find('bar');
  if(/coffee|tea|espresso|latte|barista/.test(t))                  return find('coffee');
  if(/dessert|sweet|cake|pudding|gelato|ice cream/.test(t))        return find('dessert');
  return find('kitchen');
}

function openImport(){
  IMPORT=null;
  openModal('Import a menu',
    '<p class="hint" style="margin-top:4px">Bring in a printed menu from a PDF or Word file. '+
      'Nothing is saved until you have checked it.</p>'+
    '<div style="margin-top:18px">'+
      '<button class="btn full" id="impPick">Choose a PDF or Word file</button>'+
      '<input type="file" id="impFile" accept=".pdf,.docx,.txt" style="display:none">'+
    '</div>'+
    '<p class="hint" style="text-align:center;margin:14px 0">or</p>'+
    '<label for="impText">Paste the menu text</label>'+
    '<textarea id="impText" style="min-height:150px" '+
      'placeholder="ENTREES&#10;Sydney Rock Oysters  finger lime mignonette  $6 each&#10;..."></textarea>'+
    '<button class="btn quiet full" id="impParse" style="margin-top:12px">Read pasted text</button>'+
    '<p class="hint" style="margin-top:16px">A scanned or photographed menu will not work \u2014 '+
      'the text has to be selectable in the file. If nothing comes through, open the PDF, '+
      'select all, copy, and paste it above.</p>'+
    '<p class="msg" id="impMsg" style="color:var(--bad);min-height:18px"></p>',
    '<button class="btn quiet" data-close>Cancel</button>');

  $('impPick').addEventListener('click', function(){ $('impFile').click(); });
  $('impFile').addEventListener('change', function(){
    var f=$('impFile').files && $('impFile').files[0];
    if(!f) return;
    var name=(f.name||'').toLowerCase();
    $('impMsg').textContent='Reading\u2026';
    var job;
    if(/\.pdf$/.test(name))       job=readPdf(f).then(function(lines){ return MenuParser.fromLines(lines); });
    else if(/\.docx$/.test(name)) job=readDocx(f).then(function(html){ return MenuParser.fromHtml(html); });
    else if(/\.doc$/.test(name)){
      $('impMsg').textContent='Old .doc files cannot be read here. Save as .docx or PDF, or paste the text.';
      return;
    }
    else job=f.text().then(function(t){ return MenuParser.fromText(t); });

    job.then(showPreview).catch(function(e){
      $('impMsg').textContent = (e && e.message==='offline')
        ? 'Could not load the file reader. Check your connection, or paste the menu text instead.'
        : 'Could not read that file. Try saving it as a PDF, or paste the text instead.';
    });
  });
  $('impParse').addEventListener('click', function(){
    var t=$('impText').value;
    if(!t.trim()){ $('impMsg').textContent='Paste some menu text first.'; return; }
    try { showPreview(MenuParser.fromText(t)); }
    catch(e){ $('impMsg').textContent='Could not make sense of that text.'; }
  });
}

function showPreview(cats){
  cats=(cats||[]).filter(function(c){ return c.dishes && c.dishes.length; });
  if(!cats.length){
    $('impMsg').textContent='No dishes found. If the PDF is a scan, the text is not selectable \u2014 paste it instead.';
    return;
  }
  var already={};
  ITEMS.forEach(function(i){ already[i.name.trim().toLowerCase()]=true; });
  IMPORT={ cats: cats.map(function(c){
    return {
      title: c.title,
      station: guessStation(c.title),
      include: !c.suspect,
      dishes: c.dishes.map(function(d){
        var dup = already[String(d.name||'').trim().toLowerCase()];
        return { name:d.name, desc:d.desc||'', price:d.price||'',
                 cents: priceToCents(d.price),
                 /* one decision, made here: already on the menu, or no
                    price, or a block that is probably the address */
                 include: !dup && (!!d.price || !c.suspect) };
      })
    };
  })};
  paintPreview();
}

function paintPreview(){
  var totalDishes=0, noPrice=0, dupes=0;
  var existing={};
  ITEMS.forEach(function(i){ existing[i.name.trim().toLowerCase()]=true; });

  var h='<p class="hint" style="margin-top:4px">Check this over before importing. '+
    'Everything here is editable, and nothing is saved until you press Import.</p>';

  IMPORT.cats.forEach(function(c,ci){
    var incl=c.dishes.filter(function(d){ return d.include; }).length;
    h+='<div class="sec" style="margin-top:14px">'+
      '<div class="sec-h">'+
        '<label style="display:flex;align-items:center;gap:9px;flex:1;margin:0">'+
          '<input type="checkbox" data-ci="'+ci+'" '+(c.include?'checked':'')+
            ' style="width:22px;height:22px;min-height:22px">'+
          '<input type="text" value="'+esc(c.title)+'" data-ct="'+ci+'" '+
            'style="min-height:44px;font-weight:700">'+
        '</label>'+
      '</div>'+
      (c.suspect?'<p class="hint" style="color:var(--warn)">No prices in this block \u2014 '+
        'it is probably the venue name or address, so it is unticked.</p>':'')+
      '<label style="margin-top:10px">Goes to</label>'+
      '<select data-cs="'+ci+'">'+stationOptions(c.station,false)+'</select>'+
      '<p class="hint">Orders from this section appear on that screen.</p>'+
      '<div class="acts" style="margin-top:10px">'+
        '<button data-all="'+ci+'">Tick all</button>'+
        '<button data-none="'+ci+'">Untick all</button>'+
      '</div>'+
      '<div style="margin-top:12px">';

    c.dishes.forEach(function(d,di){
      totalDishes++;
      if(d.cents===null) noPrice++;
      var dup = existing[String(d.name||'').trim().toLowerCase()];
      if(dup) dupes++;
      h+='<div class="item" style="align-items:flex-start">'+
        '<input type="checkbox" data-di="'+ci+'.'+di+'" '+(d.include?'checked':'')+
          ' style="width:22px;height:22px;min-height:22px;margin-top:12px">'+
        '<div class="item-b">'+
          '<div class="row2">'+
            '<input type="text" value="'+esc(d.name)+'" data-dn="'+ci+'.'+di+'" placeholder="Dish name">'+
            '<input type="text" value="'+esc(d.cents!==null?(d.cents/100).toFixed(2):'')+'" '+
              'data-dp="'+ci+'.'+di+'" placeholder="0.00" inputmode="decimal">'+
          '</div>'+
          '<input type="text" value="'+esc(d.desc)+'" data-dd="'+ci+'.'+di+'" '+
            'placeholder="Description" style="margin-top:8px">'+
          '<div class="acts" style="margin-top:7px;align-items:center">'+
            (IMPORT.cats.length>1
              ? '<select data-mv="'+ci+'.'+di+'" style="min-height:40px;max-width:190px;font-size:12px">'+
                  IMPORT.cats.map(function(x,xi){
                    return '<option value="'+xi+'"'+(xi===ci?' selected':'')+'>in '+esc(x.title)+'</option>';
                  }).join('')+'</select>'
              : '')+
            (dup?'<span class="pill hid">already on the menu \u2014 will be skipped</span>':'')+
            (d.cents===null&&d.price?'<span class="pill hid">'+esc(d.price)+
              ' \u2014 imports hidden until you set a price</span>':'')+
            (d.cents===null&&!d.price?'<span class="pill hid">no price found</span>':'')+
          '</div>'+
        '</div></div>';
    });
    h+='</div></div>';
  });

  $('mTitle').textContent='Check the menu';
  $('mBody').innerHTML=h;
  $('mFoot').innerHTML=
    '<div style="width:100%">'+
      '<div class="sum-note" style="color:var(--muted);font-size:12.5px;margin-bottom:10px">'+
        totalDishes+' dish'+(totalDishes===1?'':'es')+' found'+
        (noPrice?' \u00b7 '+noPrice+' without a usable price':'')+
        (dupes?' \u00b7 '+dupes+' already on your menu':'')+
      '</div>'+
      '<label style="display:flex;align-items:center;gap:9px;margin:0 0 8px">'+
        '<input type="radio" name="impMode" value="add" checked '+
          'style="width:20px;height:20px;min-height:20px"> Add to the menu I already have</label>'+
      '<label style="display:flex;align-items:center;gap:9px;margin:0 0 12px">'+
        '<input type="radio" name="impMode" value="replace" '+
          'style="width:20px;height:20px;min-height:20px"> '+
        '<span style="color:var(--bad)">Replace the whole menu</span></label>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
        '<button class="btn quiet" id="impRestart" style="flex:1;min-width:120px">Start over</button>'+
        '<button class="btn quiet" data-close style="flex:1;min-width:100px">Cancel</button>'+
        '<button class="btn" id="impGo" style="flex:2;min-width:150px">Import</button>'+
      '</div>'+
    '</div>';
}

/* keep edits in the model as they are typed */
function impPath(v){ var a=String(v).split('.'); return IMPORT.cats[+a[0]].dishes[+a[1]]; }
document.addEventListener('input', function(e){
  if(!IMPORT) return;
  var t=e.target, d=t.dataset;
  if(d.ct!==undefined) IMPORT.cats[+d.ct].title=t.value;
  else if(d.dn!==undefined) impPath(d.dn).name=t.value;
  else if(d.dd!==undefined) impPath(d.dd).desc=t.value;
  else if(d.dp!==undefined){ var x=impPath(d.dp); x.cents=priceToCents(t.value); }
});
document.addEventListener('change', function(e){
  if(!IMPORT) return;
  var t=e.target, d=t.dataset;
  if(d.ci!==undefined) IMPORT.cats[+d.ci].include=t.checked;
  else if(d.di!==undefined) impPath(d.di).include=t.checked;
  else if(d.cs!==undefined) IMPORT.cats[+d.cs].station=t.value||null;
  else if(d.mv!==undefined){
    /* the parser puts a dish in the wrong section now and then - moving it
       here beats starting the whole import again */
    var a=String(d.mv).split('.'), from=+a[0], idx=+a[1], to=+t.value;
    if(from===to) return;
    var dish=IMPORT.cats[from].dishes.splice(idx,1)[0];
    IMPORT.cats[to].dishes.push(dish);
    paintPreview();
  }
});

document.addEventListener('click', function(e){
  if(!IMPORT) return;
  var b=e.target.closest('button'); if(!b) return;
  if(b.id==='impRestart'){ IMPORT=null; openImport(); return; }
  if(b.dataset.all!==undefined){
    IMPORT.cats[+b.dataset.all].dishes.forEach(function(x){ x.include=true; });
    IMPORT.cats[+b.dataset.all].include=true; paintPreview(); return;
  }
  if(b.dataset.none!==undefined){
    IMPORT.cats[+b.dataset.none].dishes.forEach(function(x){ x.include=false; });
    paintPreview(); return;
  }
});

function runImport(btn){
  var mode=(document.querySelector('input[name=impMode]:checked')||{}).value||'add';
  var chosen=IMPORT.cats.filter(function(c){
    return c.include && c.dishes.some(function(d){ return d.include; });
  });
  if(!chosen.length){ toast('Nothing ticked to import'); return; }

  var totalDishes=chosen.reduce(function(n,c){
    return n+c.dishes.filter(function(d){ return d.include; }).length; },0);

  var warn = (mode==='replace')
    ? 'Replace the WHOLE menu?\n\nEvery current section and dish will be deleted and '+
      'replaced with '+totalDishes+' imported dish(es).\n\nPast orders keep their own '+
      'record and are not affected, but anything not in this import is gone.'
    : 'Import '+totalDishes+' dish(es) into '+chosen.length+' section(s)?';
  if(!confirm(warn)) return;

  btn.disabled=true; btn.textContent='Importing\u2026';
  var existing={};
  ITEMS.forEach(function(i){ existing[i.name.trim().toLowerCase()]=true; });

  var chain = Promise.resolve();
  if(mode==='replace'){
    chain = chain.then(function(){
      return api('/rest/v1/rd_categories?venue_id=eq.'+encodeURIComponent(VENUE.id),
        {method:'DELETE', headers:{Prefer:'return=minimal'}});
    }).then(function(){ existing={}; });
  }

  var made=0, skipped=0;
  chosen.forEach(function(c, ci){
    chain = chain.then(function(){
      /* reuse a section of the same name rather than making a second one */
      var found=null;
      if(mode!=='replace'){
        CATS.forEach(function(x){
          if(x.name.trim().toLowerCase()===c.title.trim().toLowerCase()) found=x.id;
        });
      }
      if(found) return found;
      var sort=(CATS.length?Math.max.apply(null,CATS.map(function(x){return x.sort||0;})):0)+ci+1;
      return api('/rest/v1/rd_categories',{method:'POST',
        headers:{Prefer:'return=representation'},
        body:JSON.stringify({venue_id:VENUE.id, name:c.title.trim()||'Menu',
          station_id:c.station||null, sort:sort, visible:true})})
        .then(function(rows){ return rows && rows[0] && rows[0].id; });
    }).then(function(catId){
      if(!catId) return;
      var rows=[];
      c.dishes.forEach(function(d, di){
        if(!d.include) return;
        var key=String(d.name||'').trim().toLowerCase();
        if(!key) return;
        if(existing[key]){ skipped++; return; }
        existing[key]=true;
        rows.push({
          venue_id:VENUE.id, category_id:catId,
          name:d.name.trim(),
          description:(d.desc||'').trim()||null,
          price_cents:d.cents===null?0:d.cents,
          /* a market-price dish cannot be ordered without a number, so it
             arrives hidden rather than orderable at zero */
          visible:d.cents!==null,
          sort:di+1, allow_note:true, gst_free:false
        });
        made++;
      });
      if(!rows.length) return;
      return api('/rest/v1/rd_items',{method:'POST',
        headers:{Prefer:'return=minimal'}, body:JSON.stringify(rows)});
    });
  });

  chain.then(function(){ closeModal(); return reload(); })
    .then(function(){
      toast(made+' dish'+(made===1?'':'es')+' imported'+
        (skipped?(', '+skipped+' already there'):''));
      IMPORT=null;
    })
    .catch(function(e){
      btn.disabled=false; btn.textContent='Import';
      toast(apiErr(e));
    });
}

/* ---------- reorder ---------- */
function swapSort(table, list, id, dir){
  var ix=-1; list.forEach(function(x,n){ if(x.id===id) ix=n; });
  var jx=ix+dir;
  if(ix<0||jx<0||jx>=list.length) return;
  var a=list[ix], b=list[jx];
  var as=a.sort||ix+1, bs=b.sort||jx+1;
  if(as===bs){ as=ix+1; bs=jx+1; }
  Promise.all([
    api('/rest/v1/'+table+'?id=eq.'+a.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({sort:bs})}),
    api('/rest/v1/'+table+'?id=eq.'+b.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({sort:as})})
  ]).then(reload).catch(function(e){ toast(apiErr(e)); });
}

/* ---------- menu pane events ---------- */
$('pMenu').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  var d=b.dataset;
  if(b.id==='addCat') return openCat(null);
  if(b.id==='impOpen') return openImport();
  if(d.cedit) return openCat(CATS.filter(function(c){return c.id===d.cedit;})[0]);
  if(d.cadd)  return openItem(null, d.cadd);
  if(d.cup)   return swapSort('rd_categories',CATS,d.cup,-1);
  if(d.cdn)   return swapSort('rd_categories',CATS,d.cdn,1);
  if(d.cdel){
    var c=CATS.filter(function(x){return x.id===d.cdel;})[0];
    var n=ITEMS.filter(function(i){return i.category_id===d.cdel;}).length;
    if(!confirm('Delete "'+c.name+'"'+(n?' and its '+n+' dish'+(n>1?'es':''):'')+
       '? Past orders keep their own record and are not affected.')) return;
    return api('/rest/v1/rd_categories?id=eq.'+d.cdel,{method:'DELETE',headers:{Prefer:'return=minimal'}})
      .then(reload).then(function(){ toast('Section deleted'); })
      .catch(function(err){ toast(apiErr(err)); });
  }
  var item=ITEMS.filter(function(i){return i.id===(d.iedit||d.isold||d.ihide||d.idup||d.idel||d.iup||d.idn);})[0];
  if(d.iedit) return openItem(item);
  if(d.iup)   return swapSort('rd_items',ITEMS.filter(function(x){return x.category_id===item.category_id;}),d.iup,-1);
  if(d.idn)   return swapSort('rd_items',ITEMS.filter(function(x){return x.category_id===item.category_id;}),d.idn,1);
  if(d.isold){
    var nowOut=item.sold_out||(item.remaining_qty!=null&&item.remaining_qty<=0);
    var patch = nowOut ? {sold_out:false, remaining_qty:null} : {sold_out:true};
    return api('/rest/v1/rd_items?id=eq.'+item.id,{method:'PATCH',
      headers:{Prefer:'return=minimal'},body:JSON.stringify(patch)})
      .then(reload).then(function(){ toast(nowOut?'Back on the menu':'Marked sold out'); })
      .catch(function(err){ toast(apiErr(err)); });
  }
  if(d.ihide){
    return api('/rest/v1/rd_items?id=eq.'+item.id,{method:'PATCH',
      headers:{Prefer:'return=minimal'},body:JSON.stringify({visible:!item.visible})})
      .then(reload).catch(function(err){ toast(apiErr(err)); });
  }
  if(d.idup){
    var copy={venue_id:VENUE.id,category_id:item.category_id,name:item.name+' (copy)',
      description:item.description,price_cents:item.price_cents,station_id:item.station_id,
      dietary:item.dietary,allergens:item.allergens,badges:item.badges,
      visible:false,allow_note:item.allow_note,sort:(item.sort||0)+1};
    var newId=null;
    return api('/rest/v1/rd_items',{method:'POST',headers:{Prefer:'return=representation'},
      body:JSON.stringify(copy)})
      .then(function(rows){
        newId=rows&&rows[0]&&rows[0].id;
        var gs=LINKS.filter(function(l){return l.item_id===item.id;});
        if(!newId||!gs.length) return;
        return api('/rest/v1/rd_item_modifier_groups',{method:'POST',headers:{Prefer:'return=minimal'},
          body:JSON.stringify(gs.map(function(g,ix){return {item_id:newId,group_id:g.group_id,sort:ix+1};}))});
      })
      .then(reload).then(function(){ toast('Copied \u2014 the copy is hidden until you show it'); })
      .catch(function(err){ toast(apiErr(err)); });
  }
  if(d.idel){
    if(!confirm('Delete "'+item.name+'"? Past orders keep their own record.')) return;
    return api('/rest/v1/rd_items?id=eq.'+item.id,{method:'DELETE',headers:{Prefer:'return=minimal'}})
      .then(reload).then(function(){ toast('Deleted'); })
      .catch(function(err){ toast(apiErr(err)); });
  }
});

/* ================= TABLES & QR ================= */
/* The QR must carry the address a GUEST'S PHONE can reach, which is not
   necessarily where this manager page is open. Guessing from location
   silently produces file:/// codes that work nowhere. */
function orderBase(){
  if(VENUE && VENUE.order_page_url) return VENUE.order_page_url;
  var here=location.href.split('?')[0].split('#')[0];
  return here.replace(/[^\/]*$/,'') + 'table-order.html';
}
function baseIsPublic(){
  var b=orderBase();
  return /^https?:\/\//i.test(b) && !/^https?:\/\/(localhost|127\.|0\.0\.0\.0|\[::1\])/i.test(b);
}
function tableUrl(t){
  return orderBase()+'?v='+encodeURIComponent(VENUE.slug)+'&t='+encodeURIComponent(t.token);
}
function renderTables(){
  var pub=baseIsPublic();
  var h='<div class="sec"><div class="sec-h"><h2>Ordering page address</h2>'+
      (pub?'<span class="pill st">Ready</span>':'<span class="pill out">Needs setting</span>')+
    '</div>'+
    '<p class="hint">The web address guests reach when they scan. It must be a public https address \u2014 the page as your customers see it, not a file on this device.</p>'+
    '<input id="obUrl" type="text" value="'+esc(VENUE.order_page_url||'')+'" '+
      'placeholder="https://your-site.com/table-order.html" autocapitalize="off" autocorrect="off" spellcheck="false"'+
      (isManager()?'':' disabled')+'>'+
    (isManager()?'<button class="btn" id="saveBase" style="margin-top:14px">Save address</button>':'')+
    (pub?'':'<p class="hint" style="color:var(--bad);margin-top:12px">'+
      'Until this is set, the codes below point at <b>'+esc(orderBase())+'</b>, '+
      'which a guest\u2019s phone cannot open. Set the address, then print.</p>')+
    '</div>'+
    '<div class="sec"><div class="sec-h"><h2>Table QR codes</h2></div>'+
    '<p class="hint">Print these and put one on each table. The code contains a secret unique to that table \u2014 treat a printed sheet like a set of keys, and regenerate if one goes missing.</p>'+
    '<div class="acts no-print">'+
      '<button id="printQr">Print all</button>'+
      (isManager()?'<button id="addTable">Add a table</button>':'')+
    '</div></div>';
  if(!TABLES.length){
    h+='<div class="sec"><div class="empty">No tables yet.</div></div>';
  } else {
    h+='<div class="qr-grid" id="qrGrid"></div>';
  }
  $('pTables').innerHTML=h;
  if(TABLES.length){
    var g=$('qrGrid'), out='';
    TABLES.forEach(function(t){
      var url=tableUrl(t);
      var svg;
      try{ svg=QR.toSvg(url,{px:200,ecl:'M'}); }
      catch(e){ svg='<p style="color:#a00;font-size:11px">Could not draw a code for this URL.</p>'; }
      out+='<div class="qr-card">'+svg+'<b>Table '+esc(t.label)+'</b>'+
           '<small>'+esc(VENUE.slug)+'</small>'+
           (t.active?'':'<small style="color:#a00">INACTIVE</small>')+
           '<div class="acts no-print" style="justify-content:center">'+
             '<button data-turl="'+esc(t.id)+'" style="color:#555">Copy link</button>'+
             (isManager()?'<button data-tedit="'+esc(t.id)+'" style="color:#555">Edit</button>':'')+
             (isManager()?'<button data-tnew="'+esc(t.id)+'" style="color:#a00">New code</button>':'')+
           '</div></div>';
    });
    g.innerHTML=out;
  }
}
function randToken(){
  var a=new Uint8Array(9);
  (window.crypto||window.msCrypto).getRandomValues(a);
  return Array.prototype.map.call(a,function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
}
$('pTables').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  var d=b.dataset;
  if(b.id==='saveBase'){
    var raw=$('obUrl').value.trim();
    if(raw && !/^https?:\/\//i.test(raw)) raw='https://'+raw;
    if(raw && !/table-order\.html/i.test(raw) && !/\?/.test(raw)){
      if(!confirm('That address does not mention table-order.html.\n\nUse it anyway?')) return;
    }
    b.disabled=true;
    return api('/rest/v1/rd_venues?id=eq.'+VENUE.id,{method:'PATCH',
      headers:{Prefer:'return=minimal'},body:JSON.stringify({order_page_url:raw||null})})
      .then(function(){ VENUE.order_page_url=raw||null; renderTables(); toast('Address saved'); })
      .catch(function(err){
        b.disabled=false;
        toast(/order_page_url/.test(String(err&&err.data&&err.data.message))
          ? 'Run supabase-add-order-url.sql first \u2014 that column is missing.'
          : apiErr(err));
      });
  }
  if(b.id==='printQr'){
    if(!baseIsPublic() && !confirm('The ordering page address is not set, so these codes will not work for guests.\n\nPrint anyway?')) return;
    return window.print();
  }
  if(b.id==='addTable'){
    openModal('New table','<label for="fLabel">Table name or number</label>'+
      '<input id="fLabel" type="text" placeholder="12">'+
      '<p class="hint">A fresh secret code is generated automatically.</p>',
      '<button class="btn quiet" data-close>Cancel</button><button class="btn" id="saveTable">Add</button>');
    $('saveTable').addEventListener('click', function(){
      var label=$('fLabel').value.trim();
      if(!label){ toast('Give the table a name'); return; }
      this.disabled=true;
      api('/rest/v1/rd_tables',{method:'POST',headers:{Prefer:'return=minimal'},
        body:JSON.stringify({venue_id:VENUE.id,label:label,token:randToken(),
          sort:(TABLES.length?Math.max.apply(null,TABLES.map(function(x){return x.sort||0;}))+1:1)})})
        .then(function(){ closeModal(); return reload(); }).then(function(){ toast('Table added'); })
        .catch(function(err){ toast(apiErr(err)); $('saveTable').disabled=false; });
    });
    return;
  }
  var t=TABLES.filter(function(x){return x.id===(d.turl||d.tedit||d.tnew);})[0];
  if(!t) return;
  if(d.turl){
    var url=tableUrl(t);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast('Link copied'); },
        function(){ prompt('Copy this link:',url); });
    } else prompt('Copy this link:',url);
    return;
  }
  if(d.tedit){
    openModal('Edit table','<label for="fLabel">Table name or number</label>'+
      '<input id="fLabel" type="text" value="'+esc(t.label)+'">'+
      '<label style="display:flex;align-items:center;gap:10px;margin-top:18px">'+
        '<input type="checkbox" id="fAct" '+(t.active?'checked':'')+
        ' style="width:22px;height:22px;min-height:22px"> Accepting orders</label>',
      '<button class="btn quiet" data-close>Cancel</button>'+
      (isManager()?'<button class="btn danger" id="delTable">Delete</button>':'')+
      '<button class="btn" id="saveTable">Save</button>');
    $('saveTable').addEventListener('click', function(){
      api('/rest/v1/rd_tables?id=eq.'+t.id,{method:'PATCH',headers:{Prefer:'return=minimal'},
        body:JSON.stringify({label:$('fLabel').value.trim(),active:$('fAct').checked})})
        .then(function(){ closeModal(); return reload(); }).then(function(){ toast('Saved'); })
        .catch(function(err){ toast(apiErr(err)); });
    });
    var dt=$('delTable');
    if(dt) dt.addEventListener('click', function(){
      if(!confirm('Delete table '+t.label+'? Its QR code will stop working.')) return;
      api('/rest/v1/rd_tables?id=eq.'+t.id,{method:'DELETE',headers:{Prefer:'return=minimal'}})
        .then(function(){ closeModal(); return reload(); }).then(function(){ toast('Table deleted'); })
        .catch(function(err){ toast(apiErr(err)+' A table with past orders cannot be deleted \u2014 mark it not accepting orders instead.'); });
    });
    return;
  }
  if(d.tnew){
    if(!confirm('Generate a new code for table '+t.label+'?\n\nThe old printed QR code will stop working immediately.')) return;
    api('/rest/v1/rd_tables?id=eq.'+t.id,{method:'PATCH',headers:{Prefer:'return=minimal'},
      body:JSON.stringify({token:randToken()})})
      .then(reload).then(function(){ toast('New code \u2014 reprint this table'); })
      .catch(function(err){ toast(apiErr(err)); });
  }
});

/* ================= SETTINGS ================= */
function renderSettings(){
  var v=VENUE;
  var on = v.ordering_enabled && v.accepting_orders;
  $('pSettings').innerHTML =
    '<div class="sec"><div class="sec-h"><h2>Table ordering</h2>'+
      '<span class="pill'+(on?' st':' out')+'">'+(on?'Open':'Closed')+'</span></div>'+
      '<p class="hint">Turning this off leaves the menu readable but stops new orders. Guests are shown your closed message.</p>'+
      '<div class="acts">'+
        (isManager()?'<button data-tog="ordering_enabled">'+
          (v.ordering_enabled?'Stop taking orders':'Start taking orders')+'</button>':'')+
        (v.ordering_enabled?'<button class="warn" data-tog="accepting_orders">'+
          (v.accepting_orders?'Pause (kitchen slammed)':'Resume')+'</button>':'')+
      '</div></div>'+
    '<div class="sec"><div class="sec-h"><h2>Restaurant</h2></div>'+
      '<label for="sName">Name shown to guests</label>'+
      '<input id="sName" type="text" value="'+esc(v.name||'')+'"'+(isManager()?'':' disabled')+'>'+
      '<label for="sNote">Message on the confirmation screen</label>'+
      '<textarea id="sNote"'+(isManager()?'':' disabled')+'>'+esc(v.service_note||'')+'</textarea>'+
      '<label for="sClosed">Message when ordering is closed</label>'+
      '<textarea id="sClosed"'+(isManager()?'':' disabled')+'>'+esc(v.closed_message||'')+'</textarea>'+
      (isManager()?'<button class="btn" id="saveVenue" style="margin-top:18px">Save</button>':
        '<p class="hint">Only managers can change these.</p>')+
    '</div>'+
    '<div class="sec"><div class="sec-h"><h2>Colours</h2></div>'+
      '<p class="hint">The ordering page follows these, so a re-theme does not need the page republished.</p>'+
      '<div class="row2">'+
        '<div><label for="sBg">Background</label><input id="sBg" type="text" value="'+esc(v.brand_bg||'')+'"'+(isManager()?'':' disabled')+'></div>'+
        '<div><label for="sInk">Text</label><input id="sInk" type="text" value="'+esc(v.brand_ink||'')+'"'+(isManager()?'':' disabled')+'></div>'+
        '<div><label for="sAcc">Accent</label><input id="sAcc" type="text" value="'+esc(v.brand_accent||'')+'"'+(isManager()?'':' disabled')+'></div>'+
        '<div><label for="sAcc2">Accent 2</label><input id="sAcc2" type="text" value="'+esc(v.brand_accent_2||'')+'"'+(isManager()?'':' disabled')+'></div>'+
      '</div>'+
      (isManager()?'<button class="btn" id="saveBrand" style="margin-top:18px">Save colours</button>':'')+
    '</div>'+
    '<div class="sec"><div class="sec-h"><h2>Signed in</h2></div>'+
      '<p class="hint">'+esc((SESSION&&SESSION.user&&SESSION.user.email)||'')+' \u2014 '+esc(ROLE)+'</p></div>';
}
$('pSettings').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tog){
    var f=b.dataset.tog, patch={};
    patch[f]=!VENUE[f];
    return api('/rest/v1/rd_venues?id=eq.'+VENUE.id,{method:'PATCH',
      headers:{Prefer:'return=minimal'},body:JSON.stringify(patch)})
      .then(function(){ VENUE[f]=patch[f]; renderSettings();
        toast(patch[f]?'Ordering is open':'Ordering is closed'); })
      .catch(function(err){ toast(apiErr(err)); });
  }
  if(b.id==='saveVenue'){
    var body={name:$('sName').value.trim(),service_note:$('sNote').value.trim(),
      closed_message:$('sClosed').value.trim()};
    b.disabled=true;
    return api('/rest/v1/rd_venues?id=eq.'+VENUE.id,{method:'PATCH',
      headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})
      .then(function(){ Object.keys(body).forEach(function(k){ VENUE[k]=body[k]; });
        $('vName').textContent=VENUE.name; toast('Saved'); b.disabled=false; })
      .catch(function(err){ toast(apiErr(err)); b.disabled=false; });
  }
  if(b.id==='saveBrand'){
    var hex=/^#[0-9a-f]{6}$/i;
    var vals={brand_bg:$('sBg').value.trim(),brand_ink:$('sInk').value.trim(),
      brand_accent:$('sAcc').value.trim(),brand_accent_2:$('sAcc2').value.trim()};
    var bad=Object.keys(vals).filter(function(k){ return !hex.test(vals[k]); });
    if(bad.length){ toast('Colours must look like #0b0806'); return; }
    b.disabled=true;
    return api('/rest/v1/rd_venues?id=eq.'+VENUE.id,{method:'PATCH',
      headers:{Prefer:'return=minimal'},body:JSON.stringify(vals)})
      .then(function(){ Object.keys(vals).forEach(function(k){ VENUE[k]=vals[k]; });
        toast('Colours saved'); b.disabled=false; })
      .catch(function(err){ toast(apiErr(err)); b.disabled=false; });
  }
});

/* preview: open the real customer page on a real table */
$('preview').addEventListener('click', function(){
  if(!TABLES.length){ toast('Add a table first'); return; }
  window.open(tableUrl(TABLES[0]),'_blank');
});

/* chip toggles + modal cancel, delegated */
document.addEventListener('click', function(e){
  var c=e.target.closest('[data-chips] button');
  if(c){ e.preventDefault(); c.classList.toggle('on'); return; }
  if(e.target.closest('[data-close]')) closeModal();
});


/* ---------- which restaurant? ----------
   One venue and it is chosen silently. More than one - a platform admin,
   or someone who works at two of them - and they are asked, with the
   answer remembered on this device. */
var VENUES = [];
function myVenues(){
  return api('/rest/v1/rpc/rd_my_venues',{method:'POST',body:'{}'});
}
function savedVenueId(){
  try { return localStorage.getItem('rd_venue_mgr'); } catch(e){ return null; }
}
function rememberVenue(id){
  try { localStorage.setItem('rd_venue_mgr', id); } catch(e){}
}
function forgetVenue(){
  try { localStorage.removeItem('rd_venue_mgr'); } catch(e){}
}
function paintVenuePicker(list){
  VENUES = list;
  var h='<span class="mono" style="color:var(--muted)">Restaurant Deluxe</span>'+
    '<h1 style="margin-top:8px;font-size:21px">Choose a restaurant</h1>'+
    '<p class="hint">You have access to more than one.</p>'+
    '<div style="margin-top:16px">'+
    list.map(function(v){
      return '<button class="btn quiet full" data-venue="'+esc(v.id)+'" '+
        'style="margin-top:8px;justify-content:space-between">'+
        '<span>'+esc(v.name||v.slug)+'</span>'+
        '<span style="color:var(--muted);font-size:11px;font-family:\'Space Mono\',monospace">'+
          esc(v.role||'')+'</span></button>';
    }).join('')+'</div>';
  return h;
}

/* ---------- boot ---------- */
(function(){
  if(!SUPABASE_URL||!SUPABASE_KEY){
    var c=readCfg();
    if(c&&c.url&&c.key){ SUPABASE_URL=c.url; SUPABASE_KEY=c.key; }
  }
  if(!SUPABASE_URL||!SUPABASE_KEY) return showConn('');
  showLogin('');
  var s=readSess();
  if(s&&s.access_token){
    SESSION=s;
    loadAll().catch(function(){ try{localStorage.removeItem('rd_mgr_session');}catch(e){} SESSION=null; });
  }
})();
})();
