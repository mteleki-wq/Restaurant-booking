</style></head><body><header><p>APEX AUSTRALIA · SITXFIN011 MANAGE PHYSICAL ASSETS</p><h1>Nara USA: Ready for the role-play?</h1><p>A team refresher · Plan → compare → record → explain</p></header><main><div id="app"></div><div id="message" role="status" aria-live="polite"></div><div id="printout" class="printonly"></div><footer>Revision activity only. Quiz scores are not assessment outcomes. Use the RTO Learner Assessment Pack for the formal submission.</footer></main><script>
const questions=[{"round": 1, "title": "The USA roadmap", "question": "Which set of work belongs to the Nara USA project?", "options": ["A knowledge test, a menu and a roster", "An acquisition plan, asset and maintenance registers, and a resource management strategy", "A supplier list, a room layout and a guest survey", "An invoice, a loan application and a signed purchase"], "correct": 1, "why": "The USA project has three linked parts. The in-class role-play/presentation supports the project; this revision quiz does not replace it.", "hint": "Think about planning, recording assets and managing their performance.", "action": "Name the three parts and point to where your group has started each.", "ref": "USA instructions; Parts 1–3"}, {"round": 1, "title": "Keep the assets consistent", "question": "Your group selects three physical assets in Part 1. What should happen in Parts 2 and 3?", "options": ["Choose new assets to show more variety", "Record only the asset with the highest price", "Keep the same three assets across the registers and strategy", "Use one shared maintenance plan without naming assets"], "correct": 2, "why": "The registers and strategy build on the three assets chosen in the acquisition plan. Changing assets means updating all affected sections.", "hint": "The project parts build on one another.", "action": "Say your three asset names aloud and check they match in every section.", "ref": "Part 2 Task 1; Part 3 introduction"}, {"round": 1, "title": "Explain the business need", "question": "Which explanation best supports buying laundry equipment for the hotel expansion?", "options": ["A linen-load forecast shows the expanded hotel will exceed current washing capacity", "A supplier has a discount on a model this month", "The group likes this brand more than other brands", "Another hotel has recently purchased the same machine"], "correct": 0, "why": "A workload forecast links the asset to Nara’s operational need. A discount or brand preference alone does not explain the required capacity.", "hint": "Link the asset to the work the hotel must perform.", "action": "For one of your assets, explain its job and the information supporting the need.", "ref": "Part 1 Q1–Q2"}, {"round": 1, "title": "Physical asset or subscription?", "question": "A group lists only a cloud PMS subscription as its third physical asset. What is the best next step?", "options": ["Call the monthly subscription a serial number", "Treat the subscription as guest-room furniture", "Leave the register blank for that asset", "Identify the physical computer equipment in the proposed system, or select another physical asset"], "correct": 3, "why": "The project requires physical assets. Computer systems are an allowed category; identify the hardware rather than describing only a software subscription.", "hint": "A physical asset has a material form.", "action": "Check whether each asset has a clear physical description and scope.", "ref": "Part 1 asset categories; learner guide: physical assets"}, {"round": 1, "title": "Specifications", "question": "Which entry best helps a supplier quote suitable equipment?", "options": ["A popular model with a good online rating", "Capacity, performance, size, location and maximum budget requirements", "A supplier name and an approximate delivery month", "A photograph and the hotel’s profit target"], "correct": 1, "why": "Part 1 Q3 asks for capacity, performance, size, location requirements and maximum budget for each asset or an overall budget parameter. State quantities so suppliers quote comparable scopes.", "hint": "A supplier needs to know what the equipment must do and where it must fit.", "action": "Check these requirements for one asset; identify one detail still missing.", "ref": "Part 1 Q3"}, {"round": 2, "title": "Nine comparisons", "question": "There are three selected assets. How many supplier prices or quotes are required in total?", "options": ["Three: one for each asset", "Six: two for each asset", "Nine: three for each asset", "Twelve: four for each asset"], "correct": 2, "why": "Three different supplier/source prices for each of three assets gives 3 × 3 = 9 comparisons. Keep each asset’s suppliers together.", "hint": "Count the required sources for every asset separately.", "action": "Check whether you have three sources for each asset, rather than three overall.", "ref": "Part 1 Q4"}, {"round": 2, "title": "Compare the same scope", "question": "Supplier A prices one washer without installation. Supplier B prices two installed washers. What should you do first?", "options": ["Compare equivalent quantities and included costs before choosing", "Choose A because its displayed price is lower", "Choose B because installation is mentioned", "Average the two prices and use that as the final quote"], "correct": 0, "why": "A meaningful comparison needs matching quantities and scope. Clarify GST, delivery, installation and other costs before comparing totals.", "hint": "Check what each price actually buys.", "action": "Look for differences in quantity, GST and installation in your own comparisons.", "ref": "Part 1 Q3–Q4"}, {"round": 2, "title": "Price research versus correspondence", "question": "A group has nine website links but no correspondence or final quote received for any asset. What is still needed under Q4?", "options": ["A screenshot of the search results only", "A statement that all suppliers approved the prices", "A new name for the same nine website links", "The required correspondence and final quote received for each asset"], "correct": 3, "why": "Advertised prices can support research, but Q4 also asks for attached correspondence and the final quote received for each asset. If responses are unavailable, discuss the assessment arrangement with the trainer; never invent replies.", "hint": "A price source and a supplier communication are different kinds of evidence.", "action": "List the correspondence and final quotes your group still needs to attach.", "ref": "Part 1 Q4"}, {"round": 2, "title": "Finance contacts", "question": "Which contact requirement matches Part 1 Q5?", "options": ["Two banks only, with no supplier contact", "A financial institution and at least two different suppliers, obtaining three finance options and costs", "One supplier only, obtaining three product brochures", "Three classmates, obtaining their preferred payment methods"], "correct": 1, "why": "Q5 requires a financial institution and at least two suppliers, information on three financing options and their costs, and copies of correspondence.", "hint": "Separate the people contacted from the number of options compared.", "action": "Identify your actual contacts and the evidence filenames; do not invent contact.", "ref": "Part 1 Q5"}, {"round": 2, "title": "Finance recommendation", "question": "Two options have different deposits, terms and fees. What best supports a recommendation for each asset?", "options": ["Compare only the smallest monthly repayment", "Select the option with the longest term automatically", "Calculate total costs and cash-flow effects, and consider depreciation, technology changes and specialist advice", "Choose the option used in the calculator’s sample"], "correct": 2, "why": "Q6 requires calculated finance variants and the best option for each asset, including depreciation, technology changes, financial impacts and aspects needing specialist advice. A sample calculator result alone is incomplete.", "hint": "A low repayment can still have a high total cost.", "action": "Point to your calculations and explain why your recommended option suits the hotel.", "ref": "Part 1 Q6"}, {"round": 3, "title": "The asset register", "question": "Which set of details belongs in the asset register?", "options": ["Description/model/type, serial number, purchase date, cost, depreciation and closing written-down value", "Only the supplier’s contact details and product photograph", "Only fault reports, contractor visits and cleaning tasks", "Only team roles, meeting dates and guest comments"], "correct": 0, "why": "The asset register records identification, acquisition and value details. Maintenance tasks belong in the maintenance register.", "hint": "Distinguish the identity and value of an asset from its servicing tasks.", "action": "Check one asset-register entry against the required fields.", "ref": "Part 2 Task 1 Q1"}, {"round": 3, "title": "Proposed purchase", "question": "The asset has not been purchased and has no serial number yet. What is the best approach?", "options": ["Invent a serial number to complete the table", "Remove the asset from all three project parts", "Leave every financial field blank until a real purchase", "Label purchase details as proposed/pending and calculate using a stated approximate price where allowed"], "correct": 3, "why": "Do not invent purchase facts. The assessment allows an approximate price when a current value is unavailable, using ATO guidance. State dates and assumptions and complete the required calculations.", "hint": "Some identification details can be pending; calculations still have an assessment basis.", "action": "Find any “pending calculation” entry and identify what estimate and dates you need.", "ref": "Part 2 Task 1 Q1; friendly role-play guidance"}, {"round": 3, "title": "Depreciation period", "question": "For the asset register, which period must the depreciation calculation cover?", "options": ["A full five years regardless of assessment date", "From when you undertake the assessment to the end of that financial year", "Only the month before the assessment starts", "Until the date a supplier replies to the enquiry"], "correct": 1, "why": "The pack specifies depreciation from the assessment to financial year end, and the closing written-down value at that year end. Record the dates and applicable ATO basis.", "hint": "Read the time period in the register instructions, not just the useful life.", "action": "Write your calculation start and end dates next to your method and source.", "ref": "Part 2 Task 1 Q1"}, {"round": 3, "title": "Value calculation practice", "question": "For this classroom example only, an asset’s recorded cost is $12,000 and depreciation for the stated period is $1,500. With no other adjustments, what is its closing written-down value?", "options": ["$13,500", "$1,500", "$10,500", "$12,000"], "correct": 2, "why": "Closing value = $12,000 − $1,500 = $10,500. This checks subtraction only; it does not prescribe an ATO depreciation method or rate.", "hint": "Depreciation reduces the recorded value.", "action": "Check that your closing values reconcile with cost less depreciation for your stated period.", "ref": "Part 2 Task 1 Q1; illustrative arithmetic"}, {"round": 3, "title": "Maintenance evidence", "question": "Where should the maintenance schedule for your selected model come from?", "options": ["Relevant lease/service terms or manufacturer instructions, considering frequency of use", "A generic schedule copied unchanged for every asset", "Only the supplier’s promotional photograph", "Only the estimated useful life used for depreciation"], "correct": 0, "why": "Part 2 requires maintenance requirements informed by lease/service agreements or manuals/manufacturer recommendations, with frequency of use considered.", "hint": "Think about the instructions for the particular equipment.", "action": "Identify the manual or service terms supporting one of your schedules.", "ref": "Part 2 Task 1 Q2"}, {"round": 4, "title": "Reduce disruption", "question": "A washer service will take two hours. Which plan best addresses service disruption?", "options": ["Service it during peak linen demand without telling staff", "Delay every service until the machine fails", "Close every hotel room for the full day", "Use a lower-demand period and arrange suitable backup linen/laundry capacity"], "correct": 3, "why": "The strategy must address location, duration, timing and disruption. The plan should maintain service while meeting safety and maintenance requirements.", "hint": "Connect service timing to the hotel’s workload.", "action": "Explain when you will service one asset and how operations will continue.", "ref": "Part 3 (d)–(h)"}, {"round": 4, "title": "Avoid counting costs twice", "question": "A $900 service fee already includes labour. The budget adds the same $900 again as separate labour. What should change?", "options": ["Keep both amounts because they appear in different sections", "Count the fee once, state what it includes and cross-reference the labour and parts sections", "Delete all maintenance costs from the project", "Add another $900 as a contingency without explanation"], "correct": 1, "why": "Part 3 asks for labour/contractor and parts/equipment/consumables costs. Separate or cross-reference included amounts so one expense is not counted twice.", "hint": "Two descriptions can refer to one expense.", "action": "Reconcile the totals in your labour, parts and maintenance-budget sections.", "ref": "Part 3 (j)–(k)"}, {"round": 4, "title": "Monitor asset performance", "question": "Which approach best supports ongoing asset review?", "options": ["Keep the purchase price and stop collecting records", "Use guest comments only and ignore costs and faults", "Combine condition/fault records, staff and customer feedback, maintenance costs and scheduled review", "Wait for complete failure before reviewing the asset"], "correct": 2, "why": "The strategy links reporting, feedback, financial monitoring and review/audit triggers. Include responsibilities and relevant legal/safety requirements for the selected assets.", "hint": "Use operational, customer/staff and financial information together.", "action": "Name one performance measure, one reporting responsibility and one review trigger.", "ref": "Part 3 (a)–(c), (h)–(i), (l)–(m)"}, {"round": 4, "title": "Answer the manager", "question": "The manager asks why your group recommends a supplier. Which response const rounds=['Plan the assets','Suppliers & finance','Registers & maintenance','Management discussion'];
const key='naraUSA_refresh_quiz_v1';let state=null,tick=null,seconds=60;const $=id=>document.getElementById(id);function e(t,c,text){const n=document.createElement(t);if(c)n.className=c;if(text!==undefined)n.textContent=text;return n}function button(p,text,fn,secondary=false){const b=e('button',secondary?'secondary':'',text);b.onclick=fn;p.appendChild(b);return b}function say(s){$('message').textContent=s}function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{say('Browser saving is unavailable. Download a backup before closing.')}}function stop(){clearInterval(tick);tick=null}function active(){return state.order[state.index]}function record(){return state.records[active()]||{answers:{},revealed:false}}function score(i){return state.order.filter(id=>state.records[id]?.revealed&&state.records[id].answers[i]===questions[id].correct).length}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
try{const raw=JSON.parse(localStorage.getItem(key));if(raw&&Array.isArray(raw.teams)&&raw.teams.length>=1&&raw.teams.length<=6&&Array.isArray(raw.order)&&raw.order.length&&raw.order.every(i=>Number.isInteger(i)&&i>=0&&i<20)&&raw.records&&Number.isInteger(raw.index)&&raw.index>=0&&raw.index<raw.order.length)state=raw;}catch{}
function render(){stop();$('app').replaceChildren();say('');if(!state)setup();else if(state.finished)results();else play();}
function setup(){const a=$('app');let c=e('section','card');a.appendChild(c);c.appendChild(e('span','tag','20 questions · 4 rounds · 1–6 teams'));c.appendChild(e('h2','','Refresh the task, then apply it to your project'));c.appendChild(e('p','','I discuss each question with my team, agree on one answer, then explain what we need to do in our own Nara USA project.'));
 const g=e('div','grid');c.appendChild(g);rounds.forEach((r,i)=>{const n=e('div','notice');n.append(e('strong','',`Round ${i+1}: ${r}`),e('p','muted',['Choose three suitable physical assets and specify the need.','Compare sources, contact providers and calculate finance.','Record values and plan model-specific maintenance.','Manage costs, explain evidence and record real feedback.'][i]));g.appendChild(n)});
 c.appendChild(e('p','','Suggested play: full quiz 35–45 minutes; quick refresher 15–20 minutes. One shared screen works well. Every team submits an answer before reveal. Rotate the spokesperson each question. One point per correct answer; pass = zero. Discussion prompts are not scored.'));
 const n=e('select');n.id='count';for(let i=1;i<=6;i++){const o=e('option','',String(i));o.value=i;n.appendChild(o)}n.value='3';const lab=e('label','','Number of teams');lab.htmlFor=n.id;c.append(lab,n);const names=e('div','teams');c.appendChild(names);const fill=()=>{const previous=[...names.querySelectorAll('input')].map(x=>x.value);names.replaceChildren();for(let i=0;i<Number(n.value);i++){const w=e('div'),l=e('label','',`Team ${i+1} name`),inp=e('input');inp.id='name'+i;inp.maxLength=40;inp.value=previous[i]||`Team ${i+1}`;l.htmlFor=inp.id;w.append(l,inp);names.appendChild(w)}};n.onchange=fill;fill();const bar=e('div','bar');c.appendChild(bar);const start=quick=>{state={teams:[...names.querySelectorAll('input')].map((x,i)=>x.value.trim()||`Team ${i+1}`),order:quick?[0,2,4,5,7,8,11,13,17,19]:questions.map((q,i)=>i),index:0,records:{},notes:{},finished:false,started:new Date().toLocaleDateString('en-AU')};save();render()};button(bar,'Start full quiz · 20 questions',()=>start(false));button(bar,'Quick refresher · 10 questions',()=>start(true),true);const d=e('details');d.appendChild(e('summary','','Trainer notes & source alignment'));d.appendChild(e('p','','The questions revise the acquisition plan (Q1–Q7), asset/maintenance registers and resource strategy (a)–(m). Some details are reinforced through the final checklist rather than tested separately. No extra assessment tasks are created. The correct answers and explanations can be printed as a trainer key.'));d.appendChild(e('p','muted','Sources: SITXFIN011 Learner Assessment Pack v2.2 August 2026, USA pp. 16–23 (PDF pages 16–24); SITXFIN011 Nara Roleplay Friendly revision 27 October 2026; Apex learner guide, physical asset definitions. Questions and example arithmetic are original revision material. No live supplier offers or current tax rates are supplied.'));button(d,'Print trainer answer key',printKey,true);c.appendChild(d);}
function play(){const a=$('app'),q=questions[active()],r=record();const scorebar=e('div','teams');state.teams.forEach((t,i)=>{const x=e('div','card');x.style.margin='0';x.append(e('strong','',t),e('div','score',String(score(i))),e('span','muted','points'));scorebar.appendChild(x)});a.appendChild(scorebar);let c=e('section','card');a.appendChild(c);c.appendChild(e('span','tag',`Round ${q.round}: ${rounds[q.round-1]} · Question ${state.index+1}/${state.order.length}`));const p=e('progress');p.max=state.order.length;p.value=state.order.filter(id=>state.records[id]?.revealed).length;p.setAttribute('aria-label','Questions revealed');c.appendChild(p);c.append(e('p','muted',q.title),e('h2','',q.question));const opts=e('div','grid');q.options.forEach((o,i)=>{const x=e('div','option'+(r.revealed&&i===q.correct?' correct':''));x.append(e('span','letter','ABCD'[i]),e('span','',o));opts.appendChild(x)});c.appendChild(opts);
 const h=e('details');h.append(e('summary','','Need a hint?'),e('p','',q.hint));c.appendChild(h);const tbar=e('div','bar');c.appendChild(tbar);const timer=e('span','timer','Discussion timer: 60s');tbar.appendChild(timer);button(tbar,'Start / pause 60s timer',()=>{if(tick){stop();return}if(seconds<=0)seconds=60;tick=setInterval(()=>{seconds--;timer.textContent=`Discussion timer: ${seconds}s`;if(seconds<=0)stop()},1000)},true);button(tbar,'Reset timer',()=>{stop();seconds=60;timer.textContent='Discussion timer: 60s'},true);seconds=60;
 const entries=e('div','teams');c.appendChild(entries);state.teams.forEach((team,i)=>{const w=e('div','notice'),l=e('label','',`${team}: agreed answer`),s=e('select');s.id='team'+i;l.htmlFor=s.id;[['','Choose…'],['0','A'],['1','B'],['2','C'],['3','D'],['pass','Pass / not sure']].forEach(([v,text])=>{const o=e('option','',text);o.value=v;s.appendChild(o)});s.value=r.answers[i]===undefined?'':String(r.answers[i]);s.disabled=r.revealed;s.onchange=()=>{state.records[active()]??={answers:{},revealed:false};if(s.value==='')delete state.records[active()].answers[i];else state.records[active()].answers[i]=s.value==='pass'?'pass':Number(s.value);save()};w.append(l,s);if(r.revealed)w.appendChild(e('p','',r.answers[i]===q.correct?'✓ 1 point':r.answers[i]==='pass'?'Pass · 0 points':'Review this area · 0 points'));entries.appendChild(w)});
 const bar=e('div','bar');c.appendChild(bar);if(!r.revealed)button(bar,'Reveal answer & explain',()=>{const now=record();if(state.teams.some((_,i)=>now.answers[i]===undefined)){say('Choose an answer or Pass for every team before revealing.');return}now.revealed=true;state.records[active()]=now;save();render()});else{const f=e('div','feedback');f.setAttribute('role','status');f.append(e('h3','',`Answer ${'ABCD'[q.correct]} · ${q.options[q.correct]}`),e('p','',q.why),e('p','muted','Where this fits: '+q.ref));const ap=e('div','apply');ap.append(e('strong','','Now apply it · rotate your spokesperson'),e('p','',q.action));f.appendChild(ap);c.appendChild(f);button(bar,state.index===state.order.length-1?'Finish & make our action plan':'Next question',()=>{if(state.index===state.order.length-1)state.finished=true;else state.index++;save();render();window.scrollTo(0,0)});}
 common(a);
}
function common(a){const bar=e('div','bar noprint');a.appendChild(bar);button(bar,'Download progress backup',backup,true);button(bar,'Restart / change teams',()=>{if(confirm('Start a new quiz? Download a progress backup first if you want to keep this session.')){state=null;save();render()}},true);a.appendChild(e('p','savehint','Progress saves in this browser when available. For another device, download a backup and import it on the welcome screen.'))}
function results(){const a=$('app');const c=e('section','card');a.appendChild(c);c.append(e('span','tag','Revision complete — now prepare your evidence'),e('h2','','What does our team need to finish?'),e('p','','Use the missed questions to guide revision. A high quiz score does not confirm that the USA project or role-play is satisfactory.'));
state.teams.forEach((t,i)=>{const card=e('div','card');card.append(e('h3','',`${t} · ${score(i)}/${state.order.length}`));const missed=state.order.filter(id=>state.records[id]?.answers[i]!==questions[id].correct);card.appendChild(e('p','',missed.length?'Review: '+missed.map(id=>questions[id].title).join('; '):'All quiz answers were correct. Check the completeness of your actual evidence next.'));const lab=e('label','','Our next actions · task, person responsible and due date');lab.htmlFor='notes'+i;const n=e('textarea');n.id='notes'+i;n.value=state.notes[i]||'';n.placeholder='1. What will we complete? Who will do it? By when?\n2.\n3.';n.oninput=()=>{state.notes[i]=n.value;save()};card.append(lab,n);c.appendChild(card)});
const d=e('details');d.open=true;d.appendChild(e('summary','','Before the in-class role-play: our preparation checklist'));checklist.forEach(t=>d.appendChild(e('p','',t)));c.appendChild(d);const bar=e('div','bar');c.appendChild(bar);button(bar,'Print results & action plan / Save PDF',()=>{printSummary();window.print()});button(bar,'Review questions & explanations',()=>{state.finished=false;state.index=0;save();render()},true);button(bar,'Print trainer answer key',printKey,true);common(a);}
const checklist=['Part 1 Q1–Q3: explain the business, justify each asset and define capacity, performance, size, location and budget.','Part 1 Q4: three prices/sources for each asset; attach correspondence and final quote received for each asset. Keep quantity and included costs comparable.','Part 1 Q5–Q6: financial institution and at least two supplier contacts; three finance options, calculations and recommendation for each asset; depreciation, technology changes, financial impacts and specialist advice.','Part 1 Q7: acquisition process, specifications, approvals, contracts, finance documents and disposal/tax documentation where assets are replaced.','Part 2: the same three assets, required identification/cost fields, depreciation to financial year end and closing values; maintenance requirements and schedule supported by manuals or contracts.','Part 3 (a)–(i): reporting, specialist help, customer/staff feedback, maintenance types, location, duration, timing, disruption, WHS and relevant legal/regulatory requirements.','Part 3 (j)–(m): labour/contractors, parts/equipment/consumables, financial monitoring and review/audit triggers. Count each cost once.','Meeting: bring your evidence, share speaking roles, explain decisions in your own words and record actual feedback and changes. Practice is preparation; the assessed activity occurs in class.','Submission: use the RTO assessment format and required cover page. Attach evidence. Label estimates honestly and never invent supplier replies, serial numbers, purchases or approvals.'];
function printSummary(){let s='<h2>Group revision results & next actions</h2><p>'+esc(state.started)+' · '+state.order.length+' questions · Revision only</p>';state.teams.forEach((t,i)=>{s+='<section class="card"><h3>'+esc(t)+' · '+score(i)+'/'+state.order.length+'</h3><p>Review: '+esc(state.order.filter(id=>state.records[id]?.answers[i]!==questions[id].correct).map(id=>questions[id].title).join('; ')||'All quiz items answered correctly; verify actual project evidence.')+'</p><p style="white-space:pre-wrap">Next actions:\n'+esc(state.notes[i]||'Not entered')+'</p></section>'});s+='<h3>Preparation checklist</h3>'+checklist.map(t=>'<p>'+esc(t)+'</p>').join('');$('printout').innerHTML=s;}
function printKey(){if(!confirm('This will show and print all 20 correct answers. Use it after play or for trainer preparation. Continue?'))return;const s='<h2>Trainer answer key · Nara USA refresher</h2><p>Revision only. Discussion prompts are not scored. Use the formal assessment pack for assessment decisions.</p>'+questions.map((q,i)=>'<section class="card"><h3>'+(i+1)+'. '+esc(q.question)+'</h3><p><strong>'+ 'ABCD'[q.correct]+'. '+esc(q.options[q.correct])+'</strong></p><p>'+esc(q.why)+'</p><p>Apply: '+esc(q.action)+'</p><p>'+esc(q.ref)+'</p></section>').join('');$('printout').innerHTML=s;window.print();}
function backup(){const blob=new Blob([JSON.stringify({version:1,state},null,2)],{type:'application/json'}),a=e('a');a.href=URL.createObjectURL(blob);a.download='Nara_USA_Quiz_Progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function addImport(){if(state)return;const c=e('section','card');c.appendChild(e('h3','','Continue a saved quiz'));const lab=e('label','','Import progress JSON');lab.htmlFor='import';const f=e('input');f.id='import';f.type='file';f.accept='.json';f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text()),s=d.state;if(d.version!==1||!s||!Array.isArray(s.teams)||s.teams.length<1||s.teams.length>6||!s.teams.every(t=>typeof t==='string')||!Array.isArray(s.order)||!s.order.length||s.order.some(i=>!Number.isInteger(i)||i<0||i>=20)||new Set(s.order).size!==s.order.length||!Number.isInteger(s.index)||s.index<0||s.index>=s.order.length||!s.records||typeof s.records!=='object'||Array.isArray(s.records))throw Error();for(const [id,r] of Object.entries(s.records)){if(!s.order.includes(Number(id))||!r||typeof r.revealed!=='boolean'||!r.answers||typeof r.answers!=='object')throw Error();for(const [team,v] of Object.entries(r.answers))if(!Number.isInteger(Number(team))||Number(team)<0||Number(team)>=s.teams.length||!(v==='pass'||Number.isInteger(v)&&v>=0&&v<=3))throw Error();if(r.revealed&&s.teams.some((_,i)=>r.answers[i]===undefined))throw Error();}if(s.finished&&s.order.some(i=>!s.records[i]?.revealed))throw Error();s.notes=s.notes&&typeof s.notes==='object'?s.notes:{};state=s;save();render();}catch{say('This is not a valid quiz progress file. Import the backup downloaded from this quiz.')}};c.append(lab,f);$('app').appendChild(c)}
const baseRender=render;render=()=>{baseRender();addImport()};render();
</script></body></html>
