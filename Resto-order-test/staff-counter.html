function saveBytes(bytes, filename, mime){
  var blob=new Blob([bytes],{type:mime});
  if(navigator.canShare&&window.File){
    try{
      var f=new File([blob],filename,{type:mime});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:filename})
          .then(function(){toast('Exported');},function(){ downloadBlob(blob,filename); });
        return;
      }
    }catch(e){}
  }
  downloadBlob(blob,filename);
}

function reportFilename(r){
  var d=new Date(r.period_end||Date.now());
  var p=function(n){return ('0'+n).slice(-2);};
  var slug=(r.venue||'restaurant').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return slug+'-'+(r.kind==='Z'?('Z'+r.reading):'X')+'-'+
    d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.csv';
}

/* A leading BOM. Without it Excel opens UTF-8 as Latin-1 and turns
   "Café" into "CafÃ©" - which looks like corrupted books. */
function saveCsv(text, filename){
  var blob=new Blob(['\ufeff'+text], {type:'text/csv;charset=utf-8;'});

  /* iOS Safari handles a share sheet far better than a download attribute,
     and it lets the file go straight to Files, Mail or a cloud drive. */
  if(navigator.canShare && window.File){
    try{
      var f=new File([blob], filename, {type:'text/csv'});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f], title:filename})
          .then(function(){ toast('Exported'); })
          .catch(function(){ downloadBlob(blob, filename); });
        return;
      }
    }catch(e){}
  }
  downloadBlob(blob, filename);
}
function downloadBlob(blob, filename){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    toast('Exported \u00b7 '+filename);
  }catch(e){ toast('Could not save the file on this device'); }
}

function exportReport(readingId, btn){
  var label=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='Preparing\u2026'; }

  return api('/rest/v1/rpc/rd_report',{method:'POST',body:JSON.stringify(body)})
    .then(function(r){
      if(!r) throw {data:null};
      saveCsv(buildCsv(r), reportFilename(r));
    })
    .catch(function(e){ toast(apiErr(e)); })
    .then(function(){ if(btn){ btn.disabled=false; btn.textContent=label; } });
}

function isoDate(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function trendsPreset(key){
  var end = new Date(); var start = new Date();
  if(key==='7d'){ start.setDate(end.getDate()-6); }
  else if(key==='30d'){ start.setDate(end.getDate()-29); }
  else if(key==='month'){ start = new Date(end.getFullYear(), end.getMonth(), 1); }
  else if(key==='lastmonth'){
    start = new Date(end.getFullYear(), end.getMonth()-1, 1);
    end = new Date(end.getFullYear(), end.getMonth(), 0);
  }
  return { start: isoDate(start), end: isoDate(end) };
}

    toast((params.get('provider')==='xero'?'Xero':'MYOB')+' connected');

        '<p class="hint" style="margin-bottom:8px">Send one day\u2019s real sales to '+label+' as a draft invoice \u2014 '+
          'nothing is finalised until your own bookkeeper reviews and approves it there.</p>'+
        '<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">'+
          '<div><label for="acctSyncDate" style="display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px">Date</label>'+
          '<input type="date" id="acctSyncDate" max="'+todayIso+'" value="'+yestIso+'" '+
            'style="background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);'+
            'padding:9px 11px;min-height:42px"></div>'+
          '<button class="btn sm" id="acctSyncNow">Sync this date</button>'+
        '</div>'+
        '<p class="hint" id="acctSyncResult" style="margin-top:8px"></p>'+
      '</div>'+
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">'+
        '<p class="hint" style="margin-bottom:8px">Recent syncs</p>'+
        '<div id="acctSyncHistory"><p class="hint">Loading\u2026</p></div>'+
      '</div>';
  } else {
    body =
      '<p class="hint" style="color:var(--bad,#ff9a8a)">Something went wrong connecting'+
        (status.provider?' to '+(status.provider==='xero'?'Xero':'MYOB'):'')+'.'+
        (status.last_error?' ('+esc(status.last_error)+')':'')+'</p>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">'+
        '<button class="btn quiet sm" id="acctConnectXero"'+(XERO_CLIENT_ID?'':' disabled')+'>Try Xero again</button>'+
        '<button class="btn quiet sm" id="acctConnectMyob"'+(MYOB_CLIENT_ID?'':' disabled')+'>Try MYOB again</button>'+
      '</div>';
  }
  $('acctBody').innerHTML = body;
  if(status && status.status === 'connected') loadSyncHistory(status.provider);
}
function loadAccountingStatus(){
  api('/rest/v1/rpc/rd_accounting_status',{method:'POST', body:JSON.stringify({p_venue_id:VENUE.id})})
    .then(function(res){ LAST_ACCT_STATUS = res; renderAccounting(res); })
    .catch(function(){ $('acctBody').innerHTML = '<p class="hint">Could not load status.</p>'; });
}
function syncDateLabel(iso){
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
}
function loadSyncHistory(provider){
  api('/rest/v1/rpc/rd_accounting_sync_status',{method:'POST', body:JSON.stringify({p_venue_id:VENUE.id, p_limit:8})})
    .then(function(rows){
      var relevant = (rows||[]).filter(function(r){ return r.provider === provider; });
      if(!relevant.length){ $('acctSyncHistory').innerHTML = '<p class="hint">Nothing synced yet.</p>'; return; }
      $('acctSyncHistory').innerHTML = relevant.map(function(r){
        var ok = r.status === 'success';
        return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px">'+
          '<span>'+esc(syncDateLabel(r.sync_date))+'</span>'+
          '<span style="color:'+(ok?'var(--good,#8bc49a)':'var(--bad,#ff9a8a)')+'">'+
            (ok ? money(r.revenue_cents) : esc(r.last_error||'Failed'))+'</span>'+
        '</div>';
      }).join('');
    })
    .catch(function(){ $('acctSyncHistory').innerHTML = '<p class="hint">Could not load history.</p>'; });
}
function accountingSyncFnName(provider){ return provider + '-accounting-sync'; }
function startAccountingConnect(provider){
  api('/rest/v1/rpc/rd_create_oauth_state',{method:'POST',
    body:JSON.stringify({p_venue_id:VENUE.id, p_provider:provider})})
    .then(function(res){
      var state = res.state;
      var redirect = accountingCallbackUrl(provider);
      var url;
      if(provider === 'xero'){
        // Xero retired the broad accounting.transactions scope for every
        // app created on or after 2 March 2026 - a brand-new app can
        // never be granted it at all, and requesting it fails with
        // invalid_scope. accounting.contacts + accounting.invoices are
        // the specific granular scopes this actually needs: a contact
        // to bill the daily total to, and the invoice itself. Confirmed
        // current via Xero's own developer docs, not assumed.
        url = 'https://login.xero.com/identity/connect/authorize'+
          '?response_type=code&client_id='+encodeURIComponent(XERO_CLIENT_ID)+
          '&redirect_uri='+encodeURIComponent(redirect)+
          '&scope='+encodeURIComponent('openid profile email accounting.contacts accounting.invoices offline_access')+
          '&state='+encodeURIComponent(state);
      } else {
        url = 'https://secure.myob.com/oauth2/account/authorize'+
          '?client_id='+encodeURIComponent(MYOB_CLIENT_ID)+
          '&redirect_uri='+encodeURIComponent(redirect)+
          '&response_type=code'+
          '&scope='+encodeURIComponent('sme-company-file sme-sale sme-contact')+
          '&prompt=consent&state='+encodeURIComponent(state);
      }
      window.location.href = url;
    })
    .catch(function(e){ toast(apiErr(e)); });
}
$('pTrends').addEventListener('click', function(e){
  if(e.target.id === 'acctSyncNow'){
    var dateVal = $('acctSyncDate').value;
    if(!dateVal){ toast('Pick a date'); return; }
    var provider = (LAST_ACCT_STATUS && LAST_ACCT_STATUS.provider) || 'xero';
    var btn = e.target; btn.disabled = true; btn.textContent = 'Syncing\u2026';
    $('acctSyncResult').textContent = '';
    api('/functions/v1/'+accountingSyncFnName(provider),{method:'POST',
      body:JSON.stringify({venue_id:VENUE.id, date:dateVal})})
      .then(function(res){
        if(res && res.ok){
          $('acctSyncResult').innerHTML = '<span style="color:var(--good,#8bc49a)">Sent '+money(res.revenue_cents)+
            ' as a draft invoice \u2014 review it in '+(provider==='xero'?'Xero':'MYOB')+'.</span>';
        } else {
          var msgs = {
            already_synced: 'That date has already been sent \u2014 check your recent syncs below.',
            nothing_to_sync: 'Nothing was sold that day \u2014 there\u2019s nothing to send.',
            not_connected: 'Not currently connected \u2014 try reconnecting above.',
            token_refresh_failed: 'Could not refresh the connection \u2014 try reconnecting above.',
            contact_creation_failed: 'Could not set up the sales contact on the other end \u2014 try again shortly.',
            invoice_creation_failed: 'The invoice itself was refused \u2014 try again shortly.'
          };
          $('acctSyncResult').innerHTML = '<span style="color:var(--warn)">'+
            esc(msgs[res && res.error] || ('Could not sync that date'+((res && res.error) ? ' ('+res.error+')' : '')+' \u2014 try again.'))+'</span>';
        }
        loadSyncHistory(provider);
      })
      .catch(function(){ $('acctSyncResult').innerHTML = '<span style="color:var(--bad,#ff9a8a)">Could not reach the server. Check the WiFi and try again.</span>'; })
      .then(function(){ btn.disabled=false; btn.textContent='Sync this date'; });
    return;
  }
  if(e.target.id === 'acctConnectXero') return startAccountingConnect('xero');
  if(e.target.id === 'acctConnectMyob') return startAccountingConnect('myob');
  if(e.target.id === 'acctDisconnect'){
    if(!confirm('Disconnect your accounting software? You can reconnect any time.')) return;
    api('/rest/v1/rpc/rd_disconnect_accounting',{method:'POST', body:JSON.stringify({p_venue_id:VENUE.id})})
      .then(function(){ toast('Disconnected'); loadAccountingStatus(); })
      .catch(function(er){ toast(apiErr(er)); });
  }
});

function loadTrends(start, end, btn){
  TRENDS_RANGE = { start:start, end:end };
  if(btn){ btn.disabled=true; btn.textContent='Loading\u2026'; }
  $('trResults').innerHTML = '<div class="empty">Loading\u2026</div>';
  return api('/rest/v1/rpc/rd_sales_trends',{method:'POST',
    body:JSON.stringify({p_venue_id:VENUE.id, p_start:start, p_end:end})})
    .then(function(r){
      TRENDS_DATA = r;
      $('trExport').style.display = '';
      renderTrendsData(r);
    })
    .catch(function(e){
      $('trResults').innerHTML = '<div class="empty">'+esc(apiErr(e))+'</div>';
    })
    .then(function(){ if(btn){ btn.disabled=false; btn.textContent='Load'; } });
}

function pctBadge(pct){
  if(pct===null||pct===undefined) return '';
  var up = pct >= 0;
  return '<span style="font-size:12px;font-family:\'Space Mono\',monospace;margin-left:6px;'+
    'color:'+(up?'#8fd6a8':'#ff9a8a')+'">'+(up?'\u2191':'\u2193')+Math.abs(pct)+'%</span>';
}

function dishRowsHtml(list){
  if(!list.length) return '<p class="hint" style="margin-top:8px">Nothing sold in this range.</p>';
  return '<table class="dtable" style="margin-top:10px"><thead><tr><th>Dish</th>'+
    '<th class="num">Qty</th><th class="num">Revenue</th><th>Best day</th><th>Best service</th></tr></thead><tbody>'+
    list.map(function(p){
      return '<tr'+(p.is_quiet?' style="color:var(--muted)"':'')+'><td>'+esc(p.name)+
        (p.is_quiet?' <span class="pill-svc" style="color:var(--muted)">quiet</span>':'')+'</td>'+
        '<td class="num">'+p.qty+'</td><td class="num">'+money(p.revenue_cents)+'</td>'+
        '<td>'+esc(p.best_day)+'</td><td><span class="pill-svc '+esc(p.best_service)+'">'+esc(p.best_service)+'</span></td></tr>';
    }).join('')+'</tbody></table>';
}

function renderTrendsData(r){
  var days = r.by_day_service||[];
  var byDow = {};
  days.forEach(function(d){ (byDow[d.dow]=byDow[d.dow]||{}); byDow[d.dow][d.service]=d; byDow[d.dow].day_name=d.day_name; });

  var prev = r.previous || {};
  var h = '<div class="stat-grid">'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Revenue</span><div class="n">'+
      money(r.total_revenue_cents)+pctBadge(prev.revenue_change_pct)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Orders</span><div class="n">'+
      (r.total_orders||0)+pctBadge(prev.orders_change_pct)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Items sold</span><div class="n">'+(r.total_items||0)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Avg order</span><div class="n">'+money(r.avg_order_cents)+'</div></div>'+
  '</div>';

  if(prev.start){
    h += '<p class="hint" style="margin-bottom:14px">Compared with '+dayOf(prev.start)+' \u2013 '+dayOf(prev.end)+
      ' ('+money(prev.total_revenue_cents)+', '+(prev.total_orders||0)+' orders).</p>';
  }

  h += '<div class="stat-grid">'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Food revenue</span><div class="n">'+money(r.food_revenue_cents)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Beverage revenue</span><div class="n">'+money(r.beverage_revenue_cents)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Drinks per food order</span><div class="n">'+
      (r.drinks_per_food_order==null?'\u2014':r.drinks_per_food_order)+'</div></div>'+
  '</div>';

  var quiet = (r.food_products||[]).filter(function(p){return p.is_quiet;})
    .concat((r.beverage_products||[]).filter(function(p){return p.is_quiet;}));
  if(quiet.length){
    h += '<div class="sum-card" style="border-color:rgba(255,154,138,.3)">'+
      '<span class="mono" style="color:var(--muted)">Needs attention \u2014 quietest performers</span>'+
      '<p class="hint">'+quiet.map(function(p){return esc(p.name)+' ('+money(p.revenue_cents)+')';}).join(', ')+'</p>'+
    '</div>';
  }

  h += '<div class="sum-card"><span class="mono" style="color:var(--muted)">By day of the week</span>'+
    '<table class="dtable" style="margin-top:10px"><thead><tr><th>Day</th>'+
    '<th class="num">Lunch</th><th class="num">Dinner</th><th class="num">Total</th></tr></thead><tbody>';
  [1,2,3,4,5,6,7].forEach(function(dow){
    var row = byDow[dow] || {};
    var lunch = row.lunch || {revenue_cents:0}, dinner = row.dinner || {revenue_cents:0};
    var total = (lunch.revenue_cents||0) + (dinner.revenue_cents||0);
    h += '<tr><td>'+esc(row.day_name||'')+'</td>'+
      '<td class="num">'+money(lunch.revenue_cents)+'</td>'+
      '<td class="num">'+money(dinner.revenue_cents)+'</td>'+
      '<td class="num"><b>'+money(total)+'</b></td></tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="sum-card"><span class="mono" style="color:var(--muted)">Food</span>'+
    dishRowsHtml(r.food_products||[])+'</div>';
  h += '<div class="sum-card"><span class="mono" style="color:var(--muted)">Beverage</span>'+
    dishRowsHtml(r.beverage_products||[])+'</div>';

  $('trResults').innerHTML = h;
}

function trendsFilename(r){
  var slug=(r.venue||'restaurant').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return slug+'-sales-trends-'+r.start+'-to-'+r.end+'.xlsx';
}

function buildTrendsWorkbook(r){
  var prev = r.previous || {};
  var s1 = [
    [H('Sales trends'),''],
    ['Venue', r.venue], ['From', D(new Date(r.start))], ['To', D(new Date(r.end))],
    ['Lunch/dinner cutoff', r.lunch_dinner_cutoff], ['',''],
    [B('Total revenue'), MB(r.total_revenue_cents)],
    [B('Total orders'), N(r.total_orders)],
    [B('Total items sold'), N(r.total_items)],
    [B('Average order'), MB(r.avg_order_cents)],
    ['',''],
    [B('Food revenue'), MB(r.food_revenue_cents)],
    [B('Beverage revenue'), MB(r.beverage_revenue_cents)],
    [B('Drinks per food order'), r.drinks_per_food_order==null?'':r.drinks_per_food_order],
    ['','']
  ];
  if(prev.start){
    s1.push([B('Previous period'), dayOf(prev.start)+' to '+dayOf(prev.end)]);
    s1.push(['Previous revenue', MB(prev.total_revenue_cents)]);
    s1.push(['Previous orders', N(prev.total_orders)]);
    s1.push(['Revenue change', (prev.revenue_change_pct==null?'':prev.revenue_change_pct+'%')]);
    s1.push(['Orders change', (prev.orders_change_pct==null?'':prev.orders_change_pct+'%')]);
  }

  var s2 = [[H('Day'),H('Service'),H('Revenue'),H('Orders'),H('Items')]];
  (r.by_day_service||[]).forEach(function(d){
    s2.push([d.day_name, d.service, M(d.revenue_cents), N(d.orders), N(d.items)]);
  });

  var s3 = [[H('Kind'),H('Dish'),H('Total qty'),H('Total revenue'),H('Best day'),H('Best service'),H('Quiet?')]];
  (r.food_products||[]).forEach(function(p){
    s3.push(['Food', p.name, N(p.qty), M(p.revenue_cents), p.best_day, p.best_service, p.is_quiet?'Yes':'']);
  });
  (r.beverage_products||[]).forEach(function(p){
    s3.push(['Beverage', p.name, N(p.qty), M(p.revenue_cents), p.best_day, p.best_service, p.is_quiet?'Yes':'']);
  });

  // Flat detail - every dish x day x service, exactly the shape a
  // manager can drop straight into their own pivot table in Excel.
  var s4 = [[H('Kind'),H('Dish'),H('Day'),H('Service'),H('Qty'),H('Revenue')]];
  (r.food_products||[]).concat(r.beverage_products||[]).forEach(function(p){
    var kind = (r.food_products||[]).indexOf(p) >= 0 ? 'Food' : 'Beverage';
    (p.by_day_service||[]).forEach(function(x){
      s4.push([kind, p.name, x.day_name, x.service, N(x.qty), M(x.revenue_cents)]);
    });
  });

  return buildXlsx([
    {name:'Summary', rows:s1, widths:[22,18]},
    {name:'By day & service', rows:s2, widths:[12,10,13,10,9]},
    {name:'By dish', rows:s3, widths:[11,30,10,13,12,12,8]},
    {name:'Detail', rows:s4, widths:[11,30,12,10,8,13]}
  ]);
}

function exportTrends(btn){
  if(!TRENDS_DATA) return;
  var label=btn.textContent; btn.disabled=true; btn.textContent='Building\u2026';
  try{
    saveBytes(buildTrendsWorkbook(TRENDS_DATA), trendsFilename(TRENDS_DATA),
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  } finally { btn.disabled=false; btn.textContent=label; }
}

$('pTrends').addEventListener('click', function(e){
  var pr = e.target.closest('[data-preset]');
  if(pr){
    var range = trendsPreset(pr.dataset.preset);
    TRENDS_RANGE = range;
    $('trStart').value = range.start; $('trEnd').value = range.end;
    document.querySelectorAll('.presets button').forEach(function(b){ b.classList.toggle('on', b===pr); });
    loadTrends(range.start, range.end, $('trLoad'));
    return;
  }
  if(e.target.id==='trLoad'){
    var s=$('trStart').value, en=$('trEnd').value;
    if(!s||!en){ toast('Pick both dates'); return; }
    if(s>en){ toast('The start date is after the end date'); return; }
    loadTrends(s, en, e.target);
    return;
  }
  if(e.target.id==='trExport') return exportTrends(e.target);
  if(e.target.id==='trSaveCutoff'){
    var t=$('trCutoff').value;
    if(!t){ toast('Pick a time'); return; }
    var b=e.target; b.disabled=true;
    api('/rest/v1/rpc/rd_set_lunch_dinner_cutoff',{method:'POST',
      body:JSON.stringify({p_venue_id:VENUE.id, p_cutoff:t+':00'})})
      .then(function(){ toast('Saved'); if(TRENDS_RANGE) loadTrends(TRENDS_RANGE.start, TRENDS_RANGE.end); })
      .catch(function(er){ toast(apiErr(er)); })
      .then(function(){ b.disabled=false; });
  }
});

$('pTrends').addEventListener('change', function(e){
  var sel = e.target.closest('[data-station]'); if(!sel) return;
  var isBev = sel.value === 'beverage';
  sel.disabled = true;
  api('/rest/v1/rpc/rd_set_station_kind',{method:'POST',
    body:JSON.stringify({p_venue_id:VENUE.id, p_station_id:sel.dataset.station, p_is_beverage:isBev})})
    .then(function(){
      TRENDS_STATIONS = null;   // force a fresh read next time the card renders
      toast('Saved');
      if(TRENDS_RANGE) loadTrends(TRENDS_RANGE.start, TRENDS_RANGE.end);
    })
    .catch(function(er){ toast(apiErr(er)); })
    .then(function(){ sel.disabled = false; });
});

function paintHist(){
  $('pHist').innerHTML='<div class="empty">Loading\u2026</div>';
  api('/rest/v1/rpc/rd_reading_history',{method:'POST',
    body:JSON.stringify({p_venue_id:VENUE.id,p_limit:30})})
    .then(function(rows){
      if(!rows||!rows.length){
        $('pHist').innerHTML='<div class="empty"><h3>No readings yet</h3>'+
          '<p>Z readings appear here once you close off a shift.</p></div>';
        return;
      }
      $('pHist').innerHTML=rows.map(function(r){
        var t=r.totals||{};
        return '<div class="sum-card">'+
          '<div style="display:flex;align-items:baseline;gap:10px">'+
            '<h2 style="font-size:17px">Z #'+r.number+'</h2>'+
            '<span class="hint" style="margin:0">'+dayOf(r.period_end)+' '+timeOf(r.period_end)+'</span>'+
            '<span class="spacer"></span>'+
            '<b style="font-family:\'Unbounded\',sans-serif;font-size:19px">'+
              money(t.total_cents)+'</b>'+
          '</div>'+
          '<div style="margin-top:10px">'+
            '<div class="sum-row"><span>Card</span><b>'+money(t.card_cents)+'</b></div>'+
            '<div class="sum-row"><span>Cash</span><b>'+money(t.cash_cents)+'</b></div>'+
            (t.online_cents?'<div class="sum-row"><span>Phone</span><b>'+
               money(t.online_cents)+'</b></div>':'')+
            (t.tip_cents?'<div class="sum-row"><span>Tips</span><b>'+money(t.tip_cents)+'</b></div>':'')+
            (t.other_cents?'<div class="sum-row"><span>Other</span><b>'+money(t.other_cents)+'</b></div>':'')+
            '<div class="sum-row"><span>Tables</span><b>'+(t.tables_settled||0)+'</b></div>'+
          '</div>'+
          (r.tables_open_at_close?'<p class="hint" style="color:var(--warn);margin-top:8px">'+
            'Forced with '+r.tables_open_at_close+' table(s) open.</p>':'')+
          (r.note?'<p class="hint" style="margin-top:8px">'+esc(r.note)+'</p>':'')+
          '<div class="acts" style="margin-top:12px">'+
            '<button class="btn quiet sm" data-expx="'+r.id+'">Excel</button>'+
            '<button class="btn quiet sm" data-exp="'+r.id+'">CSV</button>'+
          '</div>'+
          '</div>';
      }).join('');
    })
    .catch(function(e){
      $('pHist').innerHTML='<div class="empty"><p>'+esc(apiErr(e))+'</p></div>';
    });
}

document.querySelector('.tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-p]');if(!b)return;
  PANE=b.dataset.p;
  Array.prototype.forEach.call(b.parentNode.children,function(c){
    c.classList.toggle('on',c===b);});
  $('pOpen').classList.toggle('on',PANE==='open');
  $('pToday').classList.toggle('on',PANE==='today');
  $('pOrders').classList.toggle('on',PANE==='orders');
  if(PANE==='orders') poPaint();
  $('pHist').classList.toggle('on',PANE==='hist');
  $('pTrends').classList.toggle('on',PANE==='trends');
  if(PANE==='today') paintToday();
  else if(PANE==='hist') paintHist();
  else if(PANE==='trends') paintTrends();
  else paintOpen();
});

window.addEventListener('online',function(){refresh();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});

$('pHist').addEventListener('click',function(e){
  var x=e.target.closest('[data-expx]');
  if(x) return exportWorkbook(x.dataset.expx, x);
  var b=e.target.closest('[data-exp]'); if(!b) return;
  exportReport(b.dataset.exp, b);
});
