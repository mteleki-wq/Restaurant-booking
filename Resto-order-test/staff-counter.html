function pctBadge(pct){
  if(pct===null||pct===undefined) return '';
  var up = pct >= 0;
  return '<span style="font-size:12px;font-family:\'Space Mono\',monospace;margin-left:6px;'+
    'color:'+(up?'#8fd6a8':'#ff9a8a')+'">'+(up?'\u2191':'\u2193')+Math.abs(pct)+'%</span>';
}

function dishRowsHtml(list){
  if(!list.length) return '<p class="hint" style="margin-top:8px">Nothing sold in this range.</p>';
  return '<table class="dtable" style="margin-top:10px"><thead><tr><th>Dish</th>'+
    '<th class="num">Qty</th><th class="num">Revenue</th><th>Best day</th><th>Best service</th></tr></thead><tbody>'+
    list.map(function(p){
      return '<tr'+(p.is_quiet?' style="color:var(--muted)"':'')+'><td>'+esc(p.name)+
        (p.is_quiet?' <span class="pill-svc" style="color:var(--muted)">quiet</span>':'')+'</td>'+
        '<td class="num">'+p.qty+'</td><td class="num">'+money(p.revenue_cents)+'</td>'+
        '<td>'+esc(p.best_day)+'</td><td><span class="pill-svc '+esc(p.best_service)+'">'+esc(p.best_service)+'</span></td></tr>';
    }).join('')+'</tbody></table>';
}

function renderTrendsData(r){
  var days = r.by_day_service||[];
  var byDow = {};
  days.forEach(function(d){ (byDow[d.dow]=byDow[d.dow]||{}); byDow[d.dow][d.service]=d; byDow[d.dow].day_name=d.day_name; });

  var prev = r.previous || {};
  var h = '<div class="stat-grid">'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Revenue</span><div class="n">'+
      money(r.total_revenue_cents)+pctBadge(prev.revenue_change_pct)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Orders</span><div class="n">'+
      (r.total_orders||0)+pctBadge(prev.orders_change_pct)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Items sold</span><div class="n">'+(r.total_items||0)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Avg order</span><div class="n">'+money(r.avg_order_cents)+'</div></div>'+
  '</div>';

  if(prev.start){
    h += '<p class="hint" style="margin-bottom:14px">Compared with '+dayOf(prev.start)+' \u2013 '+dayOf(prev.end)+
      ' ('+money(prev.total_revenue_cents)+', '+(prev.total_orders||0)+' orders).</p>';
  }

  h += '<div class="stat-grid">'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Food revenue</span><div class="n">'+money(r.food_revenue_cents)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Beverage revenue</span><div class="n">'+money(r.beverage_revenue_cents)+'</div></div>'+
    '<div class="stat-box"><span class="mono" style="color:var(--muted)">Drinks per food order</span><div class="n">'+
      (r.drinks_per_food_order==null?'\u2014':r.drinks_per_food_order)+'</div></div>'+
  '</div>';

  var quiet = (r.food_products||[]).filter(function(p){return p.is_quiet;})
    .concat((r.beverage_products||[]).filter(function(p){return p.is_quiet;}));
  if(quiet.length){
    h += '<div class="sum-card" style="border-color:rgba(255,154,138,.3)">'+
      '<span class="mono" style="color:var(--muted)">Needs attention \u2014 quietest performers</span>'+
      '<p class="hint">'+quiet.map(function(p){return esc(p.name)+' ('+money(p.revenue_cents)+')';}).join(', ')+'</p>'+
    '</div>';
  }

  h += '<div class="sum-card"><span class="mono" style="color:var(--muted)">By day of the week</span>'+
    '<table class="dtable" style="margin-top:10px"><thead><tr><th>Day</th>'+
    '<th class="num">Lunch</th><th class="num">Dinner</th><th class="num">Total</th></tr></thead><tbody>';
  [1,2,3,4,5,6,7].forEach(function(dow){
    var row = byDow[dow] || {};
    var lunch = row.lunch || {revenue_cents:0}, dinner = row.dinner || {revenue_cents:0};
    var total = (lunch.revenue_cents||0) + (dinner.revenue_cents||0);
    h += '<tr><td>'+esc(row.day_name||'')+'</td>'+
      '<td class="num">'+money(lunch.revenue_cents)+'</td>'+
      '<td class="num">'+money(dinner.revenue_cents)+'</td>'+
      '<td class="num"><b>'+money(total)+'</b></td></tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="sum-card"><span class="mono" style="color:var(--muted)">Food</span>'+
    dishRowsHtml(r.food_products||[])+'</div>';
  h += '<div class="sum-card"><span class="mono" style="color:var(--muted)">Beverage</span>'+
    dishRowsHtml(r.beverage_products||[])+'</div>';

  $('trResults').innerHTML = h;
}

function trendsFilename(r){
  var slug=(r.venue||'restaurant').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return slug+'-sales-trends-'+r.start+'-to-'+r.end+'.xlsx';
}

function buildTrendsWorkbook(r){
  var prev = r.previous || {};
  var s1 = [
    [H('Sales trends'),''],
    ['Venue', r.venue], ['From', D(new Date(r.start))], ['To', D(new Date(r.end))],
    ['Lunch/dinner cutoff', r.lunch_dinner_cutoff], ['',''],
    [B('Total revenue'), MB(r.total_revenue_cents)],
    [B('Total orders'), N(r.total_orders)],
    [B('Total items sold'), N(r.total_items)],
    [B('Average order'), MB(r.avg_order_cents)],
    ['',''],
    [B('Food revenue'), MB(r.food_revenue_cents)],
    [B('Beverage revenue'), MB(r.beverage_revenue_cents)],
    [B('Drinks per food order'), r.drinks_per_food_order==null?'':r.drinks_per_food_order],
    ['','']
  ];
  if(prev.start){
    s1.push([B('Previous period'), dayOf(prev.start)+' to '+dayOf(prev.end)]);
    s1.push(['Previous revenue', MB(prev.total_revenue_cents)]);
    s1.push(['Previous orders', N(prev.total_orders)]);
    s1.push(['Revenue change', (prev.revenue_change_pct==null?'':prev.revenue_change_pct+'%')]);
    s1.push(['Orders change', (prev.orders_change_pct==null?'':prev.orders_change_pct+'%')]);
  }

  var s2 = [[H('Day'),H('Service'),H('Revenue'),H('Orders'),H('Items')]];
  (r.by_day_service||[]).forEach(function(d){
    s2.push([d.day_name, d.service, M(d.revenue_cents), N(d.orders), N(d.items)]);
  });

  var s3 = [[H('Kind'),H('Dish'),H('Total qty'),H('Total revenue'),H('Best day'),H('Best service'),H('Quiet?')]];
  (r.food_products||[]).forEach(function(p){
    s3.push(['Food', p.name, N(p.qty), M(p.revenue_cents), p.best_day, p.best_service, p.is_quiet?'Yes':'']);
  });
  (r.beverage_products||[]).forEach(function(p){
    s3.push(['Beverage', p.name, N(p.qty), M(p.revenue_cents), p.best_day, p.best_service, p.is_quiet?'Yes':'']);
  });

  // Flat detail - every dish x day x service, exactly the shape a
  // manager can drop straight into their own pivot table in Excel.
  var s4 = [[H('Kind'),H('Dish'),H('Day'),H('Service'),H('Qty'),H('Revenue')]];
  (r.food_products||[]).concat(r.beverage_products||[]).forEach(function(p){
    var kind = (r.food_products||[]).indexOf(p) >= 0 ? 'Food' : 'Beverage';
    (p.by_day_service||[]).forEach(function(x){
      s4.push([kind, p.name, x.day_name, x.service, N(x.qty), M(x.revenue_cents)]);
    });
  });

  return buildXlsx([
    {name:'Summary', rows:s1, widths:[22,18]},
    {name:'By day & service', rows:s2, widths:[12,10,13,10,9]},
    {name:'By dish', rows:s3, widths:[11,30,10,13,12,12,8]},
    {name:'Detail', rows:s4, widths:[11,30,12,10,8,13]}
  ]);
}

function exportTrends(btn){
  if(!TRENDS_DATA) return;
  var label=btn.textContent; btn.disabled=true; btn.textContent='Building\u2026';
  try{
    saveBytes(buildTrendsWorkbook(TRENDS_DATA), trendsFilename(TRENDS_DATA),
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  } finally { btn.disabled=false; btn.textContent=label; }
}

$('pTrends').addEventListener('click', function(e){
  var pr = e.target.closest('[data-preset]');
  if(pr){
    var range = trendsPreset(pr.dataset.preset);
    TRENDS_RANGE = range;
    $('trStart').value = range.start; $('trEnd').value = range.end;
    document.querySelectorAll('.presets button').forEach(function(b){ b.classList.toggle('on', b===pr); });
    loadTrends(range.start, range.end, $('trLoad'));
    return;
  }
  if(e.target.id==='trLoad'){
    var s=$('trStart').value, en=$('trEnd').value;
    if(!s||!en){ toast('Pick both dates'); return; }
    if(s>en){ toast('The start date is after the end date'); return; }
    loadTrends(s, en, e.target);
    return;
  }
  if(e.target.id==='trExport') return exportTrends(e.target);
  if(e.target.id==='trSaveCutoff'){
    var t=$('trCutoff').value;
    if(!t){ toast('Pick a time'); return; }
    var b=e.target; b.disabled=true;

      body:JSON.stringify({p_venue_id:VENUE.id, p_cutoff:t+':00'})})
      .then(function(){ toast('Saved'); if(TRENDS_RANGE) loadTrends(TRENDS_RANGE.start, TRENDS_RANGE.end); })
      .catch(function(er){ toast(apiErr(er)); })
      .then(function(){ b.disabled=false; });

});

  var isBev = sel.value === 'beverage';
  sel.disabled = true;
  api('/rest/v1/rpc/rd_set_station_kind',{method:'POST',
    body:JSON.stringify({p_venue_id:VENUE.id, p_station_id:sel.dataset.station, p_is_beverage:isBev})})
    .then(function(){
      TRENDS_STATIONS = null;   // force a fresh read next time the card renders
      toast('Saved');
      if(TRENDS_RANGE) loadTrends(TRENDS_RANGE.start, TRENDS_RANGE.end);
    })
    .catch(function(er){ toast(apiErr(er)); })
    .then(function(){ sel.disabled = false; });
});

function paintHist(){
  $('pHist').innerHTML='<div class="empty">Loading\u2026</div>';
  api('/rest/v1/rpc/rd_reading_history',{method:'POST',
    body:JSON.stringify({p_venue_id:VENUE.id,p_limit:30})})
    .then(function(rows){
      if(!rows||!rows.length){
        $('pHist').innerHTML='<div class="empty"><h3>No readings yet</h3>'+
          '<p>Z readings appear here once you close off a shift.</p></div>';
        return;
      }
      $('pHist').innerHTML=rows.map(function(r){
        var t=r.totals||{};
        return '<div class="sum-card">'+
          '<div style="display:flex;align-items:baseline;gap:10px">'+
            '<h2 style="font-size:17px">Z #'+r.number+'</h2>'+
            '<span class="hint" style="margin:0">'+dayOf(r.period_end)+' '+timeOf(r.period_end)+'</span>'+
            '<span class="spacer"></span>'+
            '<b style="font-family:\'Unbounded\',sans-serif;font-size:19px">'+
              money(t.total_cents)+'</b>'+
          '</div>'+
          '<div style="margin-top:10px">'+
            '<div class="sum-row"><span>Card</span><b>'+money(t.card_cents)+'</b></div>'+
            '<div class="sum-row"><span>Cash</span><b>'+money(t.cash_cents)+'</b></div>'+
            (t.online_cents?'<div class="sum-row"><span>Phone</span><b>'+
               money(t.online_cents)+'</b></div>':'')+
            (t.tip_cents?'<div class="sum-row"><span>Tips</span><b>'+money(t.tip_cents)+'</b></div>':'')+
            (t.other_cents?'<div class="sum-row"><span>Other</span><b>'+money(t.other_cents)+'</b></div>':'')+
            '<div class="sum-row"><span>Tables</span><b>'+(t.tables_settled||0)+'</b></div>'+
          '</div>'+
          (r.tables_open_at_close?'<p class="hint" style="color:var(--warn);margin-top:8px">'+
            'Forced with '+r.tables_open_at_close+' table(s) open.</p>':'')+
          (r.note?'<p class="hint" style="margin-top:8px">'+esc(r.note)+'</p>':'')+
          '<div class="acts" style="margin-top:12px">'+
            '<button class="btn quiet sm" data-expx="'+r.id+'">Excel</button>'+
            '<button class="btn quiet sm" data-exp="'+r.id+'">CSV</button>'+
          '</div>'+
          '</div>';
      }).join('');
    })
    .catch(function(e){
      $('pHist').innerHTML='<div class="empty"><p>'+esc(apiErr(e))+'</p></div>';
    });
}

document.querySelector('.tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-p]');if(!b)return;
  PANE=b.dataset.p;
  Array.prototype.forEach.call(b.parentNode.children,function(c){
    c.classList.toggle('on',c===b);});
  $('pOpen').classList.toggle('on',PANE==='open');
  $('pToday').classList.toggle('on',PANE==='today');
  $('pHist').classList.toggle('on',PANE==='hist');
  $('pTrends').classList.toggle('on',PANE==='trends');
  if(PANE==='today') paintToday();
  else if(PANE==='hist') paintHist();
  else if(PANE==='trends') paintTrends();
  else paintOpen();
});

window.addEventListener('online',function(){refresh();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});

$('pHist').addEventListener('click',function(e){
  var x=e.target.closest('[data-expx]');
  if(x) return exportWorkbook(x.dataset.expx, x);
  var b=e.target.closest('[data-exp]'); if(!b) return;
  exportReport(b.dataset.exp, b);
});

/* ---------- boot ---------- */
(function(){
  if(!SUPABASE_URL||!SUPABASE_KEY){
    var c=readCfg();
    if(c&&c.url&&c.key){SUPABASE_URL=c.url;SUPABASE_KEY=c.key;}
  }
  if(!SUPABASE_URL||!SUPABASE_KEY) return showConn('');
  showLogin('');
  var s=readSess();
  if(s&&s.access_token){SESSION=s;start().catch(function(){});}
})();
})();
</script>
