<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe — Webescapade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06060f;--panel:#0d0f22;--ink:#eef0ff;--muted:#9aa3c7;--faint:#6a7299;--line:rgba(255,255,255,.12);
    --cyan:#22d3ee;--teal:#2dd4bf;--red:#ff8f8f;--grad:linear-gradient(120deg,#8b5cf6,#4f7cff 55%,#22d3ee)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:'Sora',system-ui,-apple-system,Segoe UI,sans-serif;padding:24px 16px;line-height:1.55}
  .card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
  .mark{width:44px;height:44px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:14px;margin-bottom:18px}
  h1{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
  p{margin:0 0 16px;color:var(--muted);font-size:14.5px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0a0b1a;color:var(--ink);font:inherit;font-size:16px}
  input:focus{outline:none;border-color:var(--cyan)}
  button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:999px;background:var(--grad);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  button[disabled]{opacity:.5;cursor:wait}
  .msg{margin-top:14px;font-size:14px}
  .ok{color:var(--teal)} .bad{color:var(--red)}
  .foot{margin-top:20px;font-size:12px;color:var(--faint)}
  .foot a{color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="mark">WE</div>
  <div id="form">
    <h1>Unsubscribe</h1>
    <p>Stop receiving Restaurant Deluxe emails from Webescapade. It takes effect straight away.</p>
    <label for="email">Your email address</label>
    <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="you@restaurant.com">
    <button type="button" id="go">Unsubscribe me</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>
  <div id="done" hidden>
    <h1>You're unsubscribed</h1>
    <p>You won't receive any more Restaurant Deluxe marketing emails from us. Sorry to see you go, and thanks for reading.</p>
  </div>
  <p class="foot">Webescapade · Sydney, Australia · <a href="mailto:marc@webescapade.com">marc@webescapade.com</a></p>
</main>
<script>
(function(){
  var URL_ = "https://tehxobdokbvqtwtgqzrh.supabase.co/rest/v1/rpc/prospect_unsubscribe";
  var KEY  = "sb_publishable_CrlY9xXYdhI7qCQwuMnDWg_hFQ3mXCJ";
  var q = new URLSearchParams(location.search), pre = q.get("email") || "";
  if(!pre && q.get("e")){
    try{ var b=q.get("e").replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="="; pre=decodeURIComponent(escape(atob(b))); }catch(e){}
  }
  var input=document.getElementById("email"), btn=document.getElementById("go"), msg=document.getElementById("msg");
  input.value=pre;
  function say(t,c){ msg.textContent=t; msg.className="msg "+(c||""); }
  btn.addEventListener("click",function(){
    var e=input.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){ say("Please enter the email address the message was sent to.","bad"); input.focus(); return; }
    btn.disabled=true; say("Unsubscribing…");
    fetch(URL_,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY},body:JSON.stringify({p_email:e})})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); document.getElementById("form").hidden=true; document.getElementById("done").hidden=false; })
      .catch(function(){ btn.disabled=false; say("That didn't go through. Please try again, or email marc@webescapade.com and we'll remove you by hand.","bad"); });
  });
  input.addEventListener("keydown",function(e){ if(e.key==="Enter") btn.click(); });
})();
</script>
</body>
</html>
