<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book an appointment</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Service Deluxe — client booking page. One deployed copy serves every venue: ?venue=<slug> */
:root{
  --bg:#F5F2EC; --card:#FFFFFF; --ink:#1E2622; --muted:#6B746F; --line:#E4DED4;
  --accent:#4F6B5C; --accent-ink:#FFFFFF; --soft:#E9EFEA; --warn:#9A3B2E; --ok:#2F6B47;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.mark{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:400 22px "Instrument Serif",serif}
.brand b{font:400 24px/1.1 "Instrument Serif",serif;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--muted)}
.back[hidden]{display:none}
h1{font:400 clamp(34px,5vw,50px)/1.05 "Instrument Serif",serif;margin:8px 0 6px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--accent)}
.lead{color:var(--muted);margin:0 0 22px;max-width:56ch}
.steps{display:flex;gap:6px;margin:0 0 22px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.steps::-webkit-scrollbar{height:0}
.steps span{white-space:nowrap;flex:none;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--ink);border-color:var(--ink);color:#fff}
.steps span.done{background:var(--soft);border-color:var(--soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:900px){.grid{grid-template-columns:1fr 320px}}
.panel{min-width:0}
.cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.cat:first-child{margin-top:0}
.list{display:grid;gap:10px}
@media(min-width:620px){.list.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1.5px solid transparent;border-radius:var(--radius);padding:16px 18px;cursor:pointer;box-shadow:0 1px 2px rgba(30,38,34,.05);transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--line)}
.opt:active{transform:scale(.995)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.opt .t{font-weight:600;font-size:16px}
.opt .d{color:var(--muted);font-size:14px;margin-top:2px}
.opt .meta{margin-left:auto;text-align:right;white-space:nowrap;font-size:14px}
.opt .meta b{display:block;font-weight:600}
.opt .meta span{color:var(--muted)}
.ava{flex:none;width:48px;height:48px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font:400 22px "Instrument Serif",serif;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.dates::-webkit-scrollbar{height:0}
.day{flex:none;scroll-snap-align:start;width:64px;padding:10px 0;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:center;cursor:pointer}
.day small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day b{display:block;font:400 26px/1.1 "Instrument Serif",serif}
.day.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.day.sel small{color:#cfd5d1}
.day.closed{opacity:.35;cursor:default}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.monthbar b{font-weight:600}
.arrows button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
.slotgroup{margin-top:16px}
.slotgroup h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{padding:11px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--accent)}
.slot.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{background:var(--card);border-radius:var(--radius);padding:24px;color:var(--muted);text-align:center}
.form{background:var(--card);border-radius:var(--radius);padding:20px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
label span.opt-l{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:16px;font-weight:400}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;gap:14px}
@media(min-width:620px){.row2{grid-template-columns:1fr 1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--muted);font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.note{background:var(--soft);color:var(--accent);border-radius:12px;padding:12px 14px;font-size:14px}
.err{color:var(--warn);font-size:14px;min-height:1px}
.summary{background:var(--card);border-radius:var(--radius);padding:20px;position:sticky;top:16px;height:max-content}
.summary h3{margin:0 0 12px;font:400 24px "Instrument Serif",serif}
.summary dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.summary dt{color:var(--muted)}
.summary dd{margin:0;text-align:right;font-weight:600}
.summary .total{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;font-weight:700}
@media(max-width:899px){.summary{display:none}}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(245,242,236,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .sum{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sum b{color:var(--ink)}
.cta{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:14px 26px;font-weight:600;cursor:pointer;white-space:nowrap}
.cta:disabled{opacity:.35;cursor:default}
.cta.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.done{background:var(--card);border-radius:24px;padding:34px 24px;text-align:center;max-width:560px;margin:10px auto}
.tick{width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;font-size:30px}
.done h2{font:400 36px/1.1 "Instrument Serif",serif;margin:0 0 6px}
.done .ref{display:inline-block;margin:8px 0 18px;padding:6px 14px;border-radius:999px;background:var(--bg);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.done dl{text-align:left;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 auto 22px;max-width:380px;font-size:15px}
.done dt{color:var(--muted)} .done dd{margin:0;font-weight:600}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" id="brand" href="#"><span class="mark" id="mark">·</span><span><small>Online booking</small><b id="vname">Loading…</b></span></a>
    <button class="back" id="back" hidden>← Back</button>
  </header>
  <main id="app"><div class="spin"></div></main>
  <footer id="foot"></footer>
</div>
<div class="bar" id="bar" hidden><div class="in"><div class="sum" id="barsum"></div><button class="cta" id="next" disabled>Continue</button></div></div>

<script>
/* ======================= CONFIG ======================= */
var CONFIG = {
  supabaseUrl: "https://tehxobdokbvqtwtgqzrh.supabase.co",
  supabaseKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlaHhvYmRva2J2cXR3dGdxenJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwOTA0MzEsImV4cCI6MjA5NzY2NjQzMX0.ofwrtvy7T4_uDP4hcWdO9roO2viWEmrplp8CCpFNupE",
  venue: "serenity-spa",          // used only when the link has no ?venue=
  practitionerWord: "therapist"   // ?word=doctor / dentist / stylist …
};
/* ====================================================== */

var q = new URLSearchParams(location.search);
var VENUE = (q.get("venue") || CONFIG.venue || "").trim().toLowerCase();
var WORD = q.get("word") || CONFIG.practitionerWord;
if (q.get("accent") && /^#?[0-9a-f]{6}$/i.test(q.get("accent"))) {
  var acc = q.get("accent").replace(/^#?/, "#");
  document.documentElement.style.setProperty("--accent", acc);
}
var BACK = q.get("back") || document.referrer || "";

var CAT = null, TZ = "Australia/Sydney";
var S = { step: 0, service: null, provider: null, date: null, slot: null, slotsCache: {} };
var STEPS = ["Treatment", cap(WORD), "Time", "Details"];
var $ = function (id) { return document.getElementById(id); };
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function money(c){ if (c == null) return ""; if (c === 0) return "Free"; return "$" + (c/100).toFixed(c % 100 ? 2 : 0); }
function mins(m){ return m >= 60 ? (Math.floor(m/60) + " h" + (m % 60 ? " " + (m % 60) + " min" : "")) : m + " min"; }

function rpc(fn, args){
  return fetch(CONFIG.supabaseUrl.replace(/\/+$/, "").replace(/\/rest(\/v1)?$/, "") + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { apikey: CONFIG.supabaseKey, Authorization: "Bearer " + CONFIG.supabaseKey, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  }).then(function (r) {
    return r.text().then(function (t) {
      var j = null; try { j = JSON.parse(t); } catch (e) {}
      if (!r.ok) throw new Error((j && (j.message || j.hint)) || ("Request failed (" + r.status + ")"));
      return j;
    });
  });
}
function notify(){ /* emails are sent by the database itself (Supabase function svc-booking-email) */ }

/* ---------- dates in the venue's own time zone ---------- */
function todayStr(){
  return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}
function addDays(ds, n){ var d = new Date(ds + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dow(ds){ return new Date(ds + "T12:00:00Z").getUTCDay(); }
function fmtDay(ds, opts){ return new Date(ds + "T12:00:00Z").toLocaleDateString("en-AU", Object.assign({ timeZone: "UTC" }, opts)); }
function openWeekdays(){ var o = {}; (CAT.hours || []).forEach(function (h) { o[h.weekday] = true; }); return o; }

/* ---------- boot ---------- */
function boot(){
  if (!VENUE) return fatal("This booking link is missing the business name (?venue=…).");
  rpc("svc_get_catalog", { p_venue: VENUE }).then(function (c) {
    if (!c || !c.ok) return fatal("We couldn't find this business. Please check the link.");
    CAT = c; TZ = c.venue.timezone || TZ;
    document.title = "Book · " + c.venue.name;
    $("vname").textContent = c.venue.name;
    $("mark").textContent = (c.venue.name || "·").trim().charAt(0).toUpperCase();
    if (BACK && /^https?:/i.test(BACK) && BACK.indexOf(location.host + location.pathname) < 0) $("brand").href = BACK;
    $("foot").innerHTML = [c.venue.phone ? "Call " + esc(c.venue.phone) : "", c.venue.email ? '<a href="mailto:' + esc(c.venue.email) + '">' + esc(c.venue.email) + "</a>" : ""].filter(Boolean).join(" · ");
    if (q.get("ref") && q.get("t")) return manage(q.get("ref"), q.get("t"));
    var pre = q.get("service");
    if (pre) { var s = CAT.services.filter(function (x) { return x.id === pre; })[0]; if (s) { S.service = s; S.step = s.needs_provider ? 1 : 2; } }
    var pp = q.get("provider");
    if (pp) {
      var p = CAT.providers.filter(function (x) { return x.id === pp; })[0];
      if (p) { S.pref = p; if (S.service && p.service_ids.indexOf(S.service.id) >= 0) { S.provider = p; S.step = 2; } }
    }
    render();
  }).catch(function (e) { fatal("We couldn't load the booking system. " + e.message); });
}
function fatal(msg){
  $("vname").textContent = "Online booking";
  $("app").innerHTML = '<div class="empty">' + esc(msg) + "</div>";
  $("bar").hidden = true;
}

/* ---------- step rendering ---------- */
function stepsHtml(){
  var list = STEPS.filter(function (_, i) { return !(i === 1 && S.service && !S.service.needs_provider); });
  var idx = S.step - ((S.service && !S.service.needs_provider && S.step > 1) ? 1 : 0);
  return '<div class="steps">' + list.map(function (n, i) { return '<span class="' + (i < idx ? "done" : i === idx ? "on" : "") + '">' + (i + 1) + " · " + esc(n) + "</span>"; }).join("") + "</div>";
}
function render(){
  $("back").hidden = S.step === 0;
  $("bar").hidden = false;
  var h = "";
  if (S.step === 0) h = viewServices();
  if (S.step === 1) h = viewProviders();
  if (S.step === 2) h = viewTime();
  if (S.step === 3) h = viewDetails();
  $("app").innerHTML = h;
  bind();
  updateBar();
  if (S.step === 2) loadSlots();
  window.scrollTo(0, 0);
}
function shell(title, lead, body){
  return stepsHtml() + '<div class="grid"><section class="panel"><h1>' + title + "</h1>" + (lead ? '<p class="lead">' + lead + "</p>" : "") + body + '</section><aside class="summary" id="side">' + sideHtml() + "</aside></div>";
}
function sideHtml(){
  var s = S.service;
  if (!s) return '<h3>Your booking</h3><p class="muted" style="margin:0">Choose a treatment to begin.</p>';
  var rows = [["Treatment", esc(s.name)], ["Length", mins(s.duration_min)]];
  if (s.needs_provider) rows.push([cap(WORD), S.provider ? esc(S.provider.name) : "Anyone available"]);
  if (S.date) rows.push(["Date", fmtDay(S.date, { weekday: "short", day: "numeric", month: "short" })]);
  if (S.slot) rows.push(["Time", S.slot.time]);
  return "<h3>Your booking</h3><dl>" + rows.map(function (r) { return "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>"; }).join("") + "</dl>" +
    (s.price_cents != null ? '<div class="total"><span>Total</span><span>' + money(s.price_cents) + "</span></div>" : "");
}
function viewServices(){
  var cats = {}, order = [];
  var pool = S.pref ? CAT.services.filter(function (s) { return !s.needs_provider || S.pref.service_ids.indexOf(s.id) >= 0; }) : CAT.services;
  pool.forEach(function (s) { var c = s.category || "Treatments"; if (!cats[c]) { cats[c] = []; order.push(c); } cats[c].push(s); });
  if (!CAT.services.length) return shell("Nothing to book <em>yet</em>", "", '<div class="empty">No treatments are open for online booking right now. Please call us.</div>');
  var body = order.map(function (c) {
    return '<div class="cat">' + esc(c) + '</div><div class="list">' + cats[c].map(function (s) {
      return '<button class="opt' + (S.service && S.service.id === s.id ? " sel" : "") + '" data-svc="' + s.id + '"><div><div class="t">' + esc(s.name) + "</div>" +
        (s.description ? '<div class="d">' + esc(s.description) + "</div>" : "") + '</div><div class="meta"><b>' + money(s.price_cents) + "</b><span>" + mins(s.duration_min) + "</span></div></button>";
    }).join("") + "</div>";
  }).join("");
  if (S.pref) body = '<div class="note" style="margin-bottom:14px">Showing treatments with ' + esc(S.pref.name) + '. <a href="#" id="clrpref" style="color:inherit">Show everything</a></div>' + body;
  return shell("Book your <em>time</em>", "Choose a treatment, then the " + esc(WORD) + " and time that suit you. You'll get a confirmation straight away.", body);
}
function viewProviders(){
  var s = S.service;
  var pros = CAT.providers.filter(function (p) { return p.service_ids.indexOf(s.id) >= 0; });
  var any = '<button class="opt' + (!S.provider ? " sel" : "") + '" data-pro=""><span class="ava">✦</span><div><div class="t">Anyone available</div><div class="d">Most times to choose from</div></div></button>';
  var body = '<div class="list two">' + any + pros.map(function (p) {
    var a = p.photo_url ? '<img src="' + esc(p.photo_url) + '" alt="">' : esc(p.name.charAt(0));
    return '<button class="opt' + (S.provider && S.provider.id === p.id ? " sel" : "") + '" data-pro="' + p.id + '"><span class="ava">' + a + '</span><div><div class="t">' + esc(p.name) + "</div>" +
      (p.title ? '<div class="d">' + esc(p.title) + "</div>" : "") + (p.bio ? '<div class="d" style="margin-top:6px">' + esc(p.bio) + "</div>" : "") + "</div></button>";
  }).join("") + "</div>";
  return shell("Who would you <em>like</em>?", esc(s.name) + " · " + mins(s.duration_min), body);
}
function viewTime(){
  var max = Math.min(CAT.settings.max_days_ahead || 60, 120), t0 = todayStr(), ow = openWeekdays();
  if (!S.date) { for (var i = 0; i <= max; i++) { var d0 = addDays(t0, i); if (ow[dow(d0)]) { S.date = d0; break; } } }
  var days = "";
  for (var k = 0; k <= max; k++) {
    var ds = addDays(t0, k), closed = !ow[dow(ds)];
    days += '<button class="day' + (ds === S.date ? " sel" : "") + (closed ? " closed" : "") + '" data-day="' + ds + '"' + (closed ? " disabled" : "") + "><small>" +
      fmtDay(ds, { weekday: "short" }) + "</small><b>" + Number(ds.slice(8)) + "</b><small>" + fmtDay(ds, { month: "short" }) + "</small></button>";
  }
  var who = S.service.needs_provider ? (S.provider ? " with " + esc(S.provider.name) : " · any " + esc(WORD)) : "";
  return shell("Pick a <em>time</em>", esc(S.service.name) + who,
    '<div class="monthbar"><b id="mlabel">' + fmtDay(S.date || t0, { weekday: "long", day: "numeric", month: "long" }) + '</b><span class="arrows"><button id="pl" aria-label="Earlier">‹</button> <button id="pr" aria-label="Later">›</button></span></div>' +
    '<div class="dates" id="dates">' + days + '</div><div id="slots"><div class="spin"></div></div>');
}
function viewDetails(){
  var s = S.service, note = CAT.settings.booking_note;
  var saved = {}; try { saved = JSON.parse(localStorage.getItem("svc_client") || "{}"); } catch (e) {}
  var ch = CAT.settings.cancel_hours;
  var body = '<div class="form">' +
    (note ? '<div class="note">' + esc(note) + "</div>" : "") +
    '<label>Full name<input type="text" id="f_name" autocomplete="name" value="' + esc(saved.name || "") + '"></label>' +
    '<div class="row2"><label>Email<input type="email" id="f_email" autocomplete="email" inputmode="email" value="' + esc(saved.email || "") + '"></label>' +
    '<label>Mobile<input type="tel" id="f_phone" autocomplete="tel" inputmode="tel" value="' + esc(saved.phone || "") + '"></label></div>' +
    '<label>Anything we should know? <span class="opt-l">Optional — injuries, pressure preference, allergies</span><textarea id="f_notes"></textarea></label>' +
    '<label class="check"><input type="checkbox" id="f_ok"> <span>I understand bookings can be cancelled online up to ' + ch + " hours before. Later changes, please call" + (CAT.venue.phone ? " " + esc(CAT.venue.phone) : " us") + ".</span></label>" +
    '<div class="err" id="f_err"></div></div>';
  return shell("Your <em>details</em>", esc(s.name) + " · " + fmtDay(S.date, { weekday: "long", day: "numeric", month: "long" }) + " at " + S.slot.time, body);
}

/* ---------- slots ---------- */
function loadSlots(){
  var key = S.service.id + "|" + (S.provider ? S.provider.id : "") + "|" + S.date;
  var box = $("slots");
  if (!S.date) { box.innerHTML = '<div class="empty">No days are open for booking.</div>'; return; }
  var draw = function (list) {
    if (key !== S.service.id + "|" + (S.provider ? S.provider.id : "") + "|" + S.date) return;
    if (!list.length) {
      box.innerHTML = '<div class="empty">No times left on this day' + (S.provider ? " with " + esc(S.provider.name) + '. <br><button class="back" id="tryany" style="margin-top:12px">Try anyone available</button>' : ". Try another day.") + "</div>";
      var ta = $("tryany"); if (ta) ta.onclick = function () { S.provider = null; S.slot = null; render(); };
      return;
    }
    var groups = [["Morning", function (t) { return t < "12:00"; }], ["Afternoon", function (t) { return t >= "12:00" && t < "17:00"; }], ["Evening", function (t) { return t >= "17:00"; }]];
    box.innerHTML = groups.map(function (g) {
      var it = list.filter(function (s) { return g[1](s.time); });
      if (!it.length) return "";
      return '<div class="slotgroup"><h4>' + g[0] + '</h4><div class="slots">' + it.map(function (s) {
        return '<button class="slot' + (S.slot && S.slot.start === s.start ? " sel" : "") + '" data-slot="' + s.start + '">' + s.time + "</button>";
      }).join("") + "</div></div>";
    }).join("");
    box.querySelectorAll("[data-slot]").forEach(function (b) {
      b.onclick = function () {
        S.slot = list.filter(function (s) { return s.start === b.getAttribute("data-slot"); })[0];
        box.querySelectorAll(".slot").forEach(function (x) { x.classList.toggle("sel", x === b); });
        updateBar(); $("side").innerHTML = sideHtml();
      };
    });
  };
  if (S.slotsCache[key]) return draw(S.slotsCache[key]);
  box.innerHTML = '<div class="spin"></div>';
  rpc("svc_get_slots", { p_venue: VENUE, p_service: S.service.id, p_date: S.date, p_provider: S.provider ? S.provider.id : null })
    .then(function (r) { if (!r.ok) throw new Error(r.error); S.slotsCache[key] = r.slots || []; draw(S.slotsCache[key]); })
    .catch(function (e) { box.innerHTML = '<div class="empty">Couldn\'t load times. ' + esc(e.message) + "</div>"; });
}

/* ---------- events ---------- */
function bind(){
  var cp = $("clrpref"); if (cp) cp.onclick = function (e) { e.preventDefault(); S.pref = null; render(); };
  document.querySelectorAll("[data-svc]").forEach(function (b) {
    b.onclick = function () {
      var s = CAT.services.filter(function (x) { return x.id === b.getAttribute("data-svc"); })[0];
      if (!S.service || S.service.id !== s.id) { S.provider = null; S.slot = null; }
      S.service = s; S.step = s.needs_provider ? 1 : 2;
      if (S.pref && s.needs_provider && S.pref.service_ids.indexOf(s.id) >= 0) { S.provider = S.pref; S.step = 2; }
      render();
    };
  });
  document.querySelectorAll("[data-pro]").forEach(function (b) {
    b.onclick = function () {
      var id = b.getAttribute("data-pro");
      S.provider = id ? CAT.providers.filter(function (x) { return x.id === id; })[0] : null;
      S.slot = null; S.step = 2; render();
    };
  });
  document.querySelectorAll("[data-day]").forEach(function (b) {
    b.onclick = function () {
      if (b.disabled) return;
      S.date = b.getAttribute("data-day"); S.slot = null;
      document.querySelectorAll(".day").forEach(function (x) { x.classList.toggle("sel", x === b); });
      $("mlabel").textContent = fmtDay(S.date, { weekday: "long", day: "numeric", month: "long" });
      updateBar(); $("side").innerHTML = sideHtml(); loadSlots();
    };
  });
  var dl = $("dates");
  if (dl) {
    var sel = dl.querySelector(".sel"); if (sel) dl.scrollLeft = Math.max(0, sel.offsetLeft - dl.offsetLeft - 8);
    $("pl").onclick = function () { dl.scrollBy({ left: -dl.clientWidth * 0.8, behavior: "smooth" }); };
    $("pr").onclick = function () { dl.scrollBy({ left: dl.clientWidth * 0.8, behavior: "smooth" }); };
  }
  ["f_name", "f_email", "f_phone"].forEach(function (id) { var el = $(id); if (el) el.oninput = updateBar; });
  var ok = $("f_ok"); if (ok) ok.onchange = updateBar;
}
$("back").onclick = function () {
  if (S.step === 3) S.step = 2;
  else if (S.step === 2) S.step = S.service.needs_provider ? 1 : 0;
  else S.step = 0;
  render();
};
function detailsValid(){
  var n = ($("f_name") || {}).value || "", e = ($("f_email") || {}).value || "", p = ($("f_phone") || {}).value || "";
  return n.trim().length > 1 && (/^\S+@\S+\.\S+$/.test(e.trim()) || p.replace(/\D/g, "").length >= 8) && $("f_ok").checked;
}
function updateBar(){
  var nx = $("next"), s = S.service, txt = "";
  if (s) txt = "<b>" + esc(s.name) + "</b>" + (s.price_cents != null ? " · " + money(s.price_cents) : "") + (S.date && S.step >= 2 ? " · " + fmtDay(S.date, { day: "numeric", month: "short" }) : "") + (S.slot && S.step >= 2 ? " " + S.slot.time : "");
  $("barsum").innerHTML = txt || "Choose a treatment";
  if (S.step === 0) { nx.textContent = "Continue"; nx.disabled = !s; }
  if (S.step === 1) { nx.textContent = "Continue"; nx.disabled = false; }
  if (S.step === 2) { nx.textContent = "Continue"; nx.disabled = !S.slot; }
  if (S.step === 3) { nx.textContent = "Confirm booking"; nx.disabled = !detailsValid(); }
}
$("next").onclick = function () {
  if (S.step === 0 && S.service) { S.step = S.service.needs_provider ? 1 : 2; return render(); }
  if (S.step === 1) { S.step = 2; return render(); }
  if (S.step === 2 && S.slot) { S.step = 3; return render(); }
  if (S.step === 3) submit();
};

/* ---------- submit ---------- */
function submit(){
  if (!detailsValid()) return;
  var nx = $("next"); nx.disabled = true; nx.textContent = "Booking…";
  var d = { name: $("f_name").value.trim(), email: $("f_email").value.trim(), phone: $("f_phone").value.trim() };
  try { localStorage.setItem("svc_client", JSON.stringify(d)); } catch (e) {}
  rpc("svc_book", {
    p_venue: VENUE, p_service: S.service.id, p_start: S.slot.start, p_provider: S.provider ? S.provider.id : null,
    p_name: d.name, p_email: d.email, p_phone: d.phone, p_notes: $("f_notes").value.trim(), p_source: "online"
  }).then(function (r) {
    if (!r.ok) {
      $("f_err").textContent = r.error || "Something went wrong.";
      if (r.code === "taken") {
        S.slotsCache = {}; S.slot = null;
        $("f_err").innerHTML = esc(r.error) + ' <button class="back" id="pickagain" style="margin-left:6px">Choose another time</button>';
        $("pickagain").onclick = function () { S.step = 2; render(); };
      }
      nx.textContent = "Confirm booking"; updateBar(); return;
    }
    notify("confirmed", r.ref);
    success(r);
  }).catch(function (e) { $("f_err").textContent = "Couldn't complete the booking: " + e.message; nx.textContent = "Confirm booking"; updateBar(); });
}
function manageUrl(ref, tok){ var u = new URL(location.href); u.search = ""; u.searchParams.set("venue", VENUE); u.searchParams.set("ref", ref); u.searchParams.set("t", tok); return u.toString(); }
function success(r){
  $("bar").hidden = true; $("back").hidden = true;
  var link = manageUrl(r.ref, r.cancel_token);
  $("app").innerHTML = '<div class="done"><div class="tick">✓</div><h2>You\'re booked in</h2><p class="muted" style="margin:0">' +
    (S.service && $("f_email") ? "" : "") + "A confirmation is on its way" + (q.get("noemail") ? "" : " to your email") + '.</p><div class="ref">' + esc(r.ref) + "</div><dl>" +
    "<dt>Treatment</dt><dd>" + esc(r.service) + "</dd>" + (r.provider ? "<dt>" + cap(WORD) + "</dt><dd>" + esc(r.provider) + "</dd>" : "") +
    "<dt>When</dt><dd>" + esc(r.local_date) + " · " + esc(r.local_time) + "</dd><dt>Length</dt><dd>" + mins(r.duration_min) + "</dd>" +
    (r.price_cents != null ? "<dt>Price</dt><dd>" + money(r.price_cents) + "</dd>" : "") + "</dl>" +
    '<div class="actions"><button class="cta" id="ics">Add to calendar</button><button class="cta alt" id="cp">Copy manage link</button></div>' +
    '<p class="muted" style="font-size:13px;margin-top:18px">Keep the manage link to view or cancel this booking.</p></div>';
  $("ics").onclick = function () { downloadIcs(r); };
  $("cp").onclick = function () {
    var b = $("cp");
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { b.textContent = "Copied ✓"; }, function () { prompt("Your manage link:", link); });
  };
}
function icsDate(iso){ return new Date(iso).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
function downloadIcs(r){
  var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Service Deluxe//EN", "BEGIN:VEVENT", "UID:" + r.ref + "@servicedeluxe",
    "DTSTAMP:" + icsDate(new Date().toISOString()), "DTSTART:" + icsDate(r.starts_at), "DTEND:" + icsDate(r.ends_at),
    "SUMMARY:" + (r.service + " · " + r.venue).replace(/[,;]/g, " "),
    "DESCRIPTION:Booking " + r.ref + (r.provider ? " with " + r.provider : "") + (r.venue_phone ? ". Phone " + r.venue_phone : ""),
    "END:VEVENT", "END:VCALENDAR"];
  var blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = r.ref + ".ics";
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- manage / cancel ---------- */
function manage(ref, tok){
  $("bar").hidden = true;
  rpc("svc_lookup", { p_ref: ref, p_token: tok }).then(function (b) {
    if (!b.ok) return fatal(b.error || "Booking not found.");
    var state = b.status === "cancelled" ? "This booking has been cancelled." : b.status === "confirmed" ? "" : "This booking is " + b.status.replace("_", " ") + ".";
    $("app").innerHTML = '<div class="done"><h2>Your booking</h2><div class="ref">' + esc(b.ref) + "</div><dl>" +
      "<dt>Name</dt><dd>" + esc(b.client_name) + "</dd><dt>Treatment</dt><dd>" + esc(b.service) + "</dd>" +
      (b.provider ? "<dt>" + cap(WORD) + "</dt><dd>" + esc(b.provider) + "</dd>" : "") +
      "<dt>When</dt><dd>" + esc(b.local_date) + " · " + esc(b.local_time) + "</dd></dl>" +
      (state ? '<p class="note">' + esc(state) + "</p>" :
        b.can_cancel ? '<div class="actions"><button class="cta" id="cx">Cancel booking</button><a class="cta alt" href="?venue=' + encodeURIComponent(VENUE) + '" style="text-decoration:none">Make a new booking</a></div><div class="err" id="cxerr" style="margin-top:12px"></div>'
        : '<p class="note">Online cancellation closes ' + b.cancel_hours + " hours before your appointment. Please call us" + (b.venue_phone ? " on " + esc(b.venue_phone) : "") + ".</p>") + "</div>";
    var cx = $("cx");
    if (cx) cx.onclick = function () {
      if (!confirm("Cancel this booking?")) return;
      cx.disabled = true; cx.textContent = "Cancelling…";
      rpc("svc_cancel", { p_ref: ref, p_token: tok }).then(function (r) {
        if (!r.ok) { $("cxerr").textContent = r.error; cx.disabled = false; cx.textContent = "Cancel booking"; return; }
        if (!r.already) notify("cancelled", r.ref);
        manage(ref, tok);
      }).catch(function (e) { $("cxerr").textContent = e.message; cx.disabled = false; cx.textContent = "Cancel booking"; });
    };
  }).catch(function (e) { fatal(e.message); });
}

boot();
</script>
</body>
</html>
