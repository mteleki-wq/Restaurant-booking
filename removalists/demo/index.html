<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Removalist Deluxe — demo · Webescapade</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Removalist Deluxe — booking + travel-aware scheduling + quotes for electricians, plumbers and other mobile trades.
   Demo build: everything is stored in this browser (localStorage). Same shape as the Supabase version to come. */
:root{
  --bg:#F3F1EC; --card:#FFFFFF; --ink:#16202B; --muted:#65707B; --line:#E2DED6;
  --accent:#23566a; --accent-ink:#FFFFFF; --soft:#e5ecdd; --navy:#16202B; --ok:#2F7A4B; --okbg:#E3F2E8;
  --warn:#9A3B2E; --warnbg:#F8E4DF; --blue:#2C5F8A; --bluebg:#E2ECF5; --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 120px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
.top .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{font:400 22px/1.05 "Instrument Serif",serif;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#AEB8C2}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px}
.tabs button{border:0;background:none;color:#C9D1D9;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--navy)}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
.demo-note{background:var(--soft);color:#8A3A10;font-size:13px;text-align:center;padding:7px 12px}
h1{font:400 clamp(32px,5vw,48px)/1.05 "Instrument Serif",serif;margin:14px 0 6px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--accent)}
h2{font:400 30px/1.1 "Instrument Serif",serif;margin:0 0 10px}
h3{margin:0 0 8px;font-size:17px}
.lead{color:var(--muted);margin:0 0 20px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:13px}
/* steps */
.steps{display:flex;gap:6px;margin:0 0 20px;overflow-x:auto}
.steps::-webkit-scrollbar{height:0}
.steps span{white-space:nowrap;flex:none;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--ink);border-color:var(--ink);color:#fff}
.steps span.done{background:var(--soft);border-color:var(--soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr;gap:22px}
.grid>*{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1fr) 330px}}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 1px 2px rgba(22,32,43,.05)}
.cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}
.cat:first-child{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.list{display:grid;gap:10px}
@media(min-width:640px){.list.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1.5px solid transparent;border-radius:var(--radius);padding:15px 17px;cursor:pointer;box-shadow:0 1px 2px rgba(22,32,43,.05);transition:border-color .15s}
.opt:hover{border-color:var(--line)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.opt .t{font-weight:700}
.opt .d{color:var(--muted);font-size:14px;margin-top:2px}
.opt .meta{margin-left:auto;text-align:right;white-space:nowrap;font-size:14px;padding-left:8px}
.opt .meta b{display:block}
.opt .meta span{color:var(--muted);font-size:13px}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--bluebg);color:var(--blue);vertical-align:middle}
.pill.q{background:var(--soft);color:#A6400F}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.grey{background:#ECEAE5;color:var(--muted)}
/* forms */
.form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
label .opt-l{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=time],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;font-size:16px;font-weight:400}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea{min-height:90px;resize:vertical}
.row2{display:grid;gap:14px}
@media(min-width:640px){.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr 1fr 1fr}}
.row3{display:grid;gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warnbg)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.note{border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.note.ok{background:var(--okbg);color:#1F5A35}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.info{background:var(--bluebg);color:#1E4566}
/* dates + slots */
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.dates::-webkit-scrollbar{height:0}
.day{flex:none;width:64px;padding:9px 0;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:center;cursor:pointer}
.day small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day b{display:block;font:400 26px/1.1 "Instrument Serif",serif}
.day.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.day.sel small{color:#C9D1D9}
.day.closed{opacity:.35;cursor:default}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slots.exact{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.slot{padding:11px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;position:relative}
.slot small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.slot:hover{border-color:var(--accent)}
.slot.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.slot.sel small{color:#FFE3D2}
.slot .near{position:absolute;top:-8px;right:8px;background:var(--ok);color:#fff;font-size:10px;font-weight:800;letter-spacing:.04em;padding:1px 7px;border-radius:9px}
.empty{background:var(--card);border-radius:var(--radius);padding:22px;color:var(--muted);text-align:center}
/* summary */
.sum{position:sticky;top:84px;align-self:start}
.sum .r{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum .r:last-child{border-bottom:0}
.sum .r span:first-child{color:var(--muted)}
.sum .r span:last-child{text-align:right;font-weight:600}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
/* staff */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.toolbar .date{font-weight:700;font-size:18px;min-width:200px;text-align:center}
.round{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border-radius:14px;padding:12px 16px}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{color:var(--muted);font-size:13px}
.runs{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.runs{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}}
.run{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(22,32,43,.05)}
.run .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.run .hd .dot{width:12px;height:12px;border-radius:50%;flex:none}
.run .hd b{font-size:16px}
.run .hd .muted{font-size:13px}
.run .bd{padding:10px 14px 14px}
.leg{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:6px 4px 6px 14px;border-left:2px dashed var(--line);margin-left:10px}
.gap{font-size:12px;color:var(--ok);padding:3px 4px 3px 14px;border-left:2px dashed var(--line);margin-left:10px}
.job{border:1.5px solid var(--line);border-left-width:5px;border-radius:12px;padding:10px 12px;margin:2px 0}
.job .tm{font-weight:800;font-variant-numeric:tabular-nums}
.job .ti{font-weight:700}
.job .ad{font-size:13px;color:var(--muted)}
.job.done{opacity:.55}
.job .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.job .acts button,.job .acts select{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;width:auto}
.run .ft{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;background:#FAF9F6;flex-wrap:wrap}
.bar{height:8px;border-radius:5px;background:#ECEAE5;overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%}
/* tables / editors */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td input,td select{padding:8px 9px;font-size:14px;border-radius:9px}
.qrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);cursor:pointer;border:1.5px solid transparent;margin-bottom:8px}
.qrow:hover{border-color:var(--line)}
.qrow.sel{border-color:var(--accent)}
.totals{margin-left:auto;max-width:300px}
.totals .r{display:flex;justify-content:space-between;padding:5px 0}
.totals .r.big{font-size:20px;font-weight:800;border-top:2px solid var(--ink);margin-top:4px;padding-top:8px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:3px;font-weight:500;font-size:13px;background:#F3F1EC;border-radius:8px;padding:4px 7px}
.tm-row{display:grid;gap:10px;grid-template-columns:1fr;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
@media(min-width:760px){.tm-row{grid-template-columns:1.2fr 1.2fr 1.6fr 1fr auto}}
.jt-row{display:grid;gap:8px;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
@media(min-width:900px){.jt-row{grid-template-columns:1fr 2fr .8fr .8fr 1fr .8fr .8fr auto}}
.jt-row .full{grid-column:1/-1}
.emg{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warnbg);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.emg b{display:block;color:var(--warn)}.emg span{font-size:14px;color:#6B2A20}
.emg.on{background:var(--warn)}.emg.on b,.emg.on span{color:#fff}.emg.on .btn{color:#fff;border-color:rgba(255,255,255,.5)}
.job.emer{background:#FFF6F4}
.backsite{color:#fff;text-decoration:none;font-size:14px;font-weight:600;opacity:.85}
body.cust #tabs,body.cust .demo-note,body.cust .staffonly,body.cust #seeQ,body.cust #toRun{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;transition:transform .25s,opacity .25s;opacity:0;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.qdoc{max-width:760px;margin:0 auto}
.qdoc .head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px}
[hidden]{display:none!important}
@media print{.top,.demo-note,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>

      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div>

<script>

var SUB_NAMES = Object.keys(SUB).sort();

/* =====================================================================
   TRADE PRESETS — one system, any mobile trade. Add more here later.
   price types: fixed | from | range | hourly | quote
   ===================================================================== */
var PRESETS = {

var KEY = "removalistDeluxeDemo_v1", MEM = null;

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

function pad(n){ return (n < 10 ? "0" : "") + n; }
function hm(s){ var p = String(s || "0:0").split(":"); return (+p[0]) * 60 + (+p[1] || 0); }
function hhmm(m){ return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
function fmt(m){ var h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 ? "pm" : "am", h12 = h % 12 || 12; return h12 + (mm ? ":" + pad(mm) : "") + ap; }
function dur(m){ if (m < 60) return m + " min"; var h = Math.floor(m / 60), r = m % 60; return h + " h" + (r ? " " + r + " min" : ""); }
function money(n){ n = Math.round(n * 100) / 100; return "$" + n.toLocaleString("en-AU", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
function today(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function addDays(ds, n){ var d = new Date(ds + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function dow(ds){ return new Date(ds + "T12:00:00").getDay(); }

/* =====================================================================
   TRAVEL — straight-line distance × road factor ÷ average suburban speed,
   plus a fixed allowance for parking / unloading / walking in.
   ===================================================================== */
function km(a, b){
  var A = SUB[a], B = SUB[b]; if (!A || !B) return null;
  var R = 6371, dLa = (B[0] - A[0]) * Math.PI / 180, dLo = (B[1] - A[1]) * Math.PI / 180;
  var x = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(A[0] * Math.PI / 180) * Math.cos(B[0] * Math.PI / 180) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function roadKm(a, b){ var k = km(a, b); return k == null ? null : k * DB.biz.roadFactor; }
function travel(a, b){
  var B = DB.biz, c = DB.tcache && (DB.tcache[a + "|" + b] != null ? DB.tcache[a + "|" + b] : DB.tcache[b + "|" + a]);
  if (a === b) return B.bufferMin + 5;
  if (c != null) return Math.max(B.bufferMin + 5, Math.ceil((c + B.bufferMin) / 5) * 5);   // real Google drive time
  var rk = roadKm(a, b);
  if (rk == null) return B.unknownTravel;
  var m = rk / B.speedKmh * 60 + B.bufferMin;
  return Math.max(B.bufferMin + 5, Math.ceil(m / 5) * 5);
}
/* ---- optional: real drive times from Google Maps (needs the business's own API key).
   Times are saved per pair of suburbs, so each pair is looked up once — keeps the Google bill tiny. ---- */
var GM = { loading: null };
function gmLoad(){
  if (window.google && google.maps && google.maps.DistanceMatrixService) return Promise.resolve();
  if (GM.loading) return GM.loading;
  GM.loading = new Promise(function(res, rej){
    window.__gmReady = res;
    var s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(DB.biz.gmapsKey) + "&callback=__gmReady&loading=async";
    s.onerror = function(){ GM.loading = null; rej(new Error("Google Maps didn't load")); };
    document.head.appendChild(s);
  });
  return GM.loading;
}
function gmPrefetch(sub){
  if (!DB.biz.gmapsKey || !SUB[sub]) return Promise.resolve(0);
  DB.tcache = DB.tcache || {};
  var others = {}, end = addDays(today(), 22);
  others[DB.biz.base] = 1; DB.team.forEach(function(t){ others[baseOf(t)] = 1; });
  DB.bookings.forEach(function(b){ if (b.status === "booked" && b.date >= today() && b.date <= end) others[b.suburb] = 1; });
  var need = Object.keys(others).filter(function(o){ return SUB[o] && o !== sub && DB.tcache[sub + "|" + o] == null && DB.tcache[o + "|" + sub] == null; }).slice(0, 25);
  if (!need.length) return Promise.resolve(0);
  var place = function(s){ return s + " NSW, Australia"; };
  var work = gmLoad().then(function(){
    return new Promise(function(res, rej){
      new google.maps.DistanceMatrixService().getDistanceMatrix({ origins: [place(sub)], destinations: need.map(place), travelMode: "DRIVING",
        drivingOptions: { departureTime: new Date(Date.now() + 864e5), trafficModel: "best_guess" } }, function(r, st){
        if (st !== "OK") return rej(new Error("Google: " + st));
        var n = 0, pairs = {};
        r.rows[0].elements.forEach(function(e, i){ if (e.status === "OK") { var d = e.duration_in_traffic || e.duration; DB.tcache[sub + "|" + need[i]] = pairs[sub + "|" + need[i]] = Math.round(d.value / 60); n++; } });
        save(); if (LIVE) liveTravelSave(pairs); res(n);
      });
    });
  });
  var timeout = new Promise(function(res){ setTimeout(function(){ res(-1); }, 7000); });
  return Promise.race([work, timeout]).catch(function(e){ toast("Using estimated drive times (" + e.message + ")"); return 0; });
}
function baseOf(t){ return t.base || DB.biz.base; }

/* =====================================================================
   SCHEDULER
   A job fits a tradie at time t when:
   • it's inside their working hours that day (and they work that weekday),
   • the job before it finishes early enough to drive here,
   • it finishes early enough to drive to the job after it,
   • the first job of the day leaves time to drive from base (optional).
   Among tradies who fit, the one adding the least extra driving wins.
   ===================================================================== */
function jobsFor(techId, date, ignoreId){
  return DB.bookings.filter(function(b){ return b.techId === techId && b.date === date && b.status !== "cancelled" && b.id !== ignoreId; })
    .sort(function(a, b){ return a.start - b.start; });
}
/* working hours for a tradie on a date; in emergency mode on-call tradies stretch to the after-hours window */
function hoursFor(tech, date, emerg){
  var normal = tech.days.indexOf(dow(date)) >= 0 && (tech.off || []).indexOf(date) < 0, E = DB.biz.emergency;
  var nh = normal ? [hm(tech.start), hm(tech.end)] : null;
  if (emerg && E.on && tech.onCall) return { start: Math.min(hm(E.start), nh ? nh[0] : 1440), end: Math.max(hm(E.end), nh ? nh[1] : 0), normal: nh };
  return nh ? { start: nh[0], end: nh[1], normal: nh } : null;
}
function fits(tech, date, t, mins, sub, ignoreId, emerg){
  var H = hoursFor(tech, date, emerg); if (!H) return null;
  var ds = H.start, de = H.end;
  if (t < ds || t + mins > de) return null;
  var after = !H.normal || t < H.normal[0] || t + mins > H.normal[1];
  var jobs = jobsFor(tech.id, date, ignoreId), prev = null, next = null;
  for (var i = 0; i < jobs.length; i++) {
    var j = jobs[i], je = j.start + j.mins;
    if (je <= t) prev = j;
    else if (j.start >= t + mins) { if (!next) next = j; }
    else return null;                                    // overlaps
  }
  var from = prev ? prev.suburb : baseOf(tech);
  var tIn = travel(from, sub);
  if (prev && prev.start + prev.mins + tIn > t) return null;
  if (!prev && DB.biz.countFirstLeg && t < ds + tIn) return null;
  var tOut = next ? travel(sub, next.suburb) : 0;
  if (next && t + mins + tOut > next.start) return null;
  var extra = tIn + tOut - (next ? travel(from, next.suburb) : 0);
  var near = (prev && tIn <= DB.biz.bufferMin + 10) || (next && tOut <= DB.biz.bufferMin + 10);
  return { tech: tech, t: t, extra: extra, near: !!near, driveIn: tIn, after: after };
}
function canDo(tech, cat){ return tech.active !== false && tech.skills.indexOf(cat) >= 0; }
function options(date, mins, cat, sub, techId, emerg){
  var B = DB.biz, best = {}, min0 = 0;
  if (date === today()) min0 = nowMin() + (emerg ? B.emergency.notice : B.noticeHours * 60);
  DB.team.forEach(function(tech){
    if (!canDo(tech, cat) || (techId && tech.id !== techId)) return;
    var H = hoursFor(tech, date, emerg); if (!H) return;
    for (var t = H.start; t + mins <= H.end; t += B.slotStep) {
      if (t < min0) continue;
      var r = fits(tech, date, t, mins, sub, null, emerg);
      if (!r) continue;
      if (!best[t] || r.extra < best[t].extra) best[t] = r;
    }
  });
  return Object.keys(best).map(function(k){ return best[k]; }).sort(function(a, b){ return a.t - b.t; });
}
/* group exact starts into arrival windows ("we'll arrive between 9 and 11") */
function windows(opts){
  var B = DB.biz, w = B.windowHours * 60, out = [], ds = hm(B.dayStart), de = hm(B.dayEnd);
  for (var s = ds; s < de; s += w) {
    var inW = opts.filter(function(o){ return o.t >= s && o.t < s + w; });
    if (!inW.length) continue;
    inW.sort(function(a, b){ return (a.extra - b.extra) || (a.t - b.t); });
    out.push({ from: s, to: Math.min(s + w, de), pick: inW[0], near: inW.some(function(o){ return o.near; }) });
  }
  return out;
}
function dateOpen(date, emerg){ return DB.team.some(function(t){ return t.active !== false && !!hoursFor(t, date, emerg); }); }
/* repeat bookings: same weekday + time with the same tradie where possible, otherwise the closest fit that day */
function planSeries(first, every, count, mins, cat, sub){
  var out = [{ date: first.date, t: first.t, tech: first.tech, moved: false }];
  for (var i = 1; i < count; i++) {
    var d = addDays(first.date, i * every), r = fits(first.tech, d, first.t, mins, sub), moved = false;
    if (!r) {
      var opts = options(d, mins, cat, sub, null);
      opts.sort(function(a, b){ return (Math.abs(a.t - first.t) - Math.abs(b.t - first.t)) || ((a.tech.id === first.tech.id ? 0 : 1) - (b.tech.id === first.tech.id ? 0 : 1)); });
      r = opts[0] && Math.abs(opts[0].t - first.t) <= 180 ? opts[0] : null; moved = true;
    }
    out.push(r ? { date: d, t: r.t, tech: r.tech, moved: moved } : { date: d, t: null, tech: null, moved: true });
  }
  return out;
}

function photoInput(arr, box, max){
  var render = function(){ box.querySelector(".photos").innerHTML = arr.map(function(p, i){ return '<img src="' + p + '" alt="photo ' + (i + 1) + '">'; }).join(""); };
  box.querySelector("input[type=file]").onchange = function(e){
    var files = Array.prototype.slice.call(e.target.files || []).slice(0, max - arr.length);
    files.forEach(function(f){ shrink(f, function(u){ if (u && arr.length < max) { arr.push(u); render(); } }); });
    e.target.value = "";
  };
  render();
}
function shrink(file, cb){
  var r = new FileReader();
  r.onload = function(){ var im = new Image(); im.onload = function(){
    var s = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL("image/jpeg", 0.68));
  }; im.onerror = function(){ cb(null); }; im.src = r.result; };
  r.readAsDataURL(file);
}

    '<div class="row2"><label>Business phone<input type="tel" id="sPhone"></label><label>Business email<input type="email" id="sEmail" value="' + esc((SES.user && SES.user.email) || "") + '"></label></div>' +
    '<div class="row2"><label>Base suburb (where the vans start)<input type="text" id="sBase" list="subListS"></label><label>State<select id="sState">' + ["NSW","VIC","QLD","WA","SA","TAS","ACT","NT"].map(function(s){ return '<option>' + s + '</option>'; }).join("") + '</select></label></div>' +
    '<datalist id="subListS">' + SUB_NAMES.map(function(s){ return '<option value="' + s + '">'; }).join("") + '</datalist>' +
    '<div class="row2"><label>Your name<input type="text" id="sOwner"></label><label class="check" style="align-self:end"><input type="checkbox" id="sWorks" checked> <span>I do jobs myself</span></label></div>' +
    '<label>Setup code <span class="opt-l">(from Webescapade)</span><input type="text" id="sCode" value="' + esc(QP0.get("code") || "") + '"></label>' +
    '<div class="actions"><button class="btn" id="sGo">Create my business</button></div><div id="sMsg"></div></div>';
  $("#sGo").onclick = function(){
    var btn = this, name = $("#sName").value.trim(), preset = $("#sPreset").value;
    if (!name) return toast("Please enter the business name");

      var b = bizDefaults(); b.name = name; b.preset = preset; b.phone = $("#sPhone").value.trim(); b.email = $("#sEmail").value.trim(); b.base = base; b.state = $("#sState").value;

      return rpc("trd_create_business", { p_name: name, p_phone: b.phone, p_email: b.email, p_config: { biz: b, team: team, jobTypes: makeJobs(preset) }, p_code: $("#sCode").value.trim() })

function renderJoin(a){
  document.body.classList.add("cust");
  if (!SES) return renderLogin("Sign in or create a login to join the team.");

  }, function(e){ toast(e.message); });
}
function renderCancel(a){
  document.body.classList.add("cust");
  $("#app").innerHTML = '<div class="empty" style="margin-top:40px">Finding your booking…</div>';
  rpc("trd_lookup", { p_ref: a.cancel, p_token: a.t }).then(function(r){
    if (!r || !r.ok) { $("#app").innerHTML = '<div class="note warn" style="max-width:520px;margin:40px auto">' + esc((r && r.error) || "We couldn't find that booking.") + '</div>'; return; }
    $("#bizName").textContent = r.venue;
    var wh = r.win_from != null ? "arriving between " + fmt(r.win_from) + " and " + fmt(r.win_to) : "arriving at " + fmt(r.start);
    $("#app").innerHTML = '<div class="card" style="max-width:560px;margin:30px auto"><span class="pill ' + (r.status === "booked" ? "ok" : "grey") + '">' + esc(r.status) + ' · ' + esc(r.ref) + '</span>' +
      '<h2 style="margin-top:12px">' + esc(r.title) + '</h2><p style="font-size:18px"><b>' + fmtDay(String(r.date).slice(0, 10)) + '</b>, ' + wh + '</p><p class="muted">' + esc((r.street ? r.street + ", " : "") + r.suburb) + '</p>' +
      (r.can_cancel ? '<div class="actions"><button class="btn danger" id="cx">Cancel this booking</button></div>' : r.status === "booked" ? '<div class="note info">It\'s less than 24 hours away — please call ' + esc(r.venue) + (r.phone ? ' on <a href="tel:' + esc(String(r.phone).replace(/\s/g, "")) + '">' + esc(r.phone) + '</a>' : '') + ' to change it.</div>' : '') +
      '<div class="actions"><a class="btn ghost" href="?b=' + encodeURIComponent(r.slug) + '#book">Book another job</a></div></div>';
    if ($("#cx")) $("#cx").onclick = function(){ if (!confirm("Cancel this booking?")) return; var b = this; busy(b, true);
      rpc("trd_cancel", { p_ref: a.cancel, p_token: a.t }).then(function(x){ if (!x || !x.ok) { busy(b, false); return toast((x && x.error) || "Couldn't cancel."); } toast("Booking cancelled"); renderCancel(a); }); };
  });
}
function renderLiveQuote(a){
  document.body.classList.add("cust");
  if (CQ.id === a.quote && CQ.live) return renderCustomerQuote(a.quote);
  $("#app").innerHTML = '<div class="empty" style="margin-top:40px">Loading your quote…</div>';
  rpc("trd_quote_view", { p_id: a.quote, p_token: a.t }).then(function(r){
    if (!r || !r.ok) { $("#app").innerHTML = '<div class="note warn" style="max-width:520px;margin:40px auto">' + esc((r && r.error) || "This quote link isn't valid any more.") + '</div>'; return; }
    SLUG = r.slug;
    return loadPublic(r.slug).then(function(){
      var q = r.quote; q.token = a.t; q.photos = []; q.lines = q.lines || [];
      if (q.lat != null && q.suburb && !SUB[q.suburb]) SUB[q.suburb] = [q.lat, q.lng];
      DB.quotes = [q]; CQ = { id: q.id, date: null, pick: null, techId: "", stage: q.status === "booked" ? "done" : "view", live: true, booking: r.booking };
      $("#bizName").textContent = DB.biz.name; renderCustomerQuote(q.id);
    });

}

function liveBoot(){
  SES = SES || loadSes();
  var a = hashArgs();
  if (a.start) return renderStart();
  if (a.join) return renderJoin(a);
  if (a.cancel) return renderCancel(a);
  if (a.quote) return renderLiveQuote(a);
  var staffView = a.staff || a.quotes || a.setup || a.crm || a.website;
  if (!staffView && SLUG) {
    STAFF = null;
    document.body.classList.add("cust");
    return loadPublic().then(function(){ applyBookParams(); route(); }, function(e){ $("#app").innerHTML = '<div class="note warn">' + esc(e.message) + '</div>'; });
  }
  if (SES) {
    return rpc("trd_my_venues", {}).then(async function(m){
      var list = await Promise.all(((m && m.venues) || []).map(async function(v){try{var d=await rpc('trd_public',{p_venue:v.slug});return d&&d.ok&&d.config&&d.config.biz&&d.config.biz.preset==='removalist'?v:null;}catch(e){return null;}}));list=list.filter(Boolean);
      if (!SLUG) { if (list.length === 1) { SLUG = list[0].slug; } else if (staffView || !list.length) { return list.length ? renderPicker(list) : renderStart(); } }
      var mine = list.some(function(v){ return v.slug === SLUG; });
      if (mine) return loadStaff().then(route);
      if (staffView) return renderLogin("This login doesn't have access to that business.");
      return loadPublic().then(function(){ document.body.classList.add("cust"); applyBookParams(); route(); });
    }).catch(function(e){ if (/JWT|expired|401/i.test(e.message)) { saveSes(null); return liveBoot(); } toast(e.message); });
  }
  if (staffView) return renderLogin();
  if (!SLUG) { $("#app").innerHTML = '<div class="card" style="max-width:560px;margin:40px auto"><h2>Removalist Deluxe</h2><p class="muted">Looking to book? Use the booking link from your tradie\'s website.</p><div class="actions"><a class="btn" href="#staff">Staff sign in</a><a class="btn ghost" href="#start">Set up a business</a></div></div>'; document.body.classList.add("cust"); return; }
  document.body.classList.add("cust");
  $("#app").innerHTML = '<div class="empty" style="margin-top:40px">Loading…</div>';
  loadPublic().then(function(){ applyBookParams(); route(); }, function(e){ $("#app").innerHTML = '<div class="note warn" style="max-width:520px;margin:40px auto">' + esc(e.message) + '</div>'; });
}
function applyBookParams(){
  selectMovingIntent();
  
  var jid = QP0.get("job");
  if (jid) { var j = DB.jobTypes.filter(function(x){ return x.id === jid || x.name === jid; })[0]; if (j) { BK.job = j; BK.cat = j.cat; BK.step = 2; } }
  if (QP0.get("cat")) BK.cat = QP0.get("cat");
}
function liveSetupExtras(){
  var base = location.origin + location.pathname + "?b=" + encodeURIComponent(SLUG);
  var site = "https://webescapade.com/removalists/";
  var invite = STAFF && STAFF.join_key && STAFF.role !== "staff" ? base + "#join=" + encodeURIComponent(SLUG) + "&k=" + STAFF.join_key : null;
  var box = document.createElement("div"); box.className = "card"; box.style.marginBottom = "16px";
  var row = function(label, url){ return '<label>' + label + '<span style="display:flex;gap:8px"><input type="text" readonly value="' + esc(url) + '"><button class="btn ghost sm" type="button" data-copy="' + esc(url) + '">Copy</button></span></label>'; };
  box.innerHTML = '<h3>Your links</h3><div class="form">' + row("Booking page — put this on your website, Google profile and Facebook", base + "#book") +
    row("Your removalist website", new URL("../index.html?b="+encodeURIComponent(SLUG), location.href).href) + row("Run sheet for your team", base + "#staff") +
    (invite ? row("Invite a team member (they sign in, then get access)", invite) : '') + '</div>' +
    '<p class="small muted" style="margin:10px 0 0">On your Removalist Deluxe website, set the booking page to <code>' + esc(location.pathname + "?b=" + SLUG) + '</code> (Bookings button in the editor).</p>';
  var app = $("#app"), first = app.querySelector(".card"); app.insertBefore(box, first);
  $$("[data-copy]", box).forEach(function(b){ b.onclick = function(){ var u = b.getAttribute("data-copy");
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function(){ toast("Copied"); }, function(){ prompt("Copy this link:", u); }); }; });
  if ($("#outS")) $("#outS").onclick = function(){ saveSes(null); STAFF = null; location.hash = ""; location.reload(); };
}

(function(){
  var a = QP.get("accent"); if (a && /^#?[0-9a-f]{6}$/i.test(a)) document.documentElement.style.setProperty("--accent", a.replace(/^#?/, "#"));
  var bk = QP.get("back"); if (bk && /^https?:/i.test(bk)) { var l = document.createElement("a"); l.href = bk; l.className = "backsite"; l.textContent = "‹ Back to website"; document.querySelector(".top .in").insertBefore(l, document.querySelector("#tabs")); }

function renderCRM(){
 if(LIVE&&!STAFF)return renderLogin();
 var records=DB.bookings.map(function(b){return {kind:"Booking",name:b.customer&&b.customer.name,email:b.customer&&b.customer.email,phone:b.customer&&b.customer.phone,title:b.title,status:b.status,date:b.date,notes:b.notes,suburb:b.suburb,street:b.street};}).concat(DB.quotes.map(function(q){return {kind:"Quote",name:q.customer&&q.customer.name,email:q.customer&&q.customer.email,phone:q.customer&&q.customer.phone,title:q.title,status:q.status,date:new Date(q.created).toLocaleDateString(),notes:q.description,suburb:q.suburb,street:q.street};}));
 $("#app").innerHTML='<h1>Your <em>customers</em></h1><p class="lead">Bookings, quote requests and what each customer needs.</p><label>Search customers<input id="crmSearch" placeholder="Name, email, suburb or project"></label><div class="actions"><button class="btn ghost" id="crmRefresh">Refresh</button><a class="btn" href="#quotes">Manage quotes</a></div><div id="crmRows"></div><p class="small muted">Shows records returned by the run sheet and quote inbox, not a complete lifetime archive. Contact details are only available after authorised staff sign in.</p>';
 function draw(){var q=$("#crmSearch").value.toLowerCase();$("#crmRows").innerHTML=records.filter(function(r){return JSON.stringify(r).toLowerCase().includes(q);}).map(function(r){return '<article class="card" style="margin-top:14px"><span class="pill">'+esc(r.kind+' · '+r.status)+'</span><h3>'+esc(r.name||"Customer")+'</h3><p>'+esc(r.title)+' · '+esc(r.date)+'</p><p>'+esc([r.email,r.phone].filter(Boolean).join(' · '))+'</p><p>'+esc([r.street,r.suburb].filter(Boolean).join(', '))+'</p><p style="white-space:pre-wrap">'+esc(r.notes||'No additional notes')+'</p></article>';}).join('')||'<div class="empty">No matching customers yet.</div>';}
 $("#crmSearch").oninput=draw;$("#crmRefresh").onclick=function(){if(LIVE)reload().then(renderCRM);else renderCRM();};draw();
}
function renderWebsite(){
 if(LIVE&&!STAFF)return renderLogin();
 var w=DB.biz.website||{}, fields=[["headline","Headline","Your next move. A clearer budget."],["intro","Introduction","Get an indicative moving estimate, request a written quote or book a quotation visit."],["about","About your business","Tell customers about your removal services and service area."],["hero","Hero photo URL",""],["accent","Brand colour","#23566a"],["hourlyRate","Crew + truck AUD/hour (before GST)",160],["perKm","Vehicle charge AUD/km (before GST)",1.8],["calloutFee","Fixed setup/callout AUD (before GST)",80],["minimumHours","Minimum billable hours",2],["minimum","Minimum estimate AUD (before GST)",350],["baseVolume","Kitchen, hall and boxes allowance m³",6],["bedroomVolume","Volume per bedroom m³",5],["livingVolume","Volume per living room m³",8],["extraVolume","Volume per study/storage room m³",4],["handlingRate","Loading speed m³/hour for the crew",10],["unloadFactor","Unloading time as a share of loading time",0.65],["driveSpeed","Average driving km/hour for manual distance",45],["stairsMinutes","Extra minutes per floor, at each property",20],["liftMinutes","Lift-access extra minutes per property",15],["carryMinutes","Extra minutes per 25 m of carrying, per property",10],["bulkyFee","Extra AUD per bulky item (before GST)",60],["packingHourly","Packing crew AUD/hour (before GST)",120],["spread","Estimate range ± percent",20]];
 $("#app").innerHTML='<h1>Your <em>website</em></h1><p class="lead">Edit your website, moving estimate assumptions and chatbot. All estimator rates below are before GST; Setup controls whether 10% GST is added.</p><form class="card form" id="websiteForm">'+fields.map(function(f){return '<label>'+esc(f[1])+'<input data-web="'+f[0]+'" type="'+(typeof f[2]==='number'?'number':f[0]==='accent'?'color':f[0]==='hero'?'url':'text')+'" '+(typeof f[2]==='number'?'min="0" max="10000" step="0.01"':'maxlength="1200"')+' value="'+esc(w[f[0]]==null?f[2]:w[f[0]])+'"></label>';}).join('')+'<fieldset style="border:1px solid var(--line);border-radius:14px;padding:18px;margin:8px 0"><legend>Website chatbot</legend><label class="check"><input id="chatEnabled" type="checkbox" '+((w.chatEnabled===true||(!LIVE&&w.chatEnabled!==false))?'checked':'')+'>Show chatbot on my website</label><p class="small muted">Help customers ask about your moving services, estimates, access requirements and quotation visits. Live answers use your saved public website information. The assistant cannot see customer records or reserve appointments.</p><label>Chatbot name<input id="chatName" type="text" maxlength="60" value="'+esc(w.chatName||'Ask the removalist')+'"></label><label>Extra information for the chatbot<textarea id="chatKnowledge" rows="7" maxlength="8000" placeholder="For example: areas you serve, packing options, access requirements and frequently asked questions.">'+esc(w.chatKnowledge||'')+'</textarea></label><p class="small muted">These notes are public chatbot knowledge. Do not add passwords, private customer details or internal business notes. Save website to publish changes. Switching the chatbot off stops new answers.</p>'+(!LIVE?'<p class="small muted">Demo: answers use the information saved in this browser. A live business uses the connected AI assistant.</p>':'')+'</fieldset>'+'<label>Or upload a hero photo<input id="heroFile" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="small muted">Photos are resized before saving. Use images you own or are licensed to use. Business name and contact details are edited in Setup. These website fields are public; never enter private notes here.</p><div class="actions"><button class="btn">Save website</button><a class="btn ghost" target="_blank" rel="noopener" href="../site.html'+(SLUG?'?b='+encodeURIComponent(SLUG):'')+'">Preview website ↗</a></div><p id="webMessage" role="status"></p></form>';
 var photo=null;
 $("#heroFile").onchange=async function(){var file=this.files[0];if(!file)return;if(file.size>12000000)return toast('Please choose an image smaller than 12 MB');try{var img=await createImageBitmap(file),c=document.createElement('canvas'),ratio=Math.min(1,1000/img.width);c.width=img.width*ratio;c.height=img.height*ratio;c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65);img.close();if(photo.length>180000){photo=null;return toast('Photo is too detailed. Choose a smaller image.');}toast('Photo ready — save website to publish.');}catch(e){toast('Could not read that photo');}};
 $("#websiteForm").onsubmit=function(e){e.preventDefault();var previousWebsite=DB.biz.website;var nw=Object.assign({},previousWebsite||{});$$('[data-web]').forEach(function(i){nw[i.dataset.web]=i.type==='number'?Number(i.value):i.value.trim();});nw.chatEnabled=$('#chatEnabled').checked;nw.chatName=$('#chatName').value.trim().slice(0,60)||'Ask the removalist';nw.chatKnowledge=$('#chatKnowledge').value.trim().slice(0,8000);if(photo)nw.hero=photo;DB.biz.website=nw;var btn=this.querySelector('button');if(LIVE){busy(btn,true,'Saving…');rpc('trd_save_config',{p_venue:SLUG,p_config:liveCfg()}).then(function(r){if(!r||!r.ok)throw Error(r&&r.error||'Save failed');$('#webMessage').textContent='Saved. Your website, estimator and chatbot now use these settings.';}).catch(function(e){DB.biz.website=previousWebsite;$('#webMessage').textContent=e.message;}).finally(function(){busy(btn,false);});}else{save();$('#webMessage').textContent='Demo saved in this browser. Live business settings save privately to your account.';}};
}

 var link=document.getElementById("removalistHome"); if(!link)return;
 var business=(typeof SLUG!=="undefined" && SLUG)||QP0.get("b")||"";
 link.href="../site.html"+(business?"?b="+encodeURIComponent(business):"");
