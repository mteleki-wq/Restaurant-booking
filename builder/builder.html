<style>
:root{--ui-bg:#0d0d16;--ui-p:#14141f;--ui-p2:#1b1b29;--ui-line:#2a2a3c;--ui-t:#ececf6;--ui-m:#9a99b4;--ui-a:#8b5cf6;--ui-a2:#22d3ee;--ui-ok:#34d399;--ui-bad:#f87171;--ui-grad:linear-gradient(120deg,#8b5cf6,#3b82f6 55%,#22d3ee)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-t);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ui-a2)}
.hide{display:none!important}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--ui-p2);color:var(--ui-t);font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s,transform .15s,opacity .2s;white-space:nowrap}
.btn:hover{background:#262638}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ui-grad);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line)}
.btn.danger{background:#3a1d24;color:#fecaca}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12px;font-weight:600;color:var(--ui-m);text-transform:uppercase;letter-spacing:.6px}
.inp{width:100%;background:#0f0f19;border:1px solid var(--ui-line);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--ui-a)}
.muted{color:var(--ui-m)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--ui-grad);display:inline-block;box-shadow:0 0 24px #8b5cf655}
/* toast + modal */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1f1f30;border:1px solid var(--ui-line);padding:11px 18px;border-radius:12px;box-shadow:0 12px 40px #0008;animation:tIn .3s ease;font-weight:500;pointer-events:auto}
.toast.ok{border-color:#2f6f57}.toast.bad{border-color:#7a2f3a}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}}
.modal-bg{position:fixed;inset:0;background:#05050ccc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px;animation:fIn .2s}
@keyframes fIn{from{opacity:0}}
.modal{background:var(--ui-p);border:1px solid var(--ui-line);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;box-shadow:0 30px 80px #000a}
.modal.wide{width:min(1040px,100%)}
.modal h2{margin:0 0 6px;font-size:21px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:radial-gradient(900px 500px at 10% 0%,#8b5cf633,transparent),radial-gradient(800px 500px at 100% 100%,#22d3ee22,transparent)}
.auth-card{width:min(420px,100%);background:var(--ui-p);border:1px solid var(--ui-line);border-radius:20px;padding:32px;box-shadow:0 30px 80px #0009}
.auth-card h1{font-size:26px;margin:22px 0 6px}
.auth-card .row{display:flex;gap:10px;margin-top:6px}
.auth-card .row .btn{flex:1;justify-content:center}
.auth-msg{min-height:20px;margin-top:12px;font-size:13px}
/* dashboard */
.dash{min-height:100vh;background:radial-gradient(1000px 500px at 0% 0%,#8b5cf61f,transparent)}
.dash-top{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--ui-line)}
.dash-top .sp{flex:1}
.dash-main{padding:34px 32px;max-width:1240px;margin:0 auto}
.dash-main h1{margin:0 0 4px;font-size:30px}
.demo-note{margin:18px 0 0;padding:12px 16px;border:1px dashed #6d5bd0;border-radius:12px;background:#8b5cf612;color:#d9d3ff;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:26px}
.scard{background:var(--ui-p);border:1px solid var(--ui-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.scard:hover{transform:translateY(-3px);border-color:#43435e}
.scard .thumb{height:150px;display:flex;align-items:flex-end;padding:16px;font-size:44px;font-weight:700;color:#fff;background:var(--ui-grad);position:relative;cursor:pointer}
.scard .thumb small{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;background:#0008;padding:4px 9px;border-radius:99px;letter-spacing:.4px}
.scard .meta{padding:14px 16px 6px}
.scard .meta b{display:block;font-size:16px}
.scard .meta span{font-size:12.5px;color:var(--ui-m)}
.scard .acts{display:flex;gap:6px;padding:10px 12px 14px;flex-wrap:wrap}
.newcard{border:1.5px dashed #3b3b55;background:transparent;border-radius:16px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ui-m);font-weight:600;font-size:15px;transition:border-color .2s,color .2s}
.newcard:hover{border-color:var(--ui-a);color:#fff}
.newcard i{font-style:normal;font-size:34px;width:60px;height:60px;border-radius:50%;background:var(--ui-grad);color:#fff;display:flex;align-items:center;justify-content:center}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:16px 0}
.tpl{border:2px solid var(--ui-line);border-radius:14px;overflow:hidden;background:var(--ui-p2);cursor:pointer;text-align:left;padding:0;transition:border-color .2s,transform .2s}
.tpl:hover{transform:translateY(-2px)}
.tpl.on{border-color:var(--ui-a);box-shadow:0 0 0 4px #8b5cf633}
.tpl .pv{height:150px;overflow:hidden;position:relative;pointer-events:none;background:#000}
.tpl .pv>div{position:absolute;inset:0}
.tpl .tx{padding:10px 12px}
.tpl .tx b{display:block}
.tpl .tx span{font-size:12px;color:var(--ui-m)}
.msg-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.msg{background:var(--ui-p2);border-radius:12px;padding:12px 14px;border:1px solid var(--ui-line)}
.msg .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ui-m)}
.msg p{margin:8px 0 0;white-space:pre-wrap}
/* editor layout */
.ed{position:fixed;inset:0;display:grid;grid-template-columns:292px 1fr 300px;grid-template-rows:58px 1fr;grid-template-areas:"top top top" "left canvas right"}
.ed-top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--ui-p);border-bottom:1px solid var(--ui-line);z-index:20;min-width:0}
.ed-top .sp{flex:1}
.ic{width:36px;height:36px;border-radius:9px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ui-t);transition:background .15s;flex:none}
.ic:hover{background:var(--ui-p2)}
.ic.on{background:#8b5cf633;color:#c4b5fd}
.ic[disabled]{opacity:.35;pointer-events:none}
.ic svg{width:19px;height:19px}
.ed-name{display:flex;flex-direction:column;line-height:1.15;min-width:0;max-width:220px}
.ed-name b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-status{font-size:11.5px;color:var(--ui-m)}
.ed-status.bad{color:var(--ui-bad)}
.seg{display:inline-flex;background:#0f0f19;border:1px solid var(--ui-line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ui-m)}
.seg button.on{background:var(--ui-p2);color:#fff}
.seg svg{width:17px;height:17px}
.sel-sm{background:#0f0f19;border:1px solid var(--ui-line);border-radius:9px;padding:7px 9px;font-size:13px;max-width:150px}
.ed-left,.ed-right{background:var(--ui-p);overflow:auto;min-height:0}
.ed-left{grid-area:left;border-right:1px solid var(--ui-line);display:flex;flex-direction:column}
.ed-right{grid-area:right;border-left:1px solid var(--ui-line)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--ui-line);position:sticky;top:0;background:var(--ui-p);z-index:2}
.tabs button{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ui-m);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--ui-a)}
.tabs svg{width:18px;height:18px}
.pane{padding:14px}
.pane h4{margin:16px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ui-m)}
.pane h4:first-child{margin-top:2px}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add-grid button{background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;transition:border-color .15s,background .15s}
.add-grid button:hover{border-color:var(--ui-a);background:#22223a}
.add-grid svg{width:24px;height:24px;color:#c4b5fd}
.lib-list{display:flex;flex-direction:column;gap:6px}
.lib-list button{text-align:left;background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:10px;padding:10px 12px;font-weight:500;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.lib-list button:hover{border-color:var(--ui-a)}
.lib-list button em{font-style:normal;color:var(--ui-m);font-size:11px}
.slist{display:flex;flex-direction:column;gap:5px}
.sitem{display:flex;align-items:center;gap:4px;background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:10px;padding:5px 5px 5px 11px;font-size:13px;cursor:pointer}
.sitem.on{border-color:var(--ui-a);background:#8b5cf61c}
.sitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem small{color:var(--ui-m);font-size:10.5px;margin-right:4px}
.sitem .ic{width:28px;height:28px}
.sitem .ic svg{width:15px;height:15px}
.pal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pal{border:2px solid var(--ui-line);border-radius:12px;padding:8px;background:var(--ui-p2);display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:11px;font-weight:600}
.pal.on{border-color:var(--ui-a)}
.pal .dots{display:flex;gap:3px}
.pal .dots i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px #ffffff22}
.font-list{display:flex;flex-direction:column;gap:6px}
.font-list button{background:var(--ui-p2);border:2px solid var(--ui-line);border-radius:10px;padding:9px 12px;text-align:left;display:flex;justify-content:space-between;align-items:baseline}
.font-list button.on{border-color:var(--ui-a)}
.font-list b{font-size:19px;font-weight:500}
.font-list span{font-size:11px;color:var(--ui-m)}
/* inspector */
.insp-h{padding:14px 16px 10px;border-bottom:1px solid var(--ui-line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--ui-p);z-index:3}
.insp-h b{flex:1;font-size:14px}
.insp-h .tag{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:#8b5cf62a;color:#c4b5fd;padding:3px 8px;border-radius:99px}
.insp-empty{padding:30px 22px;color:var(--ui-m);text-align:center;font-size:13px;line-height:1.6}
.insp-empty b{color:#fff}
.insp-empty b.t{display:block;font-size:15px;margin-bottom:6px}
.i-grp{border-bottom:1px solid var(--ui-line)}
.i-grp summary{padding:12px 16px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ui-m);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.i-grp summary::-webkit-details-marker{display:none}
.i-grp summary::after{content:"▾";transition:transform .2s}
.i-grp:not([open]) summary::after{transform:rotate(-90deg)}
.i-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.i-row{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px;font-size:12.5px;color:#c9c8dc}
.i-row.full{grid-template-columns:1fr}
.i-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.i-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.i-4 label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--ui-m);font-weight:600}
.i-num,.i-text,.i-sel,.i-area{width:100%;background:#0f0f19;border:1px solid var(--ui-line);border-radius:8px;padding:7px 9px;font-size:13px;outline:none;min-width:0}
.i-num:focus,.i-text:focus,.i-sel:focus,.i-area:focus{border-color:var(--ui-a)}
.i-area{min-height:70px;resize:vertical}
.i-range{display:flex;align-items:center;gap:8px}
.i-range input{flex:1;accent-color:#8b5cf6;min-width:0}
.i-range output{font-size:11.5px;color:var(--ui-m);min-width:34px;text-align:right}
.i-sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.i-sw button{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff22;padding:0}
.i-sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ui-a)}
.i-sw button.none{background:repeating-linear-gradient(45deg,#555 0 3px,#222 3px 6px)}
.i-sw input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;border-radius:6px;cursor:pointer}
.i-seg{display:flex;background:#0f0f19;border:1px solid var(--ui-line);border-radius:8px;padding:2px}
.i-seg button{flex:1;border:0;background:none;border-radius:6px;padding:5px 4px;font-size:12px;font-weight:600;color:var(--ui-m)}
.i-seg button.on{background:var(--ui-p2);color:#fff}
.i-chk{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:#c9c8dc;cursor:pointer}
.i-chk input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:20px;background:#2b2b3e;position:relative;transition:background .2s;flex:none;cursor:pointer}
.i-chk input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.i-chk input:checked{background:var(--ui-a)}
.i-chk input:checked::after{transform:translateX(16px)}
.i-acts{display:flex;flex-wrap:wrap;gap:6px}
.i-note{font-size:12px;color:var(--ui-m);line-height:1.5;background:#0f0f19;border-radius:8px;padding:9px 10px}
.i-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.i-imgs div{position:relative;aspect-ratio:1;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--ui-line)}
.i-imgs button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:12px;line-height:1;padding:0}
.i-thumb{height:110px;border-radius:10px;background:#0f0f19 center/cover no-repeat;border:1px solid var(--ui-line);display:flex;align-items:center;justify-content:center;color:var(--ui-m);font-size:12px}
/* canvas */
.ed-canvas{grid-area:canvas;overflow:auto;position:relative;background:#08080e;background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:22px 22px;min-height:0;min-width:0}
.ed-stage{position:relative;margin:28px auto 120px;box-shadow:0 20px 70px #000c,0 0 0 1px #ffffff14;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ed-stage.phone{border-radius:34px;padding:0;box-shadow:0 0 0 10px #1c1c28,0 0 0 11px #34344a,0 30px 80px #000c;overflow:hidden}
.ed-mount{position:relative}
.ed-stage .wb-el{cursor:move;touch-action:none}
.ed-stage .wb-fg{cursor:move;touch-action:none}
.ed-stage .wb-el:hover{outline:calc(1px * var(--ik,1)) dashed #8b5cf6aa;outline-offset:0}
.ed-stage .wb-sec{outline:0}
.ed-stage .wb-sec:hover>.ed-secbar,.ed-stage .wb-sec.ed-on>.ed-secbar{opacity:1;pointer-events:auto}
.ed-stage .wb-sec.ed-on{box-shadow:inset 0 0 0 2px #22d3ee}
.ed-stage .wb-sec:hover>.ed-sech,.ed-stage .wb-sec.ed-on>.ed-sech,.ed-stage .wb-sec:hover>.ed-addsec{opacity:1}
.ed-secbar{position:absolute;top:8px;left:8px;z-index:60;display:flex;align-items:center;gap:2px;background:#111120ee;border:1px solid #33334a;border-radius:10px;padding:3px 3px 3px 10px;font:600 12px Inter,sans-serif;color:#fff;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 6px 20px #0007}
.wb-overlay>.ed-secbar{left:auto;right:8px;top:auto;bottom:-40px}
.ed-secbar span{margin-right:6px;white-space:nowrap}
.ed-secbar em{font-style:normal;color:#22d3ee;font-size:10px;margin-right:6px}
.ed-secbar button{width:26px;height:26px;border:0;background:none;color:#ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0}
.ed-secbar button:hover{background:#ffffff1a;color:#fff}
.ed-secbar svg{width:15px;height:15px}
.ed-sech{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:64px;height:12px;border-radius:8px;background:#22d3ee;z-index:61;cursor:ns-resize;opacity:0;transition:opacity .15s;touch-action:none;box-shadow:0 2px 10px #0008}
.ed-addsec{position:absolute;left:12px;bottom:-15px;z-index:61;opacity:0;transition:opacity .15s;border:0;background:var(--ui-grad);color:#fff;font:600 12px Inter,sans-serif;border-radius:99px;padding:5px 12px;box-shadow:0 4px 14px #0008}
.ed-sel{position:absolute;z-index:500;pointer-events:none;outline:calc(2px * var(--ik,1)) solid #8b5cf6;outline-offset:0}
.ed-sel.flow{outline-style:dashed}
.ed-h{position:absolute;width:calc(12px * var(--ik,1));height:calc(12px * var(--ik,1));background:#fff;border:calc(2px * var(--ik,1)) solid #8b5cf6;border-radius:50%;pointer-events:auto;touch-action:none;margin:calc(-6px * var(--ik,1)) 0 0 calc(-6px * var(--ik,1))}
.ed-h[data-h=nw]{left:0;top:0;cursor:nwse-resize}.ed-h[data-h=n]{left:50%;top:0;cursor:ns-resize}.ed-h[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
.ed-h[data-h=e]{left:100%;top:50%;cursor:ew-resize}.ed-h[data-h=se]{left:100%;top:100%;cursor:nwse-resize}.ed-h[data-h=s]{left:50%;top:100%;cursor:ns-resize}
.ed-h[data-h=sw]{left:0;top:100%;cursor:nesw-resize}.ed-h[data-h=w]{left:0;top:50%;cursor:ew-resize}
.ed-guide{position:absolute;z-index:499;background:#ff3d8b;pointer-events:none}
.ed-guide.v{top:0;bottom:0;width:calc(1px * var(--ik,1))}
.ed-guide.h{left:0;right:0;height:calc(1px * var(--ik,1))}
.ed-pos{position:absolute;z-index:700;background:#111;color:#fff;font:600 11px Inter,sans-serif;padding:3px 7px;border-radius:6px;pointer-events:none;white-space:nowrap}

.ed-eltb button{height:30px;min-width:30px;border:0;background:none;color:#e5e5f0;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:5px;font:600 12px Inter,sans-serif;padding:0 7px}
.ed-eltb button:hover{background:#ffffff18}
.ed-eltb svg{width:16px;height:16px}
.ed-eltb .sep{width:1px;background:#33334a;margin:4px 2px}
.ed-eltb input{height:30px;background:#0b0b14;border:1px solid #33334a;border-radius:7px;color:#fff;padding:0 8px;font:13px Inter,sans-serif;width:200px;outline:none}
.ed-stage .ed-editing,.ed-stage .ed-editing *{cursor:text!important;user-select:text!important;-webkit-user-select:text!important}
.ed-stage .ed-editing{outline:calc(2px * var(--ik,1)) solid #22d3ee!important}
.ed-stage .ed-editing [contenteditable]{outline:none}
.ed-hint{position:absolute;left:50%;top:72px;transform:translateX(-50%);background:#111120ee;border:1px solid var(--ui-line);border-radius:99px;padding:8px 16px;font-size:12.5px;color:#cfcfe6;pointer-events:none;z-index:5;white-space:nowrap}

<body>
<div id="app"></div>
<script>
/* =====================================================================
   Webescapade Site Builder — shared renderer (used by builder + viewer)
   Data model:
   site = { v, name, theme:{palette, colors{bg,surface,text,muted,accent,accent2,onaccent},
            fonts{head,body}, radius}, settings:{title,description},
            header:Section|null, footer:Section|null, pages:[{id,name,slug,sections:[Section]}] }
   Section = { id, name, anchor, h, mh, mcustom, sticky, overlay, bg:{...}, els:[El] }
   El = { id, t, x,y,w,h, z, s:{style}, c:content, m:{x,y,w,h,hide,size}|null, a:{type,delay,dur} }
   Desktop canvas is 1200 wide, mobile canvas 390 wide. Both are scaled with CSS zoom.
   ===================================================================== */
(function (global) {
  'use strict';
  const WB = {};
  const DESK = 1200, MOB = 390, BREAK = 760, PAD = 20;
  WB.DESK = DESK; WB.MOB = MOB; WB.BREAK = BREAK;

  /* ---------- small helpers ---------- */
  const uid = (p) => (p || 'e') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const num = (v, min, max, d) => { v = Number(v); if (!isFinite(v)) return d; return Math.min(max, Math.max(min, v)); };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  WB.uid = uid; WB.num = num; WB.esc = esc; WB.clone = clone;

  /* ---------- themes ---------- */
  WB.TOKENS = ['bg', 'surface', 'text', 'muted', 'accent', 'accent2', 'onaccent'];
  WB.PALETTES = {
    midnight:   { label: 'Midnight',   bg: '#0b0b1a', surface: '#16162e', text: '#f4f3ff', muted: '#a9a8c8', accent: '#8b5cf6', accent2: '#22d3ee', onaccent: '#ffffff' },
    noir:       { label: 'Noir & Gold',bg: '#0e0d0c', surface: '#1a1917', text: '#f5efe6', muted: '#a39b8f', accent: '#d4af37', accent2: '#8c6d3f', onaccent: '#111111' },
    ivory:      { label: 'Ivory',      bg: '#fbf8f2', surface: '#ffffff', text: '#1f1b16', muted: '#6f665a', accent: '#b08d57', accent2: '#2f4b3a', onaccent: '#ffffff' },
    terracotta: { label: 'Terracotta', bg: '#fbf4ee', surface: '#ffffff', text: '#2b1d17', muted: '#7a6257', accent: '#c0583b', accent2: '#e3a63b', onaccent: '#ffffff' },
    sage:       { label: 'Sage',       bg: '#f3f5ef', surface: '#ffffff', text: '#243127', muted: '#66756a', accent: '#6b8f71', accent2: '#c9a27e', onaccent: '#ffffff' },
    blush:      { label: 'Blush',      bg: '#fff6f6', surface: '#ffffff', text: '#3a2430', muted: '#8a6b78', accent: '#d16d8e', accent2: '#7c5c9e', onaccent: '#ffffff' },
    ocean:      { label: 'Ocean',      bg: '#f2f7fb', surface: '#ffffff', text: '#0f2233', muted: '#5a7184', accent: '#0e7490', accent2: '#f59e0b', onaccent: '#ffffff' },
    forest:     { label: 'Forest',     bg: '#0f1a14', surface: '#17261d', text: '#eef5ee', muted: '#9fb3a5', accent: '#7fc29b', accent2: '#e8c07a', onaccent: '#0f1a14' },
    mono:       { label: 'Mono',       bg: '#ffffff', surface: '#f4f4f5', text: '#111111', muted: '#6b6b6b', accent: '#111111', accent2: '#ef4444', onaccent: '#ffffff' }
  };
  WB.FONTS = {
    'Inter': 'Inter:wght@300;400;500;600;700',
    'DM Sans': 'DM+Sans:wght@400;500;700',
    'Poppins': 'Poppins:wght@300;400;500;600;700',
    'Montserrat': 'Montserrat:wght@300;400;500;600;700',
    'Raleway': 'Raleway:wght@300;400;500;600;700',
    'Outfit': 'Outfit:wght@300;400;500;600;700',
    'Space Grotesk': 'Space+Grotesk:wght@400;500;700',
    'Josefin Sans': 'Josefin+Sans:wght@300;400;600',
    'Bebas Neue': 'Bebas+Neue',
    'Playfair Display': 'Playfair+Display:ital,wght@0,400;0,600;0,700;1,400',
    'Cormorant Garamond': 'Cormorant+Garamond:ital,wght@0,400;0,600;1,400',
    'DM Serif Display': 'DM+Serif+Display:ital@0;1',
    'Fraunces': 'Fraunces:ital,wght@0,400;0,600;1,400',
    'Lora': 'Lora:ital,wght@0,400;0,600;1,400',
    'Great Vibes': 'Great+Vibes'
  };
  const SERIF = ['Playfair Display', 'Cormorant Garamond', 'DM Serif Display', 'Fraunces', 'Lora'];
  const fallback = (f) => SERIF.includes(f) ? 'Georgia, serif' : (f === 'Great Vibes' ? 'cursive' : 'system-ui, sans-serif');
  WB.FONT_PAIRS = {
    classic:   { label: 'Classic',   head: 'Playfair Display', body: 'Inter' },
    elegant:   { label: 'Elegant',   head: 'Cormorant Garamond', body: 'Raleway' },
    editorial: { label: 'Editorial', head: 'DM Serif Display', body: 'DM Sans' },
    modern:    { label: 'Modern',    head: 'Space Grotesk', body: 'Inter' },
    bold:      { label: 'Bold',      head: 'Bebas Neue', body: 'Montserrat' },
    friendly:  { label: 'Friendly',  head: 'Poppins', body: 'Poppins' },
    fresh:     { label: 'Fresh',     head: 'Outfit', body: 'Outfit' },
    warm:      { label: 'Warm',      head: 'Fraunces', body: 'DM Sans' }
  };

  /* ---------- safety: colours, links, images, rich text ---------- */
  function color(c, d) {
    if (c == null || c === '') return d || '';
    c = String(c).trim();
    if (c[0] === '@') { const t = c.slice(1); return WB.TOKENS.includes(t) ? 'var(--c-' + t + ')' : (d || ''); }
    if (/^#[0-9a-f]{3,8}$/i.test(c)) return c;
    if (/^rgba?\(\s*[\d.]+%?\s*,\s*[\d.]+%?\s*,\s*[\d.]+%?\s*(,\s*[\d.]+\s*)?\)$/i.test(c)) return c;
    if (c === 'transparent') return c;
    return d || '';
  }
  WB.color = color;
  function alpha(c, a) { // colour with opacity using color-mix (works for tokens and hex)
    const base = color(c, '#000000');
    return 'color-mix(in srgb, ' + base + ' ' + Math.round(num(a, 0, 1, 1) * 100) + '%, transparent)';
  }
  function safeHref(u) {
    if (!u) return '';
    u = String(u).trim();
    if (/^(https?:|mailto:|tel:)/i.test(u)) return u.replace(/[\s"'<>]/g, encodeURIComponent);
    if (/^#[\w-]*$/.test(u)) return u;
    if (/^page:[a-z0-9-]*$/.test(u)) return u;
    if (/^[\w.-]+\.[a-z]{2,}(\/[^\s"'<>]*)?$/i.test(u)) return 'https://' + u;
    return '';
  }
  function safeImg(u) {
    if (!u) return '';
    u = String(u).trim();
    if (/^https:\/\/[^\s"'<>()\\]+$/i.test(u)) return u;
    if (/^data:image\/(png|jpe?g|webp|gif);base64,[a-z0-9+/=]+$/i.test(u)) return u;
    return '';
  }
  WB.safeHref = safeHref; WB.safeImg = safeImg;
  const cssUrl = (u) => 'url("' + u.replace(/["\\\n\r]/g, '') + '")';

  const ALLOWED = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1, A: 1, SPAN: 1, DIV: 1, P: 1 };
  const DROP = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|SVG|MATH|LINK|META|NOSCRIPT|TEXTAREA|SELECT|IMG|VIDEO|AUDIO|FORM|INPUT|BUTTON)$/i;
  function sanitize(html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = String(html == null ? '' : html);
    (function walk(node) {
      Array.from(node.childNodes).forEach((ch) => {
        if (ch.nodeType === 3) return;
        if (ch.nodeType !== 1) { ch.remove(); return; }
        if (DROP.test(ch.tagName)) { ch.remove(); return; }
        walk(ch);
        if (!ALLOWED[ch.tagName.toUpperCase()]) { ch.replaceWith(...Array.from(ch.childNodes)); return; }
        Array.from(ch.attributes).forEach((a) => { if (!(ch.tagName === 'A' && a.name === 'href')) ch.removeAttribute(a.name); });
        if (ch.tagName === 'A') { const h = safeHref(ch.getAttribute('href')); if (h) ch.setAttribute('href', h); else ch.removeAttribute('href'); }
      });
    })(tpl.content);
    return tpl.innerHTML;
  }
  WB.sanitize = sanitize;

  function videoEmbed(url, auto) {
    if (!url) return '';
    url = String(url).trim();
    let m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/i);
    if (m) {
      const q = auto ? '?autoplay=1&mute=1&loop=1&playlist=' + m[1] + '&controls=0&rel=0&playsinline=1' : '?rel=0';
      return 'https://www.youtube-nocookie.com/embed/' + m[1] + q;
    }
    m = url.match(/vimeo\.com\/(?:video\/)?(\d{5,12})/i);
    if (m) return 'https://player.vimeo.com/video/' + m[1] + (auto ? '?autoplay=1&muted=1&loop=1&background=1' : '');
    return '';
  }
  WB.videoEmbed = videoEmbed;

  /* ---------- theme css ---------- */
  function themeVars(theme) {
    theme = theme || {};
    const p = WB.PALETTES[theme.palette] || WB.PALETTES.midnight;
    const cols = Object.assign({}, p, theme.colors || {});
    const f = theme.fonts || {};
    const head = WB.FONTS[f.head] ? f.head : 'Playfair Display';
    const body = WB.FONTS[f.body] ? f.body : 'Inter';
    const out = WB.TOKENS.map((t) => '--c-' + t + ':' + (color(cols[t]) || p[t]));
    out.push("--f-head:'" + head + "'," + fallback(head));
    out.push("--f-body:'" + body + "'," + fallback(body));
    out.push('--radius:' + num(theme.radius, 0, 40, 12) + 'px');
    return out.join(';');
  }
  WB.themeVars = themeVars;

  function fontVar(f) {
    if (f === 'head') return 'var(--f-head)';
    if (!f || f === 'body') return 'var(--f-body)';
    if (WB.FONTS[f]) return "'" + f + "'," + fallback(f);
    return 'var(--f-body)';
  }
  WB.loadFonts = function (site, doc) {
    doc = doc || document;
    const set = new Set();
    const th = (site.theme && site.theme.fonts) || {};
    set.add(WB.FONTS[th.head] ? th.head : 'Playfair Display');
    set.add(WB.FONTS[th.body] ? th.body : 'Inter');
    allSections(site).forEach((sec) => (sec.els || []).forEach((el) => { const f = el.s && el.s.font; if (f && WB.FONTS[f]) set.add(f); }));
    const href = 'https://fonts.googleapis.com/css2?' + Array.from(set).map((f) => 'family=' + WB.FONTS[f]).join('&') + '&display=swap';
    let link = doc.getElementById('wb-fonts');
    if (!link) { link = doc.createElement('link'); link.id = 'wb-fonts'; link.rel = 'stylesheet'; doc.head.appendChild(link); }
    if (link.href !== href) link.href = href;
  };

  function allSections(site) {
    const out = [];
    if (site.header) out.push(site.header);
    (site.pages || []).forEach((p) => (p.sections || []).forEach((s) => out.push(s)));
    if (site.footer) out.push(site.footer);
    return out;
  }
  WB.allSections = allSections;

  /* ---------- normalising (keeps saved data safe & complete) ---------- */
  WB.EL_TYPES = ['heading', 'text', 'button', 'image', 'shape', 'line', 'video', 'map', 'form', 'nav', 'social'];
  function normEl(el) {
    if (!el || WB.EL_TYPES.indexOf(el.t) < 0) return null;
    el.id = el.id || uid('e');
    el.x = num(el.x, -600, 1800, 40); el.y = num(el.y, -400, 6000, 40);
    el.w = num(el.w, 4, 2400, 300); el.h = num(el.h, 1, 4000, 60);
    el.z = num(el.z, 0, 999, 1);
    el.s = el.s && typeof el.s === 'object' ? el.s : {};
    if (el.c == null) el.c = el.t === 'image' ? {} : '';
    if (el.m && typeof el.m === 'object') {
      ['x', 'y', 'w', 'h'].forEach((k) => { if (el.m[k] != null) el.m[k] = num(el.m[k], -400, 3000, 0); });
    } else el.m = null;
    el.a = el.a && typeof el.a === 'object' ? el.a : { type: 'none' };
    return el;
  }
  function normSection(sec) {
    if (!sec || typeof sec !== 'object') return null;
    sec.id = sec.id || uid('s');
    sec.name = sec.name || 'Section';
    sec.h = num(sec.h, 40, 4000, 500);
    sec.mh = sec.mh == null ? null : num(sec.mh, 40, 8000, 500);
    sec.mcustom = !!sec.mcustom && sec.mh != null;
    sec.bg = sec.bg && typeof sec.bg === 'object' ? sec.bg : { type: 'color', color: '@bg' };
    sec.els = (Array.isArray(sec.els) ? sec.els : []).map(normEl).filter(Boolean);
    return sec;
  }
  WB.normSection = normSection; WB.normEl = normEl;
  WB.normalizeSite = function (site) {
    site = site && typeof site === 'object' ? site : {};
    site.v = 1;
    site.name = site.name || 'My website';
    site.theme = site.theme || {};
    if (!WB.PALETTES[site.theme.palette]) site.theme.palette = 'midnight';
    site.theme.colors = Object.assign({}, WB.PALETTES[site.theme.palette], site.theme.colors || {});
    delete site.theme.colors.label;
    site.theme.fonts = site.theme.fonts || { head: 'Playfair Display', body: 'Inter' };
    site.theme.radius = num(site.theme.radius, 0, 40, 12);
    site.settings = site.settings || {};
    site.header = site.header ? normSection(site.header) : null;
    site.footer = site.footer ? normSection(site.footer) : null;
    site.pages = (Array.isArray(site.pages) && site.pages.length ? site.pages : [{ name: 'Home', slug: '', sections: [] }]).map((p, i) => {
      p.id = p.id || uid('p');
      p.name = p.name || (i ? 'Page ' + (i + 1) : 'Home');
      p.slug = i === 0 ? '' : String(p.slug || p.name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || ('page-' + (i + 1));
      p.sections = (Array.isArray(p.sections) ? p.sections : []).map(normSection).filter(Boolean);
      return p;
    });
    return site;
  };

  /* ---------- mobile automatic layout ---------- */
  function autoMSize(s) {
    s = num(s, 8, 200, 18);
    if (s >= 56) return Math.round(Math.max(32, s * 0.58));
    if (s >= 36) return Math.round(s * 0.72);
    if (s >= 24) return Math.round(s * 0.85);
    return s;
  }
  WB.mobileSize = (el) => (el.m && el.m.size) ? num(el.m.size, 8, 200, 16) : autoMSize(el.s && el.s.size);

  const box = (el) => ({ x: el.x, y: el.y, w: el.w, h: el.h, r: el.x + el.w, b: el.y + el.h });
  function inside(a, b) { // fraction of a inside b
    const ix = Math.max(0, Math.min(a.r, b.r) - Math.max(a.x, b.x));
    const iy = Math.max(0, Math.min(a.b, b.b) - Math.max(a.y, b.y));
    return (ix * iy) / Math.max(1, a.w * a.h);
  }
  // Build a tree: shapes that contain other elements become "cards" (groups)
  function buildNodes(els) {
    const items = els.map((el) => ({ el, bx: box(el), kids: null }));
    const shapes = items.filter((n) => n.el.t === 'shape' && n.bx.w >= 150 && n.bx.h >= 90).sort((a, b) => b.bx.w * b.bx.h - a.bx.w * a.bx.h);
    const owner = new Map();
    shapes.forEach((sh) => {
      items.forEach((n) => {
        if (n === sh || owner.has(n)) return;
        if (n.el.t === 'shape' && n.bx.w * n.bx.h >= sh.bx.w * sh.bx.h) return;
        if (inside(n.bx, sh.bx) > 0.8) owner.set(n, sh);
      });
    });
    // resolve to the closest (smallest) owning shape
    items.forEach((n) => {
      let best = null;
      shapes.forEach((sh) => {
        if (sh === n) return;
        if (n.el.t === 'shape' && n.bx.w * n.bx.h >= sh.bx.w * sh.bx.h) return;
        if (inside(n.bx, sh.bx) > 0.8 && (!best || sh.bx.w * sh.bx.h < best.bx.w * best.bx.h)) best = sh;
      });
      if (best) owner.set(n, best); else owner.delete(n);
    });
    const roots = [];
    items.forEach((n) => {
      const o = owner.get(n);
      if (o) { (o.kids = o.kids || []).push(n); } else roots.push(n);
    });
    return roots;
  }
  function cut(nodes, axis) { // split into groups separated by a clear gap along axis
    const k1 = axis === 'x' ? 'x' : 'y', k2 = axis === 'x' ? 'r' : 'b';
    const s = nodes.slice().sort((a, b) => a.bx[k1] - b.bx[k1]);
    const groups = []; let cur = [], end = -Infinity;
    s.forEach((n) => {
      if (cur.length && n.bx[k1] >= end - 2) { groups.push(cur); cur = []; end = -Infinity; }
      cur.push(n); end = Math.max(end, n.bx[k2]);
    });
    if (cur.length) groups.push(cur);
    return groups;
  }
  function balanced(groups) {
    if (groups.length < 2) return false;
    const ws = groups.map((g) => Math.max(...g.map((n) => n.bx.r)) - Math.min(...g.map((n) => n.bx.x)));
    const mx = Math.max(...ws), mn = Math.min(...ws);
    return mn >= 160 && mn / mx >= 0.55;
  }
  function order(nodes) { // recursive XY-cut reading order
    if (nodes.length <= 1) return nodes;
    const cols = cut(nodes, 'x');
    if (balanced(cols)) return [].concat(...cols.map(order));
    const rows = cut(nodes, 'y');
    if (rows.length > 1) {
      // merge runs of rows that share the same column structure (e.g. photo / name / role in 3 columns)
      const out = []; let i = 0;
      while (i < rows.length) {
        let best = i;
        for (let j = i + 1; j < rows.length; j++) {
          const uni = [].concat(...rows.slice(i, j + 1));
          if (balanced(cut(uni, 'x'))) best = j;
        }
        if (best > i) { const uni = [].concat(...rows.slice(i, best + 1)); out.push(...[].concat(...cut(uni, 'x').map(order))); }
        else out.push(...order(rows[i]));
        i = best + 1;
      }
      return out;
    }
    if (cols.length > 1) return [].concat(...cols.map(order));
    return nodes.slice().sort((a, b) => (a.bx.y - b.bx.y) || (a.bx.x - b.bx.x));
  }
  const FULL = { heading: 1, text: 1, form: 1, nav: 1, video: 1, map: 1, line: 1 };
  function flowSize(el, avail) {
    let w, h = el.h;
    if (FULL[el.t]) w = avail;
    else if (el.t === 'image') w = el.w >= 240 ? avail : Math.min(avail, el.w);
    else w = Math.min(avail, el.w);

  function modal(html, opts) {

  function confirmBox(title, text, okLabel, danger) {
    return new Promise((res) => {

  function promptBox(title, label, value, okLabel) {
    return new Promise((res) => {
      const m = modal('<h2>' + esc(title) + '</h2><label class="field"><span>' + esc(label) + '</span><input class="inp" value="' + esc(value || '') + '"></label><div class="acts"><button class="btn ghost" data-x>Cancel</button><button class="btn pri" data-ok>' + esc(okLabel || 'OK') + '</button></div>', { onClose: () => res(null) });

      $('[data-x]', m).onclick = () => m.close();
      $('[data-ok]', m).onclick = ok;
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok(); });

  }
  const slugify = (s) => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 42);
  const RESERVED = ['admin', 'www', 'api', 'app', 'builder', 'login', 'webescapade', 'restaurant', 'service', 'sites', 'site', 'help', 'support'];
  function slugError(s) {
    if (!/^[a-z0-9](?:[a-z0-9-]{1,40}[a-z0-9])$/.test(s)) return 'Use 3–42 lowercase letters, numbers or dashes (no dash at the start or end).';
    if (RESERVED.indexOf(s) >= 0) return 'That address is reserved — please choose another.';
    return '';
  }

  /* ---------------- storage (Supabase or this browser) ---------------- */
  const LOCAL = !(CFG.supabaseUrl && CFG.supabaseKey) || !window.supabase;
  let sb = null, user = null;
  if (!LOCAL) sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  const nowIso = () => new Date().toISOString();
  const blobToDataURL = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
  function friendly(e) {
    const m = (e && e.message) || String(e);
    if (/duplicate key|slug_key/i.test(m)) return new Error('That web address is already taken — please try another.');
    if (/slug.*check|check constraint/i.test(m)) return new Error('Web address can only use lowercase letters, numbers and dashes.');
    if (/site limit/i.test(m)) return new Error('You have reached the maximum of ' + CFG.maxSites + ' websites.');
    if (/Failed to fetch|NetworkError/i.test(m)) return new Error('No connection — check your internet and try again.');
    if (/JWT|not authenticated|401/i.test(m)) return new Error('Your session expired — please sign in again.');
    return new Error(m);
  }
  const Store = LOCAL ? (function () {
    const K = 'wb.sites', key = (id) => 'wb.site.' + id;
    const idx = () => { try { return JSON.parse(localStorage.getItem(K)) || []; } catch (e) { return []; } };
    const write = (r) => {
      try { localStorage.setItem(key(r.id), JSON.stringify(r)); } catch (e) { throw new Error('This browser’s storage is full. Remove some large photos, or connect online saving.'); }

      mode: 'local',
      async list() { return idx().sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at))); },

  /* ---------------- image compression ---------------- */
  function compressImage(file, maxDim) {
    return new Promise((res, rej) => {
      if (!/^image\//.test(file.type)) return rej(new Error('Please choose an image file.'));
      if (file.type === 'image/gif' && file.size < 2.5e6) return res({ blob: file, ext: 'gif' });
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        try {
          const md = maxDim || 1800;
          const sc = Math.min(1, md / Math.max(im.naturalWidth, im.naturalHeight));
          const w = Math.round(im.naturalWidth * sc), h = Math.round(im.naturalHeight * sc);
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const cx = cv.getContext('2d');
          const png = file.type === 'image/png' && file.size < 1.5e6;
          if (!png) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); }
          cx.drawImage(im, 0, 0, w, h);
          URL.revokeObjectURL(url);
          cv.toBlob((b) => b ? res({ blob: b, ext: png ? 'png' : 'jpg' }) : rej(new Error('Could not process that image.')), png ? 'image/png' : 'image/jpeg', 0.8);
        } catch (e) { rej(e); }
      };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That image format could not be opened. Try a JPG or PNG.')); };
      im.src = url;
    });
  }

      try {
        const c = await compressImage(f, maxDim);

        urls.push(await Store.upload(c.blob, c.ext));
      } catch (e) { toast(e.message || 'Upload failed', 'bad', 5000); }
      t.remove();
    }
    return urls;
  }

  async function showDashboard() {

      [['add', 'Add', 'plus'], ['sections', 'Sections', 'layers'], ['theme', 'Theme', 'palette'], ['pages', 'Pages', 'pages'], ['settings', 'Site', 'gear']].map((t) => '<button data-tab="' + t[0] + '">' + I(t[2]) + t[1] + '</button>').join('') +

    const cv = $('#cv', root), stage = $('#stage', root), mount = $('#mount', root), insp = $('#insp', root), lpane = $('#l-pane', root);

    /* ---------- data helpers ---------- */
    const page = () => S.site.pages.find((p) => p.id === S.pageId) || S.site.pages[0];
    const W = () => (S.device === 'mobile' ? WB.MOB : WB.DESK);
    function sections() {

      page().sections.forEach((s) => out.push({ sec: s, where: 'page' }));

    }
    function findSec(id) { const r = sections().find((x) => x.sec.id === id); return r ? r.sec : null; }
    function findEl(id) {
      for (const { sec } of sections()) { const el = sec.els.find((e) => e.id === id); if (el) return { el, sec }; }
      return null;
    }
    const isFlow = (sec) => S.device === 'mobile' && !sec.mcustom;
    function geom(el, sec) {

    function setGeom(el, sec, g) {

      else { el.m = el.m || {}; ['x', 'y', 'w', 'h'].forEach((k) => { if (g[k] != null) el.m[k] = r(g[k]); }); }
    }
    function ensureMGeom(el, sec) {

      const ratio = (WB.MOB - 40) / WB.DESK;
      const w = Math.min(WB.MOB - 40, Math.max(40, el.t === 'heading' || el.t === 'text' ? WB.MOB - 40 : el.w * ratio * 1.8));
      const h = el.t === 'image' || el.t === 'shape' ? Math.round(el.h * (w / el.w)) : Math.max(el.h * 0.7, 20);

    function redo() { exitEdit(true); if (!S.fut.length) return; S.hist.push(snap()); S.site = JSON.parse(S.fut.pop()); afterRestore(); }
    function afterRestore() {

    function markDirty() { S.dirty = true; setStatus('Unsaved changes'); clearTimeout(S.saveTimer); S.saveTimer = setTimeout(saveNow, 1200); }

    async function saveNow() {

      if (!S.dirty) return;

        const r = await Store.save(S.row.id, { draft: S.site, name: S.site.name });

    const onUnload = (e) => { if (S.dirty || S.saving) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', onUnload);

    /* ---------- rendering ---------- */
    function render(opts) {

      renderInspector();

    function computeK() {
      if (S.device === 'mobile') return 1;
      if (S.zoom === 'fit') return Math.max(0.3, Math.min(1, (cv.clientWidth - 56) / WB.DESK));
      return parseFloat(S.zoom) || 1;
    }
    function renderCanvas() {
      if (S.runtime) { S.runtime(); S.runtime = null; }
      const k = S.k = computeK();
      const w = W() * k;
      stage.style.width = w + 'px';
      stage.style.setProperty('--ik', 1 / k);
      stage.classList.toggle('phone', S.device === 'mobile');

        WB.renderPage(S.site, page(), mount, { editor: true, device: S.device, k, width: w, pageHref: () => '#' });
      } catch (e) { console.error(e); mount.innerHTML = '<p style="padding:30px;color:#f87171">This page could not be drawn. Use Undo to go back.</p>'; }
      cv.scrollTop = sTop;

    }
    function decorate() {
      $$('.wb-sec', mount).forEach((n) => {
        const sec = findSec(n.dataset.id); if (!sec) return;

        const bar = frag('<div class="ed-secbar"><span>' + esc(sec.name) + '</span>' + (where ? '<em>ALL PAGES</em>' : '') +
          (isFlow(sec) ? '<em>AUTO</em>' : (S.device === 'mobile' ? '<em>CUSTOM</em>' : '')) +

        if (S.sel && (S.sel.sec === sec.id || (S.sel.el && sec.els.some((e) => e.id === S.sel.el)))) n.classList.add('ed-on');
      });
    }
    function nodeFor(id) { return mount.querySelector('.wb-el[data-id="' + id + '"]') || mount.querySelector('.wb-fg[data-id="' + id + '"]'); }
    function kOf(inn) { return inn.getBoundingClientRect().width / (inn.classList.contains('wb-flow') || S.device === 'mobile' ? WB.MOB : WB.DESK) || S.k; }
    function drawSel() {

      if (!f || !node) return;
      const inn = node.closest('.wb-in'); const k = kOf(inn);

      const flow = !g;

      } else if (f.el.t === 'heading' || f.el.t === 'text' || f.el.t === 'form') {

      sel.style.cssText = 'left:' + g.x + 'px;top:' + g.y + 'px;width:' + g.w + 'px;height:' + g.h + 'px';

      const t = f.el.t;
      const tb = frag('<div class="ed-eltb">' +
        (t === 'heading' || t === 'text' || t === 'button' ? '<button data-ea="edit">' + I('edit') + 'Edit text</button>' : '') +
        (t === 'image' ? '<button data-ea="img">' + I('image') + 'Replace</button>' : '') +
        '<button data-ea="dup" title="Duplicate (⌘D)">' + I('copy') + '</button><button data-ea="front" title="Bring forward">' + I('front') + '</button><button data-ea="back" title="Send backward">' + I('back2') + '</button>' +

    /* ---------- selection ---------- */
    function select(sel) {

    /* ---------- mobile: switch a section from automatic to custom layout ---------- */
    function toCustom(sec) {

      $('#t-name', root).textContent = S.site.name;
      const ps = $('#t-page', root);
      ps.innerHTML = S.site.pages.map((p) => '<option value="' + p.id + '"' + (p.id === S.pageId ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
      $$('[data-dev]', root).forEach((b) => b.classList.toggle('on', b.dataset.dev === S.device));
      $('[data-a="undo"]', root).disabled = !S.hist.length;
      $('[data-a="redo"]', root).disabled = !S.fut.length;
      $('[data-a="snap"]', root).classList.toggle('on', S.snap);
      $('#t-zoom', root).value = S.zoom;
      $('#t-zoom', root).disabled = S.device === 'mobile';
    }
    $('.ed-top', root).addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.dev) { if (S.device !== b.dataset.dev) { exitEdit(true); S.device = b.dataset.dev; render(); if (S.device === 'mobile' && !S.mobHint) { S.mobHint = 1; hint('Phone view: items stack automatically. Drag anything to arrange a section by hand.'); } } return; }
      const a = b.dataset.a;
      if (a === 'back') { saveNow().then(() => showDashboard()); }
      if (a === 'undo') undo();
      if (a === 'redo') redo();
      if (a === 'snap') { S.snap = !S.snap; updateTop(); }
      if (a === 'preview') openPreview();
      if (a === 'publish') publish();
      if (a === 'toggleLeft') root.classList.toggle('show-left');
      if (a === 'toggleRight') root.classList.toggle('show-right');
    });
    $('#t-page', root).addEventListener('change', (e) => { S.pageId = e.target.value; S.sel = null; cv.scrollTop = 0; render({ left: true }); });
    $('#t-zoom', root).addEventListener('change', (e) => { S.zoom = e.target.value; renderCanvas(); });
    function hint(t) { const n = frag('<div class="ed-hint">' + esc(t) + '</div>'); root.appendChild(n); n.style.position = 'fixed'; setTimeout(() => n.remove(), 5000); }

    /* ---------- preview ---------- */
    function openPreview() {
      exitEdit(true);
      let dev = S.device, pid = S.pageId, stop = null;
      const ov = frag('<div class="prev"><div class="prev-bar"><div class="logo"><i></i>Preview</div><select class="sel-sm" id="pv-page"></select><div class="seg"><button data-pd="desktop">' + I('desk') + 'Desktop</button><button data-pd="mobile">' + I('phone') + 'Phone</button></div><button class="btn sm" id="pv-replay">↻ Replay animations</button><div class="sp"></div><button class="btn sm pri" id="pv-x">Close preview</button></div><div class="prev-scroll"><div class="prev-frame"></div></div></div>');
      document.body.appendChild(ov);
      const sc = $('.prev-scroll', ov), fr = $('.prev-frame', ov);
      const draw = () => {
        if (stop) stop();
        $('#pv-page', ov).innerHTML = S.site.pages.map((p) => '<option value="' + p.id + '"' + (p.id === pid ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
        $$('[data-pd]', ov).forEach((b) => b.classList.toggle('on', b.dataset.pd === dev));
        fr.classList.toggle('phone', dev === 'mobile');
        const w = dev === 'mobile' ? 390 : sc.clientWidth;
        fr.style.width = w + 'px';
        const pg = S.site.pages.find((p) => p.id === pid) || S.site.pages[0];
        WB.renderPage(S.site, pg, fr, { device: dev, width: w, pageHref: (slug) => '#wbp:' + slug, onSubmit: () => new Promise((r) => setTimeout(r, 500)) });
        const scroller = dev === 'mobile' ? fr : sc;
        scroller.scrollTop = 0;
        stop = WB.activate(fr.firstElementChild, { scroller });
      };
      fr.addEventListener('click', (e) => {
        const a = e.target.closest('a[href]'); if (!a) return;
        const href = a.getAttribute('href');
        if (href.indexOf('#wbp:') === 0) { e.preventDefault(); const p = S.site.pages.find((x) => x.slug === href.slice(5)); if (p) { pid = p.id; draw(); } }
        else if (href[0] === '#') { e.preventDefault(); const t = fr.querySelector(href); if (t) t.scrollIntoView({ behavior: 'smooth' }); }
      });
      $('#pv-page', ov).onchange = (e) => { pid = e.target.value; draw(); };
      $$('[data-pd]', ov).forEach((b) => { b.onclick = () => { dev = b.dataset.pd; draw(); }; });
      $('#pv-replay', ov).onclick = draw;
      const close = () => { if (stop) stop(); ov.remove(); document.removeEventListener('keydown', key); };
      const key = (e) => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', key);
      $('#pv-x', ov).onclick = close;
      WB.loadFonts(S.site);
      draw();
    }

    /* ---------- publish ---------- */
    async function publish() {
      exitEdit(true);
      const btn = $('[data-a="publish"]', root); btn.disabled = true;
      try {
        S.dirty = true; await saveNow();
        const r = await Store.publish(S.row.id, S.site);
        S.row = Object.assign(S.row, r);
        const url = Store.viewUrl(S.row);
        const m = modal('<h2>🎉 Your website is live</h2><p class="muted">Every time you make changes, press Publish again to update the live site.</p><label class="field"><span>Your link</span><input class="inp" readonly value="' + esc(LOCAL ? '(demo mode — opens in this browser only)' : url) + '"></label><div class="acts"><button class="btn ghost" data-x>Close</button>' + (LOCAL ? '' : '<button class="btn" data-copy>Copy link</button>') + '<a class="btn pri" target="_blank" href="' + esc(url) + '">' + I('ext') + 'Open site</a></div>');
        $('[data-x]', m).onclick = () => m.close();
        const cp = $('[data-copy]', m); if (cp) cp.onclick = () => { navigator.clipboard.writeText(url).then(() => toast('Link copied', 'ok')); };
        if (S.tab === 'settings') renderLeft();
      } catch (e) { toast(e.message || 'Publishing failed', 'bad', 6000); }
      btn.disabled = false;
    }

    /* ---------- keyboard ---------- */
    function onKey(e) {
      if ($('.modal-bg') || $('.prev')) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (S.editing || tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
      if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); return redo(); }
      if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); S.dirty = true; return saveNow(); }
      const f = S.sel && S.sel.el ? findEl(S.sel.el) : null;
      if (mod && e.key.toLowerCase() === 'c' && f) { S.clip = clone(f.el); toast('Copied'); return; }
      if (mod && e.key.toLowerCase() === 'v' && S.clip) { const sec = curSec() || targetSection(); if (sec) { e.preventDefault(); duplicateEl(S.clip, sec); } return; }
      if (mod && e.key.toLowerCase() === 'd' && f) { e.preventDefault(); return duplicateEl(f.el, f.sec); }
      if ((e.key === 'Delete' || e.key === 'Backspace') && f) { e.preventDefault(); return elementAction('del', f.el.id); }
      if (e.key === 'Escape') { return select(null); }
      if (e.key === 'Enter' && f && ['heading', 'text', 'button'].indexOf(f.el.t) >= 0) { e.preventDefault(); return enterEdit(f.el.id); }
      if (f && /^Arrow/.test(e.key)) {
        const g = geom(f.el, f.sec); if (!g) return;
        e.preventDefault();
        const st = e.shiftKey ? 10 : 1;
        const d = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key];
        change(() => setGeom(f.el, f.sec, { x: g.x + d[0], y: g.y + d[1] }));
      }
    }
    document.addEventListener('keydown', onKey);
    let rT = null;
    const onResize = () => { clearTimeout(rT); rT = setTimeout(() => { if (!drag) renderCanvas(); }, 150); };
    window.addEventListener('resize', onResize);

    destroyEditor = () => {
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('beforeunload', onUnload);
      if (S.runtime) S.runtime();
      $$('.ed-pop').forEach((n) => n.remove());
      if (S.dirty) saveNow();
    };
    // expose a tiny handle for automated checks
    window.__wbEditor = { S, render, select, addElement, insertSection, undo, redo, findEl, saveNow, toCustom, change };
    S.tab = 'add';
    render({ left: true });
    setStatus(S.row.published_at ? 'Saved · live' : 'Saved · draft');
  }

  /* ---------------- boot ---------------- */
  async function boot() {
    if (LOCAL) { route(); return; }
    try {
      const { data } = await sb.auth.getSession();
      user = data.session && data.session.user;
    } catch (e) { user = null; }
    sb.auth.onAuthStateChange((ev, session) => {
      const had = !!user; user = session && session.user;
      if (!had && user) route();
      if (had && !user) showAuth();
    });
    user ? route() : showAuth();
  }
  function route() {
    const m = location.hash.match(/edit=([\w-]+)/);
    if (m) openEditor(m[1]); else showDashboard();
  }
  window.addEventListener('error', (e) => { console.error(e.error || e.message); });
  boot();
})();

</script>
</body>
</html>
