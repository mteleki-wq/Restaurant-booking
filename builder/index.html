<style>
:root{--ui-bg:#0d0d16;--ui-p:#14141f;--ui-p2:#1b1b29;--ui-line:#2a2a3c;--ui-t:#ececf6;--ui-m:#9a99b4;--ui-a:#8b5cf6;--ui-a2:#22d3ee;--ui-ok:#34d399;--ui-bad:#f87171;--ui-grad:linear-gradient(120deg,#8b5cf6,#3b82f6 55%,#22d3ee)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-t);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ui-a2)}
.hide{display:none!important}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--ui-p2);color:var(--ui-t);font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s,transform .15s,opacity .2s;white-space:nowrap}
.btn:hover{background:#262638}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ui-grad);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line)}
.btn.danger{background:#3a1d24;color:#fecaca}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12px;font-weight:600;color:var(--ui-m);text-transform:uppercase;letter-spacing:.6px}
.inp{width:100%;background:#0f0f19;border:1px solid var(--ui-line);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--ui-a)}
.muted{color:var(--ui-m)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--ui-grad);display:inline-block;box-shadow:0 0 24px #8b5cf655}
/* toast + modal */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1f1f30;border:1px solid var(--ui-line);padding:11px 18px;border-radius:12px;box-shadow:0 12px 40px #0008;animation:tIn .3s ease;font-weight:500;pointer-events:auto}
.toast.ok{border-color:#2f6f57}.toast.bad{border-color:#7a2f3a}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}}
.modal-bg{position:fixed;inset:0;background:#05050ccc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px;animation:fIn .2s}
@keyframes fIn{from{opacity:0}}
.modal{background:var(--ui-p);border:1px solid var(--ui-line);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;box-shadow:0 30px 80px #000a}
.modal.wide{width:min(1040px,100%)}
.ml-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}.ml-use{font-size:13px}
.ml-bar{height:6px;border-radius:6px;background:var(--ui-p2);overflow:hidden;margin:10px 0 12px}.ml-bar i{display:block;height:100%;width:0;background:var(--ui-grad);transition:width .4s}.ml-bar i.warn{background:#f59e0b}.ml-bar i.full{background:#ef4444}
.ml-tip{font-size:13px;margin:0 0 14px}.ml-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:2px}
.ml-it{position:relative;aspect-ratio:4/3;border:0;border-radius:10px;background:#0006 center/cover no-repeat;cursor:pointer;box-shadow:inset 0 0 0 1px var(--ui-line);transition:transform .15s,box-shadow .15s}
.ml-it:hover{transform:translateY(-2px)}.ml-it.on{box-shadow:0 0 0 3px #8b5cf6}.ml-it.on:after{content:"✓";position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:#8b5cf6;color:#fff;font:700 14px/24px sans-serif;text-align:center}
.ml-del{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:#000b;color:#fff;font:700 17px/25px sans-serif;text-align:center;opacity:0;transition:opacity .15s}.ml-it:hover .ml-del,.ml-it:focus .ml-del{opacity:1}@media(hover:none){.ml-del{opacity:1}}
.ml-empty{grid-column:1/-1;text-align:center;padding:30px 0}
.modal h2{margin:0 0 6px;font-size:21px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:radial-gradient(900px 500px at 10% 0%,#8b5cf633,transparent),radial-gradient(800px 500px at 100% 100%,#22d3ee22,transparent)}
.auth-card{width:min(420px,100%);background:var(--ui-p);border:1px solid var(--ui-line);border-radius:20px;padding:32px;box-shadow:0 30px 80px #0009}
.auth-card h1{font-size:26px;margin:22px 0 6px}
.auth-card .row{display:flex;gap:10px;margin-top:6px}
.auth-card .row .btn{flex:1;justify-content:center}
.auth-msg{min-height:20px;margin-top:12px;font-size:13px}
/* dashboard */
.dash{min-height:100vh;background:radial-gradient(1000px 500px at 0% 0%,#8b5cf61f,transparent)}
.dash-top{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--ui-line)}
.dash-top .sp{flex:1}
.dash-main{padding:34px 32px;max-width:1240px;margin:0 auto}
.dash-main h1{margin:0 0 4px;font-size:30px}
.demo-note{margin:18px 0 0;padding:12px 16px;border:1px dashed #6d5bd0;border-radius:12px;background:#8b5cf612;color:#d9d3ff;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:26px}
.scard{background:var(--ui-p);border:1px solid var(--ui-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.scard:hover{transform:translateY(-3px);border-color:#43435e}
.scard .thumb{height:190px;display:flex;align-items:flex-end;padding:16px;font-size:44px;font-weight:700;color:#fff;background:var(--ui-grad);position:relative;cursor:pointer;overflow:hidden}
.scard .thumb small{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;background:#0b0b14cc;backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px;letter-spacing:.6px;z-index:3}
.scard .thumb small.live{color:#6ee7b7}
.thumb.has-pv .tletter{display:none}
.thumb .tpv,.tpl .pv .tpv{position:absolute;left:0;top:0;width:100%;pointer-events:none;transition:transform var(--dur,5s) cubic-bezier(.45,.05,.35,1)}
.scard:hover .tpv,.tpl:hover .tpv{transform:translateY(var(--sc,0))}
.thumb.has-pv::after,.tpl .pv::after{content:"";position:absolute;inset:auto 0 0 0;height:50px;background:linear-gradient(transparent,#0000003a);pointer-events:none;z-index:2}
.thumb .tpv .wb-site,.tpl .tpv .wb-site{pointer-events:none}
.scard .meta{padding:14px 16px 6px}
.scard .meta b{display:block;font-size:16px}
.scard .meta span{font-size:12.5px;color:var(--ui-m)}
.scard .acts{display:flex;gap:6px;padding:10px 12px 14px;flex-wrap:wrap}
.newcard{border:1.5px dashed #3b3b55;background:transparent;border-radius:16px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ui-m);font-weight:600;font-size:15px;transition:border-color .2s,color .2s}
.newcard:hover{border-color:var(--ui-a);color:#fff}
.newcard i{font-style:normal;font-size:34px;width:60px;height:60px;border-radius:50%;background:var(--ui-grad);color:#fff;display:flex;align-items:center;justify-content:center}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:16px 0}
.tpl{border:2px solid var(--ui-line);border-radius:14px;overflow:hidden;background:var(--ui-p2);cursor:pointer;text-align:left;padding:0;transition:border-color .2s,transform .2s}
.tpl:hover{transform:translateY(-2px)}
.tpl.on{border-color:var(--ui-a);box-shadow:0 0 0 4px #8b5cf633}
.tpl .pv{height:190px;overflow:hidden;position:relative;pointer-events:none;background:#000}
.tpl .tx{padding:10px 12px}
.tpl .tx b{display:block}
.tpl .tx span{font-size:12px;color:var(--ui-m)}
.msg-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.msg{background:var(--ui-p2);border-radius:12px;padding:12px 14px;border:1px solid var(--ui-line)}
.msg .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ui-m)}
.msg p{margin:8px 0 0;white-space:pre-wrap}
/* editor layout */
.ed{position:fixed;inset:0;display:grid;grid-template-columns:292px 1fr 300px;grid-template-rows:58px 1fr;grid-template-areas:"top top top" "left canvas right"}
.ed-top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--ui-p);border-bottom:1px solid var(--ui-line);z-index:20;min-width:0}
.ed-top .sp{flex:1}
.ic{width:36px;height:36px;border-radius:9px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ui-t);transition:background .15s;flex:none}
.ic:hover{background:var(--ui-p2)}
.ic.on{background:#8b5cf633;color:#c4b5fd}
.ic[disabled]{opacity:.35;pointer-events:none}
.ic svg{width:19px;height:19px}
.ed-name{display:flex;flex-direction:column;line-height:1.15;min-width:0;max-width:220px}
.ed-name b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-status{font-size:11.5px;color:var(--ui-m)}
.ed-status.bad{color:var(--ui-bad);cursor:pointer;text-decoration:underline dotted}
.ed-status.ok{color:var(--ui-ok,#34d399)}
.seg{display:inline-flex;background:#0f0f19;border:1px solid var(--ui-line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ui-m)}
.seg button.on{background:var(--ui-p2);color:#fff}
.seg svg{width:17px;height:17px}
.sel-sm{background:#0f0f19;border:1px solid var(--ui-line);border-radius:9px;padding:7px 9px;font-size:13px;max-width:150px}
.ed-left,.ed-right{background:var(--ui-p);overflow:auto;min-height:0}
.ed-left{grid-area:left;border-right:1px solid var(--ui-line);display:flex;flex-direction:column}
.ed-right{grid-area:right;border-left:1px solid var(--ui-line)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--ui-line);position:sticky;top:0;background:var(--ui-p);z-index:2}
.tabs button{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:600;color:var(--ui-m);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--ui-a)}
.tabs svg{width:18px;height:18px}
.pane{padding:14px}
.pane h4{margin:16px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ui-m)}
.pane h4:first-child{margin-top:2px}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add-grid button{background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;transition:border-color .15s,background .15s}
.add-grid button:hover{border-color:var(--ui-a);background:#22223a}
.add-grid svg{width:24px;height:24px;color:#c4b5fd}
.lib-list{display:flex;flex-direction:column;gap:6px}
.lib-list button{text-align:left;background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:10px;padding:10px 12px;font-weight:500;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.lib-list button:hover{border-color:var(--ui-a)}
.lib-list button em{font-style:normal;color:var(--ui-m);font-size:11px}
.slist{display:flex;flex-direction:column;gap:5px}
.sitem{display:flex;align-items:center;gap:4px;background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:10px;padding:5px 5px 5px 11px;font-size:13px;cursor:pointer}
.sitem.on{border-color:var(--ui-a);background:#8b5cf61c}
.sitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem small{color:var(--ui-m);font-size:10.5px;margin-right:4px}
.sitem .ic{width:28px;height:28px}
.sitem .ic svg{width:15px;height:15px}
.pal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pal{border:2px solid var(--ui-line);border-radius:12px;padding:8px;background:var(--ui-p2);display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:11px;font-weight:600}
.pal.on{border-color:var(--ui-a)}
.pal .dots{display:flex;gap:3px}
.pal .dots i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px #ffffff22}
.font-list{display:flex;flex-direction:column;gap:6px}
.font-list button{background:var(--ui-p2);border:2px solid var(--ui-line);border-radius:10px;padding:9px 12px;text-align:left;display:flex;justify-content:space-between;align-items:baseline}
.font-list button.on{border-color:var(--ui-a)}
.font-list b{font-size:19px;font-weight:500}
.font-list span{font-size:11px;color:var(--ui-m)}
/* inspector */
.insp-h{padding:14px 16px 10px;border-bottom:1px solid var(--ui-line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--ui-p);z-index:3}
.insp-h b{flex:1;font-size:14px}
.insp-h .tag{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:#8b5cf62a;color:#c4b5fd;padding:3px 8px;border-radius:99px}
.insp-empty{padding:30px 22px;color:var(--ui-m);text-align:center;font-size:13px;line-height:1.6}
.insp-empty b{color:#fff}
.insp-empty b.t{display:block;font-size:15px;margin-bottom:6px}
.i-grp{border-bottom:1px solid var(--ui-line)}
.i-grp summary{padding:12px 16px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ui-m);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.i-grp summary::-webkit-details-marker{display:none}
.i-grp summary::after{content:"▾";transition:transform .2s}
.i-grp:not([open]) summary::after{transform:rotate(-90deg)}
.i-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.i-row{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px;font-size:12.5px;color:#c9c8dc}
.i-row.full{grid-template-columns:1fr}
.i-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.i-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.i-4 label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--ui-m);font-weight:600}
.i-num,.i-text,.i-sel,.i-area{width:100%;background:#0f0f19;border:1px solid var(--ui-line);border-radius:8px;padding:7px 9px;font-size:13px;outline:none;min-width:0}
.i-num:focus,.i-text:focus,.i-sel:focus,.i-area:focus{border-color:var(--ui-a)}
.i-area{min-height:70px;resize:vertical}
.i-range{display:flex;align-items:center;gap:8px}
.i-range input{flex:1;accent-color:#8b5cf6;min-width:0}
.i-range output{font-size:11.5px;color:var(--ui-m);min-width:34px;text-align:right}
.i-sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.i-sw button{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff22;padding:0}
.i-sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ui-a)}
.i-sw button.none{background:repeating-linear-gradient(45deg,#555 0 3px,#222 3px 6px)}
.i-sw input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;border-radius:6px;cursor:pointer}
.i-seg{display:flex;background:#0f0f19;border:1px solid var(--ui-line);border-radius:8px;padding:2px}
.i-seg button{flex:1;border:0;background:none;border-radius:6px;padding:5px 4px;font-size:12px;font-weight:600;color:var(--ui-m)}
.i-seg button.on{background:var(--ui-p2);color:#fff}
.i-chk{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:#c9c8dc;cursor:pointer}
.i-chk input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:20px;background:#2b2b3e;position:relative;transition:background .2s;flex:none;cursor:pointer}
.i-chk input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.i-chk input:checked{background:var(--ui-a)}
.i-chk input:checked::after{transform:translateX(16px)}
.i-acts{display:flex;flex-wrap:wrap;gap:6px}
.i-note{font-size:12px;color:var(--ui-m);line-height:1.5;background:#0f0f19;border-radius:8px;padding:9px 10px}
.i-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.i-imgs div{position:relative;aspect-ratio:1;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--ui-line)}
.i-imgs button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:12px;line-height:1;padding:0}
.i-thumb{height:110px;border-radius:10px;background:#0f0f19 center/cover no-repeat;border:1px solid var(--ui-line);display:flex;align-items:center;justify-content:center;color:var(--ui-m);font-size:12px}
/* canvas */
.ed-canvas{grid-area:canvas;overflow:auto;position:relative;background:#08080e;background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:22px 22px;min-height:0;min-width:0}
.ed-stage{position:relative;margin:28px auto 120px;box-shadow:0 20px 70px #000c,0 0 0 1px #ffffff14;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ed-stage.phone{border-radius:34px;padding:0;box-shadow:0 0 0 10px #1c1c28,0 0 0 11px #34344a,0 30px 80px #000c;overflow:hidden}
.ed-mount{position:relative}
.ed-stage .wb-el{cursor:move;touch-action:none}
.ed-stage .wb-fg{cursor:move;touch-action:none}
.ed-stage .wb-el:hover{outline:calc(1px * var(--ik,1)) dashed #8b5cf6aa;outline-offset:0}
.ed-stage .wb-sec{outline:0}
.ed-stage .wb-sec:hover>.ed-secbar,.ed-stage .wb-sec.ed-on>.ed-secbar{opacity:1;pointer-events:auto}
.ed-stage .wb-sec.ed-on{box-shadow:inset 0 0 0 2px #22d3ee}
.ed-stage .wb-sec:hover>.ed-sech,.ed-stage .wb-sec.ed-on>.ed-sech,.ed-stage .wb-sec:hover>.ed-addsec{opacity:1}
.ed-secbar{position:absolute;top:8px;left:8px;z-index:60;display:flex;align-items:center;gap:2px;background:#111120ee;border:1px solid #33334a;border-radius:10px;padding:3px 3px 3px 10px;font:600 12px Inter,sans-serif;color:#fff;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 6px 20px #0007}
.wb-overlay>.ed-secbar{left:auto;right:8px;top:auto;bottom:-40px}
.ed-secbar span{margin-right:6px;white-space:nowrap}
.ed-secbar em{font-style:normal;color:#22d3ee;font-size:10px;margin-right:6px}
.ed-secbar button{width:26px;height:26px;border:0;background:none;color:#ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0}

.em-h{margin:18px 0 8px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ui-m);display:flex;justify-content:space-between}
.em-h small{letter-spacing:0;text-transform:none}
.em-sec{background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:14px;padding:12px 14px 4px;margin-bottom:10px}
.em-sec-h{display:flex;justify-content:space-between;align-items:center;margin:-2px 0 10px;font-size:13.5px}
.em-sec-h button{border:0;background:transparent;color:var(--ui-m);font-size:15px;padding:2px 7px;border-radius:6px;cursor:pointer}
.em-sec-h button:hover:not(:disabled){background:#2c2947;color:var(--ui-t)}
.em-sec-h button:disabled{opacity:.3}
.em-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.em-pic{position:relative;flex:none}
.em-pic-i{width:92px;height:70px;border-radius:10px;border:1px dashed #4a4668;background:#1b1930 center/cover no-repeat;color:var(--ui-m);font-size:12px;cursor:pointer}
.em-pic:not(.empty) .em-pic-i{border-style:solid;border-color:transparent}
.em-pic.sm .em-pic-i{width:100%;height:64px}
.em-pic-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:#000c;color:#fff;font-size:13px;line-height:1;cursor:pointer}
.em-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.em-card .em-pic{display:block;margin-bottom:6px}
.em-card .field{margin-bottom:6px}
.em-side-seg{margin:0 0 10px}
.em-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border:1px dashed #4a4668;border-radius:14px}
.em-add span{font-size:12.5px;color:var(--ui-m);margin-right:4px}
.em-add button{border:1px solid var(--ui-line);background:var(--ui-p2);color:var(--ui-t);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.em-add button:hover{border-color:#7c6cf0}
.em-pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:56vh;overflow:auto}
.em-pics button{aspect-ratio:4/3;border:2px solid transparent;border-radius:10px;background:#222 center/cover no-repeat;cursor:pointer}
.em-pics button:hover{border-color:#7c6cf0}
.em-ed .em-form{max-height:74vh;overflow:auto;padding-right:6px}
.em-prev{position:sticky;top:0;max-height:74vh}
@media(max-width:980px){.em-cards{grid-template-columns:1fr}.em-ed .em-form,.em-prev{max-height:none}}

<body>
<div id="app"></div>
<script>
/* =====================================================================
   Webescapade Site Builder — shared renderer (used by builder + viewer)
   Data model:
   site = { v, name, theme:{palette, colors{bg,surface,text,muted,accent,accent2,onaccent},
            fonts{head,body}, radius}, settings:{title,description},
            header:Section|null, footer:Section|null, pages:[{id,name,slug,sections:[Section]}] }
   Section = { id, name, anchor, h, mh, mcustom, sticky, overlay, bg:{...}, els:[El] }
   El = { id, t, x,y,w,h, z, s:{style}, c:content, m:{x,y,w,h,hide,size}|null, a:{type,delay,dur} }
   Desktop canvas is 1200 wide, mobile canvas 390 wide. Both are scaled with CSS zoom.
   ===================================================================== */
(function (global) {
  'use strict';
  const WB = {};
  const DESK = 1200, MOB = 390, BREAK = 760, PAD = 20;
  WB.DESK = DESK; WB.MOB = MOB; WB.BREAK = BREAK;

  /* ---------- small helpers ---------- */
  const uid = (p) => (p || 'e') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const num = (v, min, max, d) => { v = Number(v); if (!isFinite(v)) return d; return Math.min(max, Math.max(min, v)); };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  WB.uid = uid; WB.num = num; WB.esc = esc; WB.clone = clone;

  /* ---------- themes ---------- */
  WB.TOKENS = ['bg', 'surface', 'text', 'muted', 'accent', 'accent2', 'onaccent'];
  WB.PALETTES = {
    midnight:   { label: 'Midnight',   bg: '#0b0b1a', surface: '#16162e', text: '#f4f3ff', muted: '#a9a8c8', accent: '#8b5cf6', accent2: '#22d3ee', onaccent: '#ffffff' },
    noir:       { label: 'Noir & Gold',bg: '#0e0d0c', surface: '#1a1917', text: '#f5efe6', muted: '#a39b8f', accent: '#d4af37', accent2: '#8c6d3f', onaccent: '#111111' },
    ivory:      { label: 'Ivory',      bg: '#fbf8f2', surface: '#ffffff', text: '#1f1b16', muted: '#6f665a', accent: '#b08d57', accent2: '#2f4b3a', onaccent: '#ffffff' },
    terracotta: { label: 'Terracotta', bg: '#fbf4ee', surface: '#ffffff', text: '#2b1d17', muted: '#7a6257', accent: '#c0583b', accent2: '#e3a63b', onaccent: '#ffffff' },
    sage:       { label: 'Sage',       bg: '#f3f5ef', surface: '#ffffff', text: '#243127', muted: '#66756a', accent: '#6b8f71', accent2: '#c9a27e', onaccent: '#ffffff' },
    blush:      { label: 'Blush',      bg: '#fff6f6', surface: '#ffffff', text: '#3a2430', muted: '#8a6b78', accent: '#d16d8e', accent2: '#7c5c9e', onaccent: '#ffffff' },
    ocean:      { label: 'Ocean',      bg: '#f2f7fb', surface: '#ffffff', text: '#0f2233', muted: '#5a7184', accent: '#0e7490', accent2: '#f59e0b', onaccent: '#ffffff' },
    forest:     { label: 'Forest',     bg: '#0f1a14', surface: '#17261d', text: '#eef5ee', muted: '#9fb3a5', accent: '#7fc29b', accent2: '#e8c07a', onaccent: '#0f1a14' },
    mono:       { label: 'Mono',       bg: '#ffffff', surface: '#f4f4f5', text: '#111111', muted: '#6b6b6b', accent: '#111111', accent2: '#ef4444', onaccent: '#ffffff' }
  };
  WB.FONTS = {
    'Inter': 'Inter:wght@300;400;500;600;700',
    'DM Sans': 'DM+Sans:wght@400;500;700',
    'Poppins': 'Poppins:wght@300;400;500;600;700',
    'Montserrat': 'Montserrat:wght@300;400;500;600;700',
    'Raleway': 'Raleway:wght@300;400;500;600;700',
    'Outfit': 'Outfit:wght@300;400;500;600;700',
    'Space Grotesk': 'Space+Grotesk:wght@400;500;700',
    'Josefin Sans': 'Josefin+Sans:wght@300;400;600',
    'Bebas Neue': 'Bebas+Neue',
    'Playfair Display': 'Playfair+Display:ital,wght@0,400;0,600;0,700;1,400',
    'Cormorant Garamond': 'Cormorant+Garamond:ital,wght@0,400;0,600;1,400',
    'DM Serif Display': 'DM+Serif+Display:ital@0;1',
    'Fraunces': 'Fraunces:ital,wght@0,400;0,600;1,400',
    'Lora': 'Lora:ital,wght@0,400;0,600;1,400',
    'Great Vibes': 'Great+Vibes'
  };
  const SERIF = ['Playfair Display', 'Cormorant Garamond', 'DM Serif Display', 'Fraunces', 'Lora'];
  const fallback = (f) => SERIF.includes(f) ? 'Georgia, serif' : (f === 'Great Vibes' ? 'cursive' : 'system-ui, sans-serif');
  WB.FONT_PAIRS = {
    classic:   { label: 'Classic',   head: 'Playfair Display', body: 'Inter' },
    elegant:   { label: 'Elegant',   head: 'Cormorant Garamond', body: 'Raleway' },
    editorial: { label: 'Editorial', head: 'DM Serif Display', body: 'DM Sans' },
    modern:    { label: 'Modern',    head: 'Space Grotesk', body: 'Inter' },
    bold:      { label: 'Bold',      head: 'Bebas Neue', body: 'Montserrat' },
    friendly:  { label: 'Friendly',  head: 'Poppins', body: 'Poppins' },
    fresh:     { label: 'Fresh',     head: 'Outfit', body: 'Outfit' },
    warm:      { label: 'Warm',      head: 'Fraunces', body: 'DM Sans' }
  };

  /* ---------- safety: colours, links, images, rich text ---------- */
  function color(c, d) {
    if (c == null || c === '') return d || '';
    c = String(c).trim();
    if (c[0] === '@') { const t = c.slice(1); return WB.TOKENS.includes(t) ? 'var(--c-' + t + ')' : (d || ''); }
    if (/^#[0-9a-f]{3,8}$/i.test(c)) return c;
    if (/^rgba?\(\s*[\d.]+%?\s*,\s*[\d.]+%?\s*,\s*[\d.]+%?\s*(,\s*[\d.]+\s*)?\)$/i.test(c)) return c;
    if (c === 'transparent') return c;
    return d || '';
  }
  WB.color = color;
  function alpha(c, a) { // colour with opacity using color-mix (works for tokens and hex)
    const base = color(c, '#000000');
    return 'color-mix(in srgb, ' + base + ' ' + Math.round(num(a, 0, 1, 1) * 100) + '%, transparent)';
  }
  function safeHref(u) {
    if (!u) return '';
    u = String(u).trim();
    if (/^(https?:|mailto:|tel:)/i.test(u)) return u.replace(/[\s"'<>]/g, encodeURIComponent);
    if (/^#[\w-]*$/.test(u)) return u;
    if (/^page:[a-z0-9-]*$/.test(u)) return u;
    if (u === 'booking:') return u;
    if (/^[\w.-]+\.[a-z]{2,}(\/[^\s"'<>]*)?$/i.test(u)) return 'https://' + u;
    return '';
  }
  function safeImg(u) {
    if (!u) return '';
    u = String(u).trim();
    if (/^https:\/\/[^\s"'<>()\\]+$/i.test(u)) return u;
    if (/^data:image\/(png|jpe?g|webp|gif);base64,[a-z0-9+/=]+$/i.test(u)) return u;
    return '';
  }
  WB.safeHref = safeHref; WB.safeImg = safeImg;
  const cssUrl = (u) => 'url("' + u.replace(/["\\\n\r]/g, '') + '")';

  const ALLOWED = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1, A: 1, SPAN: 1, DIV: 1, P: 1 };
  const DROP = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|SVG|MATH|LINK|META|NOSCRIPT|TEXTAREA|SELECT|IMG|VIDEO|AUDIO|FORM|INPUT|BUTTON)$/i;
  function sanitize(html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = String(html == null ? '' : html);
    (function walk(node) {
      Array.from(node.childNodes).forEach((ch) => {
        if (ch.nodeType === 3) return;
        if (ch.nodeType !== 1) { ch.remove(); return; }
        if (DROP.test(ch.tagName)) { ch.remove(); return; }
        walk(ch);
        if (!ALLOWED[ch.tagName.toUpperCase()]) { ch.replaceWith(...Array.from(ch.childNodes)); return; }
        Array.from(ch.attributes).forEach((a) => { if (!(ch.tagName === 'A' && a.name === 'href')) ch.removeAttribute(a.name); });
        if (ch.tagName === 'A') { const h = safeHref(ch.getAttribute('href')); if (h) ch.setAttribute('href', h); else ch.removeAttribute('href'); }
      });
    })(tpl.content);
    return tpl.innerHTML;
  }
  WB.sanitize = sanitize;

  function videoEmbed(url, auto) {
    if (!url) return '';
    url = String(url).trim();
    let m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/i);
    if (m) {
      const q = auto ? '?autoplay=1&mute=1&loop=1&playlist=' + m[1] + '&controls=0&rel=0&playsinline=1' : '?rel=0';
      return 'https://www.youtube-nocookie.com/embed/' + m[1] + q;
    }
    m = url.match(/vimeo\.com\/(?:video\/)?(\d{5,12})/i);
    if (m) return 'https://player.vimeo.com/video/' + m[1] + (auto ? '?autoplay=1&muted=1&loop=1&background=1' : '');
    return '';
  }
  WB.videoEmbed = videoEmbed;

  /* ---------- theme css ---------- */
  function themeVars(theme) {
    theme = theme || {};
    const p = WB.PALETTES[theme.palette] || WB.PALETTES.midnight;
    const cols = Object.assign({}, p, theme.colors || {});
    const f = theme.fonts || {};
    const head = WB.FONTS[f.head] ? f.head : 'Playfair Display';
    const body = WB.FONTS[f.body] ? f.body : 'Inter';
    const out = WB.TOKENS.map((t) => '--c-' + t + ':' + (color(cols[t]) || p[t]));
    out.push("--f-head:'" + head + "'," + fallback(head));
    out.push("--f-body:'" + body + "'," + fallback(body));
    out.push('--radius:' + num(theme.radius, 0, 40, 12) + 'px');
    return out.join(';');
  }
  WB.themeVars = themeVars;

  function fontVar(f) {
    if (f === 'head') return 'var(--f-head)';
    if (!f || f === 'body') return 'var(--f-body)';
    if (WB.FONTS[f]) return "'" + f + "'," + fallback(f);
    return 'var(--f-body)';
  }
  WB.loadFonts = function (site, doc) {
    doc = doc || document;
    const set = new Set();
    const th = (site.theme && site.theme.fonts) || {};
    set.add(WB.FONTS[th.head] ? th.head : 'Playfair Display');
    set.add(WB.FONTS[th.body] ? th.body : 'Inter');
    allSections(site).forEach((sec) => (sec.els || []).forEach((el) => { const f = el.s && el.s.font; if (f && WB.FONTS[f]) set.add(f); }));
    const href = 'https://fonts.googleapis.com/css2?' + Array.from(set).map((f) => 'family=' + WB.FONTS[f]).join('&') + '&display=swap';
    let link = doc.getElementById('wb-fonts');
    if (!link) { link = doc.createElement('link'); link.id = 'wb-fonts'; link.rel = 'stylesheet'; doc.head.appendChild(link); }
    if (link.href !== href) link.href = href;
  };

  function allSections(site) {
    const out = [];
    if (site.header) out.push(site.header);
    (site.pages || []).forEach((p) => (p.sections || []).forEach((s) => out.push(s)));
    if (site.footer) out.push(site.footer);
    return out;
  }
  WB.allSections = allSections;

  /* ---------- normalising (keeps saved data safe & complete) ---------- */
  WB.EL_TYPES = ['heading', 'text', 'button', 'image', 'shape', 'line', 'video', 'map', 'form', 'nav', 'social', 'product', 'shopgrid', 'cart', 'livemenu'];
  function normEl(el) {
    if (!el || WB.EL_TYPES.indexOf(el.t) < 0) return null;
    el.id = el.id || uid('e');
    el.x = num(el.x, -600, 1800, 40); el.y = num(el.y, -400, 6000, 40);
    el.w = num(el.w, 4, 2400, 300); el.h = num(el.h, 1, 4000, 60);
    el.z = num(el.z, 0, 999, 1);
    el.s = el.s && typeof el.s === 'object' ? el.s : {};
    if (el.c == null) el.c = el.t === 'image' ? {} : '';
    if (el.m && typeof el.m === 'object') {
      ['x', 'y', 'w', 'h'].forEach((k) => { if (el.m[k] != null) el.m[k] = num(el.m[k], -400, 3000, 0); });
    } else el.m = null;
    el.a = el.a && typeof el.a === 'object' ? el.a : { type: 'none' };
    return el;
  }
  function normSection(sec) {
    if (!sec || typeof sec !== 'object') return null;
    sec.id = sec.id || uid('s');
    sec.name = sec.name || 'Section';
    sec.h = num(sec.h, 40, 4000, 500);
    sec.mh = sec.mh == null ? null : num(sec.mh, 40, 8000, 500);
    sec.mcustom = !!sec.mcustom && sec.mh != null;
    sec.bg = sec.bg && typeof sec.bg === 'object' ? sec.bg : { type: 'color', color: '@bg' };
    sec.els = (Array.isArray(sec.els) ? sec.els : []).map(normEl).filter(Boolean);
    return sec;
  }
  WB.normSection = normSection; WB.normEl = normEl;
  WB.normalizeSite = function (site) {
    site = site && typeof site === 'object' ? site : {};
    site.v = 1;
    site.name = site.name || 'My website';
    site.theme = site.theme || {};
    if (!WB.PALETTES[site.theme.palette]) site.theme.palette = 'midnight';
    site.theme.colors = Object.assign({}, WB.PALETTES[site.theme.palette], site.theme.colors || {});
    delete site.theme.colors.label;
    site.theme.fonts = site.theme.fonts || { head: 'Playfair Display', body: 'Inter' };
    site.theme.radius = num(site.theme.radius, 0, 40, 12);
    site.settings = site.settings || {};
    site.header = site.header ? normSection(site.header) : null;
    site.footer = site.footer ? normSection(site.footer) : null;
    site.pages = (Array.isArray(site.pages) && site.pages.length ? site.pages : [{ name: 'Home', slug: '', sections: [] }]).map((p, i) => {
      p.id = p.id || uid('p');
      p.name = p.name || (i ? 'Page ' + (i + 1) : 'Home');
      p.slug = i === 0 ? '' : String(p.slug || p.name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || ('page-' + (i + 1));
      p.sections = (Array.isArray(p.sections) ? p.sections : []).map(normSection).filter(Boolean);
      return p;
    });
    return site;
  };

  /* ---------- mobile automatic layout ---------- */
  function autoMSize(s) {
    s = num(s, 8, 200, 18);
    if (s >= 56) return Math.round(Math.max(32, s * 0.58));
    if (s >= 36) return Math.round(s * 0.72);
    if (s >= 24) return Math.round(s * 0.85);
    return s;
  }
  WB.mobileSize = (el) => (el.m && el.m.size) ? num(el.m.size, 8, 200, 16) : autoMSize(el.s && el.s.size);

  const box = (el) => ({ x: el.x, y: el.y, w: el.w, h: el.h, r: el.x + el.w, b: el.y + el.h });
  function inside(a, b) { // fraction of a inside b
    const ix = Math.max(0, Math.min(a.r, b.r) - Math.max(a.x, b.x));
    const iy = Math.max(0, Math.min(a.b, b.b) - Math.max(a.y, b.y));
    return (ix * iy) / Math.max(1, a.w * a.h);
  }
  // Build a tree: shapes that contain other elements become "cards" (groups)
  function buildNodes(els) {
    const items = els.map((el) => ({ el, bx: box(el), kids: null }));
    const shapes = items.filter((n) => n.el.t === 'shape' && n.bx.w >= 150 && n.bx.h >= 90).sort((a, b) => b.bx.w * b.bx.h - a.bx.w * a.bx.h);
    const owner = new Map();
    shapes.forEach((sh) => {
      items.forEach((n) => {
        if (n === sh || owner.has(n)) return;
        if (n.el.t === 'shape' && n.bx.w * n.bx.h >= sh.bx.w * sh.bx.h) return;
        if (inside(n.bx, sh.bx) > 0.8) owner.set(n, sh);
      });
    });
    // resolve to the closest (smallest) owning shape
    items.forEach((n) => {
      let best = null;
      shapes.forEach((sh) => {
        if (sh === n) return;
        if (n.el.t === 'shape' && n.bx.w * n.bx.h >= sh.bx.w * sh.bx.h) return;
        if (inside(n.bx, sh.bx) > 0.8 && (!best || sh.bx.w * sh.bx.h < best.bx.w * best.bx.h)) best = sh;
      });
      if (best) owner.set(n, best); else owner.delete(n);
    });
    const roots = [];
    items.forEach((n) => {
      const o = owner.get(n);
      if (o) { (o.kids = o.kids || []).push(n); } else roots.push(n);
    });
    return roots;
  }
  function cut(nodes, axis) { // split into groups separated by a clear gap along axis
    const k1 = axis === 'x' ? 'x' : 'y', k2 = axis === 'x' ? 'r' : 'b';
    const s = nodes.slice().sort((a, b) => a.bx[k1] - b.bx[k1]);
    const groups = []; let cur = [], end = -Infinity;
    s.forEach((n) => {
      if (cur.length && n.bx[k1] >= end - 2) { groups.push(cur); cur = []; end = -Infinity; }
      cur.push(n); end = Math.max(end, n.bx[k2]);
    });
    if (cur.length) groups.push(cur);
    return groups;
  }
  function balanced(groups) {
    if (groups.length < 2) return false;
    const ws = groups.map((g) => Math.max(...g.map((n) => n.bx.r)) - Math.min(...g.map((n) => n.bx.x)));
    const mx = Math.max(...ws), mn = Math.min(...ws);
    return mn >= 160 && mn / mx >= 0.55;
  }
  function order(nodes) { // recursive XY-cut reading order
    if (nodes.length <= 1) return nodes;
    const cols = cut(nodes, 'x');
    if (balanced(cols)) return [].concat(...cols.map(order));
    const rows = cut(nodes, 'y');
    if (rows.length > 1) {
      // merge runs of rows that share the same column structure (e.g. photo / name / role in 3 columns)
      const out = []; let i = 0;
      while (i < rows.length) {
        let best = i;
        for (let j = i + 1; j < rows.length; j++) {
          const uni = [].concat(...rows.slice(i, j + 1));
          if (balanced(cut(uni, 'x'))) best = j;
        }
        if (best > i) { const uni = [].concat(...rows.slice(i, best + 1)); out.push(...[].concat(...cut(uni, 'x').map(order))); }
        else out.push(...order(rows[i]));
        i = best + 1;
      }
      return out;
    }
    if (cols.length > 1) return [].concat(...cols.map(order));
    return nodes.slice().sort((a, b) => (a.bx.y - b.bx.y) || (a.bx.x - b.bx.x));
  }
  const FULL = { heading: 1, text: 1, form: 1, nav: 1, video: 1, map: 1, line: 1, shopgrid: 1, product: 1, livemenu: 1 };
  const AUTOH = { heading: 1, text: 1, form: 1, product: 1, shopgrid: 1, livemenu: 1 };
  WB.AUTOH = AUTOH;
  function flowSize(el, avail) {
    let w, h = el.h;
    if (FULL[el.t]) w = avail;
    else if (el.t === 'image') w = el.w >= 240 ? avail : Math.min(avail, el.w);
    else w = Math.min(avail, el.w);
    if (el.t === 'image' || el.t === 'shape') h = Math.round(el.h * (w / el.w));
    if (el.t === 'video') h = Math.round(w * 9 / 16);

  WB.growSection = function (w) {

  WB.money = (c) => '$' + (Number(c || 0) / 100).toFixed(2);
  const CHAT_ICON = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
  const CAL_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>';
  // o: { plan, slug, chatUrl, apiKey, token, preview, host, box }
  WB.mountExtras = function (root, site, o) {
    o = o || {};
    const host = o.host || document.body;
    const plat = o.plan === 'platinum';
    const bk = site.booking || {}, chat = site.chat || {};
    const url = plat ? WB.bookingUrl(bk) : '';
    const layer = document.createElement('div');
    layer.className = 'wb-x';
    layer.setAttribute('style', themeVars(site.theme));
    if (o.box) { layer.style.position = 'fixed'; layer.style.inset = 'auto'; layer.style.left = o.box.left + 'px'; layer.style.top = o.box.top + 'px'; layer.style.width = o.box.width + 'px'; layer.style.height = o.box.height + 'px'; layer.style.borderRadius = '30px'; layer.style.overflow = 'hidden'; }
    host.appendChild(layer);
    const narrow = () => layer.getBoundingClientRect().width < 560;
    // booking panel
    let panel = null;
    function openBooking() {
      if (!url) {
        if (o.preview) { note(plat ? 'Connect your booking system in the Platinum tab to switch this on.' : 'Online booking is a Platinum feature.'); return; }
        // live website without a booking connection: take visitors to the contact details rather than doing nothing
        const t = root.querySelector('#contact') || (root.querySelector('.wb-t-form') || {}).parentNode || null;
        if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      if (panel) { panel.classList.add('on'); return; }
      panel = document.createElement('div');
      panel.className = 'wb-x-bk';
      panel.innerHTML = '<div class="wb-x-bk-bg"></div><div class="wb-x-bk-sheet"><div class="wb-x-bk-h"><b>' + esc(bk.title || bk.label || 'Book now') + '</b><a target="_blank" rel="noopener" href="' + esc(url) + '">Open in new tab ↗</a><button type="button" aria-label="Close">✕</button></div><div class="wb-x-bk-body"><div class="wb-x-spin"></div><iframe title="Booking" src="' + esc(url) + '" allow="payment"></iframe></div></div>';
      layer.appendChild(panel);
      const close = () => panel.classList.remove('on');
      panel.querySelector('button').onclick = close;
      panel.querySelector('.wb-x-bk-bg').onclick = close;
      panel.querySelector('iframe').onload = () => { const sp = panel.querySelector('.wb-x-spin'); if (sp) sp.remove(); };
      requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add('on')));
    }
    function note(t) {
      const n = document.createElement('div'); n.className = 'wb-x-note'; n.textContent = t; layer.appendChild(n);
      setTimeout(() => n.remove(), 3200);
    }
    const onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href="#wb-book"]');
      if (a) { e.preventDefault(); openBooking(); }
    };
    root.addEventListener('click', onClick);
    if (url && bk.floating !== false) {
      const pill = document.createElement('button');
      pill.type = 'button'; pill.className = 'wb-x-pill' + (plat && chat.on ? ' with-chat' : '');
      pill.innerHTML = CAL_ICON + '<span>' + esc(bk.label || 'Book now') + '</span>';
      pill.onclick = openBooking;
      layer.appendChild(pill);
    }
    // chat assistant
    if (plat && chat.on) {
      const key = 'wbchat.' + (o.slug || 'x') + (o.preview ? '.p' : '');
      let msgs = [];
      try { msgs = JSON.parse(sessionStorage.getItem(key) || '[]'); } catch (e) { msgs = []; }
      const name = chat.name || 'Assistant';
      const greet = chat.greeting || ('Hi! I’m ' + name + '. Ask me anything about ' + (site.name || 'us') + '.');
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'wb-x-chatbtn'; btn.setAttribute('aria-label', 'Chat with us'); btn.innerHTML = CHAT_ICON;
      const box = document.createElement('div');
      box.className = 'wb-x-chat';
      box.innerHTML = '<div class="wb-x-ch"><i>' + esc(name.charAt(0).toUpperCase()) + '</i><div><b>' + esc(name) + '</b><span>AI assistant · answers can be wrong</span></div><button type="button" aria-label="Close">✕</button></div><div class="wb-x-msgs" role="log"></div><div class="wb-x-chips"></div><form class="wb-x-in"><input maxlength="800" placeholder="Type your question…" aria-label="Message"><button type="submit" aria-label="Send">➤</button></form>';
      layer.appendChild(box); layer.appendChild(btn);
      const list = box.querySelector('.wb-x-msgs'), chips = box.querySelector('.wb-x-chips'), form = box.querySelector('form'), input = form.querySelector('input');
      const bubble = (role, text, book) => {
        const d = document.createElement('div'); d.className = 'wb-x-m ' + role;
        d.innerHTML = esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>');
        list.appendChild(d);
        if (book && url) { const b = document.createElement('button'); b.type = 'button'; b.className = 'wb-x-bookbtn'; b.innerHTML = CAL_ICON + (bk.label || 'Book now'); b.onclick = openBooking; list.appendChild(b); }
        list.scrollTop = list.scrollHeight;
      };
      const draw = () => { list.innerHTML = ''; bubble('bot', greet); msgs.forEach((m) => bubble(m.role === 'user' ? 'me' : 'bot', m.content, m.book)); };
      const setChips = () => {
        chips.innerHTML = '';
        const c = (chat.chips && chat.chips.length ? chat.chips : ['What are your opening hours?', 'Where are you located?']).slice(0, 3);
        if (url) c.unshift(bk.label || 'Book now');
        if (msgs.length) return;
        c.forEach((t) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.onclick = () => { if (url && t === (bk.label || 'Book now')) openBooking(); else send(t); }; chips.appendChild(b); });
      };
      let busy = false;
      async function send(text) {
        text = String(text || '').trim().slice(0, 800);
        if (!text || busy) return;
        busy = true; chips.innerHTML = '';
        msgs.push({ role: 'user', content: text }); bubble('me', text);
        const typing = document.createElement('div'); typing.className = 'wb-x-m bot wb-x-typing'; typing.innerHTML = '<i></i><i></i><i></i>'; list.appendChild(typing); list.scrollTop = list.scrollHeight;
        let reply = '', book = false;
        try {
          if (!o.chatUrl) { await new Promise((r) => setTimeout(r, 700)); reply = 'This is a preview. Once your website is online with Platinum, I will answer questions using everything on your site.'; }
          else {
            const res = await fetch(o.chatUrl, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: o.apiKey || '', Authorization: 'Bearer ' + (o.token || o.apiKey || '') }, body: JSON.stringify({ slug: o.slug, preview: !!o.preview, messages: msgs.slice(-12).map((m) => ({ role: m.role, content: m.content })) }) });
            const j = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(j.error || 'unavailable');
            reply = j.reply || '…'; book = !!j.book;
          }
        } catch (e) { reply = (e && e.message && e.message.length < 160 && e.message !== 'unavailable') ? e.message : 'Sorry, I can’t answer right now. Please try again in a moment, or use the contact form.'; }
        typing.remove();
        msgs.push({ role: 'assistant', content: reply, book }); bubble('bot', reply, book);
        try { sessionStorage.setItem(key, JSON.stringify(msgs.slice(-20))); } catch (e) { /* private mode */ }
        busy = false;
      }
      form.addEventListener('submit', (e) => { e.preventDefault(); const t = input.value; input.value = ''; send(t); });
      btn.onclick = () => { box.classList.toggle('on'); btn.classList.toggle('open', box.classList.contains('on')); if (box.classList.contains('on')) { box.classList.toggle('full', narrow()); setTimeout(() => input.focus(), 250); } };
      box.querySelector('.wb-x-ch button').onclick = () => { box.classList.remove('on'); btn.classList.remove('open'); };
      draw(); setChips();
      if (chat.autoOpen && !narrow() && !msgs.length) setTimeout(() => { if (!box.classList.contains('on')) btn.click(); }, 4000);
    }
    return function destroy() { root.removeEventListener('click', onClick); layer.remove(); };
  };


  /* ---------- online shop: cart drawer, checkout, order page ---------- */
  // o: { shop:{products,enabled}, slug, api(action, body) -> Promise, preview, host, box, order:{id,token}, openCart }
  WB.mountShop = function (root, site, o) {
    o = o || {};
    const shop = o.shop || { products: [] };
    const prods = new Map((shop.products || []).map((p) => [p.id, p]));
    const cfg = site.shop || {};
    const key = 'wbcart.' + (o.slug || 'x') + (o.preview ? '.p' : '');
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem(key) || '[]').filter((i) => prods.has(i.id)); } catch (e) { cart = []; }
    const save = () => { try { localStorage.setItem(key, JSON.stringify(cart)); } catch (e) { /* storage off */ } update(); };
    const layer = document.createElement('div');
    layer.className = 'wb-x wb-xs';
    layer.setAttribute('style', themeVars(site.theme));
    if (o.box) { layer.style.position = 'fixed'; layer.style.inset = 'auto'; layer.style.left = o.box.left + 'px'; layer.style.top = o.box.top + 'px'; layer.style.width = o.box.width + 'px'; layer.style.height = o.box.height + 'px'; layer.style.overflow = 'hidden'; }
    (o.host || document.body).appendChild(layer);
    const fab = document.createElement('button');
    fab.type = 'button'; fab.className = 'wb-x-cartfab'; fab.innerHTML = BAG_ICON + '<b class="wb-cart-count">0</b>';
    layer.appendChild(fab);
    const drawer = document.createElement('div');
    drawer.className = 'wb-x-bk wb-x-cart';
    drawer.innerHTML = '<div class="wb-x-bk-bg"></div><div class="wb-x-bk-sheet"><div class="wb-x-bk-h"><b>Your cart</b><button type="button" aria-label="Close">✕</button></div><div class="wb-x-cbody"></div></div>';
    layer.appendChild(drawer);
    const body = drawer.querySelector('.wb-x-cbody');
    const close = () => drawer.classList.remove('on');
    drawer.querySelector('.wb-x-bk-h button').onclick = close;
    drawer.querySelector('.wb-x-bk-bg').onclick = close;
    const open = () => { draw(); drawer.classList.add('on'); };
    fab.onclick = open;
    let fulfil = '';
    const count = () => cart.reduce((n, i) => n + i.qty, 0);
    function update() {
      const n = count();
      document.querySelectorAll('.wb-cart-count').forEach((b) => { b.textContent = n; b.style.display = n ? '' : 'none'; });
      fab.classList.toggle('on', n > 0);
    }
    function methods(subtotal) {
      const m = [];
      if (cfg.post && cfg.post.on) {
        const freeOver = Math.round(Number(cfg.post.freeOver || 0) * 100);
        const fee = freeOver > 0 && subtotal >= freeOver ? 0 : Math.round(Number(cfg.post.fee || 0) * 100);
        m.push({ id: 'post', label: 'Post to my address', fee, note: freeOver > 0 ? (fee ? 'Free postage over ' + WB.money(freeOver) : 'Free postage') : '' });
      }
      if (cfg.local && cfg.local.on) m.push({ id: 'local', label: 'Local delivery', fee: Math.round(Number(cfg.local.fee || 0) * 100), note: cfg.local.note || '' });
      if (cfg.pickup && cfg.pickup.on) m.push({ id: 'pickup', label: 'Pick up', fee: 0, note: cfg.pickup.note || '' });
      return m;
    }
    function draw(err) {
      if (!cart.length) { body.innerHTML = '<div class="wb-x-cempty">' + BAG_ICON + '<p>Your cart is empty.</p></div>'; return; }
      const sub = cart.reduce((s, i) => s + (prods.get(i.id).price_cents * i.qty), 0);
      const physical = cart.some((i) => prods.get(i.id).kind === 'physical');
      const ms = physical ? methods(sub) : [];
      if (physical && !ms.some((m) => m.id === fulfil)) fulfil = ms.length === 1 ? ms[0].id : '';
      const sel = ms.find((m) => m.id === fulfil);
      const ship = sel ? sel.fee : 0;
      let h = '<div class="wb-x-items">' + cart.map((i, n) => { const p = prods.get(i.id); return '<div class="wb-x-item">' + (safeImg(p.image) ? '<img alt="" src="' + esc(safeImg(p.image)) + '">' : '<i></i>') + '<div><b>' + esc(p.name) + '</b>' + (i.option ? '<span>' + esc(i.option) + '</span>' : '') + '<span>' + WB.money(p.price_cents) + '</span></div><div class="wb-x-qty"><button type="button" data-q="-1" data-n="' + n + '">−</button><em>' + i.qty + '</em><button type="button" data-q="1" data-n="' + n + '">+</button></div></div>'; }).join('') + '</div>';
      if (physical) {
        h += '<div class="wb-x-ful"><b>How would you like it?</b>' + (ms.length ? ms.map((m) => '<label class="' + (m.id === fulfil ? 'on' : '') + '"><input type="radio" name="wbful" value="' + m.id + '"' + (m.id === fulfil ? ' checked' : '') + '><span><b>' + esc(m.label) + '</b>' + (m.note ? '<small>' + esc(m.note) + '</small>' : '') + '</span><em>' + (m.fee ? WB.money(m.fee) : 'Free') + '</em></label>').join('') : '<p class="wb-x-err">Delivery options are not set up yet.</p>') + '</div>';
      }
      h += '<div class="wb-x-tot"><span>Subtotal</span><b>' + WB.money(sub) + '</b>' + (physical ? '<span>Delivery</span><b>' + (sel ? (ship ? WB.money(ship) : 'Free') : '—') + '</b>' : '') + '<span class="big">Total</span><b class="big">' + WB.money(sub + ship) + '</b></div>' +
        (err ? '<p class="wb-x-err">' + esc(err) + '</p>' : '') +
        '<button type="button" class="wb-x-pay"' + (physical && !sel ? ' disabled' : '') + '>🔒 Checkout securely</button><p class="wb-x-small">Payments are processed by Stripe. Apple Pay, Google Pay and cards accepted.</p>';
      body.innerHTML = h;
    }
    body.addEventListener('click', async (e) => {
      const q = e.target.closest('[data-q]');
      if (q) { const i = cart[+q.dataset.n]; i.qty += +q.dataset.q; if (i.qty < 1) cart.splice(+q.dataset.n, 1); else { const p = prods.get(i.id); if (p.stock != null && i.qty > p.stock) i.qty = p.stock; if (i.qty > 99) i.qty = 99; } save(); draw(); return; }
      const pay = e.target.closest('.wb-x-pay');
      if (pay) {
        if (o.preview) { draw('Preview only — on your live website this opens Stripe’s secure checkout.'); return; }
        pay.disabled = true; pay.textContent = 'Opening secure checkout…';
        try {
          const r = await o.api('checkout', { slug: o.slug, items: cart.map((i) => ({ id: i.id, qty: i.qty, option: i.option })), fulfilment: fulfil });
          if (r && r.url) { location.href = r.url; return; }
          throw new Error('Checkout is not available right now.');
        } catch (er) { draw(er.message || 'Checkout is not available right now.'); }
      }
    });
    body.addEventListener('change', (e) => { if (e.target.name === 'wbful') { fulfil = e.target.value; draw(); } });
    const onClick = (e) => {
      const add = e.target.closest && e.target.closest('[data-wb-add]');
      if (add && !add.disabled) {
        e.preventDefault();
        const id = add.dataset.wbAdd, p = prods.get(id); if (!p) return;
        const card = add.closest('.wb-prod'); const opt = card && card.querySelector('.wb-prod-opt');
        const option = opt ? opt.value : '';
        const ex = cart.find((i) => i.id === id && i.option === option);
        const inCart = cart.filter((i) => i.id === id).reduce((s, i) => s + i.qty, 0);
        const label = add.dataset.label || (add.dataset.label = add.textContent);
        const flash = (txt) => { add.textContent = txt; clearTimeout(add._t); add._t = setTimeout(() => { add.textContent = label; }, 1800); };
        if (p.stock != null && inCart >= p.stock) { flash(p.stock > 0 ? 'Only ' + p.stock + ' in stock' : 'No more in stock'); return; }
        if (ex) ex.qty++; else cart.push({ id, qty: 1, option });
        save();
        flash('✓ Added');
        open();
        return;
      }
      const a = e.target.closest && e.target.closest('a[href="#wb-cart"]');
      if (a) { e.preventDefault(); open(); }
    };
    root.addEventListener('click', onClick);
    update();
    if (o.openCart && cart.length) setTimeout(open, 400);
    // order confirmation page
    if (o.order && o.order.id) {
      const ov = document.createElement('div');
      ov.className = 'wb-x-order';
      ov.innerHTML = '<div class="wb-x-ocard"><div class="wb-x-spin"></div><p>Confirming your payment…</p></div>';
      layer.appendChild(ov);
      let tries = 0;
      const load = async () => {
        let r;
        try { r = await o.api('order', { order_id: o.order.id, token: o.order.token }); } catch (e) { ov.firstChild.innerHTML = '<h2>We couldn’t find that order</h2><p>' + esc(e.message || '') + '</p><button type="button" class="wb-x-pay">Close</button>'; ov.querySelector('button').onclick = () => ov.remove(); return; }
        if (r.status === 'pending' && tries++ < 8) { setTimeout(load, 2500); return; }
        const paid = r.status === 'paid' || r.status === 'fulfilled';
        if (paid) { cart = []; save(); }
        let h = paid ? '<div class="wb-x-tick">✓</div><h2>Thank you' + (r.customer && r.customer.name ? ', ' + esc(String(r.customer.name).split(' ')[0]) : '') + '!</h2><p>Your order is confirmed. Bookmark this page to come back to your order any time.</p>'
          : r.status === 'cancelled' ? '<h2>Order not completed</h2><p>The payment was not finished, so you have not been charged.</p>'
          : '<h2>Payment still processing</h2><p>This can take a minute. Refresh this page shortly — keep this link to come back to your order.</p>';
        h += '<div class="wb-x-osum">' + r.items.map((i) => '<div><span>' + esc(i.name) + (i.option ? ' — ' + esc(i.option) : '') + ' × ' + i.qty + '</span><b>' + WB.money(i.price_cents * i.qty) + '</b></div>').join('') +
          (r.fulfilment ? '<div><span>' + esc({ post: 'Postage', local: 'Local delivery', pickup: 'Pick up' }[r.fulfilment] || r.fulfilment) + '</span><b>' + (r.shipping_cents ? WB.money(r.shipping_cents) : 'Free') + '</b></div>' : '') +
          '<div class="t"><span>Total</span><b>' + WB.money(r.total_cents) + '</b></div></div>';
        if (r.vouchers && r.vouchers.length) h += '<div class="wb-x-ocodes"><b>Your gift voucher' + (r.vouchers.length > 1 ? 's' : '') + '</b>' + r.vouchers.map((v) => '<div><code>' + esc(v.code) + '</code><span>' + esc(v.product_name || '') + ' · ' + WB.money(v.amount_cents) + '</span></div>').join('') + '<small>Keep these codes safe — show them when you visit.</small></div>';
        if (r.downloads && r.downloads.length) h += '<div class="wb-x-ocodes"><b>Your downloads</b>' + r.downloads.map((d) => '<div><a href="' + esc(d.url) + '" target="_blank" rel="noopener">⬇ ' + esc(d.name) + '</a></div>').join('') + '<small>Links last 7 days. Open this page again any time for fresh links — bookmark it.</small></div>';
        h += '<button type="button" class="wb-x-pay">Back to the website</button>';
        ov.firstChild.innerHTML = h;
        ov.querySelector('.wb-x-pay').onclick = () => ov.remove();
      };
      load();
    }
    return function destroy() { root.removeEventListener('click', onClick); layer.remove(); };
  };

.wb-sec{position:relative;width:100%}
.wb-has-nav{z-index:30}
.wb-overlay{position:absolute;left:0;right:0;top:0;z-index:40;pointer-events:none}
.wb-overlay .wb-el,.wb-overlay .wb-fg{pointer-events:auto}
.wb-overlay>.wb-bg{transition:background .35s,box-shadow .35s}
.wb-sticky{position:sticky;top:0;z-index:40}
.wb-fixed{position:fixed}
.wb-fixed.wb-scrolled>.wb-bg{background:var(--wb-scroll-bg,color-mix(in srgb,var(--c-bg) 92%,transparent))!important;box-shadow:0 6px 24px rgba(0,0,0,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.wb-bg{position:absolute;inset:0;overflow:hidden;z-index:0}
.wb-in{position:absolute;left:50%;top:0;z-index:1;transform-origin:0 0}
.wb-el{position:absolute}
.wb-flow{display:flex;flex-direction:column;padding:44px ${PAD}px}
.wb-flow>.wb-el,.wb-fg>.wb-el{position:relative;left:auto;top:auto}
.wb-fg{display:flex;flex-direction:column;padding:18px;position:relative}
.wb-c{width:100%;height:100%;display:block}
.wb-txt{margin:0;overflow-wrap:break-word;min-height:inherit}
.wb-txt p,.wb-txt div{margin:0}
.wb-txt a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.wb-gtext{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.wb-btn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s,color .25s;padding:0 18px;line-height:1.15;border:0;font:inherit}
.wb-bs-solid{background:var(--b-bg);color:var(--b-fg)}
.wb-bs-outline{background:transparent;color:var(--b-bg);box-shadow:inset 0 0 0 2px var(--b-bg)}
.wb-bs-ghost{background:color-mix(in srgb,var(--b-bg) 16%,transparent);color:var(--b-bg)}
.wb-bs-link{background:none;color:var(--b-bg);text-decoration:underline;text-underline-offset:4px;padding:0}
.wb-live .wb-hv-lift:hover{transform:translateY(-3px);box-shadow:0 12px 26px color-mix(in srgb,var(--b-bg) 35%,transparent)}
.wb-live .wb-hv-glow:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--b-bg) 30%,transparent),0 0 34px color-mix(in srgb,var(--b-bg) 60%,transparent)}
.wb-live .wb-bs-outline.wb-hv-fill:hover{background:var(--b-bg);color:var(--b-fg)}
.wb-live .wb-hv-fill:hover{filter:brightness(1.08)}
.wb-img{overflow:hidden;position:relative}
.wb-img img{width:100%;height:100%;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.wb-live .wb-hv-zoom:hover img{transform:scale(1.07)}
.wb-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px;color:var(--c-muted);font:500 13px/1.3 var(--f-body);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c-muted) 16%,transparent) 0 12px,color-mix(in srgb,var(--c-muted) 8%,transparent) 12px 24px);border-radius:inherit}
.wb-bgph{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;gap:8px;padding:18px 22px;color:var(--c-muted);font:500 13px var(--f-body);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c-muted) 14%,transparent) 0 14px,transparent 14px 28px)}
.wb-frame{overflow:hidden;position:relative;background:color-mix(in srgb,var(--c-muted) 12%,transparent)}
.wb-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wb-shield{position:absolute;inset:0;z-index:2}
.wb-form{display:flex;flex-direction:column;gap:10px}
.wb-form input,.wb-form textarea{width:100%;padding:13px 15px;border:1px solid color-mix(in srgb,var(--c-muted) 45%,transparent);border-radius:calc(var(--radius) * .7);background:var(--f-in);color:var(--f-fg);font:inherit;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.wb-form input:focus,.wb-form textarea:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-accent) 22%,transparent)}
.wb-form textarea{flex:1;min-height:110px;resize:vertical}
.wb-optin{display:flex;align-items:flex-start;gap:9px;font-size:.86em;line-height:1.4;color:var(--f-fg);opacity:.85;cursor:pointer;text-align:left}
.wb-form .wb-optin input{width:auto;flex:none;margin:.2em 0 0;padding:0;accent-color:var(--c-accent)}
.wb-form button{height:50px;border-radius:var(--radius);font-weight:600;font-size:15px}
.wb-form-msg{font-size:14px;min-height:1em;color:var(--f-fg)}
.wb-nav{display:flex;align-items:center;justify-content:space-between;gap:24px;position:relative}
.wb-nav a{color:inherit;text-decoration:none}
.wb-nav-logo{display:flex;align-items:center;white-space:nowrap;line-height:1}
.wb-nav-logo img{max-height:52px;max-width:200px;display:block}
.wb-nav-links{display:flex;align-items:center;gap:30px}
.wb-nav-links a{position:relative;padding:6px 0;opacity:.9;transition:opacity .2s}
.wb-nav-links a:hover,.wb-nav-links a.cur{opacity:1}
.wb-nav-links a:not(.wb-nav-cta)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--n-acc);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.wb-live .wb-nav-links a:not(.wb-nav-cta):hover::after,.wb-nav-links a.cur::after{transform:scaleX(1)}
.wb-nav-cta{background:var(--n-acc);color:var(--c-onaccent)!important;padding:10px 20px!important;border-radius:999px;opacity:1!important}
.wb-burger{display:none;width:42px;height:42px;border:0;background:none;color:inherit;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0}
.wb-burger i{display:block;width:24px;height:2px;background:currentColor;border-radius:2px;transition:transform .3s,opacity .3s}
.wb-nav-m .wb-burger{display:flex}
.wb-nav-m .wb-navdrop{position:absolute;top:calc(100% + 8px);left:0;right:0;flex-direction:column;align-items:stretch;gap:0;padding:10px;background:var(--n-drop);border-radius:var(--radius);box-shadow:0 18px 40px rgba(0,0,0,.25);display:none;z-index:80}
.wb-nav-m .wb-navdrop a{padding:13px 12px!important}
.wb-nav-m .wb-navdrop a::after{display:none}
.wb-nav-m .wb-navdrop .wb-nav-cta{margin-top:6px;text-align:center}
.wb-nav-m.open .wb-navdrop{display:flex}
.wb-nav-m.open .wb-burger i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.wb-nav-m.open .wb-burger i:nth-child(2){opacity:0}
.wb-nav-m.open .wb-burger i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.wb-social{display:flex;align-items:center;flex-wrap:wrap}
.wb-social a{color:inherit;display:flex;transition:transform .25s,opacity .25s;opacity:.85}
.wb-live .wb-social a:hover{transform:translateY(-2px);opacity:1;color:var(--c-accent)}
/* backgrounds */
.wb-grad{position:absolute;inset:0}
.wb-anim-gradient .wb-grad{background-size:300% 300%!important;animation:wbGrad calc(16s * var(--wb-spd)) ease infinite}
@keyframes wbGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.wb-bgimg{position:absolute;inset:0;background-size:cover;opacity:0;transition:opacity 1.8s ease}
.wb-bgimg.on{opacity:1}
.wb-anim-kenburns .wb-bgimg.on,.wb-anim-kenburns .wb-bgimg.prev{animation:wbKen calc(14s * var(--wb-spd)) linear both}
.wb-anim-kenburns .wb-bgimg:nth-child(even).on,.wb-anim-kenburns .wb-bgimg:nth-child(even).prev{animation-name:wbKen2}
@keyframes wbKen{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.2) translate(-2.5%,-2%)}}
@keyframes wbKen2{from{transform:scale(1.2) translate(2%,1.5%)}to{transform:scale(1.04) translate(0,0)}}
.wb-anim-zoom .wb-bgimg.on{animation:wbZoom calc(3.2s * var(--wb-spd)) cubic-bezier(.2,.7,.2,1) both}
@keyframes wbZoom{from{transform:scale(1.28);filter:blur(4px)}to{transform:scale(1);filter:none}}
.wb-anim-parallax .wb-bgimg{top:-22%;bottom:-22%;will-change:transform}
.wb-blob{position:absolute;width:62%;height:85%;border-radius:50%;filter:blur(90px);opacity:.5;animation:wbBlob calc(20s * var(--wb-spd)) ease-in-out infinite alternate}
.wb-blob0{left:-12%;top:-25%}
.wb-blob1{right:-15%;top:10%;animation-duration:calc(26s * var(--wb-spd));animation-direction:alternate-reverse}
.wb-blob2{left:25%;bottom:-40%;opacity:.3;animation-duration:calc(32s * var(--wb-spd))}
@keyframes wbBlob{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12%,10%) scale(1.15)}100%{transform:translate(-8%,16%) scale(.92)}}
.wb-ov{position:absolute;inset:0}
.wb-curtain{position:absolute;inset:0;z-index:5;display:flex;pointer-events:none}
.wb-curtain i{flex:1;background:var(--cur);transition:transform 1.5s cubic-bezier(.77,0,.18,1) .15s}
.wb-seen .wb-curtain i:first-child{transform:translateX(-101%)}
.wb-seen .wb-curtain i:last-child{transform:translateX(101%)}
/* entrance animations */
.wb-anim{opacity:0;transition:opacity var(--wb-dur,.9s) ease var(--wb-delay,0s),transform var(--wb-dur,.9s) cubic-bezier(.2,.7,.2,1) var(--wb-delay,0s),filter var(--wb-dur,.9s) ease var(--wb-delay,0s)}
.wb-a-fadeUp{transform:translateY(44px)}
.wb-a-fadeDown{transform:translateY(-44px)}
.wb-a-slideLeft{transform:translateX(-70px)}
.wb-a-slideRight{transform:translateX(70px)}
.wb-a-zoomIn{transform:scale(.84)}
.wb-a-blurIn{filter:blur(14px);transform:scale(1.04)}
.wb-a-flipUp{transform:perspective(700px) rotateX(40deg) translateY(30px);transform-origin:50% 100%}
.wb-a-letters{opacity:1}
.wb-anim.wb-on{opacity:1;transform:none;filter:none}
.wb-w{display:inline-block;white-space:nowrap}
.wb-ch{display:inline-block;opacity:0;transform:translateY(.55em) rotate(4deg);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--wb-delay,0s) + var(--i) * 32ms)}
.wb-on .wb-ch{opacity:1;transform:none}

/* thumbnails */
.wb-thumbmode .wb-ph,.wb-thumbmode .wb-bgph{background:linear-gradient(135deg,color-mix(in srgb,var(--c-accent) 55%,var(--c-surface)),color-mix(in srgb,var(--c-accent2) 45%,var(--c-bg)))!important}
.wb-thumbmode .wb-ph svg,.wb-thumbmode .wb-bgph *{display:none}
.wb-thumbmode .wb-bgph{opacity:.9}
/* platinum extras */
.wb-x{position:fixed;inset:0;pointer-events:none;z-index:2000;font-family:var(--f-body);color:var(--c-text)}
.wb-x *{box-sizing:border-box}
.wb-x>*{pointer-events:auto}
.wb-x-pill{position:absolute;right:20px;bottom:22px;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 22px;background:var(--c-accent);color:var(--c-onaccent);font:600 15px var(--f-body);cursor:pointer;box-shadow:0 12px 30px color-mix(in srgb,var(--c-accent) 45%,transparent);transition:transform .25s;animation:wbxIn .6s 1s both}
.wb-x-pill.with-chat{right:94px}
.wb-x-pill:hover{transform:translateY(-3px)}
.wb-x-chatbtn{position:absolute;right:20px;bottom:18px;width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;color:var(--c-onaccent);background:linear-gradient(135deg,var(--c-accent),var(--c-accent2));box-shadow:0 14px 34px color-mix(in srgb,var(--c-accent) 50%,transparent);display:flex;align-items:center;justify-content:center;transition:transform .3s;animation:wbxIn .6s 1.2s both}
.wb-x-chatbtn:hover{transform:scale(1.07)}
.wb-x-chatbtn::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--c-accent);opacity:0;animation:wbxPulse 2.6s 2s infinite}
.wb-x-chatbtn.open::after{display:none}
@keyframes wbxPulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@keyframes wbxIn{from{opacity:0;transform:translateY(20px)}}
.wb-x-chat{position:absolute;right:20px;bottom:94px;width:370px;height:min(540px,calc(100% - 120px));background:var(--c-surface);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 1px color-mix(in srgb,var(--c-muted) 25%,transparent);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(16px) scale(.97);transform-origin:bottom right;pointer-events:none;transition:opacity .28s,transform .28s cubic-bezier(.2,.7,.2,1)}
.wb-x-chat.on{opacity:1;transform:none;pointer-events:auto}
.wb-x-chat.full{left:10px;right:10px;width:auto;bottom:90px;height:calc(100% - 110px)}
.wb-x-ch{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,var(--c-accent),var(--c-accent2));color:var(--c-onaccent)}
.wb-x-ch i{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font:700 18px var(--f-head);font-style:normal}
.wb-x-ch div{flex:1;display:flex;flex-direction:column;line-height:1.25}
.wb-x-ch b{font-size:16px}
.wb-x-ch span{font-size:12px;opacity:.85}
.wb-x-ch button{border:0;background:rgba(255,255,255,.18);color:inherit;width:32px;height:32px;border-radius:50%;cursor:pointer}
.wb-x-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--c-bg)}
.wb-x-m{max-width:84%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.wb-x-m a{color:inherit;text-decoration:underline}
.wb-x-m.bot{align-self:flex-start;background:var(--c-surface);border-bottom-left-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.wb-x-m.me{align-self:flex-end;background:var(--c-accent);color:var(--c-onaccent);border-bottom-right-radius:5px}
.wb-x-typing{display:flex;gap:4px}
.wb-x-typing i{width:7px;height:7px;border-radius:50%;background:var(--c-muted);animation:wbxDot 1s infinite}
.wb-x-typing i:nth-child(2){animation-delay:.15s}.wb-x-typing i:nth-child(3){animation-delay:.3s}
@keyframes wbxDot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.wb-x-bookbtn{align-self:flex-start;display:flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:9px 16px;background:var(--c-accent);color:var(--c-onaccent);font:600 13.5px var(--f-body);cursor:pointer}
.wb-x-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px;background:var(--c-bg)}
.wb-x-chips:empty{display:none}
.wb-x-chips button{border:1px solid color-mix(in srgb,var(--c-accent) 50%,transparent);background:transparent;color:var(--c-accent);border-radius:999px;padding:7px 12px;font:500 13px var(--f-body);cursor:pointer}
.wb-x-in{display:flex;gap:8px;padding:12px;border-top:1px solid color-mix(in srgb,var(--c-muted) 20%,transparent);background:var(--c-surface)}
.wb-x-in input{flex:1;min-width:0;border:1px solid color-mix(in srgb,var(--c-muted) 35%,transparent);border-radius:999px;padding:11px 16px;background:var(--c-bg);color:var(--c-text);font:15px var(--f-body);outline:none}
.wb-x-in input:focus{border-color:var(--c-accent)}
.wb-x-in button{width:44px;height:44px;border-radius:50%;border:0;background:var(--c-accent);color:var(--c-onaccent);font-size:16px;cursor:pointer}
.wb-x-bk{position:absolute;inset:0;pointer-events:none}
.wb-x-bk.on{pointer-events:auto}
.wb-x-bk-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.wb-x-bk.on .wb-x-bk-bg{opacity:1}
.wb-x-bk-sheet{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--c-surface);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.7,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.3)}
.wb-x-bk.on .wb-x-bk-sheet{transform:none}
.wb-x-bk-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid color-mix(in srgb,var(--c-muted) 25%,transparent)}
.wb-x-bk-h b{flex:1;font:600 18px var(--f-head)}
.wb-x-bk-h a{font-size:13px;color:var(--c-muted)}
.wb-x-bk-h button{width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--c-muted) 18%,transparent);color:var(--c-text);cursor:pointer}
.wb-x-bk-body{flex:1;position:relative;background:#fff}
.wb-x-bk-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wb-x-spin{position:absolute;left:50%;top:40%;width:32px;height:32px;margin:-16px;border-radius:50%;border:3px solid rgba(0,0,0,.1);border-top-color:var(--c-accent);animation:wbxSpin .8s linear infinite}
@keyframes wbxSpin{to{transform:rotate(360deg)}}
.wb-x-note{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:90%;text-align:center}

/* shop */
.wb-lm{display:block;color:var(--lm-fg)}.wb-lm-load{padding:30px;text-align:center;color:var(--lm-mut);font-size:15px}.wb-lm-retry{margin-left:6px;font:inherit;font-weight:600;color:var(--lm-acc);background:none;border:1px solid currentColor;border-radius:999px;padding:3px 12px;cursor:pointer}.wb-lm-empty{min-height:160px;padding:20px;text-align:center}
.wb-lm-note{display:flex;align-items:center;gap:12px;justify-content:center;margin:0 auto 34px;max-width:640px;padding:12px 18px;border-radius:999px;background:var(--lm-card);color:var(--lm-fg);font-size:15px;font-weight:600}.wb-lm-note svg{color:var(--lm-acc);flex:none}
.wb-lm-cat{margin:0 0 40px}.wb-lm-ch{margin:0 0 6px;text-align:center;font-family:var(--f-head);font-size:30px;font-weight:600;color:var(--lm-acc)}.wb-lm-ch:after{content:"";display:block;width:70px;height:2px;margin:12px auto 0;background:var(--lm-acc);opacity:.6}
.wb-lm-blurb{margin:10px auto 0;max-width:640px;text-align:center;color:var(--lm-mut);font-size:15px}
.wb-lm-grid{display:grid;grid-template-columns:repeat(var(--lm-cols),minmax(0,1fr));gap:22px 56px;margin-top:24px}
.wb-lm-item{display:flex;gap:16px;align-items:flex-start;padding-bottom:18px;border-bottom:1px solid color-mix(in srgb,var(--lm-mut) 30%,transparent)}.wb-lm-item.is-out{opacity:.55}
.wb-lm-img{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none}.wb-lm-body{flex:1;min-width:0}
.wb-lm-top{display:flex;align-items:baseline;gap:10px}.wb-lm-top h4{margin:0;font-family:var(--f-head);font-size:21px;font-weight:600;line-height:1.3}.wb-lm-dots{flex:1;border-bottom:1px dotted color-mix(in srgb,var(--lm-mut) 55%,transparent);transform:translateY(-5px)}.wb-lm-top b{font-size:18px;color:var(--lm-acc);white-space:nowrap}
.wb-lm-body p{margin:5px 0 0;color:var(--lm-mut);font-size:15px;line-height:1.55}.wb-lm-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.wb-lm-tags span{font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--lm-card);color:var(--lm-mut)}.wb-lm-tags span.out{background:var(--lm-acc);color:var(--c-onaccent)}
.wb-shop{display:grid;align-content:start;min-height:inherit}
.wb-shop-empty{min-height:160px;border-radius:var(--radius)}
.wb-prod{background:var(--p-card);color:var(--p-fg);border-radius:var(--p-r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 26px rgba(0,0,0,.08);transition:transform .3s,box-shadow .3s}
.wb-live .wb-prod:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.14)}
.wb-prod-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:color-mix(in srgb,var(--c-muted) 12%,transparent)}
.wb-shop-one .wb-prod-img{aspect-ratio:1/1}
.wb-prod-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}
.wb-live .wb-prod:hover .wb-prod-img img{transform:scale(1.06)}
.wb-prod-tag{position:absolute;left:10px;top:10px;background:var(--c-accent);color:var(--c-onaccent);font:600 11px var(--f-body);letter-spacing:.5px;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.wb-prod-tag.so{left:auto;right:10px;background:#111;color:#fff}
.wb-prod-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.wb-prod-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wb-prod-name{margin:0;font:600 18px/1.25 var(--f-head)}
.wb-prod-price{font:700 17px var(--f-body);color:var(--c-accent);white-space:nowrap}
.wb-prod-desc{margin:0;font-size:14px;line-height:1.55;color:color-mix(in srgb,var(--p-fg) 70%,transparent);flex:1}

.wb-prod-add[disabled]{opacity:.55;cursor:default}
.wb-cartbtn{gap:8px;position:relative;width:100%;height:100%}
.wb-cart-count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--c-text);color:var(--c-bg);font:700 11.5px/20px var(--f-body);text-align:center}
.wb-x-cartfab{position:absolute;left:20px;bottom:66px;width:58px;height:58px;border-radius:50%;border:0;background:var(--c-text);color:var(--c-bg);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.wb-x-cartfab.on{display:flex;animation:wbxIn .4s both}
.wb-x-cartfab .wb-cart-count{position:absolute;top:-2px;right:-2px;background:var(--c-accent);color:var(--c-onaccent)}
.wb-x-cbody{flex:1;overflow:auto;padding:16px 18px 22px;display:flex;flex-direction:column;gap:16px}
.wb-x-cempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--c-muted);gap:6px}
.wb-x-cempty svg{width:40px;height:40px}
.wb-x-items{display:flex;flex-direction:column;gap:12px}
.wb-x-item{display:flex;gap:12px;align-items:center}
.wb-x-item img,.wb-x-item>i{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;background:color-mix(in srgb,var(--c-muted) 18%,transparent)}
.wb-x-item>div:nth-child(2){flex:1;display:flex;flex-direction:column;font-size:14px;line-height:1.35;min-width:0}
.wb-x-item span{color:var(--c-muted);font-size:13px}
.wb-x-qty{display:flex;align-items:center;gap:6px}
.wb-x-qty button{width:30px;height:30px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c-muted) 40%,transparent);background:transparent;color:var(--c-text);cursor:pointer;font-size:16px}
.wb-x-qty em{font-style:normal;min-width:18px;text-align:center;font-weight:600}
.wb-x-ful{display:flex;flex-direction:column;gap:8px;font-size:14px}

.wb-x-ful label.on{border-color:var(--c-accent);background:color-mix(in srgb,var(--c-accent) 8%,transparent)}
.wb-x-ful label span{flex:1;display:flex;flex-direction:column}
.wb-x-ful small{color:var(--c-muted);font-size:12.5px}
.wb-x-ful em{font-style:normal;font-weight:600}
.wb-x-ful input{accent-color:var(--c-accent)}
.wb-x-tot{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14.5px;border-top:1px solid color-mix(in srgb,var(--c-muted) 25%,transparent);padding-top:12px}
.wb-x-tot .big{font-size:18px;font-weight:700}
.wb-x-pay{width:100%;border:0;border-radius:12px;padding:15px;background:var(--c-accent);color:var(--c-onaccent);font:600 16px var(--f-body);cursor:pointer}
.wb-x-pay[disabled]{opacity:.5;cursor:default}
.wb-x-small{margin:-6px 0 0;text-align:center;font-size:12px;color:var(--c-muted)}
.wb-x-err{margin:0;color:#dc2626;font-size:13.5px}
.wb-x-order{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:wbxIn .3s}

.wb-x-osum{text-align:left;display:flex;flex-direction:column;gap:6px;font-size:14px;margin:6px 0 16px;padding:12px 14px;border-radius:12px;background:var(--c-bg)}
