<style>
:root{--ui-bg:#0d0d16;--ui-p:#14141f;--ui-p2:#1b1b29;--ui-line:#2a2a3c;--ui-t:#ececf6;--ui-m:#9a99b4;--ui-a:#8b5cf6;--ui-a2:#22d3ee;--ui-ok:#34d399;--ui-bad:#f87171;--ui-grad:linear-gradient(120deg,#8b5cf6,#3b82f6 55%,#22d3ee)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-t);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ui-a2)}
.hide{display:none!important}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--ui-p2);color:var(--ui-t);font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s,transform .15s,opacity .2s;white-space:nowrap}
.btn:hover{background:#262638}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ui-grad);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line)}
.btn.danger{background:#3a1d24;color:#fecaca}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12px;font-weight:600;color:var(--ui-m);text-transform:uppercase;letter-spacing:.6px}
.inp{width:100%;background:#0f0f19;border:1px solid var(--ui-line);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--ui-a)}
.muted{color:var(--ui-m)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--ui-grad);display:inline-block;box-shadow:0 0 24px #8b5cf655}
/* toast + modal */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1f1f30;border:1px solid var(--ui-line);padding:11px 18px;border-radius:12px;box-shadow:0 12px 40px #0008;animation:tIn .3s ease;font-weight:500;pointer-events:auto}
.toast.ok{border-color:#2f6f57}.toast.bad{border-color:#7a2f3a}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}}
.modal-bg{position:fixed;inset:0;background:#05050ccc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px;animation:fIn .2s}
@keyframes fIn{from{opacity:0}}
.modal{background:var(--ui-p);border:1px solid var(--ui-line);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;box-shadow:0 30px 80px #000a}
.modal.wide{width:min(1040px,100%)}
.ml-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}.ml-use{font-size:13px}
.ml-bar{height:6px;border-radius:6px;background:var(--ui-p2);overflow:hidden;margin:10px 0 12px}.ml-bar i{display:block;height:100%;width:0;background:var(--ui-grad);transition:width .4s}.ml-bar i.warn{background:#f59e0b}.ml-bar i.full{background:#ef4444}
.ml-tip{font-size:13px;margin:0 0 14px}.ml-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:2px}
.ml-it{position:relative;aspect-ratio:4/3;border:0;border-radius:10px;background:#0006 center/cover no-repeat;cursor:pointer;box-shadow:inset 0 0 0 1px var(--ui-line);transition:transform .15s,box-shadow .15s}
.ml-it:hover{transform:translateY(-2px)}.ml-it.on{box-shadow:0 0 0 3px #8b5cf6}.ml-it.on:after{content:"✓";position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:#8b5cf6;color:#fff;font:700 14px/24px sans-serif;text-align:center}
.ml-del{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:#000b;color:#fff;font:700 17px/25px sans-serif;text-align:center;opacity:0;transition:opacity .15s}.ml-it:hover .ml-del,.ml-it:focus .ml-del{opacity:1}@media(hover:none){.ml-del{opacity:1}}
.ml-empty{grid-column:1/-1;text-align:center;padding:30px 0}
.modal h2{margin:0 0 6px;font-size:21px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:radial-gradient(900px 500px at 10% 0%,#8b5cf633,transparent),radial-gradient(800px 500px at 100% 100%,#22d3ee22,transparent)}
.auth-card{width:min(420px,100%);background:var(--ui-p);border:1px solid var(--ui-line);border-radius:20px;padding:32px;box-shadow:0 30px 80px #0009}
.auth-card h1{font-size:26px;margin:22px 0 6px}
.auth-card .row{display:flex;gap:10px;margin-top:6px}
.auth-card .row .btn{flex:1;justify-content:center}
.auth-msg{min-height:20px;margin-top:12px;font-size:13px}
/* dashboard */
.dash{min-height:100vh;background:radial-gradient(1000px 500px at 0% 0%,#8b5cf61f,transparent)}
.dash-top{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--ui-line)}
.dash-top .sp{flex:1}
.dash-main{padding:34px 32px;max-width:1240px;margin:0 auto}
.dash-main h1{margin:0 0 4px;font-size:30px}
.demo-note{margin:18px 0 0;padding:12px 16px;border:1px dashed #6d5bd0;border-radius:12px;background:#8b5cf612;color:#d9d3ff;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:26px}
.scard{background:var(--ui-p);border:1px solid var(--ui-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.scard:hover{transform:translateY(-3px);border-color:#43435e}
.scard .thumb{height:190px;display:flex;align-items:flex-end;padding:16px;font-size:44px;font-weight:700;color:#fff;background:var(--ui-grad);position:relative;cursor:pointer;overflow:hidden}
.scard .thumb small{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;background:#0b0b14cc;backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px;letter-spacing:.6px;z-index:3}
.scard .thumb small.live{color:#6ee7b7}
.thumb.has-pv .tletter{display:none}
.thumb .tpv,.tpl .pv .tpv{position:absolute;left:0;top:0;width:100%;pointer-events:none;transition:transform var(--dur,5s) cubic-bezier(.45,.05,.35,1)}
.scard:hover .tpv,.tpl:hover .tpv{transform:translateY(var(--sc,0))}
.thumb.has-pv::after,.tpl .pv::after{content:"";position:absolute;inset:auto 0 0 0;height:50px;background:linear-gradient(transparent,#0000003a);pointer-events:none;z-index:2}
.thumb .tpv .wb-site,.tpl .tpv .wb-site{pointer-events:none}
.scard .meta{padding:14px 16px 6px}
.scard .meta b{display:block;font-size:16px}
.scard .meta span{font-size:12.5px;color:var(--ui-m)}
.scard .acts{display:flex;gap:6px;padding:10px 12px 14px;flex-wrap:wrap}
.newcard{border:1.5px dashed #3b3b55;background:transparent;border-radius:16px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ui-m);font-weight:600;font-size:15px;transition:border-color .2s,color .2s}
.newcard:hover{border-color:var(--ui-a);color:#fff}
.newcard i{font-style:normal;font-size:34px;width:60px;height:60px;border-radius:50%;background:var(--ui-grad);color:#fff;display:flex;align-items:center;justify-content:center}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:16px 0}
.tpl{border:2px solid var(--ui-line);border-radius:14px;overflow:hidden;background:var(--ui-p2);cursor:pointer;text-align:left;padding:0;transition:border-color .2s,transform .2s}
.tpl:hover{transform:translateY(-2px)}
.tpl.on{border-color:var(--ui-a);box-shadow:0 0 0 4px #8b5cf633}
.tpl .pv{height:190px;overflow:hidden;position:relative;pointer-events:none;background:#000}
.tpl .tx{padding:10px 12px}
.tpl .tx b{display:block}
.tpl .tx span{font-size:12px;color:var(--ui-m)}
.msg-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.msg{background:var(--ui-p2);border-radius:12px;padding:12px 14px;border:1px solid var(--ui-line)}
.msg .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ui-m)}
.msg p{margin:8px 0 0;white-space:pre-wrap}
/* editor layout */
.ed{position:fixed;inset:0;display:grid;grid-template-columns:292px 1fr 300px;grid-template-rows:58px 1fr;grid-template-areas:"top top top" "left canvas right"}
.ed-top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--ui-p);border-bottom:1px solid var(--ui-line);z-index:20;min-width:0}
.ed-top .sp{flex:1}
.ic{width:36px;height:36px;border-radius:9px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ui-t);transition:background .15s;flex:none}
.ic:hover{background:var(--ui-p2)}
.ic.on{background:#8b5cf633;color:#c4b5fd}
.ic[disabled]{opacity:.35;pointer-events:none}
.ic svg{width:19px;height:19px}
.ed-name{display:flex;flex-direction:column;line-height:1.15;min-width:0;max-width:220px}
.ed-name b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-status{font-size:11.5px;color:var(--ui-m)}
.ed-status.bad{color:var(--ui-bad);cursor:pointer;text-decoration:underline dotted}
.ed-status.ok{color:var(--ui-ok,#34d399)}
.seg{display:inline-flex;background:#0f0f19;border:1px solid var(--ui-line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ui-m)}
.seg button.on{background:var(--ui-p2);color:#fff}
.seg svg{width:17px;height:17px}
.sel-sm{background:#0f0f19;border:1px solid var(--ui-line);border-radius:9px;padding:7px 9px;font-size:13px;max-width:150px}
.ed-left,.ed-right{background:var(--ui-p);overflow:auto;min-height:0}
.ed-left{grid-area:left;border-right:1px solid var(--ui-line);display:flex;flex-direction:column}
.ed-right{grid-area:right;border-left:1px solid var(--ui-line)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--ui-line);position:sticky;top:0;background:var(--ui-p);z-index:2}
.tabs button{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:600;color:var(--ui-m);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--ui-a)}
.tabs svg{width:18px;height:18px}
.pane{padding:14px}
.pane h4{margin:16px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ui-m)}
.pane h4:first-child{margin-top:2px}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add-grid button{background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;transition:border-color .15s,background .15s}
.add-grid button:hover{border-color:var(--ui-a);background:#22223a}
.add-grid svg{width:24px;height:24px;color:#c4b5fd}
.lib-list{display:flex;flex-direction:column;gap:6px}
.lib-list button{text-align:left;background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:10px;padding:10px 12px;font-weight:500;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.lib-list button:hover{border-color:var(--ui-a)}
.lib-list button em{font-style:normal;color:var(--ui-m);font-size:11px}
.slist{display:flex;flex-direction:column;gap:5px}
.sitem{display:flex;align-items:center;gap:4px;background:var(--ui-p2);border:1px solid var(--ui-line);border-radius:10px;padding:5px 5px 5px 11px;font-size:13px;cursor:pointer}
.sitem.on{border-color:var(--ui-a);background:#8b5cf61c}
.sitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem small{color:var(--ui-m);font-size:10.5px;margin-right:4px}
.sitem .ic{width:28px;height:28px}
.sitem .ic svg{width:15px;height:15px}
.pal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pal{border:2px solid var(--ui-line);border-radius:12px;padding:8px;background:var(--ui-p2);display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:11px;font-weight:600}
.pal.on{border-color:var(--ui-a)}
.pal .dots{display:flex;gap:3px}
.pal .dots i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px #ffffff22}
.font-list{display:flex;flex-direction:column;gap:6px}
.font-list button{background:var(--ui-p2);border:2px solid var(--ui-line);border-radius:10px;padding:9px 12px;text-align:left;display:flex;justify-content:space-between;align-items:baseline}
.font-list button.on{border-color:var(--ui-a)}
.font-list b{font-size:19px;font-weight:500}
.font-list span{font-size:11px;color:var(--ui-m)}
/* inspector */
.insp-h{padding:14px 16px 10px;border-bottom:1px solid var(--ui-line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--ui-p);z-index:3}
.insp-h b{flex:1;font-size:14px}
.insp-h .tag{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:#8b5cf62a;color:#c4b5fd;padding:3px 8px;border-radius:99px}
.insp-empty{padding:30px 22px;color:var(--ui-m);text-align:center;font-size:13px;line-height:1.6}
.insp-empty b{color:#fff}
.insp-empty b.t{display:block;font-size:15px;margin-bottom:6px}
.i-grp{border-bottom:1px solid var(--ui-line)}
.i-grp summary{padding:12px 16px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ui-m);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.i-grp summary::-webkit-details-marker{display:none}
.i-grp summary::after{content:"▾";transition:transform .2s}
.i-grp:not([open]) summary::after{transform:rotate(-90deg)}
.i-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.i-row{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px;font-size:12.5px;color:#c9c8dc}
.i-row.full{grid-template-columns:1fr}
.i-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.i-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.i-4 label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--ui-m);font-weight:600}
.i-num,.i-text,.i-sel,.i-area{width:100%;background:#0f0f19;border:1px solid var(--ui-line);border-radius:8px;padding:7px 9px;font-size:13px;outline:none;min-width:0}
.i-num:focus,.i-text:focus,.i-sel:focus,.i-area:focus{border-color:var(--ui-a)}
.i-area{min-height:70px;resize:vertical}
.i-range{display:flex;align-items:center;gap:8px}
.i-range input{flex:1;accent-color:#8b5cf6;min-width:0}
.i-range output{font-size:11.5px;color:var(--ui-m);min-width:34px;text-align:right}
.i-sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.i-sw button{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff22;padding:0}
.i-sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ui-a)}
.i-sw button.none{background:repeating-linear-gradient(45deg,#555 0 3px,#222 3px 6px)}
.i-sw input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;border-radius:6px;cursor:pointer}
.i-seg{display:flex;background:#0f0f19;border:1px solid var(--ui-line);border-radius:8px;padding:2px}
.i-seg button{flex:1;border:0;background:none;border-radius:6px;padding:5px 4px;font-size:12px;font-weight:600;color:var(--ui-m)}
.i-seg button.on{background:var(--ui-p2);color:#fff}
.i-chk{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:#c9c8dc;cursor:pointer}
.i-chk input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:20px;background:#2b2b3e;position:relative;transition:background .2s;flex:none;cursor:pointer}
.i-chk input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.i-chk input:checked{background:var(--ui-a)}
.i-chk input:checked::after{transform:translateX(16px)}
.i-acts{display:flex;flex-wrap:wrap;gap:6px}
.i-note{font-size:12px;color:var(--ui-m);line-height:1.5;background:#0f0f19;border-radius:8px;padding:9px 10px}
.i-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.i-imgs div{position:relative;aspect-ratio:1;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--ui-line)}
.i-imgs button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:12px;line-height:1;padding:0}
.i-thumb{height:110px;border-radius:10px;background:#0f0f19 center/cover no-repeat;border:1px solid var(--ui-line);display:flex;align-items:center;justify-content:center;color:var(--ui-m);font-size:12px}
/* canvas */
.ed-canvas{grid-area:canvas;overflow:auto;position:relative;background:#08080e;background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:22px 22px;min-height:0;min-width:0}
.ed-stage{position:relative;margin:28px auto 120px;box-shadow:0 20px 70px #000c,0 0 0 1px #ffffff14;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ed-stage.phone{border-radius:34px;padding:0;box-shadow:0 0 0 10px #1c1c28,0 0 0 11px #34344a,0 30px 80px #000c;overflow:hidden}
.ed-mount{position:relative}
.ed-stage .wb-el{cursor:move;touch-action:none}
.ed-stage .wb-fg{cursor:move;touch-action:none}
.ed-stage .wb-el:hover{outline:calc(1px * var(--ik,1)) dashed #8b5cf6aa;outline-offset:0}
.ed-stage .wb-sec{outline:0}
.ed-stage .wb-sec:hover>.ed-secbar,.ed-stage .wb-sec.ed-on>.ed-secbar{opacity:1;pointer-events:auto}
.ed-stage .wb-sec.ed-on{box-shadow:inset 0 0 0 2px #22d3ee}
.ed-stage .wb-sec:hover>.ed-sech,.ed-stage .wb-sec.ed-on>.ed-sech,.ed-stage .wb-sec:hover>.ed-addsec{opacity:1}
.ed-secbar{position:absolute;top:8px;left:8px;z-index:60;display:flex;align-items:center;gap:2px;background:#111120ee;border:1px solid #33334a;border-radius:10px;padding:3px 3px 3px 10px;font:600 12px Inter,sans-serif;color:#fff;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 6px 20px #0007}
.wb-overlay>.ed-secbar{left:auto;right:8px;top:auto;bottom:-40px}
.ed-secbar span{margin-right:6px;white-space:nowrap}
.ed-secbar em{font-style:normal;color:#22d3ee;font-size:10px;margin-right:6px}
.ed-secbar button{width:26px;height:26px;border:0;background:none;color:#ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0}

<body>
<div id="app"></div>
<script>
/* =====================================================================
   Webescapade Site Builder — shared renderer (used by builder + viewer)
   Data model:
   site = { v, name, theme:{palette, colors{bg,surface,text,muted,accent,accent2,onaccent},
            fonts{head,body}, radius}, settings:{title,description},
            header:Section|null, footer:Section|null, pages:[{id,name,slug,sections:[Section]}] }
   Section = { id, name, anchor, h, mh, mcustom, sticky, overlay, bg:{...}, els:[El] }
   El = { id, t, x,y,w,h, z, s:{style}, c:content, m:{x,y,w,h,hide,size}|null, a:{type,delay,dur} }
   Desktop canvas is 1200 wide, mobile canvas 390 wide. Both are scaled with CSS zoom.
   ===================================================================== */
(function (global) {
  'use strict';
  const WB = {};
  const DESK = 1200, MOB = 390, BREAK = 760, PAD = 20;
  WB.DESK = DESK; WB.MOB = MOB; WB.BREAK = BREAK;

  /* ---------- small helpers ---------- */
  const uid = (p) => (p || 'e') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const num = (v, min, max, d) => { v = Number(v); if (!isFinite(v)) return d; return Math.min(max, Math.max(min, v)); };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  WB.uid = uid; WB.num = num; WB.esc = esc; WB.clone = clone;

  /* ---------- themes ---------- */
  WB.TOKENS = ['bg', 'surface', 'text', 'muted', 'accent', 'accent2', 'onaccent'];
  WB.PALETTES = {
    midnight:   { label: 'Midnight',   bg: '#0b0b1a', surface: '#16162e', text: '#f4f3ff', muted: '#a9a8c8', accent: '#8b5cf6', accent2: '#22d3ee', onaccent: '#ffffff' },
    noir:       { label: 'Noir & Gold',bg: '#0e0d0c', surface: '#1a1917', text: '#f5efe6', muted: '#a39b8f', accent: '#d4af37', accent2: '#8c6d3f', onaccent: '#111111' },
    ivory:      { label: 'Ivory',      bg: '#fbf8f2', surface: '#ffffff', text: '#1f1b16', muted: '#6f665a', accent: '#b08d57', accent2: '#2f4b3a', onaccent: '#ffffff' },
    terracotta: { label: 'Terracotta', bg: '#fbf4ee', surface: '#ffffff', text: '#2b1d17', muted: '#7a6257', accent: '#c0583b', accent2: '#e3a63b', onaccent: '#ffffff' },
    sage:       { label: 'Sage',       bg: '#f3f5ef', surface: '#ffffff', text: '#243127', muted: '#66756a', accent: '#6b8f71', accent2: '#c9a27e', onaccent: '#ffffff' },
    blush:      { label: 'Blush',      bg: '#fff6f6', surface: '#ffffff', text: '#3a2430', muted: '#8a6b78', accent: '#d16d8e', accent2: '#7c5c9e', onaccent: '#ffffff' },
    ocean:      { label: 'Ocean',      bg: '#f2f7fb', surface: '#ffffff', text: '#0f2233', muted: '#5a7184', accent: '#0e7490', accent2: '#f59e0b', onaccent: '#ffffff' },
    forest:     { label: 'Forest',     bg: '#0f1a14', surface: '#17261d', text: '#eef5ee', muted: '#9fb3a5', accent: '#7fc29b', accent2: '#e8c07a', onaccent: '#0f1a14' },
    mono:       { label: 'Mono',       bg: '#ffffff', surface: '#f4f4f5', text: '#111111', muted: '#6b6b6b', accent: '#111111', accent2: '#ef4444', onaccent: '#ffffff' }
  };
  WB.FONTS = {
    'Inter': 'Inter:wght@300;400;500;600;700',
    'DM Sans': 'DM+Sans:wght@400;500;700',
    'Poppins': 'Poppins:wght@300;400;500;600;700',
    'Montserrat': 'Montserrat:wght@300;400;500;600;700',
    'Raleway': 'Raleway:wght@300;400;500;600;700',
    'Outfit': 'Outfit:wght@300;400;500;600;700',
    'Space Grotesk': 'Space+Grotesk:wght@400;500;700',
    'Josefin Sans': 'Josefin+Sans:wght@300;400;600',
    'Bebas Neue': 'Bebas+Neue',
    'Playfair Display': 'Playfair+Display:ital,wght@0,400;0,600;0,700;1,400',
    'Cormorant Garamond': 'Cormorant+Garamond:ital,wght@0,400;0,600;1,400',
    'DM Serif Display': 'DM+Serif+Display:ital@0;1',
    'Fraunces': 'Fraunces:ital,wght@0,400;0,600;1,400',
    'Lora': 'Lora:ital,wght@0,400;0,600;1,400',
    'Great Vibes': 'Great+Vibes'
  };
  const SERIF = ['Playfair Display', 'Cormorant Garamond', 'DM Serif Display', 'Fraunces', 'Lora'];
  const fallback = (f) => SERIF.includes(f) ? 'Georgia, serif' : (f === 'Great Vibes' ? 'cursive' : 'system-ui, sans-serif');
  WB.FONT_PAIRS = {
    classic:   { label: 'Classic',   head: 'Playfair Display', body: 'Inter' },
    elegant:   { label: 'Elegant',   head: 'Cormorant Garamond', body: 'Raleway' },
    editorial: { label: 'Editorial', head: 'DM Serif Display', body: 'DM Sans' },
    modern:    { label: 'Modern',    head: 'Space Grotesk', body: 'Inter' },
    bold:      { label: 'Bold',      head: 'Bebas Neue', body: 'Montserrat' },
    friendly:  { label: 'Friendly',  head: 'Poppins', body: 'Poppins' },
    fresh:     { label: 'Fresh',     head: 'Outfit', body: 'Outfit' },
    warm:      { label: 'Warm',      head: 'Fraunces', body: 'DM Sans' }
  };

  /* ---------- safety: colours, links, images, rich text ---------- */
  function color(c, d) {
    if (c == null || c === '') return d || '';
    c = String(c).trim();
    if (c[0] === '@') { const t = c.slice(1); return WB.TOKENS.includes(t) ? 'var(--c-' + t + ')' : (d || ''); }
    if (/^#[0-9a-f]{3,8}$/i.test(c)) return c;
    if (/^rgba?\(\s*[\d.]+%?\s*,\s*[\d.]+%?\s*,\s*[\d.]+%?\s*(,\s*[\d.]+\s*)?\)$/i.test(c)) return c;
    if (c === 'transparent') return c;
    return d || '';
  }
  WB.color = color;
  function alpha(c, a) { // colour with opacity using color-mix (works for tokens and hex)
    const base = color(c, '#000000');
    return 'color-mix(in srgb, ' + base + ' ' + Math.round(num(a, 0, 1, 1) * 100) + '%, transparent)';
  }
  function safeHref(u) {
    if (!u) return '';
    u = String(u).trim();
    if (/^(https?:|mailto:|tel:)/i.test(u)) return u.replace(/[\s"'<>]/g, encodeURIComponent);
    if (/^#[\w-]*$/.test(u)) return u;
    if (/^page:[a-z0-9-]*$/.test(u)) return u;
    if (u === 'booking:') return u;
    if (/^[\w.-]+\.[a-z]{2,}(\/[^\s"'<>]*)?$/i.test(u)) return 'https://' + u;
    return '';
  }
  function safeImg(u) {
    if (!u) return '';
    u = String(u).trim();
    if (/^https:\/\/[^\s"'<>()\\]+$/i.test(u)) return u;
    if (/^data:image\/(png|jpe?g|webp|gif);base64,[a-z0-9+/=]+$/i.test(u)) return u;
    return '';
  }
  WB.safeHref = safeHref; WB.safeImg = safeImg;
  const cssUrl = (u) => 'url("' + u.replace(/["\\\n\r]/g, '') + '")';

  const ALLOWED = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1, A: 1, SPAN: 1, DIV: 1, P: 1 };
  const DROP = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|SVG|MATH|LINK|META|NOSCRIPT|TEXTAREA|SELECT|IMG|VIDEO|AUDIO|FORM|INPUT|BUTTON)$/i;
  function sanitize(html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = String(html == null ? '' : html);
    (function walk(node) {
      Array.from(node.childNodes).forEach((ch) => {
        if (ch.nodeType === 3) return;
        if (ch.nodeType !== 1) { ch.remove(); return; }
        if (DROP.test(ch.tagName)) { ch.remove(); return; }
        walk(ch);
        if (!ALLOWED[ch.tagName.toUpperCase()]) { ch.replaceWith(...Array.from(ch.childNodes)); return; }
        Array.from(ch.attributes).forEach((a) => { if (!(ch.tagName === 'A' && a.name === 'href')) ch.removeAttribute(a.name); });
        if (ch.tagName === 'A') { const h = safeHref(ch.getAttribute('href')); if (h) ch.setAttribute('href', h); else ch.removeAttribute('href'); }
      });
    })(tpl.content);
    return tpl.innerHTML;
  }
  WB.sanitize = sanitize;

  function videoEmbed(url, auto) {
    if (!url) return '';
    url = String(url).trim();
    let m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/i);
    if (m) {
      const q = auto ? '?autoplay=1&mute=1&loop=1&playlist=' + m[1] + '&controls=0&rel=0&playsinline=1' : '?rel=0';
      return 'https://www.youtube-nocookie.com/embed/' + m[1] + q;
    }
    m = url.match(/vimeo\.com\/(?:video\/)?(\d{5,12})/i);
    if (m) return 'https://player.vimeo.com/video/' + m[1] + (auto ? '?autoplay=1&muted=1&loop=1&background=1' : '');
    return '';
  }
  WB.videoEmbed = videoEmbed;

  /* ---------- theme css ---------- */
  function themeVars(theme) {
    theme = theme || {};
    const p = WB.PALETTES[theme.palette] || WB.PALETTES.midnight;
    const cols = Object.assign({}, p, theme.colors || {});
    const f = theme.fonts || {};
    const head = WB.FONTS[f.head] ? f.head : 'Playfair Display';
    const body = WB.FONTS[f.body] ? f.body : 'Inter';
    const out = WB.TOKENS.map((t) => '--c-' + t + ':' + (color(cols[t]) || p[t]));
    out.push("--f-head:'" + head + "'," + fallback(head));
    out.push("--f-body:'" + body + "'," + fallback(body));
    out.push('--radius:' + num(theme.radius, 0, 40, 12) + 'px');
    return out.join(';');
  }
  WB.themeVars = themeVars;

  function fontVar(f) {
    if (f === 'head') return 'var(--f-head)';
    if (!f || f === 'body') return 'var(--f-body)';
    if (WB.FONTS[f]) return "'" + f + "'," + fallback(f);
    return 'var(--f-body)';
  }
  WB.loadFonts = function (site, doc) {
    doc = doc || document;
    const set = new Set();
    const th = (site.theme && site.theme.fonts) || {};
    set.add(WB.FONTS[th.head] ? th.head : 'Playfair Display');
    set.add(WB.FONTS[th.body] ? th.body : 'Inter');
    allSections(site).forEach((sec) => (sec.els || []).forEach((el) => { const f = el.s && el.s.font; if (f && WB.FONTS[f]) set.add(f); }));
    const href = 'https://fonts.googleapis.com/css2?' + Array.from(set).map((f) => 'family=' + WB.FONTS[f]).join('&') + '&display=swap';
    let link = doc.getElementById('wb-fonts');
    if (!link) { link = doc.createElement('link'); link.id = 'wb-fonts'; link.rel = 'stylesheet'; doc.head.appendChild(link); }
    if (link.href !== href) link.href = href;
  };

  function allSections(site) {
    const out = [];

      if (physical && !ms.some((m) => m.id === fulfil)) fulfil = ms.length === 1 ? ms[0].id : '';
      const sel = ms.find((m) => m.id === fulfil);
      const ship = sel ? sel.fee : 0;
      let h = '<div class="wb-x-items">' + cart.map((i, n) => { const p = prods.get(i.id); return '<div class="wb-x-item">' + (safeImg(p.image) ? '<img alt="" src="' + esc(safeImg(p.image)) + '">' : '<i></i>') + '<div><b>' + esc(p.name) + '</b>' + (i.option ? '<span>' + esc(i.option) + '</span>' : '') + '<span>' + WB.money(p.price_cents) + '</span></div><div class="wb-x-qty"><button type="button" data-q="-1" data-n="' + n + '">−</button><em>' + i.qty + '</em><button type="button" data-q="1" data-n="' + n + '">+</button></div></div>'; }).join('') + '</div>';
      if (physical) {
        h += '<div class="wb-x-ful"><b>How would you like it?</b>' + (ms.length ? ms.map((m) => '<label class="' + (m.id === fulfil ? 'on' : '') + '"><input type="radio" name="wbful" value="' + m.id + '"' + (m.id === fulfil ? ' checked' : '') + '><span><b>' + esc(m.label) + '</b>' + (m.note ? '<small>' + esc(m.note) + '</small>' : '') + '</span><em>' + (m.fee ? WB.money(m.fee) : 'Free') + '</em></label>').join('') : '<p class="wb-x-err">Delivery options are not set up yet.</p>') + '</div>';
      }
      h += '<div class="wb-x-tot"><span>Subtotal</span><b>' + WB.money(sub) + '</b>' + (physical ? '<span>Delivery</span><b>' + (sel ? (ship ? WB.money(ship) : 'Free') : '—') + '</b>' : '') + '<span class="big">Total</span><b class="big">' + WB.money(sub + ship) + '</b></div>' +
        (err ? '<p class="wb-x-err">' + esc(err) + '</p>' : '') +
        '<button type="button" class="wb-x-pay"' + (physical && !sel ? ' disabled' : '') + '>🔒 Checkout securely</button><p class="wb-x-small">Payments are processed by Stripe. Apple Pay, Google Pay and cards accepted.</p>';
      body.innerHTML = h;
    }
    body.addEventListener('click', async (e) => {
      const q = e.target.closest('[data-q]');
      if (q) { const i = cart[+q.dataset.n]; i.qty += +q.dataset.q; if (i.qty < 1) cart.splice(+q.dataset.n, 1); else { const p = prods.get(i.id); if (p.stock != null && i.qty > p.stock) i.qty = p.stock; if (i.qty > 99) i.qty = 99; } save(); draw(); return; }
      const pay = e.target.closest('.wb-x-pay');
      if (pay) {
        if (o.preview) { draw('Preview only — on your live website this opens Stripe’s secure checkout.'); return; }
        pay.disabled = true; pay.textContent = 'Opening secure checkout…';
        try {
          const r = await o.api('checkout', { slug: o.slug, items: cart.map((i) => ({ id: i.id, qty: i.qty, option: i.option })), fulfilment: fulfil });
          if (r && r.url) { location.href = r.url; return; }
          throw new Error('Checkout is not available right now.');
        } catch (er) { draw(er.message || 'Checkout is not available right now.'); }
      }
    });
    body.addEventListener('change', (e) => { if (e.target.name === 'wbful') { fulfil = e.target.value; draw(); } });
    const onClick = (e) => {
      const add = e.target.closest && e.target.closest('[data-wb-add]');
      if (add && !add.disabled) {
        e.preventDefault();
        const id = add.dataset.wbAdd, p = prods.get(id); if (!p) return;
        const card = add.closest('.wb-prod'); const opt = card && card.querySelector('.wb-prod-opt');
        const option = opt ? opt.value : '';
        const ex = cart.find((i) => i.id === id && i.option === option);
        const inCart = cart.filter((i) => i.id === id).reduce((s, i) => s + i.qty, 0);
        const label = add.dataset.label || (add.dataset.label = add.textContent);
        const flash = (txt) => { add.textContent = txt; clearTimeout(add._t); add._t = setTimeout(() => { add.textContent = label; }, 1800); };
        if (p.stock != null && inCart >= p.stock) { flash(p.stock > 0 ? 'Only ' + p.stock + ' in stock' : 'No more in stock'); return; }
        if (ex) ex.qty++; else cart.push({ id, qty: 1, option });
        save();
        flash('✓ Added');
        open();
        return;
      }
      const a = e.target.closest && e.target.closest('a[href="#wb-cart"]');
      if (a) { e.preventDefault(); open(); }
    };
    root.addEventListener('click', onClick);
    update();
    if (o.openCart && cart.length) setTimeout(open, 400);
    // order confirmation page
    if (o.order && o.order.id) {
      const ov = document.createElement('div');
      ov.className = 'wb-x-order';
      ov.innerHTML = '<div class="wb-x-ocard"><div class="wb-x-spin"></div><p>Confirming your payment…</p></div>';
      layer.appendChild(ov);
      let tries = 0;
      const load = async () => {
        let r;
        try { r = await o.api('order', { order_id: o.order.id, token: o.order.token }); } catch (e) { ov.firstChild.innerHTML = '<h2>We couldn’t find that order</h2><p>' + esc(e.message || '') + '</p><button type="button" class="wb-x-pay">Close</button>'; ov.querySelector('button').onclick = () => ov.remove(); return; }
        if (r.status === 'pending' && tries++ < 8) { setTimeout(load, 2500); return; }
        const paid = r.status === 'paid' || r.status === 'fulfilled';
        if (paid) { cart = []; save(); }
        let h = paid ? '<div class="wb-x-tick">✓</div><h2>Thank you' + (r.customer && r.customer.name ? ', ' + esc(String(r.customer.name).split(' ')[0]) : '') + '!</h2><p>Your order is confirmed. Bookmark this page to come back to your order any time.</p>'
          : r.status === 'cancelled' ? '<h2>Order not completed</h2><p>The payment was not finished, so you have not been charged.</p>'
          : '<h2>Payment still processing</h2><p>This can take a minute. Refresh this page shortly — keep this link to come back to your order.</p>';
        h += '<div class="wb-x-osum">' + r.items.map((i) => '<div><span>' + esc(i.name) + (i.option ? ' — ' + esc(i.option) : '') + ' × ' + i.qty + '</span><b>' + WB.money(i.price_cents * i.qty) + '</b></div>').join('') +
          (r.fulfilment ? '<div><span>' + esc({ post: 'Postage', local: 'Local delivery', pickup: 'Pick up' }[r.fulfilment] || r.fulfilment) + '</span><b>' + (r.shipping_cents ? WB.money(r.shipping_cents) : 'Free') + '</b></div>' : '') +
          '<div class="t"><span>Total</span><b>' + WB.money(r.total_cents) + '</b></div></div>';
        if (r.vouchers && r.vouchers.length) h += '<div class="wb-x-ocodes"><b>Your gift voucher' + (r.vouchers.length > 1 ? 's' : '') + '</b>' + r.vouchers.map((v) => '<div><code>' + esc(v.code) + '</code><span>' + esc(v.product_name || '') + ' · ' + WB.money(v.amount_cents) + '</span></div>').join('') + '<small>Keep these codes safe — show them when you visit.</small></div>';
        if (r.downloads && r.downloads.length) h += '<div class="wb-x-ocodes"><b>Your downloads</b>' + r.downloads.map((d) => '<div><a href="' + esc(d.url) + '" target="_blank" rel="noopener">⬇ ' + esc(d.name) + '</a></div>').join('') + '<small>Links last 7 days. Open this page again any time for fresh links — bookmark it.</small></div>';
        h += '<button type="button" class="wb-x-pay">Back to the website</button>';
        ov.firstChild.innerHTML = h;
        ov.querySelector('.wb-x-pay').onclick = () => ov.remove();
      };
      load();
    }
    return function destroy() { root.removeEventListener('click', onClick); layer.remove(); };
  };

    if (site.footer) {
      site.footer.els.forEach((e) => { if (typeof e.c === 'string') e.c = e.c.replace(/Your Brand/g, WB.esc(d.name || siteName || '')); if (e.t === 'social') e.c = { linkedin: d.linkedin || '', email: d.email || '' }; });
      const f = site.footer.els.find((e) => e.t === 'heading'); if (f) f.c = WB.esc(d.name || siteName || ''); const t = site.footer.els.find((e) => e.t === 'text'); if (t) t.c = [WB.esc(d.title || ''), WB.esc(d.location || '')].filter(Boolean).join('<br>'); }
    return site;

  WB.TEMPLATES = T;
  WB.buildTemplate = function (key, name) {

      name: name || 'My website',
      theme: { palette: t.palette, colors: Object.assign({}, WB.PALETTES[t.palette]), fonts: { head: WB.FONT_PAIRS[t.fonts].head, body: WB.FONT_PAIRS[t.fonts].body }, radius: 14 },

<script>
/* =====================================================================
   Menu / price list import — reads a PDF, Word (.docx) or pasted text on the
   customer's own device (same reader as Restaurant Deluxe; no server, no AI)
   and returns { categories: [{ title, dishes: [{ name, desc, price }] }] }.
   ===================================================================== */
(function () {
  'use strict';
  var MI_SECTIONS = /^(entr[\u00e9e]es?|starters?|to (start|share|begin|finish|drink)|small plates?|large plates?|snacks?|nibbles?|raw|oysters?|salads?|soups?|mains?|main courses?|from the (grill|land|sea)|grill|seafood|meat|pizze?a?s?|pastas?|risotto|sides?|vegetables?|desserts?|sweets?|cheeses?|drinks?|beverages?|cocktails?|wines?|beer|kids?|children|set menu|tasting menu|degustation|breakfast|brunch|lunch|dinner|supper|specials?)\b/i;
  var MI_FOOTER   = /(allerg|dietar|surcharge|include[ds]? gst|prices? (are|include|subject)|public holiday|service charge|gratuit|10%|15%|please (advise|inform|note)|subject to)/i;
  var MI_PRICE    = /^([\s\S]*?)(\$\s?\d[\d.,]*(?:\s?(?:ea|each|pp|dozen|doz|per person))?|\bMP\b|\bP\.?O\.?A\.?\b|market price)\s*$/i;
  var MI_PRICEISH = /^(\$|mp$|p\.?o\.?a|\d)/i;

  function itemsToWords(items){
    var out = [];
    (items || []).forEach(function(it){
      var s = it.str; if(s == null || !/\S/.test(s)) return;
      var tr = it.transform || [1,0,0,1,0,0];
      var x = tr[4] || 0, y = -(tr[5] || 0), w = it.width || 0;
      out.push({ x:x, y:y, xM:x + w, t:s.replace(/\s+/g,' ').trim() });
    });
    return out;
  }
  function groupRows(ws){
    var rows = [];
    ws.slice().sort(function(a,b){ return a.y - b.y || a.x - b.x; }).forEach(function(w){
      var r = null;
      for(var i=0;i<rows.length;i++){ if(Math.abs(rows[i].y - w.y) <= 4){ r = rows[i]; break; } }
      if(!r){ r = { y:w.y, ws:[] }; rows.push(r); }
      r.ws.push(w);
    });
    return rows;
  }
  function rowText(ws){
    return ws.slice().sort(function(a,b){ return a.x - b.x; }).map(function(w){ return w.t; }).join(' ').replace(/\s+/g,' ').trim();
  }
  /* columns are found from where NAMES/DESCRIPTIONS start (prices are ignored,
     since they're right-aligned and would masquerade as extra columns) */
  function detectColumnStarts(words){
    var edges = [];
    groupRows(words).forEach(function(r){
      var ws = r.ws.slice().sort(function(a,b){ return a.x - b.x; });
      ws.forEach(function(w){
        if(MI_PRICEISH.test(w.t)) return;
        var hasLeft = ws.some(function(o){ return o.x < w.x && Math.abs(w.x - o.xM) < 14; });
        if(!hasLeft) edges.push(w.x);
      });
    });
    edges.sort(function(a,b){ return a-b; });
    var clusters = [];
    edges.forEach(function(x){
      var c = null;
      for(var i=0;i<clusters.length;i++){ if(Math.abs(clusters[i].x - x) <= 6){ c = clusters[i]; break; } }
      if(!c){ c = { x:x, xs:[] }; clusters.push(c); }
      c.xs.push(x); c.x = c.xs.reduce(function(a,b){ return a+b; },0)/c.xs.length;
    });
    if(!clusters.length) return [0];
    clusters.sort(function(a,b){ return b.xs.length - a.xs.length; });
    var top = clusters[0].xs.length, starts = [];
    clusters.forEach(function(c){
      if(c.xs.length >= Math.max(3, 0.25*top) && starts.every(function(s){ return Math.abs(c.x - s) > 120; })) starts.push(c.x);
    });
    starts.sort(function(a,b){ return a-b; });
    return starts.length ? starts : [0];
  }
  function wordsToLines(words){
    if(!words.length) return [];
    var starts = detectColumnStarts(words);
    function colOf(x){ var idx = 0; for(var i=0;i<starts.length;i++){ if(x >= starts[i]-8) idx = i; } return idx; }
    var byCol = {};
    words.forEach(function(w){ var c = colOf(w.x); (byCol[c] = byCol[c] || []).push(w); });
    var lines = [];
    Object.keys(byCol).forEach(function(c){
      groupRows(byCol[c]).forEach(function(r){ lines.push({ col:+c, y:r.y, text:rowText(r.ws) }); });
    });
    return lines;
  }
  function textToLines(text){
    var lines = [];
    String(text || '').split(/\r?\n/).forEach(function(l, i){
      l = l.replace(/[ \t]+/g,' ').trim();
      if(l) lines.push({ col:0, y:i, text:l });
    });
    return lines;
  }
  function tidyTitle(t){
    return t.replace(/\s+/g,' ').trim().toLowerCase().replace(/(^|[\s\-\/&(])(\S)/g, function(m,a,c){ return a + c.toUpperCase(); });
  }
  function isAllCapsShort(l){
    var letters = l.replace(/[^A-Za-z]/g,'');
    return letters.length >= 3 && l.length <= 34 && !/\d/.test(l) && l.indexOf('$') < 0 && l === l.toUpperCase();
  }
  function normPrice(p){ return p.replace(/\s+/g,' ').trim().replace(/\$\s+/,'$').replace(/^mp$/i,'MP'); }
  function mapDish(d){ return { name:d.name, desc:d.desc, price:d.price }; }

  function linesToMenu(lines){
    lines = (lines || []).slice();
    lines.forEach(function(ln){
      var t = ln.text;
      ln.priceM = t.match(MI_PRICE);
      ln.footer = MI_FOOTER.test(t) && !ln.priceM;
      ln.hdr = (MI_SECTIONS.test(t) || isAllCapsShort(t)) && !ln.priceM && t.length <= 40;
    });
    lines.sort(function(a,b){ return a.y - b.y || a.col - b.col; });
    var headers = lines.filter(function(l){ return l.hdr && !l.footer; });
    var started = null;
    for(var i=0;i<lines.length;i++){ if(!lines[i].footer && (lines[i].hdr || lines[i].priceM)){ started = lines[i].y; break; } }

    function sectionFor(d){
      /* nearest heading above the item in the SAME column; else the nearest above in any column */
      function near(list){ var best = null; list.forEach(function(h){ if(h.y <= d.y + 0.5 && (best === null || h.y > best.y + 0.5)) best = h; }); return best; }
      return near(headers.filter(function(h){ return h.col === d.col; })) || near(headers);
    }

    var dishes = [], cols = {};
    lines.forEach(function(l){ cols[l.col] = true; });
    Object.keys(cols).map(Number).sort(function(a,b){ return a-b; }).forEach(function(col){
      var cur = null;
      lines.filter(function(l){ return l.col === col; }).forEach(function(ln){
        if(started !== null && ln.y < started - 0.5) return;   /* skip the title block */
        if(ln.footer) return;
        if(ln.hdr){ cur = null; return; }
        if(ln.priceM){
          var name = ln.priceM[1].replace(/[.\s\-\u2013\u2014]+$/,'').trim();
          var price = normPrice(ln.priceM[2]);
          if(!name && cur && !cur.price){ cur.price = price; return; }   /* price on its own line */
          cur = { col:col, y:ln.y, name:name || 'Dish', price:price, desc:'' };
          dishes.push(cur);
        } else {
          if(cur) cur.desc = cur.desc ? (cur.desc + ' ' + ln.text) : ln.text;   /* description */
          else { cur = { col:col, y:ln.y, name:ln.text, price:'', desc:'' }; dishes.push(cur); }
        }
      });
    });

    dishes.forEach(function(d){ d.sec = sectionFor(d); });
    var seen = [], out = [];
    headers.slice().sort(function(a,b){ var pa = Math.floor(a.y / 100000), pb = Math.floor(b.y / 100000); return pa - pb || a.col - b.col || a.y - b.y; }).forEach(function(h){ if(seen.indexOf(h) < 0) seen.push(h); });
    var orphans = dishes.filter(function(d){ return !d.sec; });
    if(orphans.length){ orphans.sort(function(a,b){ return a.col - b.col || a.y - b.y; }); out.push({ title:'Menu', dishes:orphans.map(mapDish) }); }
    seen.forEach(function(h){
      var ds = dishes.filter(function(d){ return d.sec === h; });
      ds.sort(function(a,b){ return a.col - b.col || a.y - b.y; });
      if(ds.length) out.push({ title: tidyTitle(h.text), dishes: ds.map(mapDish) });
    });
    return { categories: out };
  }


  const LIBS = {
    pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
    docx: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'
  };
  const loaded = {};
  function load(src) {
    if (!loaded[src]) loaded[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('Could not load the document reader. Check your internet and try again.')); }; document.head.appendChild(s); });
    return loaded[src];
  }
  async function readPdfLines(file) {
    await load(LIBS.pdf);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
    const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      const tc = await (await pdf.getPage(n)).getTextContent();
      out = out.concat(wordsToLines(itemsToWords(tc.items)).map((l) => Object.assign(l, { y: l.y + n * 100000 })));
    }
    return out;
  }
  async function readDocxText(file) {
    await load(LIBS.docx);
    const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value;
  }
  function count(m) { return m.categories.reduce((a, c) => a + c.dishes.length, 0); }
  function check(m) {
    if (!m || !m.categories || !m.categories.length || !count(m)) throw new Error('We couldn’t pick out any items. Make sure each item has a price like $24, or paste the text instead.');
    return m;
  }
  WB.DocReader = { pdfLines: readPdfLines, docxText: readDocxText };
  WB.MenuImport = {
    async fromFile(file) {
      const name = (file.name || '').toLowerCase();
      if (name.endsWith('.pdf') || file.type === 'application/pdf') return check(linesToMenu(await readPdfLines(file)));
      if (name.endsWith('.docx')) return check(linesToMenu(textToLines(await readDocxText(file))));
      if (name.endsWith('.txt') || /^text\//.test(file.type)) return check(linesToMenu(textToLines(await file.text())));
      if (name.endsWith('.doc')) throw new Error('Old .doc files can’t be read — please save it as .docx or PDF, or paste the text.');
      throw new Error('Please choose a PDF, a Word (.docx) or a text file.');
    },
    fromText(text) { return check(linesToMenu(textToLines(text))); },
    count
  };
})();

/* =====================================================================
   Resume import — reads a PDF, Word (.docx) or pasted resume on the
   person's own device (no server, no AI) and returns:
   { name, title, summary, about, email, phone, location, linkedin, website,
     jobs:[{role, org, dates, points:[]}], education:[{title, org, dates}],
     skills:[], certs:[] }
   Grew out of ChefLink's resume reader, widened for any job.
   ===================================================================== */
(function () {
  'use strict';
  const MONTH = '(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\\.?';
  const DATE = '(?:' + MONTH + '\\s+)?(?:(?:0?[1-9]|1[0-2])\\/)?(?:19[6-9]\\d|20\\d{2})';
  const END = '(?:' + DATE + '|present|current|now|today|ongoing)';
  const RANGE = new RegExp('(' + DATE + ')\\s*(?:[-–—]|to|until)\\s*(' + END + ')', 'i');
  const SINGLE = new RegExp('\\b(' + DATE + ')\\b', 'i');

  const HEADS = [
    ['profile', /^(professional\s+summary|career\s+(summary|profile|objective)|personal\s+(statement|profile)|executive\s+summary|summary(\s+of\s+qualifications)?|profile|about(\s+me)?|objective|introduction)$/i],
    ['experience', /^(professional\s+experience|work\s+(experience|history)|employment(\s+history)?|career\s+history|(relevant\s+)?experience|positions?\s+held|career)$/i],
    ['education', /^(education(\s+(and|&)\s+(training|qualifications))?|academic\s+(background|qualifications)|qualifications?|training|studies)$/i],
    ['certs', /^(certifications?|certificates?|licen[cs]es?(\s+(and|&)\s+certifications?)?|accreditations?|tickets?)$/i],
    ['skills', /^(key\s+skills|core\s+(skills|competencies|strengths)|(technical\s+|soft\s+)?skills(\s+(and|&)\s+(abilities|expertise))?|expertise|areas\s+of\s+expertise|competencies|strengths|capabilities|tools(\s+(and|&)\s+technologies)?)$/i],
    ['contact', /^(contact(\s+(details|information|me))?|personal\s+details|details)$/i],
    ['other', /^(referees?|references?|interests|hobbies(\s+(and|&)\s+interests)?|languages|awards?(\s+(and|&)\s+achievements)?|achievements|volunteer(ing)?(\s+experience)?|projects|publications|memberships)$/i]
  ];
  const BULLET = /^\s*([•●▪◦■□➢►▸‣∙·*–—-]|\d+[.)])\s+/;
  const CAREER = /\b(manager|director|officer|assistant|coordinator|consultant|engineer|developer|designer|analyst|chef|cook|nurse|teacher|trainer|assessor|accountant|administrator|specialist|supervisor|lead|head|executive|associate|technician|electrician|plumber|carpenter|builder|apprentice|sales|marketing|receptionist|clerk|barista|waiter|waitress|attendant|representative|advisor|adviser|architect|photographer|writer|editor|producer|owner|founder|intern|volunteer|worker|operator|driver|therapist|stylist|hairdresser|beautician|pharmacist|doctor|dentist|lawyer|solicitor|paralegal|bookkeeper|scientist|researcher|lecturer|tutor|planner|estimator|surveyor|agent|broker|cleaner|carer|labourer|mechanic|fitter|welder|machinist|baker|butcher|server|host|bartender|sommelier|instructor|coach)s?\b/i;
  const NOT_NAME = /\b(resume|curriculum|vitae|cv|profile|summary|contact|address|mobile|phone|email|linkedin|references?|objective|page|history|experience|skills|education|qualifications?|work|employment|certificates?|street|road|avenue)\b/i;

  const fixAcro = (s) => s.replace(/\b(i{1,3}|iv|tafe|nsw|rsa|rcg|whs|uts|unsw|ict|it|hr)\b/gi, (m) => m.toUpperCase());
  const tc = (s) => s.toLowerCase().replace(/(^|[\s'’-])([a-zà-ÿ])/g, (m, a, c) => a + c.toUpperCase());
  const sentences = (s) => (s.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+/g) || (s.trim() ? [s.trim()] : [])).map((x) => x.trim());
  const stripBullet = (l) => l.replace(BULLET, '').trim();
  const isHead = (l) => {
    const c = l.trim().replace(/[:\-–—]+\s*$/, '').replace(/\s+/g, ' ');
    if (!c || c.length > 44) return null;
    for (const [k, rx] of HEADS) if (rx.test(c)) return k;
    return null;
  };

  function split(lines) {
    const sec = { head: [] }; let cur = 'head';
    lines.forEach((l) => { const h = isHead(l); if (h) { cur = h; sec[cur] = sec[cur] || []; return; } (sec[cur] = sec[cur] || []).push(l); });
    return sec;
  }

  function email(t) { const m = t.match(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i); return m ? m[0] : ''; }
  function phone(t) {
    const cands = t.match(/(?:\+\d{1,3}[\s.-]?)?(?:\(?\d{1,4}\)?[\s.-]?){2,5}\d{2,4}/g) || [];
    for (const c of cands) {
      const d = c.replace(/\D/g, '');
      if (d.length < 8 || d.length > 13) continue;
      if (/^(19|20)\d{2}(19|20)\d{2}$/.test(d)) continue;
      let au = d.startsWith('61') ? '0' + d.slice(2) : d;
      if (/^04\d{8}$/.test(au)) return au.replace(/(\d{4})(\d{3})(\d{3})/, '$1 $2 $3');
      if (/^0[2378]\d{8}$/.test(au)) return au.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2 $3');
      return c.trim();
    }
    return '';
  }
  function links(t) {
    const li = t.match(/(?:https?:\/\/)?(?:[a-z]{2,3}\.)?linkedin\.com\/in\/[\w%-]+\/?/i);
    const urls = (t.match(/(?:https?:\/\/|www\.)[^\s)>,|]+/gi) || []).map((u) => u.replace(/[.,;]$/, '')).filter((u) => !/linkedin\.com/i.test(u));

    }

  }

  /* split "Role at Org", "Role | Org", "Role, Org", "Role – Org" (or "Org – Role") */
  function roleOrg(text) {
    let t = text.replace(/\s+/g, ' ').replace(/^[\s|,•·–—-]+|[\s|,•·–—-]+$/g, '');

    if (!m) m = t.match(/^(.+?)\s*(?:\||–|—|\s-\s|,)\s*(.+)$/);
    if (!m) return CAREER.test(t) ? { role: t, org: '' } : { role: '', org: t };
    let a = m[1].trim(), b = m[2].trim();
    if (!CAREER.test(a) && CAREER.test(b)) [a, b] = [b, a];
    return { role: a, org: b };
  }

  /* entries = blocks anchored on a date range (jobs, study) */
  function entries(lines, wantPoints) {
    const out = []; let cur = null, pend = [];
    const flushPend = () => { if (cur && pend.length) { pend.forEach((p) => cur.points.push(p)); } pend = []; };
    lines.forEach((raw) => {
      const line = raw.trim(); if (!line) return;

        if (rest.replace(/[\s|,•·–—-]/g, '').length > 1) header.push(rest);

        if (hs.length === 1) Object.assign(cur, roleOrg(hs[0]));
        else if (hs.length >= 2) {
          const a = roleOrg(hs[0]), b = roleOrg(hs[1]);

  /* ---------------- image compression ---------------- */
  let PLAN = 'standard';
  function compressImage(file, maxDim) {
    return new Promise((res, rej) => {
      if (!/^image\//.test(file.type)) return rej(new Error('Please choose an image file.'));
      if (file.type === 'image/gif' && file.size < 2.5e6) return res({ blob: file, ext: 'gif' });
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        try {
          const free = PLAN !== 'platinum';
          const md = free ? Math.min(maxDim || 1800, 1600) : (maxDim || 1800);
          const sc = Math.min(1, md / Math.max(im.naturalWidth, im.naturalHeight));
          const w = Math.round(im.naturalWidth * sc), h = Math.round(im.naturalHeight * sc);
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const cx = cv.getContext('2d');
          const png = file.type === 'image/png' && file.size < 1.5e6;
          if (!png) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); }
          cx.drawImage(im, 0, 0, w, h);
          URL.revokeObjectURL(url);
          const done = (b, ext) => b ? res({ blob: b, ext: ext }) : rej(new Error('Could not process that image.'));
          if (png) cv.toBlob((b) => done(b, 'png'), 'image/png');
          else if (free) cv.toBlob((b) => { if (b && b.type === 'image/webp') done(b, 'webp'); else cv.toBlob((j) => done(j, 'jpg'), 'image/jpeg', 0.78); }, 'image/webp', 0.78);
          else cv.toBlob((b) => done(b, 'jpg'), 'image/jpeg', 0.82);
        } catch (e) { rej(e); }
      };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That image format could not be opened. Try a JPG or PNG.')); };
      im.src = url;
    });
  }

  // live mini preview of a site (first page) inside a card; scrolls slowly on hover
  function thumbInto(box, draft) {
    if (!draft || !box) return;
    try {
      const site = WB.normalizeSite(clone(draft));
      const pv = $('.tpv', box);
      const w = box.clientWidth || 300;
      const k = w / WB.DESK;
      // draw the page at full desktop size, then shrink the whole picture with a transform
      // (works the same in Safari, Chrome and Firefox; CSS zoom does not)
      const inner = document.createElement('div');
      inner.className = 'tpvi';
      inner.style.cssText = 'width:' + WB.DESK + 'px;transform:scale(' + k + ');transform-origin:0 0';
      pv.innerHTML = ''; pv.appendChild(inner);
      WB.renderPage(site, site.pages[0], inner, { thumb: true, device: 'desktop', width: WB.DESK, k: 1, maxSections: 6 });
      box.classList.add('has-pv');
      box.style.background = WB.color(site.theme.colors.bg, '#111');
      requestAnimationFrame(() => {
        const fullH = inner.offsetHeight * k;
        pv.style.height = fullH + 'px';
        const over = fullH - box.clientHeight;
        if (over > 10) { pv.style.setProperty('--sc', -over + 'px'); pv.style.setProperty('--dur', Math.min(9, Math.max(3, over / 120)) + 's'); }
      });
    } catch (e) { console.warn('thumbnail', e); }
  }

  async function cannotOpen(id, err) {
    const msg = (err && err.message) || '';
    if (/session expired/i.test(msg)) { rememberDest(id); toast('Please sign in again to open this website.', 'bad', 5000); return sb.auth.signOut(); }
    let why = 'missing', offline = /No connection/i.test(msg);
    if (!LOCAL && !offline) {
      if (!/^[0-9a-f-]{36}$/i.test(id)) why = 'missing';
      else { try { const { data, error } = await sb.rpc('builder_site_access', { p_id: id }); if (error) throw error; why = data || 'missing'; } catch (e) { offline = true; } }
    }
    const who = !LOCAL && user && user.email ? '<b>' + esc(user.email) + '</b>' : 'this account';
    const T = offline ? ['We couldn’t reach your website', 'Your connection or our server didn’t answer. Your work is safe — nothing has been changed.']
      : why === 'other' ? ['This website belongs to another account', 'You’re signed in as ' + who + ', but this website was made with a different Webescapade account. Sign out, then sign in with the email you used to create it.']
      : why === 'mine' ? ['We couldn’t open this website', 'It belongs to you, but it didn’t load. Please try again.']
      : ['We couldn’t find this website', 'It may have been deleted, or the link is incomplete. Your other websites are listed on your dashboard.'];
    const v = setView('<div class="auth"><div class="auth-card"><div class="logo"><i></i>Webescapade Site Builder</div><h1 style="font-size:22px">' + T[0] + '</h1><p class="muted" style="margin:0 0 20px;line-height:1.55">' + T[1] + '</p>' +
      '<div class="row" style="flex-wrap:wrap">' +
      (offline || why === 'mine' ? '<button class="btn pri" id="co-retry">Try again</button>' : '') +
      (why === 'other' && !LOCAL ? '<button class="btn pri" id="co-switch">Sign in with another account</button>' : '') +
      '<button class="btn ghost" id="co-dash">Go to my websites</button></div></div></div>');
    const r = $('#co-retry', v), s = $('#co-switch', v);
    if (r) r.onclick = () => openEditor(id);
    if (s) s.onclick = () => { rememberDest(id); sb.auth.signOut(); };
    $('#co-dash', v).onclick = () => { rememberDest(''); showDashboard(); };
  }

    const SYS_NAME = { restaurant: 'Restaurant Deluxe', service: 'Service Deluxe', trades: 'Trade Deluxe', other: 'your booking system' };
    function bookingFields(bk) {
      if (!bk.system) return '';

          (bk.url && !u ? '<p class="bk-st bad">⚠ That link doesn’t look right — it must start with https://</p>'
            : u ? '<p class="bk-st">Link saved. We can’t test other booking systems automatically — <a href="' + esc(u) + '" target="_blank" rel="noopener">open the link</a> to check it shows your booking page.</p>'

      }

      const ph = { restaurant: 'e.g. cafe-bojo', service: 'e.g. serenity-spa', trades: 'e.g. smith-electrical' }[bk.system];
      const code = WB.bookingCode(bk), v = bk.verified || {};
      const ok = code && v.system === bk.system && v.code === code;
      let st;
      if (!code) st = '<p class="bk-st">⚠ Not connected yet — type your ' + (bk.system === 'restaurant' ? 'venue' : 'business') + ' code (or paste your ' + SYS_NAME[bk.system] + ' booking link).</p>';
      else if (ok) st = '<p class="bk-st ok">✓ Connection verified — bookings go to <b>' + esc(v.name || code) + '</b>.</p>';
      else if (S.bkCheck && S.bkCheck.key === bk.system + '|' + code) st = S.bkCheck.busy ? '<p class="bk-st">Checking…</p>' : '<p class="bk-st bad">' + S.bkCheck.msg + '</p>';
      else st = '<p class="bk-st">Not tested yet — press <b>Test connection</b>.</p>';
      return '<label class="field"><span>' + label + '</span><input class="inp" data-site="booking.venue" value="' + esc(code) + '" placeholder="' + ph + '" autocapitalize="off" autocorrect="off" spellcheck="false"></label>' +
        '<div class="i-acts"><button class="btn sm" id="bk-test">Test connection</button>' + (WB.bookingUrl(bk) ? '<a class="btn sm ghost" target="_blank" rel="noopener" href="' + esc(WB.bookingUrl(bk)) + '">Open booking page ↗</a>' : '') + '</div>' + st;
    }
    function bookingMsg(r, code, sys) {
      const nm = r && r.name ? '“' + esc(r.name) + '”' : '“' + esc(code) + '”';
      switch (r && r.error) {
        case 'missing': return 'Type your code first.';
        case 'invalid': return 'Codes use only lowercase letters, numbers and dashes — like cafe-bojo.';
        case 'unknown': return 'We couldn’t find a ' + SYS_NAME[sys] + ' business with the code “' + esc(code) + '”. Check the code in your ' + SYS_NAME[sys] + ' settings — it’s the part after <b>?venue=</b> in your booking link.';
        case 'inactive': return nm + ' is switched off in ' + SYS_NAME[sys] + ', so it can’t take bookings right now.';
        case 'wrong_system': return nm + ' is a ' + SYS_NAME[r.actual] + ' business. Choose <b>' + SYS_NAME[r.actual] + '</b> as the booking system above.';
        case 'incomplete': return nm + ' has no services set up yet, so customers can’t book. Add your services in Service Deluxe, then test again.';
        case 'network': return 'We couldn’t reach the booking service just now. Your settings are saved — try again in a minute.';
        default: return 'That connection didn’t work. Check the code and try again.';
      }
    }
    async function testBooking(quiet) {
      const bk = S.site.booking || {}; const code = WB.bookingCode(bk);
      if (!/^(restaurant|service|trades)$/.test(bk.system || '')) return;
      const key = bk.system + '|' + code;
      if (!code) { S.bkCheck = { key, msg: bookingMsg({ error: 'missing' }, code, bk.system) }; renderLeft(); return; }
      S.bkCheck = { key, busy: true }; if (S.tab === 'extras') renderLeft();
      let r;
      try { r = await Store.checkBooking(bk.system, code); } catch (e) { r = { ok: false, error: 'network' }; }
      const now = S.site.booking || {};
      if (now.system + '|' + WB.bookingCode(now) !== key) return; // settings changed while checking
      if (r && r.ok) {
        S.bkCheck = null;
        change(() => { S.site.booking.verified = { system: bk.system, code, name: r.name || code, at: new Date().toISOString() }; }, { left: true, render: false });
        renderLeft();
        if (!quiet) toast('Connection verified — bookings go to ' + (r.name || code), 'ok');
      } else {
        S.bkCheck = { key, msg: bookingMsg(r, code, bk.system) };
        if ((now.verified || {}).code) change(() => { delete S.site.booking.verified; }, { render: false });
        if (S.tab === 'extras') renderLeft();
      }
    }

      if (S.editing || tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
      if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); return redo(); }
      if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); S.dirty = true; return saveNow(); }
      const f = S.sel && S.sel.el ? findEl(S.sel.el) : null;
      if (mod && e.key.toLowerCase() === 'c' && f) { S.clip = clone(f.el); toast('Copied'); return; }

      if (e.key === 'Escape') { return select(null); }
      if (e.key === 'Enter' && f && ['heading', 'text', 'button'].indexOf(f.el.t) >= 0) { e.preventDefault(); return enterEdit(f.el.id); }

      window.removeEventListener('wb-lm-loaded', onLm);
      window.removeEventListener('beforeunload', onUnload);
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', onHide);
      window.removeEventListener('online', onOnline);
      clearTimeout(S.saveTimer); clearTimeout(S.typeTimer);
      if (S.runtime) S.runtime();
      $$('.ed-pop').forEach((n) => n.remove());
      if (S.dirty) saveNow();
    };
    // expose a tiny handle for automated checks
    window.__wbEditor = { S, render, select, addElement, insertSection, undo, redo, findEl, saveNow, toCustom, change };
    S.tab = 'add';
    S.plan = 'standard';
    Store.plan().then((p) => { S.plan = p; PLAN = p; if (S.tab === 'extras') renderLeft(); }).catch(() => {});
    S.shopOn = false; S.products = []; S.shopStatus = null;
    Store.shopOn().then((v) => { S.shopOn = v; if (S.tab === 'shop') renderLeft(); }).catch(() => {});
    loadProducts();
    if (/shop_return=1/.test(location.search)) { S.tab = 'shop'; history.replaceState(null, '', location.pathname + location.hash); setTimeout(loadShopStatus, 300); }
    render({ left: true });
    setStatus(S.row.published_at ? 'Saved · live' : 'Saved · draft');
  }

  /* ---------------- boot ---------------- */
  async function boot() {
    if (LOCAL) { route(); return; }
    try {
      const { data } = await sb.auth.getSession();
      user = data.session && data.session.user;
    } catch (e) { user = null; }
    sb.auth.onAuthStateChange((ev, session) => {
      const had = !!user; user = session && session.user;
      if (!had && user) route();
      if (had && !user) showAuth();
    });
    if (!user) rememberDest(linkDest() || storedDest());
    user ? route() : showAuth();
  }
  function route() {
    const id = linkDest() || storedDest();
    if (location.search.match(/[?&]edit=/)) history.replaceState(null, '', location.pathname + location.search.replace(/[?&]edit=[\w-]+/, '').replace(/^&/, '?') + location.hash);
    if (id) openEditor(id); else showDashboard();
  }
  window.addEventListener('error', (e) => { console.error(e.error || e.message); });
  boot();
})();

</script>
</body>
</html>
