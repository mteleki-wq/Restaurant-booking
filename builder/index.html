.wb-x-ocodes{text-align:left;display:flex;flex-direction:column;gap:8px;margin:0 0 16px;padding:14px;border-radius:12px;border:1.5px dashed var(--c-accent)}

.wb-x-ocodes small{color:var(--c-muted);font-size:12px}
.wb-x-ocodes a{color:var(--c-accent);font-weight:600}

<script>
/* =====================================================================
   Menu / price list import — reads a PDF, Word (.docx) or pasted text on the
   customer's own device (same reader as Restaurant Deluxe; no server, no AI)
   and returns { categories: [{ title, dishes: [{ name, desc, price }] }] }.
   ===================================================================== */
(function () {
  'use strict';
  var MI_SECTIONS = /^(entr[\u00e9e]es?|starters?|to (start|share|begin|finish|drink)|small plates?|large plates?|snacks?|nibbles?|raw|oysters?|salads?|soups?|mains?|main courses?|from the (grill|land|sea)|grill|seafood|meat|pizze?a?s?|pastas?|risotto|sides?|vegetables?|desserts?|sweets?|cheeses?|drinks?|beverages?|cocktails?|wines?|beer|kids?|children|set menu|tasting menu|degustation|breakfast|brunch|lunch|dinner|supper|specials?)\b/i;
  var MI_FOOTER   = /(allerg|dietar|surcharge|include[ds]? gst|prices? (are|include|subject)|public holiday|service charge|gratuit|10%|15%|please (advise|inform|note)|subject to)/i;
  var MI_PRICE    = /^([\s\S]*?)(\$\s?\d[\d.,]*(?:\s?(?:ea|each|pp|dozen|doz|per person))?|\bMP\b|\bP\.?O\.?A\.?\b|market price)\s*$/i;
  var MI_PRICEISH = /^(\$|mp$|p\.?o\.?a|\d)/i;

  function itemsToWords(items){
    var out = [];
    (items || []).forEach(function(it){
      var s = it.str; if(s == null || !/\S/.test(s)) return;
      var tr = it.transform || [1,0,0,1,0,0];
      var x = tr[4] || 0, y = -(tr[5] || 0), w = it.width || 0;
      out.push({ x:x, y:y, xM:x + w, t:s.replace(/\s+/g,' ').trim() });
    });
    return out;

    const edu = entries(sec.education || [], false).map((e) => ({ title: e.role || e.org, org: e.role ? e.org : '', dates: e.dates }));
    if (!edu.length && sec.education) (sec.education || []).filter((l) => !BULLET.test(l) || true).slice(0, 6).forEach((l) => edu.push({ title: stripBullet(l), org: '', dates: '' }));

    let certs = list(sec.certs || []);
    if (!certs.length) { CERT.forEach((rx) => (text.match(rx) || []).forEach((c) => certs.push(c.trim().replace(/[,.;]+$/, '')))); certs = [...new Set(certs.map((c) => c.split(/\s+[-–—,]\s+/)[0]).map((c) => (c.length <= 5 ? c.toUpperCase() : fixAcro(tc(c)))))].filter((c) => !edu.some((e) => e.title.toLowerCase() === c.toLowerCase())).slice(0, 8); }

    if (about.length > 700) about = about.slice(0, 697).replace(/\s+\S*$/, '') + '…';
    const ttl = title(lines, nm) || (jobs[0] && jobs[0].role) || '';
    let summary = sentences(prof)[0] || '';
    if (summary.length > 160 || summary.length < 25) summary = [ttl, location(text)].filter(Boolean).join(' · ');
    const d = { name: nm, title: ttl, summary, about, email: em, phone: phone(text), location: location(text), linkedin: lk.linkedin, website: lk.website, jobs, education: edu.slice(0, 8), skills, certs };
    if (!d.name && !d.jobs.length && !d.email) throw new Error('We couldn’t find a name, contact details or jobs in that file. Try another file, or paste the text.');
    return d;
  }

  async function linesFromFile(file) {
    const n = (file.name || '').toLowerCase();
    if (n.endsWith('.pdf') || file.type === 'application/pdf') {
      const ls = await WB.DocReader.pdfLines(file);
      ls.sort((a, b) => Math.floor(a.y / 100000) - Math.floor(b.y / 100000) || a.col - b.col || a.y - b.y);
      return ls.map((l) => l.text);
    }
    if (n.endsWith('.docx')) return (await WB.DocReader.docxText(file)).split(/\r?\n/);
    if (n.endsWith('.txt') || /^text\//.test(file.type)) return (await file.text()).split(/\r?\n/);
    if (n.endsWith('.doc')) throw new Error('Old .doc files can’t be read — please save it as .docx or PDF, or paste the text.');

  }
  WB.ResumeImport = {
    async fromFile(file) { return parse(await linesFromFile(file)); },
    fromText(text) { return parse(String(text || '').split(/\r?\n/)); }
  };
})();

          const md = free ? Math.min(maxDim || 1800, 1600) : (maxDim || 1800);
          const sc = Math.min(1, md / Math.max(im.naturalWidth, im.naturalHeight));
          const w = Math.round(im.naturalWidth * sc), h = Math.round(im.naturalHeight * sc);
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const cx = cv.getContext('2d');
          const png = file.type === 'image/png' && file.size < 1.5e6;
          if (!png) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); }
          cx.drawImage(im, 0, 0, w, h);
          URL.revokeObjectURL(url);
          const done = (b, ext) => b ? res({ blob: b, ext: ext }) : rej(new Error('Could not process that image.'));
          if (png) cv.toBlob((b) => done(b, 'png'), 'image/png');
          else if (free) cv.toBlob((b) => { if (b && b.type === 'image/webp') done(b, 'webp'); else cv.toBlob((j) => done(j, 'jpg'), 'image/jpeg', 0.78); }, 'image/webp', 0.78);
          else cv.toBlob((b) => done(b, 'jpg'), 'image/jpeg', 0.82);
        } catch (e) { rej(e); }
      };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That image format could not be opened. Try a JPG or PNG.')); };
      im.src = url;
    });
  }
  function pickImages(multiple) {

  function limitBox(limit) {

  /* My photos: pick an uploaded photo or upload new ones */
  function chooseImages(multiple, maxDim) {
    if (Store.mode === 'local') return pickImages(multiple).then((f) => f.length ? uploadFiles(f, maxDim) : []);
    return new Promise((res) => {
      let done = false; const fin = (v) => { if (done) return; done = true; res(v); };
      const m = modal('<div class="ml-head"><h2>My photos</h2><span class="ml-use muted" id="ml-use">Loading…</span></div><div class="ml-bar"><i id="ml-fill"></i></div>' +
        '<p class="muted ml-tip">' + (multiple ? 'Tap photos to choose them, or upload new ones.' : 'Tap a photo to use it, or upload a new one.') + ' Photos are reused across your pages, so you never need to upload the same one twice.</p>' +
        '<div class="ml-grid" id="ml-grid"></div><div class="acts"><button class="btn ghost" data-x>Cancel</button><button class="btn" id="ml-up">Upload new</button>' + (multiple ? '<button class="btn pri" id="ml-use-sel" disabled>Use selected</button>' : '') + '</div>', { wide: true, onClose: () => fin([]) });
      const sel = []; let info = { limit: 30, files: [] };
      const draw = () => {
        const n = info.files.length, pct = Math.min(100, Math.round(n / info.limit * 100));
        $('#ml-use', m).textContent = n + ' of ' + info.limit + ' photos used' + (PLAN === 'platinum' ? '' : ' · free plan');
        $('#ml-fill', m).style.width = pct + '%'; $('#ml-fill', m).className = pct >= 100 ? 'full' : pct >= 80 ? 'warn' : '';
        $('#ml-grid', m).innerHTML = n ? info.files.map((f, i) => '<button type="button" class="ml-it' + (sel.indexOf(f.url) >= 0 ? ' on' : '') + '" data-i="' + i + '" style="background-image:url(&quot;' + esc(f.url) + '&quot;)"><span class="ml-del" data-del="' + i + '" title="Delete photo">×</span></button>').join('')
          : '<p class="muted ml-empty">No photos yet. Press Upload new to add your first one.</p>';
        const us = $('#ml-use-sel', m); if (us) { us.disabled = !sel.length; us.textContent = sel.length ? 'Use ' + sel.length + ' selected' : 'Use selected'; }
      };
      const load = () => Store.media().then((d) => { info = d; draw(); }).catch((e) => { $('#ml-use', m).textContent = ''; toast(e.message, 'bad'); });
      load();
      $('#ml-grid', m).onclick = async (e) => {
        const d = e.target.closest('[data-del]');
        if (d) {
          e.stopPropagation(); const f = info.files[+d.dataset.del];
          if (!await confirmBox('Delete this photo?', 'If it is used on any of your pages, it will disappear there too. This frees up one photo space.', 'Delete', true)) return;
          try { await Store.removeMedia(f.name); const k = sel.indexOf(f.url); if (k >= 0) sel.splice(k, 1); toast('Photo deleted', 'ok'); await load(); } catch (er) { toast(er.message, 'bad'); }
          return;
        }
        const it = e.target.closest('.ml-it'); if (!it) return;
        const u = info.files[+it.dataset.i].url;
        if (!multiple) { fin([u]); m.close(); return; }
        const k = sel.indexOf(u); if (k >= 0) sel.splice(k, 1); else sel.push(u); draw();
      };
      $('[data-x]', m).onclick = () => m.close();
      $('#ml-up', m).onclick = async () => {
        if (info.files.length >= info.limit) return limitBox(info.limit);
        const files = await pickImages(multiple); if (!files.length) return;
        const urls = await uploadFiles(files.slice(0, Math.max(1, info.limit - info.files.length)), maxDim);
        if (!urls.length) { load(); return; }
        if (!multiple) { fin(urls); m.close(); return; }
        urls.forEach((u) => sel.push(u)); await load();
      };
      const us = $('#ml-use-sel', m); if (us) us.onclick = () => { fin(sel.slice()); m.close(); };
    });
  }
  async function uploadFiles(files, maxDim) {
    const urls = [];
    let full = false;
    for (const f of files) {
      if (full) break;
      const t = frag('<div class="toast">Uploading ' + esc(f.name) + '…</div>'); toasts.appendChild(t);
      try {
        const c = await compressImage(f, maxDim);
        if (c.blob.size > 5e6) throw new Error('Image is too large after compression (over 5 MB).');
        urls.push(await Store.upload(c.blob, c.ext));
      } catch (e) {
        if (/row-level security|violates|403|unauthori[sz]ed/i.test(e.message || '')) { full = true; let lim = 30; try { lim = (await Store.media()).limit; } catch (x) {} limitBox(lim); }
        else toast(e.message || 'Upload failed', 'bad', 5000);
      }
      t.remove();
    }
    return urls;
  }

  // live mini preview of a site (first page) inside a card; scrolls slowly on hover
  function thumbInto(box, draft) {
    if (!draft || !box) return;
    try {
      const site = WB.normalizeSite(clone(draft));
      const pv = $('.tpv', box);
      const w = box.clientWidth || 300;
      const k = w / WB.DESK;
      // draw the page at full desktop size, then shrink the whole picture with a transform
      // (works the same in Safari, Chrome and Firefox; CSS zoom does not)
      const inner = document.createElement('div');
      inner.className = 'tpvi';
      inner.style.cssText = 'width:' + WB.DESK + 'px;transform:scale(' + k + ');transform-origin:0 0';
      pv.innerHTML = ''; pv.appendChild(inner);
      WB.renderPage(site, site.pages[0], inner, { thumb: true, device: 'desktop', width: WB.DESK, k: 1, maxSections: 6 });
      box.classList.add('has-pv');
      box.style.background = WB.color(site.theme.colors.bg, '#111');
      requestAnimationFrame(() => {
        const fullH = inner.offsetHeight * k;
        pv.style.height = fullH + 'px';
        const over = fullH - box.clientHeight;
        if (over > 10) { pv.style.setProperty('--sc', -over + 'px'); pv.style.setProperty('--dur', Math.min(9, Math.max(3, over / 120)) + 's'); }
      });
    } catch (e) { console.warn('thumbnail', e); }
  }

  /* ---------------- "Build it with AI": a few questions -> a ready-made first draft ---------------- */
  const AI_TYPES = [['restaurant', 'Restaurant / café'], ['bar', 'Bar / pub / wine bar'], ['venue', 'Function / event venue'], ['spa', 'Spa / massage / beauty'], ['salon', 'Hair / nail salon'], ['health', 'Health clinic / therapist'], ['fitness', 'Gym / yoga / fitness'], ['trades', 'Tradie / home services'], ['professional', 'Professional services'], ['creative', 'Photographer / creative'], ['retail', 'Shop / products'], ['other', 'Something else']];

  function aiModal(onDone, init) {

    const fld = (k, label, ph, opt) => '<label class="field"><span>' + label + (opt ? ' <small class="muted">(optional)</small>' : '') + '</span>' + (opt === 'area' || (opt && opt.area) ? '<textarea class="inp" rows="' + ((opt && opt.rows) || 4) + '" data-a="' + k + '" placeholder="' + esc(ph || '') + '">' + esc(ans[k] || '') + '</textarea>' : '<input class="inp" data-a="' + k + '" value="' + esc(ans[k] || '') + '" placeholder="' + esc(ph || '') + '">') + '</label>';

    const nav = (next, back) => '<div class="acts">' + (back !== false ? '<button class="btn ghost" id="ai-back">Back</button>' : '<button class="btn ghost" data-x>Cancel</button>') + '<button class="btn pri" id="ai-next">' + (next || 'Next') + '</button></div>';
    const collect = () => { $$('[data-a]', box).forEach((n) => { ans[n.dataset.a] = n.value.trim(); }); };
    const typeName = () => ans.type === 'other' ? (ans.typeOther || 'Small business') : ((AI_TYPES.find((t) => t[0] === ans.type) || [])[1] || '');
    const draw = () => {
      let h = '';
      if (step === 0) h = head('Let’s build your website', 'Answer a few quick questions and we’ll write a first draft of your website — ready for your photos and final touches.') +

        '<div class="field"><span>What kind of business is it?</span><div class="ai-chips">' + AI_TYPES.map(([k, l]) => '<button type="button" class="ai-chip' + (ans.type === k ? ' on' : '') + '" data-type="' + k + '">' + esc(l) + '</button>').join('') + '</div></div>' +
        (ans.type === 'other' ? fld('typeOther', 'Tell us in a few words', 'e.g. Dog grooming') : '') + nav('Next', false);
      if (step === 1) h = head('Where are you, and how can customers reach you?', 'These go straight onto your contact section, exactly as you type them.') +
        '<div class="i-2">' + fld('suburb', 'Suburb or city', 'e.g. Surry Hills, Sydney') + fld('phone', 'Phone', 'e.g. 02 9000 0000', true) + '</div>' +
        '<div class="i-2">' + fld('email', 'Email', 'e.g. hello@bellacucina.com.au', true) + fld('address', 'Street address', 'e.g. 12 Crown St, Surry Hills NSW', true) + '</div>' +
        area('hours', 'Opening hours', 'e.g. Tue–Sun 12pm till late', 2, true) + nav();
      if (step === 2) h = head('What do you offer?', 'The more you tell us, the better your website. Mention your main services, products or dishes — with prices if you’d like them shown.') +
        area('offer', 'What you offer', ans.type === 'restaurant' || ans.type === 'bar' ? 'e.g. Wood-fired pizza and handmade pasta, natural wines, weekend brunch…' : ans.type === 'trades' ? 'e.g. Emergency plumbing, blocked drains ($180), hot water systems…' : 'e.g. Relaxation massage 60 min $95, facials, gift vouchers…', 5) +
        area('special', 'What makes you special? Who are your customers?', 'e.g. Family-run since 2009, locally sourced, friendly team, great for families…', 4, true) + nav();
      if (step === 3) h = head('How should your website feel?', 'Pick the mood — we’ll choose colours and fonts to match. You can change them any time.') +
        '<div class="ai-chips big">' + AI_FEEL.map((f) => '<button type="button" class="ai-chip' + (ans.feel === f ? ' on' : '') + '" data-feel="' + esc(f) + '">' + esc(f) + '</button>').join('') + '</div>' + nav();
      if (step === 4) {
        if (!ans.want) ans.want = (AI_DEFAULTS[ans.type] || []).slice();
        h = head('What would you like on your website?', 'We always add a welcome section, an about section and a contact section with a form.') +
          '<div class="ai-chips">' + Object.keys(AI_WANT).map((k) => '<button type="button" class="ai-chip' + (ans.want.indexOf(k) >= 0 ? ' on' : '') + '" data-want="' + k + '">' + (ans.want.indexOf(k) >= 0 ? '✓ ' : '') + esc(AI_WANT[k]) + '</button>').join('') + '</div>' +
          (ans.type === 'restaurant' || ans.type === 'bar' ? '<div style="margin-top:14px">' + fld('venue', 'Use Restaurant Deluxe? Your venue code shows your live menu', 'e.g. sunset-grill', true) + '</div>' : '') +
          (ans.want.indexOf('booking') >= 0 ? '<p class="i-note">Online bookings connect to your booking system in the <b>Platinum</b> tab afterwards. Until then, the Book buttons take visitors to your contact section.</p>' : '') + nav();

        '<label class="imp-drop" id="ai-drop"><input type="file" id="ai-file" accept=".pdf,.docx,.txt,application/pdf" hidden>' + I('pages') + '<b>Drop a file here, or click to choose</b><span>PDF, Word (.docx) or text file — read on your device</span></label>' +
        area('pasted', 'Or paste text', 'Paste your menu, price list or any text about your business…', 7, true) +
        '<p class="i-note">To write your website, your answers and this text are sent to our AI service. Please don’t include passwords or card details. The AI writes a first draft — check every word, price and detail before you publish.</p>' + nav('✨ Build my website');

      $$('[data-want]', box).forEach((b) => { b.onclick = () => { collect(); const k = b.dataset.want, i = ans.want.indexOf(k); if (i >= 0) ans.want.splice(i, 1); else ans.want.push(k); draw(); }; });
      const x = $('[data-x]', box); if (x) x.onclick = () => m.close();
      const bk = $('#ai-back', box); if (bk) bk.onclick = () => { collect(); step--; draw(); };
      $('#ai-next', box).onclick = () => {
        collect();
        if (step === 0 && !ans.name) return toast('Please type your business name.', 'bad');
        if (step === 0 && !ans.type) return toast('Please choose the kind of business.', 'bad');
        if (step === 1 && ans.email && !/^\S+@\S+\.\S+$/.test(ans.email)) return toast('That email doesn’t look right.', 'bad');
        if (step === 2 && ans.offer.length < 10) return toast('Tell us a little about what you offer — a sentence or two is enough.', 'bad');
        if (step < STEPS - 1) { step++; draw(); return; }
        build();
      };
      const drop = $('#ai-drop', box), inp = $('#ai-file', box);
      if (drop) {
        const readFile = async (f) => {
          const n = (f.name || '').toLowerCase();
          try {
            let t = '';
            if (n.endsWith('.pdf') || f.type === 'application/pdf') t = (await WB.DocReader.pdfLines(f)).map((l) => (typeof l === 'string' ? l : l.text || '')).join('\n');
            else if (n.endsWith('.docx')) t = await WB.DocReader.docxText(f);
            else if (n.endsWith('.txt') || /^text\//.test(f.type)) t = await f.text();
            else return toast('Please choose a PDF, a Word (.docx) or a text file.', 'bad');
            collect(); ans.pasted = ((ans.pasted ? ans.pasted + '\n\n' : '') + t).slice(0, 14000); draw();
            toast('Added the text from ' + f.name + '. Check it below.', 'ok');
          } catch (e) { toast('We couldn’t read that file — try pasting the text instead.', 'bad', 6000); }
        };
        drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
        drop.addEventListener('dragleave', () => drop.classList.remove('over'));
        drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
        inp.onchange = () => { if (inp.files[0]) readFile(inp.files[0]); };

    const facts = () => ({ name: ans.name, type: typeName(), suburb: ans.suburb, address: ans.address, phone: ans.phone, email: ans.email, hours: ans.hours, offer: ans.offer, special: ans.special, feel: ans.feel, want: ans.want.filter((k) => k !== 'booking').map((k) => AI_WANT[k]), booking: ans.want.indexOf('booking') >= 0, venue: ans.venue });
    const build = async () => {
      if (busy) return; busy = true;

      const keep = {};

      const usable = (s) => s.type === 'testimonial' ? !!String(s.text || '').trim() : s.type === 'team' ? (s.items || []).some((i) => i && i.title) : s.type === 'stats' ? (s.items || []).filter((i) => i && i.title).length >= 2 : true;

        (plan.tagline ? '<p class="ai-tag">“' + esc(plan.tagline) + '”</p>' : '') +
        '<div class="ai-secs">' + secs.map((s, i) => '<label class="i-chk imp-r ai-sec"><input type="checkbox" data-sec="' + i + '" checked><span><b>' + esc(WB.AI_LABEL[s.type] || s.type) + '</b><small>' + preview(s) + '</small></span></label>').join('') + '</div>' +
        (miss.length ? '<div class="ai-miss"><b>Still to add</b><ul>' + miss.map((x) => '<li>' + esc(x) + '</li>').join('') + '<li>Your own photos</li></ul></div>' : '<div class="ai-miss"><b>Still to add</b><ul><li>Your own photos</li></ul></div>') +
        '<p class="i-note">Written by AI from your answers — please check every detail, especially prices and times, before you publish.' + (plan.__left != null ? ' You can build ' + plan.__left + ' more today.' : '') + '</p>' +
        '<div class="acts"><button class="btn ghost" id="ai-again" style="margin-right:auto">Change my answers</button><button class="btn ghost" data-x>Cancel</button><button class="btn pri" id="ai-use">Use this website</button></div>';
      $('[data-x]', box).onclick = () => m.close();
      $('#ai-again', box).onclick = () => { step = 0; draw(); };
      $('#ai-use', box).onclick = () => {
        const on = $$('[data-sec]', box).filter((n) => n.checked).map((n) => +n.dataset.sec);

        let site;
        try { site = WB.aiSite(p2, a2); } catch (e) { console.error(e); return toast('Something went wrong putting your website together. Please try again.', 'bad'); }
        m.close(); onDone(site, ans);
      };
    };
    draw();
  }

    function bookingMsg(r, code, sys) {
      const nm = r && r.name ? '“' + esc(r.name) + '”' : '“' + esc(code) + '”';
      switch (r && r.error) {
        case 'missing': return 'Type your code first.';
        case 'invalid': return 'Codes use only lowercase letters, numbers and dashes — like cafe-bojo.';
        case 'unknown': return 'We couldn’t find a ' + SYS_NAME[sys] + ' business with the code “' + esc(code) + '”. Check the code in your ' + SYS_NAME[sys] + ' settings — it’s the part after <b>?venue=</b> in your booking link.';
        case 'inactive': return nm + ' is switched off in ' + SYS_NAME[sys] + ', so it can’t take bookings right now.';
        case 'wrong_system': return nm + ' is a ' + SYS_NAME[r.actual] + ' business. Choose <b>' + SYS_NAME[r.actual] + '</b> as the booking system above.';
        case 'incomplete': return nm + ' has no services set up yet, so customers can’t book. Add your services in Service Deluxe, then test again.';
        case 'network': return 'We couldn’t reach the booking service just now. Your settings are saved — try again in a minute.';

    async function testBooking(quiet) {
      const bk = S.site.booking || {}; const code = WB.bookingCode(bk);
      if (!/^(restaurant|service|trades)$/.test(bk.system || '')) return;
      const key = bk.system + '|' + code;
      if (!code) { S.bkCheck = { key, msg: bookingMsg({ error: 'missing' }, code, bk.system) }; renderLeft(); return; }
      S.bkCheck = { key, busy: true }; if (S.tab === 'extras') renderLeft();
      let r;
      try { r = await Store.checkBooking(bk.system, code); } catch (e) { r = { ok: false, error: 'network' }; }
      const now = S.site.booking || {};
      if (now.system + '|' + WB.bookingCode(now) !== key) return; // settings changed while checking
      if (r && r.ok) {
        S.bkCheck = null;
        change(() => { S.site.booking.verified = { system: bk.system, code, name: r.name || code, at: new Date().toISOString() }; }, { left: true, render: false });
        renderLeft();
        if (!quiet) toast('Connection verified — bookings go to ' + (r.name || code), 'ok');
      } else {
        S.bkCheck = { key, msg: bookingMsg(r, code, bk.system) };
        if ((now.verified || {}).code) change(() => { delete S.site.booking.verified; }, { render: false });
        if (S.tab === 'extras') renderLeft();
      }
    }

          if (!code) warn = 'Online bookings aren’t connected yet — add your ' + SYS_NAME[bk.system] + ' code in the Platinum tab.';
          else if (!(vf.system === bk.system && vf.code === code)) {
            let r; try { r = await Store.checkBooking(bk.system, code); } catch (e) { r = null; }
            if (r && r.ok) { S.site.booking.verified = { system: bk.system, code, name: r.name || code, at: new Date().toISOString() }; markDirty(); }
            else warn = r ? bookingMsg(r, code, bk.system) : 'We couldn’t check your booking connection just now.';
          }
        }
        const m = modal('<h2>🎉 Your website is live</h2><p class="muted">Every time you make changes, press Publish again to update the live site.</p>' + (warn ? '<p class="bk-st bad" style="margin:0 0 14px">⚠ Bookings: ' + warn + '</p>' : '') + '<label class="field"><span>Your link</span><input class="inp" readonly value="' + esc(LOCAL ? '(demo mode — opens in this browser only)' : url) + '"></label><div class="acts"><button class="btn ghost" data-x>Close</button>' + (LOCAL ? '' : '<button class="btn" data-copy>Copy link</button>') + '<a class="btn pri" target="_blank" href="' + esc(url) + '">' + I('ext') + 'Open site</a></div>');
        $('[data-x]', m).onclick = () => m.close();
        const cp = $('[data-copy]', m); if (cp) cp.onclick = () => { navigator.clipboard.writeText(url).then(() => toast('Link copied', 'ok')); };
        if (S.tab === 'settings') renderLeft();
      } catch (e) { toast(e.message || 'Publishing failed', 'bad', 6000); }
      btn.disabled = false;
    }

    /* ---------- keyboard ---------- */
    function onKey(e) {
      if ($('.modal-bg') || $('.prev')) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (S.editing || tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
      if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); return redo(); }
      if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); S.dirty = true; return saveNow(); }
      const f = S.sel && S.sel.el ? findEl(S.sel.el) : null;
      if (mod && e.key.toLowerCase() === 'c' && f) { S.clip = clone(f.el); toast('Copied'); return; }
      if (mod && e.key.toLowerCase() === 'v' && S.clip) { const sec = curSec() || targetSection(); if (sec) { e.preventDefault(); duplicateEl(S.clip, sec); } return; }
      if (mod && e.key.toLowerCase() === 'd' && f) { e.preventDefault(); return duplicateEl(f.el, f.sec); }
      if ((e.key === 'Delete' || e.key === 'Backspace') && f) { e.preventDefault(); return elementAction('del', f.el.id); }
      if (e.key === 'Escape') { return select(null); }
      if (e.key === 'Enter' && f && ['heading', 'text', 'button'].indexOf(f.el.t) >= 0) { e.preventDefault(); return enterEdit(f.el.id); }
      if (f && /^Arrow/.test(e.key)) {
        const g = geom(f.el, f.sec); if (!g) return;
        e.preventDefault();
        const st = e.shiftKey ? 10 : 1;
        const d = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key];
        change(() => setGeom(f.el, f.sec, { x: g.x + d[0], y: g.y + d[1] }));
      }
    }
    document.addEventListener('keydown', onKey);
    let rT = null;
    const onResize = () => { clearTimeout(rT); rT = setTimeout(() => { if (!drag) renderCanvas(); }, 150); };
    window.addEventListener('resize', onResize);
    const onLm = (e) => { if (e.detail && findEl(e.detail)) fitText(e.detail); };
    window.addEventListener('wb-lm-loaded', onLm);

    destroyEditor = () => {
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('wb-lm-loaded', onLm);
      window.removeEventListener('beforeunload', onUnload);
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', onHide);
      window.removeEventListener('online', onOnline);
      clearTimeout(S.saveTimer); clearTimeout(S.typeTimer);
      if (S.runtime) S.runtime();
      $$('.ed-pop').forEach((n) => n.remove());
      if (S.dirty) saveNow();
    };
    // expose a tiny handle for automated checks
    window.__wbEditor = { S, render, select, addElement, insertSection, undo, redo, findEl, saveNow, toCustom, change };
    S.tab = 'add';
    S.plan = 'standard';
    Store.plan().then((p) => { S.plan = p; PLAN = p; if (S.tab === 'extras') renderLeft(); }).catch(() => {});
    S.shopOn = false; S.products = []; S.shopStatus = null;
    Store.shopOn().then((v) => { S.shopOn = v; if (S.tab === 'shop') renderLeft(); }).catch(() => {});
    loadProducts();
    if (/shop_return=1/.test(location.search)) { S.tab = 'shop'; history.replaceState(null, '', location.pathname + location.hash); setTimeout(loadShopStatus, 300); }
    render({ left: true });
    setStatus(S.row.published_at ? 'Saved · live' : 'Saved · draft');
  }

  /* ---------------- boot ---------------- */
  async function boot() {
    if (LOCAL) { route(); return; }
    try {
      const { data } = await sb.auth.getSession();
      user = data.session && data.session.user;
    } catch (e) { user = null; }
    sb.auth.onAuthStateChange((ev, session) => {
      const had = !!user; user = session && session.user;
      if (!had && user) route();
      if (had && !user) showAuth();
    });
    if (!user) rememberDest(linkDest() || storedDest());
    user ? route() : showAuth();
  }
  function route() {
    const id = linkDest() || storedDest();
    if (location.search.match(/[?&]edit=/)) history.replaceState(null, '', location.pathname + location.search.replace(/[?&]edit=[\w-]+/, '').replace(/^&/, '?') + location.hash);
    if (id) openEditor(id); else showDashboard();
  }
  window.addEventListener('error', (e) => { console.error(e.error || e.message); });
  boot();
  WB.__hub = { Store, modal, toast, confirmBox, esc, frag, $, $$, I, pickImages, uploadFiles, chooseImages, CFG };
})();

/* =====================================================================
   Webescapade Site Builder — email template (shared).
   The same file runs in the editor (live preview) and in the builder-email
   function (what is actually sent), so the preview is always the real email.
   Content v2: { v:2, look, accent, preheader, eyebrow, hero, headline, intro,
     button_text, button_url, sections:[…], signoff }
   Section types: pictext {img,title,text,side,btn_text,btn_url}
                  gallery {imgs[2-3],caption}
                  cards {title,items:[{img,title,text}] (2-3)}
                  text {title,text}
                  highlight {title,text,btn_text,btn_url}
                  button {text,url}
   ===================================================================== */
const WBMail = (() => {
  const LOOKS = {
    site: { label: 'Your website', bg: '#f3f2f7', card: '#ffffff', ink: '#17142b', text: '#2f2d3a', muted: '#6b6880', soft: '#f5f3fa', line: '#ebe8f2', accent: '#5b4bd6', head: 'Arial,Helvetica,sans-serif' },
    cream: { label: 'Cream & terracotta', bg: '#f3ece2', card: '#fffaf3', ink: '#3a2a20', text: '#4a3a30', muted: '#8a7768', soft: '#f5e8da', line: '#eadccb', accent: '#b4583a', head: 'Georgia,"Times New Roman",serif' },
    olive: { label: 'Olive', bg: '#edefe4', card: '#fbfcf6', ink: '#2c311d', text: '#3b402c', muted: '#737862', soft: '#e7ebd7', line: '#dfe3cd', accent: '#5f6b2f', head: 'Georgia,"Times New Roman",serif' },
    sage: { label: 'Soft sage', bg: '#edf3ef', card: '#ffffff', ink: '#24352c', text: '#33453b', muted: '#6c7f74', soft: '#e4efe8', line: '#dbe7df', accent: '#5f8f76', head: 'Georgia,"Times New Roman",serif' },
    midnight: { label: 'Midnight & gold', bg: '#0e1120', card: '#171b2d', ink: '#ffffff', text: '#d5d8e6', muted: '#959bb3', soft: '#21263d', line: '#2a3049', accent: '#c9a45c', head: 'Georgia,"Times New Roman",serif' },
  };
  const TYPES = { pictext: 'Picture + text', gallery: 'Photo row', cards: 'Highlights', text: 'Text', highlight: 'Offer box', button: 'Button' };
  const MAXSEC = 8;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const txt = (v, n) => String(v == null ? '' : v).replace(/\r/g, '').slice(0, n);
  const okImg = (u) => /^https:\/\/[^\s"'<>]+$/i.test(String(u || ''));
  const okUrl = (u) => /^https:\/\/[^\s"'<>]+$/i.test(String(u || '')) || /^(mailto:|tel:)[^\s"'<>]+$/i.test(String(u || ''));
  const hex = (h) => /^#[0-9a-f]{6}$/i.test(h || '');
  const onAccent = (h) => { const n = parseInt(h.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? '#17142b' : '#ffffff'; };

  // accepts v1 ({message,image,button_*}) or v2 content; returns safe v2
  function clean(c) {
    c = c || {};
    const out = { v: 2, look: LOOKS[c.look] ? c.look : 'site', accent: hex(c.accent) ? c.accent : '#5b4bd6', preheader: txt(c.preheader, 160), eyebrow: txt(c.eyebrow, 60),
      hero: okImg(c.hero) ? c.hero : (okImg(c.image) ? c.image : ''), headline: txt(c.headline, 140), intro: txt(c.intro != null ? c.intro : c.message, 4000),
      button_text: txt(c.button_text, 50), button_url: okUrl(c.button_url) ? String(c.button_url) : '', signoff: txt(c.signoff, 300), sections: [] };
    (Array.isArray(c.sections) ? c.sections : []).slice(0, MAXSEC).forEach((s) => {
      if (!s || !TYPES[s.t]) return;
      const b = { t: s.t };
      if (s.t === 'pictext') Object.assign(b, { img: okImg(s.img) ? s.img : '', title: txt(s.title, 120), text: txt(s.text, 1500), side: s.side === 'right' ? 'right' : 'left', btn_text: txt(s.btn_text, 40), btn_url: okUrl(s.btn_url) ? s.btn_url : '' });
      if (s.t === 'gallery') Object.assign(b, { imgs: (Array.isArray(s.imgs) ? s.imgs : []).filter(okImg).slice(0, 3), caption: txt(s.caption, 200) });
      if (s.t === 'cards') Object.assign(b, { title: txt(s.title, 120), items: (Array.isArray(s.items) ? s.items : []).slice(0, 3).map((i) => ({ img: okImg(i && i.img) ? i.img : '', title: txt(i && i.title, 60), text: txt(i && i.text, 300) })) });
      if (s.t === 'text') Object.assign(b, { title: txt(s.title, 120), text: txt(s.text, 3000) });
      if (s.t === 'highlight') Object.assign(b, { title: txt(s.title, 120), text: txt(s.text, 800), btn_text: txt(s.btn_text, 40), btn_url: okUrl(s.btn_url) ? s.btn_url : '' });
      if (s.t === 'button') Object.assign(b, { text: txt(s.text, 50), url: okUrl(s.url) ? s.url : '' });
      out.sections.push(b);
    });
    return out;
  }

  // anything with text the reader would see — used to stop empty sends
  function hasBody(c) { return !!(c.headline.trim() || c.intro.trim() || c.sections.length); }
  // [square bracket] notes left in from an idea
  function blanks(c) {
    const all = [c.headline, c.intro, c.preheader, c.signoff, c.button_text].concat(c.sections.map((s) => [s.title, s.text, s.caption, s.btn_text].concat((s.items || []).map((i) => i.title + ' ' + i.text)).map((x) => x || '').join(' '))).join(' ');
    return (all.match(/\[[^\]\n]{2,60}\]/g) || []).filter((v, i, a) => a.indexOf(v) === i);
  }

  function render(raw, biz, first, unsub) {
    const c = clean(raw), L = Object.assign({}, LOOKS[c.look]);
    if (c.look === 'site') L.accent = c.accent;
    const A = L.accent, AT = onAccent(A), F = 'Arial,Helvetica,sans-serif';
    const fill = (t) => esc(t).replace(/\{first_name\}/g, esc(first || 'there'));
    const paras = (t, size) => String(t || '').split(/\n{2,}/).map((p) => p.trim()).filter(Boolean)
      .map((p) => '<p style="margin:0 0 14px;font:' + (size || 16) + 'px/1.6 ' + F + ';color:' + L.text + '">' + fill(p).replace(/\n/g, '<br>') + '</p>').join('');
    const h2 = (t, center) => t ? '<h2 style="margin:0 0 10px;font:bold 22px/1.25 ' + L.head + ';color:' + L.ink + (center ? ';text-align:center' : '') + '">' + fill(t) + '</h2>' : '';
    const btn = (t, u, center) => t && u ? '<table role="presentation" cellpadding="0" cellspacing="0"' + (center ? ' align="center"' : '') + ' style="margin:6px ' + (center ? 'auto' : '0') + ' 4px"><tr><td style="border-radius:999px;background:' + A + '"><a href="' + esc(u) + '" style="display:inline-block;padding:13px 26px;font:bold 15px ' + F + ';color:' + AT + ';text-decoration:none;border-radius:999px">' + esc(t) + '</a></td></tr></table>' : '';
    const img = (u, r) => '<img src="' + esc(u) + '" alt="" width="100%" style="display:block;width:100%;height:auto;border:0;border-radius:' + (r == null ? 12 : r) + 'px">';
    const row = (inner, pad) => '<tr><td class="wbm-pad" style="padding:' + (pad || '0 32px 26px') + '">' + inner + '</td></tr>';

    const secs = c.sections.map((s) => {
      if (s.t === 'text') return row(h2(s.title) + paras(s.text));
      if (s.t === 'button') return row(btn(s.text, s.url, true));
      if (s.t === 'highlight') return row('<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:' + L.soft + ';border-radius:14px;border-left:5px solid ' + A + '"><tr><td style="padding:22px 24px">' + h2(s.title) + paras(s.text, 15) + btn(s.btn_text, s.btn_url) + '</td></tr></table>');
      if (s.t === 'gallery') {
        const n = s.imgs.length; if (!n) return '';
        const w = n === 1 ? 100 : n === 2 ? 50 : 33;
        return row('<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>' + s.imgs.map((u, i) => '<td width="' + w + '%" valign="top" style="padding:0 ' + (i < n - 1 ? 4 : 0) + 'px 0 ' + (i ? 4 : 0) + 'px">' + img(u, 10) + '</td>').join('') + '</tr></table>' +
          (s.caption ? '<p style="margin:10px 0 0;font:italic 14px/1.5 ' + F + ';color:' + L.muted + ';text-align:center">' + fill(s.caption) + '</p>' : ''));
      }
      if (s.t === 'cards') {
        const it = s.items.filter((i) => i.title || i.text || i.img); if (!it.length) return '';
        const w = it.length === 1 ? 100 : it.length === 2 ? 50 : 33;
        return row(h2(s.title, true) + '<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>' + it.map((i, k) => '<td class="wbm-col" width="' + w + '%" valign="top" style="padding:8px ' + (k < it.length - 1 ? 6 : 0) + 'px 0 ' + (k ? 6 : 0) + 'px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:' + L.soft + ';border-radius:12px"><tr><td style="padding:' + (i.img ? '0' : '16px 16px 4px') + '">' + (i.img ? img(i.img, 12) : '') + '</td></tr><tr><td style="padding:' + (i.img ? '14px' : '0') + ' 16px 16px">' +
          (i.title ? '<p style="margin:0 0 6px;font:bold 16px/1.3 ' + L.head + ';color:' + L.ink + '">' + fill(i.title) + '</p>' : '') + (i.text ? '<p style="margin:0;font:14px/1.5 ' + F + ';color:' + L.text + '">' + fill(i.text).replace(/\n/g, '<br>') + '</p>' : '') + '</td></tr></table></td>').join('') + '</tr></table>');
      }
      if (s.t === 'pictext') {
        const words = h2(s.title) + paras(s.text, 15) + btn(s.btn_text, s.btn_url);
        if (!s.img) return row(words);
        const pic = '<td class="wbm-col" width="48%" valign="middle" style="padding:0">' + img(s.img, 12) + '</td>';
        const gap = '<td class="wbm-gap" width="4%" style="font-size:0">&nbsp;</td>';
        const tx = '<td class="wbm-col" width="48%" valign="middle" style="padding:0">' + words + '</td>';
        return row('<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>' + (s.side === 'right' ? tx + gap + pic : pic + gap + tx) + '</tr></table>');
      }
      return '';
    }).join('');

    const site = biz.site || '';
    return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><title>' + esc(raw && raw.subject || '') + '</title>' +
      '<style>@media (max-width:540px){.wbm-col{display:block!important;width:100%!important;padding:0 0 12px!important}.wbm-gap{display:none!important}.wbm-pad{padding-left:20px!important;padding-right:20px!important}h1{font-size:26px!important}}</style></head>' +
      '<body style="margin:0;padding:0;background:' + L.bg + '">' +
      '<div style="display:none;max-height:0;overflow:hidden;opacity:0">' + esc(c.preheader) + '&#8203;&nbsp;&#8203;&nbsp;&#8203;&nbsp;</div>' +
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:' + L.bg + '"><tr><td align="center" style="padding:24px 10px">' +
      '<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:' + L.card + ';border-radius:18px;overflow:hidden">' +
      '<tr><td style="padding:20px 32px;font:bold 19px ' + L.head + ';color:' + L.ink + ';border-bottom:1px solid ' + L.line + '"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + A + ';margin-right:10px"></span>' + esc(biz.name) + '</td></tr>' +
      (c.hero ? '<tr><td>' + img(c.hero, 0) + '</td></tr>' : '') +
      '<tr><td class="wbm-pad" style="padding:30px 32px 10px">' +
      (c.eyebrow ? '<p style="margin:0 0 8px;font:bold 12px ' + F + ';letter-spacing:2px;text-transform:uppercase;color:' + A + '">' + fill(c.eyebrow) + '</p>' : '') +
      (c.headline ? '<h1 style="margin:0 0 16px;font:bold 30px/1.18 ' + L.head + ';color:' + L.ink + '">' + fill(c.headline) + '</h1>' : '') +
      paras(c.intro) + btn(c.button_text, c.button_url) + '</td></tr>' +
      (secs ? '<tr><td style="padding:10px 0 0"><table role="presentation" width="100%" cellpadding="0" cellspacing="0">' + secs + '</table></td></tr>' : '') +
      (c.signoff ? '<tr><td class="wbm-pad" style="padding:0 32px 28px">' + paras(c.signoff, 15) + '</td></tr>' : '<tr><td style="height:8px"></td></tr>') +
      '<tr><td style="padding:20px 32px 26px;background:' + L.soft + ';font:13px/1.6 ' + F + ';color:' + L.muted + '"><b style="color:' + L.ink + '">' + esc(biz.name) + '</b>' +
      (site ? ' · <a href="' + esc(site) + '" style="color:' + L.muted + '">' + esc(site.replace(/^https:\/\//, '')) + '</a>' : '') +
      '<br>You are receiving this because you asked to hear from ' + esc(biz.name) + '. Reply to this email to contact us.<br>' +
      '<a href="' + esc(unsub || '#') + '" style="color:' + L.muted + '">Unsubscribe</a></td></tr>' +
      '</table></td></tr></table></body></html>';
  }

  return { LOOKS, TYPES, MAXSEC, clean, render, hasBody, blanks, okImg, okUrl };
})();
if (typeof window !== 'undefined') window.WBMail = WBMail;

/* =====================================================================
   Webescapade Site Builder — email ideas for the Business hub.
   Each idea builds a full v2 email from the owner's own website:
   their name, their booking link and their photos. Details only the
   owner knows are left in [square brackets] and must be filled in
   before a test or a send.
   ===================================================================== */
(function () {
  'use strict';

  const KIND = {
    restaurant: { label: 'Restaurant & café', btn: 'Book a table' },
    function: { label: 'Function & events venue', btn: 'Enquire now' },
    service: { label: 'Salon, spa & clinic', btn: 'Book now' },
    trades: { label: 'Trades & home services', btn: 'Book a job' },
    shop: { label: 'Shop', btn: 'Shop now' },
    general: { label: 'Any business', btn: 'Visit our website' },
  };

  // every https picture used on the website, most-used first
  WB.siteImages = function (site) {
    const seen = {}, order = [];
    const walk = (v, k) => {
      if (!v) return;
      if (typeof v === 'string') {
        if (/^https:\/\/[^\s"'<>]+$/i.test(v) && (/\.(jpe?g|png|webp|avif)(\?|$)/i.test(v) || /^(src|img|image|bg|photo|hero|poster)$/i.test(k || ''))) {
          if (!seen[v]) { seen[v] = 0; order.push(v); } seen[v]++;
        }
        return;
      }
      if (Array.isArray(v)) return v.forEach((x) => walk(x, k));
      if (typeof v === 'object') Object.keys(v).forEach((kk) => { if (!/^(favicon|logo|icon|og)$/i.test(kk)) walk(v[kk], kk); });
    };
    walk(site, '');
    return order.filter((u) => !/\.(svg|gif)(\?|$)/i.test(u)).slice(0, 40);
  };

  // what kind of business is this? (booking system first, then the words on the site)
  WB.siteKind = function (site, acc) {
    const words = JSON.stringify(site || {}).replace(/"https?:[^"]*"/g, '').toLowerCase();
    const has = (re) => re.test(words);
    if (has(/function (room|centre|center|venue)|wedding|banquet|conference|reception venue|event space|ballroom/)) return 'function';
    const sys = acc && acc.system;
    if (sys === 'restaurant') return 'restaurant';
    if (sys === 'service') return 'service';
    if (sys === 'trades') return 'trades';
    if (site && site.shop && (site.shop.products || []).length) return 'shop';
    if (has(/restaurant|bistro|caf[eé]|menu|dining|brunch|chef/)) return 'restaurant';
    if (has(/salon|spa|massage|beauty|clinic|dentist|physio|barber|nails|facial/)) return 'service';
    if (has(/plumb|electric|builder|carpent|roofing|landscap|handyman|air ?con|painting/)) return 'trades';
    return 'general';
  };

  const P = (S, i) => (S.imgs.length ? S.imgs[i % S.imgs.length] : '');
  const P3 = (S, i) => [P(S, i), P(S, i + 1), P(S, i + 2)].filter((v, k, a) => v && a.indexOf(v) === k);
  const sign = (S) => 'See you soon,\nThe team at ' + S.name;
  const base = (S, o) => Object.assign({ v: 2, look: S.look || 'site', accent: S.accent, hero: P(S, 0), button_url: S.book, signoff: sign(S), sections: [] }, o);

    /* ----- the editor ----- */
    function openCamp(c) {
      if (!c) c = { subject: '', content: { v: 2, look: 'site', accent: siteAccent, hero: S.imgs[0] || '', headline: '', intro: '', button_text: WB.MAIL_KINDS[kind].btn, button_url: book, signoff: 'See you soon,\nThe team at ' + S.name, sections: [] }, status: 'draft' };
      const k = WBMail.clean(Object.assign({}, c.content || {}, { accent: siteAccent }));
      if (c.content && c.content.v !== 2 && !c.content.look) k.look = 'site';
      k.subject = c.subject || '';
      const sent = c.status !== 'draft';
      drawList(c);
      const RO = sent ? ' readonly' : '';
      const inp = (p, lab, ph, opt) => { opt = opt || {}; const v = getP(k, p) || ''; return '<label class="field' + (opt.cls ? ' ' + opt.cls : '') + '"><span>' + lab + '</span>' + (opt.area ? '<textarea class="inp" data-p="' + p + '" rows="' + (opt.rows || 4) + '" placeholder="' + esc(ph || '') + '"' + RO + '>' + esc(v) + '</textarea>' : '<input class="inp" data-p="' + p + '" value="' + esc(v) + '" placeholder="' + esc(ph || '') + '"' + RO + '>') + '</label>'; };
      const pic = (p, small) => { const v = getP(k, p); return '<span class="em-pic' + (small ? ' sm' : '') + (v ? '' : ' empty') + '">' + (v ? '<button class="em-pic-i" data-img="' + p + '" style="background-image:url(\'' + esc(v) + '\')" title="Change picture"' + (sent ? ' disabled' : '') + '></button>' + (sent ? '' : '<button class="em-pic-x" data-imgx="' + p + '" title="Remove picture">×</button>') : '<button class="em-pic-i" data-img="' + p + '"' + (sent ? ' disabled' : '') + '>+ Picture</button>') + '</span>'; };
      const secHtml = (s, i) => {
        const P = 'sections.' + i + '.';
        let f = '';
        if (s.t === 'pictext') f = '<div class="em-row">' + pic(P + 'img') + '<div style="flex:1">' + inp(P + 'title', 'Heading', 'e.g. Why we love it') + '</div></div>' + inp(P + 'text', 'Text', 'A few sentences', { area: true }) +
          '<div class="em-2">' + inp(P + 'btn_text', 'Button text (optional)', 'Find out more') + inp(P + 'btn_url', 'Button link', 'https://…') + '</div>' +
          (sent ? '' : '<div class="seg sm em-side-seg"><button data-side="' + i + ':left"' + (s.side !== 'right' ? ' class="on"' : '') + '>Picture left</button><button data-side="' + i + ':right"' + (s.side === 'right' ? ' class="on"' : '') + '>Picture right</button></div>');
        if (s.t === 'gallery') { while (s.imgs.length < 3 && !sent) s.imgs.push(''); f = '<div class="em-row">' + s.imgs.map((u, j) => pic(P + 'imgs.' + j)).join('') + '</div>' + inp(P + 'caption', 'Caption (optional)', 'e.g. A few of our favourites'); }
        if (s.t === 'cards') f = inp(P + 'title', 'Heading (optional)', 'e.g. Three to try first') + '<div class="em-cards">' + s.items.map((it, j) => '<div class="em-card">' + pic(P + 'items.' + j + '.img', true) + inp(P + 'items.' + j + '.title', 'Title', '') + inp(P + 'items.' + j + '.text', 'Text', '', { area: true, rows: 2 }) + '</div>').join('') + '</div>';
        if (s.t === 'text') f = inp(P + 'title', 'Heading (optional)', '') + inp(P + 'text', 'Text', 'Leave a blank line between paragraphs', { area: true, rows: 5 });
        if (s.t === 'highlight') f = inp(P + 'title', 'Heading', 'e.g. This week only') + inp(P + 'text', 'Text', '', { area: true, rows: 3 }) + '<div class="em-2">' + inp(P + 'btn_text', 'Button text (optional)', 'Book now') + inp(P + 'btn_url', 'Button link', 'https://…') + '</div>';
        if (s.t === 'button') f = '<div class="em-2">' + inp(P + 'text', 'Button text', 'e.g. See the full menu') + inp(P + 'url', 'Button link', 'https://…') + '</div>';
        return '<div class="em-sec"><div class="em-sec-h"><b>' + SEC_ICON[s.t] + ' ' + esc(WBMail.TYPES[s.t]) + '</b>' + (sent ? '' : '<span><button data-mv="' + i + ':-1" title="Move up"' + (i ? '' : ' disabled') + '>↑</button><button data-mv="' + i + ':1" title="Move down"' + (i < k.sections.length - 1 ? '' : ' disabled') + '>↓</button><button data-rm="' + i + '" title="Remove section">✕</button></span>') + '</div>' + f + '</div>';
      };
      const draw = () => {
        const y = main.scrollTop, fy = main.querySelector('.em-form') ? main.querySelector('.em-form').scrollTop : 0;
        main.innerHTML = '<div class="em-ed"><div class="em-form">' +
          (sent ? '<div class="hub-note ok">Sent ' + esc(day(c.sent_at)) + ' to ' + fmtN(c.recipients) + ' people · ' + fmtN(c.delivered) + ' delivered.</div>'
            : '<div class="em-ai"><input class="inp" id="eb" placeholder="What’s this email about? e.g. our new function room for 60 guests"><button class="btn sm" id="eai">✨ Write it for me</button><button class="btn sm ghost" id="eideas">💡 Ideas</button></div>') +
          '<div class="em-looks"><span>Look</span>' + Object.keys(WBMail.LOOKS).map((l) => { const L = WBMail.LOOKS[l], ac = l === 'site' ? siteAccent : L.accent; return '<button data-look="' + l + '" class="' + (k.look === l ? 'on' : '') + '"' + (sent ? ' disabled' : '') + ' title="' + esc(L.label) + '"><i style="background:' + L.bg + '"><em style="background:' + ac + '"></em></i>' + esc(L.label) + '</button>'; }).join('') + '</div>' +
          inp('subject', 'Subject', 'e.g. Our spring menu is here') + inp('preheader', 'Preview text (shown after the subject in the inbox)', 'A short line that makes people open it') +
          '<h4 class="em-h">Top of the email</h4><div class="em-sec"><div class="em-row">' + pic('hero') + '<div style="flex:1">' + inp('eyebrow', 'Small label (optional)', 'e.g. New menu') + '</div></div>' +
          inp('headline', 'Headline', 'Hello {first_name}!') + inp('intro', 'Message', 'Write your news. Leave a blank line between paragraphs. {first_name} becomes each person’s first name.', { area: true, rows: 5 }) +
          '<div class="em-2">' + inp('button_text', 'Button text', 'Book now') + inp('button_url', 'Button link', 'https://…') + '</div></div>' +
          '<h4 class="em-h">More sections <small>' + k.sections.length + ' of ' + WBMail.MAXSEC + '</small></h4>' + k.sections.map(secHtml).join('') +
          (sent || k.sections.length >= WBMail.MAXSEC ? '' : '<div class="em-add"><span>Add a section</span>' + Object.keys(WBMail.TYPES).map((t) => '<button data-add="' + t + '" title="' + esc(SEC_HELP[t]) + '">' + SEC_ICON[t] + ' ' + esc(WBMail.TYPES[t]) + '</button>').join('') + '</div>') +
          '<h4 class="em-h">Sign-off</h4>' + inp('signoff', '', 'See you soon,\nThe team', { area: true, rows: 2 }) +
          (sent ? '' : '<div class="acts em-acts"><button class="btn danger sm" id="edel"' + (c.id ? '' : ' hidden') + '>Delete</button><span style="flex:1"></span><button class="btn ghost" id="esave">Save draft</button><button class="btn ghost" id="etest">Send me a test</button><button class="btn pri" id="esend">Send to ' + fmtN(people) + '</button></div>') +
          '</div><div class="em-prev"><div class="em-inbox"><b id="pvs"></b><span id="pvp"></span></div><iframe id="pvf" title="Email preview"></iframe></div></div>';
        wire();
        main.scrollTop = y; const ff = main.querySelector('.em-form'); if (ff) ff.scrollTop = fy;
      };
      const read = () => { const o = WBMail.clean(k); o.sections.forEach((s) => { if (s.imgs) s.imgs = s.imgs.filter(Boolean); }); return { subject: (k.subject || '').trim(), content: o }; };
      const prev = () => { const r = read(), g = (id) => main.querySelector('#' + id); g('pvs').textContent = (r.subject || 'Subject').replace(/\{first_name\}/g, 'Sam'); g('pvp').textContent = r.content.preheader || ''; g('pvf').srcdoc = WB.hubEmailHtml(r.content, biz, 'Sam'); };
      const save = async (quiet) => {
        const r = read(); if (!r.subject) { toast('Add a subject first.', 'bad'); return null; }
        if ([k.button_url].concat(k.sections.map((s) => s.btn_url || s.url)).some((u) => u && !WBMail.okUrl(u))) { toast('Links should start with https:// (or mailto: / tel:).', 'bad', 5000); return null; }
        try { const saved = await Store.saveCampaign(ctx.row.id, Object.assign({ id: c.id }, r)); c = saved; const i = camps.findIndex((x) => x.id === saved.id); if (i >= 0) camps[i] = saved; else camps.unshift(saved); drawList(c); const d = main.querySelector('#edel'); if (d) d.hidden = false; if (!quiet) toast('Draft saved', 'ok'); return saved; }
        catch (e) { toast(e.message, 'bad', 5000); return null; }
      };
      const blanksMsg = () => { const b = WBMail.blanks(read().content).concat((k.subject.match(/\[[^\]]{2,60}\]/g) || [])); return b.length ? 'Fill in the parts in [square brackets] first: ' + b.slice(0, 4).join(', ') + (b.length > 4 ? '…' : '') : ''; };
      function wire() {
        prev();
        main.querySelectorAll('[data-p]').forEach((n) => { n.addEventListener('input', () => { setP(k, n.dataset.p, n.value); clearTimeout(n._t); n._t = setTimeout(prev, 250); }); });
        if (sent) return;
        const g = (id) => main.querySelector('#' + id);
        main.querySelectorAll('[data-look]').forEach((b) => { b.onclick = () => { k.look = b.dataset.look; draw(); }; });
        main.querySelectorAll('[data-add]').forEach((b) => { b.onclick = () => { k.sections.push(newSec(b.dataset.add, S)); draw(); const f = main.querySelectorAll('.em-sec'); if (f.length) f[f.length - 1].scrollIntoView({ block: 'center', behavior: 'smooth' }); }; });
        main.querySelectorAll('[data-rm]').forEach((b) => { b.onclick = () => { k.sections.splice(+b.dataset.rm, 1); draw(); }; });
        main.querySelectorAll('[data-mv]').forEach((b) => { b.onclick = () => { const [i, d] = b.dataset.mv.split(':').map(Number), j = i + d; if (j < 0 || j >= k.sections.length) return; const t = k.sections[i]; k.sections[i] = k.sections[j]; k.sections[j] = t; draw(); }; });
        main.querySelectorAll('[data-side]').forEach((b) => { b.onclick = () => { const [i, v] = b.dataset.side.split(':'); k.sections[+i].side = v; draw(); }; });
        main.querySelectorAll('[data-img]').forEach((b) => { b.onclick = async () => { const u = await choosePic(); if (u) { setP(k, b.dataset.img, u); draw(); } }; });
        main.querySelectorAll('[data-imgx]').forEach((b) => { b.onclick = () => { setP(k, b.dataset.imgx, ''); draw(); }; });
        g('eideas').onclick = () => ideas(c);
        g('eai').onclick = async () => {
          const brief = g('eb').value.trim(); if (brief.length < 5) return toast('Tell the AI what the email is about first.', 'bad');
          const b = g('eai'); b.disabled = true; b.textContent = 'Writing…';
          try {
            const r = await Store.emailApi('draft', { site_id: ctx.row.id, brief, kind, images: S.imgs.slice(0, 24), book });
            const d = WBMail.clean(Object.assign({}, r.content || {}, { look: k.look, accent: siteAccent }));
            Object.assign(k, d, { subject: (r.content && r.content.subject) || k.subject }); draw();
            toast('Draft written — please check every detail before sending.', 'ok', 5000);
          } catch (e) { toast(e.message, 'bad', 5000); b.disabled = false; b.textContent = '✨ Write it for me'; }
        };
        g('esave').onclick = () => save();
        g('etest').onclick = async () => {
          const r = read(); if (!r.subject) return toast('Add a subject first.', 'bad');
          const bl = blanksMsg(); if (bl) toast(bl + ' (sending the test anyway)', 'bad', 6000);
          const b = g('etest'); b.disabled = true;
          try { const j = await Store.emailApi('test', { site_id: ctx.row.id, campaign: Object.assign({ subject: r.subject }, r.content) }); toast('Test sent to ' + j.to, 'ok', 5000); } catch (e) { toast(e.message, 'bad', 6000); }
          b.disabled = false;
        };
        g('esend').onclick = async () => {
          const r = read();
          if (!r.subject || !WBMail.hasBody(r.content)) return toast('Add a subject and a message first.', 'bad');
          const bl = blanksMsg(); if (bl) return toast(bl, 'bad', 7000);
          if (!people) return toast('No one has agreed to receive emails yet.', 'bad', 5000);
          const ok = await sendConfirm(people, r.subject); if (!ok) return;
          const saved = await save(true); if (!saved) return;
          const b = g('esend'); b.disabled = true; b.textContent = 'Sending…';
          try { const j = await Store.emailApi('send', { site_id: ctx.row.id, campaign_id: saved.id }); toast('Sent to ' + fmtN(j.sent) + ' people' + (j.failed ? ' (' + j.failed + ' could not be delivered)' : ''), 'ok', 6000); camps = await Store.campaigns(ctx.row.id); openCamp(camps.find((x) => x.id === saved.id) || saved); }
          catch (e) { toast(e.message, 'bad', 7000); b.disabled = false; b.textContent = 'Send to ' + fmtN(people); }
        };
        g('edel').onclick = async () => {
          if (!c.id || !(await D().confirmBox('Delete this draft?', 'This cannot be undone.', 'Delete', true))) return;
          try { await Store.deleteCampaign(ctx.row.id, c.id); camps = camps.filter((x) => x.id !== c.id); ideas(); } catch (e) { toast(e.message, 'bad'); }
        };
      }
      draw();
    }
    function sendConfirm(n, subject) {
      return new Promise((res) => {
        const { modal, $, esc } = D();
        const m = modal('<h2>Send “' + esc(subject.replace(/\{first_name\}/g, '…')) + '”?</h2><p class="muted">It goes to <b>' + fmtN(n) + '</b> customer' + (n === 1 ? '' : 's') + ' who agreed to hear from you. Each email includes your business name and an unsubscribe link.</p>' +
          '<label class="hub-check"><input type="checkbox" id="sc"><span>I’ve checked the test email, and everything in it is correct.</span></label>' +
          '<div class="acts"><button class="btn ghost" data-x>Cancel</button><button class="btn pri" data-ok disabled>Send now</button></div>');
        const ok = $('[data-ok]', m); $('#sc', m).onchange = (e) => { ok.disabled = !e.target.checked; };
        $('[data-x]', m).onclick = () => { m.close(); res(false); };
        ok.onclick = () => { m.close(); res(true); };
      });
    }
    ctx.body.querySelector('#enew').onclick = () => ideas();
    const open = openId ? camps.find((x) => x.id === openId) : camps.find((x) => x.status === 'draft');
    if (open) openCamp(open); else ideas();
  }
})();

</script>
</body>
</html>
