<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Email Studio · Service Deluxe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070f;--panel:#0d0f20;--panel2:#12152b;--panel3:#171b36;
  --violet:#8b5cf6;--blue:#4f7cff;--cyan:#22d3ee;--teal:#2dd4bf;--gold:#f0cd8b;--rose:#fb7185;
  --ink:#eef0ff;--muted:#9aa3c7;--faint:#6a7299;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.06);--glass:rgba(255,255,255,.035);
  --grad:linear-gradient(120deg,var(--violet),var(--blue) 55%,var(--cyan));
  --fd:'Sora',system-ui,-apple-system,Segoe UI,sans-serif;--fm:'Space Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--fd);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 500px at 10% -8%,rgba(139,92,246,.16),transparent 60%),radial-gradient(800px 520px at 95% 6%,rgba(34,211,238,.09),transparent 62%)}
[hidden]{display:none!important}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(7,7,15,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:40;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;font:10.5px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.sp{flex:1 1 auto}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font:11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--glass);text-decoration:none;white-space:nowrap}
.pill b{color:var(--ink);font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.dot.warn{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--glass);border-radius:11px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--rose);color:var(--rose);background:rgba(251,113,133,.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr) minmax(0,1.04fr);flex:1 1 auto;min-height:0}
.rail{border-right:1px solid var(--line);padding:18px 14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.rail-h{font:10.5px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:6px 0 2px 4px}
.camp{position:relative;display:block;width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--glass);padding:10px 30px 10px 12px;color:var(--ink)}
.camp:hover{border-color:rgba(139,92,246,.5)}
.camp[aria-current=true]{border-color:var(--violet);background:rgba(139,92,246,.13)}
.camp b{display:block;font-weight:600;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camp span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.camp .x{position:absolute;top:7px;right:6px;width:22px;height:22px;border-radius:7px;border:0;background:transparent;color:var(--faint);cursor:pointer;display:none;font-size:15px;line-height:1}
.camp:hover .x,.camp[aria-current=true] .x{display:block}
.camp .x:hover{color:var(--rose);background:rgba(251,113,133,.12)}
.empty{color:var(--faint);font-size:13px;padding:6px 4px}
.editor{padding:20px 24px 60px;min-width:0;border-right:1px solid var(--line)}
.eyebrow{font:10.5px var(--fm);letter-spacing:.18em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2.sec{margin:4px 0 2px;font-size:22px;letter-spacing:-.015em}
.sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.namebar{display:flex;gap:8px;align-items:center;margin:0 0 14px}
.namebar input{flex:1 1 auto;min-width:0}
.namebar .btn{white-space:nowrap}
.saved{font:11px var(--fm);color:var(--faint);white-space:nowrap}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:13px;background:var(--glass);margin:0 0 16px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:transparent;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.tab[aria-selected=true]{background:rgba(139,92,246,.2);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(139,92,246,.45)}
.tab.ai{color:var(--cyan)}
.field{margin:0 0 12px;min-width:0}
.field>label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px}
.help{font-size:12px;color:var(--faint);margin:5px 0 0}
input[type=text],input[type=url],input[type=email],input[type=number],input[type=password],select,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font-size:14px;font-weight:400}
textarea{resize:vertical;min-height:70px;line-height:1.5}
select option{background:#151831}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(139,92,246,.7);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--glass);padding:16px;margin:0 0 14px}
.card h3{margin:0 0 4px;font-size:15px}
.card>p{margin:0 0 12px;color:var(--muted);font-size:13px}
.note{border:1px solid rgba(240,205,139,.35);background:rgba(240,205,139,.07);color:#f6e2b8;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.note.ok{border-color:rgba(45,212,191,.35);background:rgba(45,212,191,.07);color:#bff3ea}
.note.bad{border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.08);color:#ffd0d7}
/* sections */
.blk{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:0 0 8px;transition:border-color .15s}
.blk.open{border-color:rgba(139,92,246,.55);background:var(--panel2)}
.blk.off{opacity:.55}
.bh{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;cursor:pointer;user-select:none}
.bh .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:15px;flex:0 0 auto}
.bh .t{flex:1 1 auto;min-width:0}
.bh .t b{display:block;font-size:13.5px;font-weight:600}
.bh .t span{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh .acts{display:flex;gap:2px;flex:0 0 auto}
.ib{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.ib.del:hover{color:var(--rose);background:rgba(251,113,133,.12)}
.bb{padding:4px 14px 14px;border-top:1px solid var(--line2)}
.bands{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.bands button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px 5px 7px;font-size:12px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.bands button i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.bands button.on{border-color:var(--violet);color:var(--ink);background:rgba(139,92,246,.14)}
.add{display:flex;align-items:center;justify-content:center;width:100%;border:1.5px dashed rgba(139,92,246,.45);background:rgba(139,92,246,.05);color:#cbbcff;border-radius:14px;padding:12px;cursor:pointer;font-weight:600;margin:4px 0 0}
.add:hover{background:rgba(139,92,246,.12)}
.ins{display:block;width:100%;height:12px;border:0;background:transparent;cursor:pointer;position:relative;margin:-4px 0}
.ins::after{content:"+";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:var(--violet);color:#fff;font-size:14px;line-height:20px;opacity:0;transition:opacity .15s}
.ins:hover::after{opacity:1}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.typegrid button{border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:12px;text-align:left;cursor:pointer;color:var(--ink)}
.typegrid button:hover{border-color:var(--violet);background:rgba(139,92,246,.1)}
.typegrid b{display:block;font-size:13px;margin-top:4px}
.typegrid span{font-size:20px}
.typegrid small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px;line-height:1.35}
.imgf{display:flex;gap:10px;align-items:center}
.imgf .th{width:86px;height:58px;border-radius:9px;background:rgba(255,255,255,.05) center/cover no-repeat;border:1px solid var(--line);flex:0 0 auto;display:grid;place-items:center;color:var(--faint);font-size:11px}
.imgf .bt{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin:0 0 6px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--violet)}
.svclist{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:rgba(139,92,246,.22);color:var(--ink)}
.thms{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.thm{border:1px solid var(--line);border-radius:12px;background:var(--glass);padding:8px;cursor:pointer;text-align:left;color:var(--ink)}
.thm.on{border-color:var(--violet);box-shadow:0 0 0 2px rgba(139,92,246,.35)}
.thm i{display:block;height:34px;border-radius:7px;position:relative;overflow:hidden}
.thm i::after{content:"";position:absolute;left:8px;bottom:7px;width:34px;height:9px;border-radius:9px;background:var(--a)}
.thm span{display:block;font-size:11.5px;margin-top:6px;line-height:1.3}
.colours{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.colours button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.colours button.on{border-color:#fff}
.colours input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:8px;background:transparent;padding:2px;cursor:pointer}
/* preview */
.pv{padding:18px 22px 40px;min-width:0;position:sticky;top:69px;align-self:start;max-height:calc(100vh - 69px);display:flex;flex-direction:column}
.pvbar{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.inbox{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 14px;margin:0 0 10px;display:flex;gap:11px;align-items:center}
.inbox .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:0 0 auto}
.inbox .m{min-width:0;flex:1}
.inbox .m b{font-size:13.5px;display:block}
.inbox .m div{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox .m div span{color:var(--faint)}
.frame{flex:1 1 auto;height:calc(100vh - 250px);min-height:420px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;margin:0 auto;width:100%;transition:width .25s}
.frame.mob{width:390px;max-width:100%}
.frame iframe{display:block;width:100%;height:100%;min-height:416px;border:0;background:#fff}
/* modal / toast / login */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,3,10,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel2);border:1px solid var(--line);border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.mbox h3{margin:0 0 6px;font-size:18px}
.mbox .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.lib button{border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;aspect-ratio:3/2;background:#222 center/cover no-repeat}
.lib button:hover{border-color:var(--violet)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:#1c2042;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:200;transition:.25s;font-size:13.5px;max-width:92vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.login{max-width:400px;margin:9vh auto;padding:26px}
.login h2{margin:0 0 4px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--violet);animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ai-busy{display:flex;gap:10px;align-items:center;color:var(--cyan);font-size:13px;margin:10px 0}
.ai-busy i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(34,211,238,.25);border-top-color:var(--cyan);animation:sp .8s linear infinite}
.sent{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.sent:first-child{border-top:0}
.sent .m{flex:1;min-width:0}
.sent .m b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sent .m span{font-size:12px;color:var(--faint)}
.mtabs{display:none}
kbd{font:11px var(--fm);padding:1px 5px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rail{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:nowrap;overflow-x:auto;align-items:center;padding:10px 14px}
  .rail-h,.rail .empty{display:none}
  .rail .camp{flex:0 0 200px}
  .rail .rnew{flex:0 0 auto}
}
@media (max-width:820px){
  header.top{padding:10px 14px;gap:8px}
  .brand p,.hidem{display:none}
  .layout{grid-template-columns:minmax(0,1fr)}
  .editor{border-right:0;padding:16px 16px 90px}
  .pv{position:static;max-height:none;padding:12px 16px 90px}
  .mtabs{display:flex;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;background:rgba(18,21,43,.94);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .mtabs button{border:0;background:transparent;color:var(--muted);padding:9px 20px;border-radius:999px;font-weight:600;cursor:pointer}
  .mtabs button.on{background:var(--grad);color:#fff}
  body.m-edit .pv{display:none}
  body.m-prev .editor{display:none}
  .g2{grid-template-columns:1fr}
  #devSeg{display:none}
  .frame.mob{width:100%}
  .frame{height:auto}
  .frame iframe{min-height:75vh}
}
</style>
</head>
<body class="m-edit">
<div class="app">
  <header class="top">
    <div class="logo">SD</div>
    <div class="brand"><h1>Email Studio</h1><p id="bizName">Service Deluxe</p></div>
    <div class="sp"></div>
    <span class="pill hidem" id="pSubs" hidden></span>
    <span class="pill hidem" id="pSent" hidden></span>
    <a class="pill" id="staffLink" href="service-staff.html">← Staff page</a>
    <button class="btn sm ghost" id="logout" hidden>Sign out</button>
  </header>
  <main id="main"><div class="spin"></div></main>
</div>
<div class="mtabs" id="mtabs"><button data-m="edit" class="on">✏️ Edit</button><button data-m="prev">👁 Preview</button></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="image/*" hidden>

<script>
/* Service Deluxe — Email Studio section renderer.
   Shared by service/email-studio.html (live preview) and the svc-email function (what is actually sent),
   so the preview is exactly the email. Everything is escaped here and every link is checked here. */
var SVC_THEMES = {
  spa:    { label: "Spa — sage & cream",       bg: "#F3F0EA", card: "#FFFFFF", soft: "#F4F0E8", ink: "#18201C", muted: "#66706A", line: "#E6E0D4", accent: "#4F6B5C", dark: "#24312B", darkInk: "#F3F0EA" },
  salon:  { label: "Salon — terracotta & blush", bg: "#F7EDE8", card: "#FFFFFF", soft: "#FBF2EE", ink: "#2A1D1A", muted: "#7A665F", line: "#EEDDD5", accent: "#B85C3E", dark: "#3A2420", darkInk: "#FBF2EE" },
  blush:  { label: "Beauty — rose & pearl",    bg: "#FBF0F2", card: "#FFFFFF", soft: "#FDF5F6", ink: "#2C1A21", muted: "#80656F", line: "#F1DCE2", accent: "#B4486E", dark: "#3B1F2A", darkInk: "#FDF5F6" },
  dental: { label: "Dental — fresh teal",      bg: "#EAF4F5", card: "#FFFFFF", soft: "#F1F8F9", ink: "#12262B", muted: "#5D7277", line: "#D6E8EA", accent: "#0E8484", dark: "#0F3036", darkInk: "#EAF4F5" },
  clinic: { label: "Clinic — calm blue",       bg: "#ECF1F8", card: "#FFFFFF", soft: "#F3F6FB", ink: "#14213A", muted: "#5E6B82", line: "#DCE4F0", accent: "#2F5FB3", dark: "#18284A", darkInk: "#ECF1F8" },
  night:  { label: "Evening — plum & gold",    bg: "#120E15", card: "#1C1620", soft: "#251D2A", ink: "#F3ECE4", muted: "#B6AAB8", line: "#33293A", accent: "#D6B06A", dark: "#0B080D", darkInk: "#F3ECE4", isDark: true },
  mono:   { label: "Minimal — black & white",  bg: "#F1F1EF", card: "#FFFFFF", soft: "#F6F6F4", ink: "#151515", muted: "#6B6B6B", line: "#E3E3E0", accent: "#151515", dark: "#151515", darkInk: "#FFFFFF" }
};
var SVC_BLOCKS = {
  hero: "Big picture & headline", text: "Text", image: "Picture", split: "Picture beside text", services: "Your services & prices",
  offer: "Offer box", gallery: "Picture row (2–3)", team: "Meet the team", quote: "Client review", video: "Video", button: "Button", hours: "Opening hours", divider: "Line / space"
};
function svcStudioHtml(c, look, o) {
  c = c || {}; look = look || {}; o = o || {};
  var T = Object.assign({}, SVC_THEMES[c.theme] || SVC_THEMES.spa);
  if (/^#[0-9A-Fa-f]{6}$/.test(c.accent || "")) T.accent = c.accent;
  var HF = c.font === "sans" ? "Helvetica,Arial,sans-serif" : c.font === "modern" ? "'Trebuchet MS',Helvetica,Arial,sans-serif" : "Georgia,'Times New Roman',serif";
  var BF = "Helvetica,Arial,sans-serif";
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (x) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[x]; }); };
  var first = String(o.first_name || "").trim() || "there";
  var fill = function (t) { return String(t == null ? "" : t).replace(/\{first_name\}/g, first).replace(/\{business\}/g, look.name || ""); };
  var url = function (u) { u = String(u || "").trim(); return /^(https?:\/\/|mailto:|tel:)/i.test(u) && !/[\s"<>]/.test(u) ? u : ""; };
  var img = function (u) { u = String(u || "").trim(); return /^https:\/\/[^\s"<>]+$/i.test(u) || (o.preview && /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(u)) ? u : ""; };
  var book = function (sid) { return typeof o.book === "function" ? o.book(sid || "") : ""; };

/* ---------- boot ---------- */
function boot(){
  $("staffLink").href = CONFIG.staffPage + "?venue=" + encodeURIComponent(VENUE) + "&tab=email";
  fetch(BASE + "/rest/v1/rpc/svc_get_catalog", { method: "POST", headers: { apikey: CONFIG.supabaseKey, Authorization: "Bearer " + CONFIG.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify({ p_venue: VENUE }) })
    .then(function (r) { return r.json(); })
    .then(function (c) {
      if (!c || !c.ok) { $("main").innerHTML = '<div class="card login"><h2>Unknown business</h2><p class="sub">No business called “' + esc(VENUE) + '”. Check the ?venue= part of the link.</p></div>'; return; }
      CAT = c; $("bizName").textContent = c.venue.name; document.title = "Email Studio · " + c.venue.name;
      SES = loadSes(); if (SES) enter(); else loginView();
    }).catch(function (e) { $("main").innerHTML = '<div class="card login"><p class="note bad">' + esc(e.message) + "</p></div>"; });
}
function loginView(msg){
  $("logout").hidden = true;
  $("main").innerHTML = '<form class="card login" id="lf"><span class="eyebrow">Email Studio</span><h2>Staff sign in</h2><p class="sub">' + esc(CAT.venue.name) + '</p>' +
    '<div class="field"><label for="le">Email</label><input type="email" id="le" autocomplete="username" required></div>' +
    '<div class="field"><label for="lp">Password</label><input type="password" id="lp" autocomplete="current-password" required></div>' +
    '<button class="btn pri" type="submit" style="width:100%">Sign in</button>' + (msg ? '<p class="note bad" style="margin-top:12px">' + esc(msg) + "</p>" : "") +
    '<p class="help" style="text-align:center">Same login as your staff page.</p></form>';
  $("lf").onsubmit = function (e) { e.preventDefault(); auth("token?grant_type=password", { email: $("le").value.trim(), password: $("lp").value }).then(function (s) { saveSes(s); enter(); }).catch(function (er) { loginView(er.message); }); };
}
$("logout").onclick = function () { saveSes(null); loginView(); };
function enter(){
  $("main").innerHTML = '<div class="spin"></div>';
  Promise.all([rpc("svc_email_overview", { p_venue: VENUE }), rpc("svc_email_drafts", { p_venue: VENUE })]).then(function (r) {
    if (!r[0] || !r[0].ok) throw new Error((r[0] && r[0].error) || "Not on the team for this business.");
    OV = r[0]; DRAFTS = (r[1] && r[1].drafts) || []; SOCIAL = (r[1] && r[1].social) || {};
    $("logout").hidden = false;
    paintPills();
    layout();
    var want = q.get("draft");
    var d = want && DRAFTS.filter(function (x) { return x.id === want; })[0];
    if (d) openDraft(d); else if (DRAFTS.length) openDraft(DRAFTS[0]); else newFrom("newsletter", true);
  }).catch(function (e) { if (/sign in|JWT|401/i.test(e.message)) { saveSes(null); return loginView("Please sign in again."); } loginView(e.message); });
}
function paintPills(){
  $("pSubs").hidden = false; $("pSubs").innerHTML = '<span class="dot"></span><b>' + OV.subscribers + "</b> subscribers";
  $("pSent").hidden = false; $("pSent").innerHTML = '<span class="dot' + (OV.sent_month > OV.cap * .8 ? " warn" : "") + '"></span><b>' + OV.sent_month + "</b> / " + OV.cap.toLocaleString() + " this month";
}

      return '<div class="camp" role="button" tabindex="0" data-id="' + d.id + '" aria-current="' + (S && S.id === d.id) + '"><b>' + esc(d.name || d.subject || "Untitled") + "</b><span>" +

}
function pickStarter(){
  var T = STARTERS();
  modal('<h3>Start a new email</h3><p class="sub">Pick a starting point. Everything can be changed — add, move or delete sections.</p><div class="typegrid">' +
    Object.keys(T).map(function (k) { return '<button data-k="' + k + '"><b style="font-size:14px">' + esc(T[k].label) + "</b><small>" + esc(T[k].d) + "</small></button>"; }).join("") +
    '</div><div class="mf"><button class="btn" data-close>Cancel</button></div>', function (m) {
      m.querySelector(".typegrid").onclick = function (e) { var b = e.target.closest("[data-k]"); if (!b) return; closeModal(); flush(); newFrom(b.getAttribute("data-k")); };
    });
}
function newFrom(k, quiet){
  var T = STARTERS()[k] || STARTERS().blank;
  S = { id: null, name: T.label.replace(/^\W+\s*/, ""), c: clone(T.c) }; UNDO = []; TAB = "sections"; S.open = S.c.blocks[0] && S.c.blocks[0].id;
  renderAll(); if (!quiet) queueSave();
}
function openDraft(d){
  var c = d.content || {}; if (c.v !== 2) c = { v: 2, theme: themeFor(BT()), subject: d.subject || "", blocks: [] };
  (c.blocks || []).forEach(function (b) { if (!b.id) b.id = uid(); });
  S = { id: d.id, name: d.name || d.subject || "", c: c }; UNDO = []; S.open = null;
  renderAll();
}

/* ---------- saving (drafts live in your account, so they follow you to any device) ---------- */
var saveT = null, saving = false, pend = false;
function queueSave(){ $("savedLbl") && ($("savedLbl").textContent = "Saving…"); clearTimeout(saveT); saveT = setTimeout(save, 1400); }
function flush(){ if (saveT) { clearTimeout(saveT); saveT = null; save(); } }
function save(){
  saveT = null; if (!S) return;
  if (saving) { pend = true; return; }
  saving = true; var me = S;
  rpc("svc_email_draft_save", { p_venue: VENUE, p_id: me.id, p_name: me.name || me.c.subject || "Untitled", p_content: me.c }).then(function (r) {
    if (!r || !r.ok) throw new Error((r && r.error) || "Couldn't save");
    var isNew = !me.id; me.id = r.id;
    var row = { id: r.id, name: me.name, subject: me.c.subject, content: me.c, updated_at: new Date().toISOString() };
    DRAFTS = [row].concat(DRAFTS.filter(function (d) { return d.id !== r.id; }));
    if (me === S) { $("savedLbl") && ($("savedLbl").textContent = "Saved ✓"); }
    if (isNew || true) renderRail();
  }).catch(function (e) { $("savedLbl") && ($("savedLbl").textContent = "Not saved"); toast(e.message, 4000); })
    .then(function () { saving = false; if (pend) { pend = false; save(); } });
}
function delDraft(id){
  rpc("svc_email_draft_delete", { p_venue: VENUE, p_id: id }).then(function () {
    DRAFTS = DRAFTS.filter(function (d) { return d.id !== id; });
    if (S && S.id === id) { if (DRAFTS.length) openDraft(DRAFTS[0]); else newFrom("newsletter", true); } else renderRail();
    toast("Deleted");
  }).catch(function (e) { toast(e.message); });
}
window.addEventListener("beforeunload", function () { flush(); });

/* ---------- edits ---------- */
function snap(){ UNDO.push(JSON.stringify(S.c)); if (UNDO.length > 40) UNDO.shift(); }
function changed(rebuild){ queueSave(); preview(); if (rebuild) renderEditor(); else paintInbox(); }
function undo(){ if (!UNDO.length) return toast("Nothing to undo"); S.c = JSON.parse(UNDO.pop()); renderEditor(); preview(); queueSave(); }
document.addEventListener("keydown", function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); flush(); toast("Saved"); }
  if ((e.metaKey || e.ctrlKey) && e.key === "z" && !/INPUT|TEXTAREA/.test((e.target || {}).tagName || "")) { e.preventDefault(); undo(); }
});

function shrink(file, max){
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () { var im = new Image(); im.onload = function () {
      var s = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas"); cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      var cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
      cv.toBlob(function (bl) { bl ? res(bl) : rej(new Error("Couldn't read that picture")); }, "image/jpeg", .84); };
      im.onerror = function () { rej(new Error("Couldn't read that picture — try a JPG or PNG.")); }; im.src = fr.result; };
    fr.onerror = function () { rej(new Error("Couldn't read that file")); }; fr.readAsDataURL(file);
  });
}
function upload(set){
  var inp = $("fileIn"); inp.value = "";
  inp.onchange = function () {
    var f = inp.files && inp.files[0]; if (!f) return;

    shrink(f, 1200).then(function (blob) {
      return fresh().then(function (tok) { return fetch(BASE + "/storage/v1/object/venue-media/" + name, { method: "POST", headers: { apikey: CONFIG.supabaseKey, Authorization: "Bearer " + tok, "Content-Type": "image/jpeg", "x-upsert": "true", "Cache-Control": "max-age=31536000" }, body: blob }); });
    }).then(function (r) { if (!r.ok) throw new Error("Upload refused (" + r.status + ") — please sign in again."); set(BASE + "/storage/v1/object/public/venue-media/" + name); toast("Picture added"); })
      .catch(function (e) { toast(e.message, 4500); });
  };
  inp.click();
}

    rpc("svc_email_settings_save", { p_venue: VENUE, p: p }).then(function (r) { if (!r || !r.ok) throw new Error((r && r.error) || "Couldn't save"); return rpc("svc_email_social_save", { p_venue: VENUE, p: so }); })
      .then(function (r) { if (!r || !r.ok) throw new Error((r && r.error) || "Couldn't save"); Object.assign(OV.settings, { from_name: p.from_name.trim(), reply_to: p.reply_to.trim(), address: p.address.trim() || null }); SOCIAL = {}; Object.keys(so).forEach(function (k) { if (so[k]) SOCIAL[k] = so[k]; }); $("bMsg").textContent = "Saved ✓"; preview(); paintInbox(); })
      .catch(function (e) { $("bMsg").textContent = ""; toast(e.message, 4000); });
  };
}

/* ---- send pane ---- */
function paneSend(){
  var st = OV.settings || {}, issues = checks();
  $("pane").innerHTML = (issues.length ? '<div class="note bad"><b>Before sending:</b><br>' + issues.map(esc).join("<br>") + "</div>" : '<div class="note ok">Looks ready. Send yourself a test first to see it in a real inbox.</div>') +
    '<div class="card"><h3>1 · Send yourself a test</h3><p>Goes to the email you sign in with: <b>' + esc((SES.user && SES.user.email) || "") + '</b></p><button class="btn" id="tBtn">✉️ Send me a test</button> <span class="saved" id="tMsg"></span></div>' +
    '<div class="card"><h3>2 · Choose who gets it</h3><p>Only clients who ticked “Keep me posted” when booking. Each email has an unsubscribe link.</p>' +
    '<div class="field"><select id="aKind"><option value="all">Everyone on my list</option><option value="service">Clients who booked a particular ' + esc(SW()) + '</option><option value="lapsed">Clients who haven\'t visited for a while</option><option value="new">New clients (one visit or none)</option></select></div>' +
    '<div class="field" id="aSvcF" hidden><select id="aSvc">' + services().map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + "</option>"; }).join("") + "</select></div>" +
    '<div class="field" id="aMonF" hidden><label>No visit for at least</label><select id="aMon">' + [2, 3, 4, 6, 9, 12].map(function (n) { return '<option value="' + n + '"' + (n === 3 ? " selected" : "") + ">" + n + " months</option>"; }).join("") + "</select></div>" +
    '<p class="help" id="aCount">Counting…</p></div>' +
    '<div class="card"><h3>3 · Send</h3><p>' + OV.sent_month + " of " + OV.cap.toLocaleString() + ' emails used this month (fair use).</p><button class="btn pri" id="sBtn" disabled>Send</button> <span class="saved" id="sMsg"></span></div>' +
    '<div class="card"><h3>Download</h3><p>Use this email somewhere else — another mail app, or your own records.</p><button class="btn sm" id="dlBtn">⬇ Download .html</button> <button class="btn sm" id="cpBtn">Copy HTML</button></div>' +
    '<div class="card"><h3>Sent emails</h3><div id="sentList">' + sentList() + "</div></div>";
  var kind = $("aKind");
  kind.value = AUD.kind || "all"; if (AUD.service_id) $("aSvc").value = AUD.service_id; if (AUD.months) $("aMon").value = AUD.months;
  var recount = function () {
    $("aSvcF").hidden = kind.value !== "service"; $("aMonF").hidden = kind.value !== "lapsed";
    AUD = { kind: kind.value }; if (kind.value === "service") AUD.service_id = $("aSvc").value; if (kind.value === "lapsed") AUD.months = +$("aMon").value;
    $("aCount").textContent = "Counting…"; $("sBtn").disabled = true;
    rpc("svc_email_count", { p_venue: VENUE, p_filter: AUD }).then(function (r) {
      AUDN = (r && r.count) || 0;
      $("aCount").textContent = AUDN ? AUDN + " client" + (AUDN === 1 ? "" : "s") + " will get this email." : "No subscribed clients match yet.";
      $("sBtn").textContent = AUDN ? "Send to " + AUDN + " client" + (AUDN === 1 ? "" : "s") : "Send";
      $("sBtn").disabled = !AUDN || !OV.allowed || checks().length > 0;
    }).catch(function (e) { $("aCount").textContent = e.message; });
  };
  kind.onchange = recount; $("aSvc").onchange = recount; $("aMon").onchange = recount; recount();
  $("tBtn").onclick = function () {
    var b = this; b.disabled = true; $("tMsg").textContent = "Sending…"; flush();
    fn("test", { content: S.c }).then(function (r) { $("tMsg").textContent = r.ok ? "Sent to " + r.to + " ✓" : ""; if (!r.ok) toast(r.error || "Couldn't send", 5000); })
      .catch(function (e) { $("tMsg").textContent = ""; toast(e.message); }).then(function () { b.disabled = false; });
  };
  $("sBtn").onclick = function () {
    var n = AUDN;
    modal('<h3>Send to ' + n + " client" + (n === 1 ? "" : "s") + "?</h3><p class=\"sub\">Subject: <b>" + esc(S.c.subject) + "</b><br>This can't be undone. It usually takes under a minute.</p>" +
      '<div class="mf"><button class="btn" data-close>Not yet</button><button class="btn pri" id="goSend">Send now</button></div>', function (m) {
        m.querySelector("#goSend").onclick = function () {
          closeModal(); var b = $("sBtn"); b.disabled = true; $("sMsg").textContent = "Sending… keep this page open"; flush();
          fn("send", { content: S.c, audience: AUD, name: S.name }).then(function (r) {
            if (!r.ok) throw new Error(r.error || "Couldn't send");
            $("sMsg").textContent = "Sent to " + r.sent + " ✓" + (r.failed ? " (" + r.failed + " failed)" : "");
            toast("Sent to " + r.sent + " client" + (r.sent === 1 ? "" : "s") + " 🎉", 4000);
            return rpc("svc_email_overview", { p_venue: VENUE }).then(function (o) { if (o && o.ok) { OV = o; paintPills(); $("sentList").innerHTML = sentList(); } });
          }).catch(function (e) { $("sMsg").textContent = ""; toast(e.message, 5000); b.disabled = false; });
        };
      });
  };
  $("dlBtn").onclick = function () { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html(false)], { type: "text/html" })); a.download = (S.name || S.c.subject || "email").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".html"; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000); };
  $("cpBtn").onclick = function () { var t = html(false); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast("HTML copied"); }, function () { toast("Couldn't copy — use Download instead"); }); };
  $("sentList").onclick = function (e) {
    var b = e.target.closest("[data-reuse]"); if (!b) return;
    var cp = (OV.campaigns || []).filter(function (x) { return x.id === b.getAttribute("data-reuse"); })[0]; if (!cp) return;
    flush(); var c = cp.content && cp.content.v === 2 ? clone(cp.content) : null;
    if (!c) return toast("That one was written on the staff page's simple Email tab.");
    c.blocks.forEach(function (x) { x.id = uid(); }); S = { id: null, name: (cp.subject || "Email") + " (again)", c: c }; UNDO = []; TAB = "sections"; renderAll(); queueSave(); toast("Copied into a new email");
  };
}
function sentList(){
  var l = (OV.campaigns || []);
  return l.length ? l.map(function (c) { return '<div class="sent"><div class="m"><b>' + esc(c.subject || "(no subject)") + "</b><span>" + esc(new Date(c.at).toLocaleString("en-AU", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })) + " · " + (c.sent || 0) + " sent" + (c.failed ? " · " + c.failed + " failed" : "") + "</span></div>" +
    (c.content && c.content.v === 2 ? '<button class="btn sm" data-reuse="' + c.id + '">Use again</button>' : "") + "</div>"; }).join("") : '<p class="empty">Nothing sent yet.</p>';
}
function checks(){
  var c = S.c, out = [];
  if (!String(c.subject || "").trim()) out.push("• Add a subject line (Sections tab).");
  if (!(OV.settings || {}).address) out.push("• Add your business address (🎨 Look tab) — the law requires it.");
  if (!c.blocks.filter(function (b) { return !b.hidden; }).length) out.push("• Add at least one section.");
  if (JSON.stringify(c).indexOf("data:image") >= 0) out.push("• A picture wasn't uploaded properly — upload it again.");
  if (/Write your offer here|Your team member's name|Tell your clients about something new|Your headline/.test(JSON.stringify(c))) out.push("• Some starter text is still there (“Write your offer here”, “Your headline”…). Replace it or delete that section.");
  return out;
}

/* ---- AI pane ---- */
function paneAI(){
  $("pane").innerHTML = '<div class="card"><h3>✦ Write it for me</h3><p>Tell Claude what the email is about. It builds the sections using your real ' + esc(SW()) + 's and prices — then you check and edit.</p>' +
    '<div class="field"><label for="aiKind">Type of email</label><select id="aiKind"><option value="news">Newsletter / news</option><option value="new service">Something new</option><option value="offer">Special offer</option><option value="free spots">Free spots this week</option><option value="holiday hours">Holiday or closing hours</option><option value="gift vouchers">Gift vouchers</option></select></div>' +
    '<div class="field"><label for="aiBrief">What should it say?</label><textarea id="aiBrief" rows="5" placeholder="e.g. We now offer hot stone massage, 75 minutes, perfect for winter. Book before 30 November and get a free scalp massage. Mention Mia, our new senior therapist."></textarea></div>' +
    '<label class="chk"><input type="checkbox" id="aiKeep" checked> Keep my pictures and theme</label>' +
    '<button class="btn pri" id="aiGo">✦ Write my email</button><div id="aiOut"></div><p class="help">Claude never makes up prices or offers — it only uses what you write and your booking system. Undo puts back what you had.</p></div>';
  $("aiGo").onclick = function () {
    var brief = $("aiBrief").value.trim(); if (brief.length < 8) return toast("Write a sentence or two first");
    var b = this; b.disabled = true; $("aiOut").innerHTML = '<div class="ai-busy"><i></i>Claude is writing your email…</div>';
    fn("draft", { brief: brief, kind: $("aiKind").value, format: "blocks" }).then(function (r) {
      if (!r.ok) throw new Error(r.error || "Couldn't write it");
      var nc = r.content, keep = $("aiKeep").checked;
      snap();
      var pics = S.c.blocks.reduce(function (a, x) { if (x.image) a.push(x.image); (x.images || []).forEach(function (p) { if (p.image) a.push(p.image); }); return a; }, []);
      var pi = 0;
      nc.blocks.forEach(function (x) { x.id = uid(); if ((x.type === "hero" || x.type === "split") && !x.image) x.image = keep && pics[pi] ? pics[pi++] : pic(pi++); });
      S.c = Object.assign({}, S.c, { subject: nc.subject, preheader: nc.preheader, blocks: nc.blocks });
      if (!keep) S.c.theme = themeFor(BT());
      if (!S.name || /^(Monthly newsletter|Blank|Special offer)$/.test(S.name)) S.name = nc.subject;
      TAB = "sections"; S.open = null; renderAll(); queueSave(); toast("Done — check it over, then send a test");
    }).catch(function (e) { $("aiOut").innerHTML = '<div class="note bad">' + esc(e.message) + "</div>"; b.disabled = false; });
  };
}

/* ---------- preview ---------- */
var pvT = null;
function html(prev){ return svcStudioHtml(S.c, look(), { preview: prev, first_name: "Sophie", book: bookUrl, catalog: CAT }); }
function preview(now){
  clearTimeout(pvT);
  pvT = setTimeout(function () {
    var f = $("pvf"); if (!f) return; var y = 0; try { y = f.contentWindow.scrollY; } catch (e) {}
    f.onload = function () { try { f.contentWindow.scrollTo(0, y); f.contentDocument.addEventListener("click", function (e) { var a = e.target.closest && e.target.closest("a"); if (a) { e.preventDefault(); window.open(a.href, "_blank", "noopener"); } }); } catch (e) {} };
    f.srcdoc = html(true);
  }, now ? 0 : 160);
}
function paintInbox(){
  var l = look(), T = SVC_THEMES[S.c.theme] || SVC_THEMES.spa, f = function (t) { return String(t || "").replace(/\{first_name\}/g, "Sophie").replace(/\{business\}/g, l.name); };
  var el = $("inbox"); if (!el) return;
  el.innerHTML = '<span class="av" style="background:' + (S.c.accent || T.accent) + '">' + esc((l.name || "?").charAt(0)) + '</span><div class="m"><b>' + esc(l.name) + "</b><div>" + esc(f(S.c.subject) || "(no subject)") + ' <span>— ' + esc(f(S.c.preheader)) + "</span></div></div>";
}

/* ---------- modal ---------- */
function modal(inner, bind){
  closeModal(); var m = document.createElement("div"); m.className = "modal"; m.id = "modal"; m.innerHTML = '<div class="mbox" role="dialog" aria-modal="true">' + inner + "</div>";
  m.addEventListener("click", function (e) { if (e.target === m || e.target.closest("[data-close]")) closeModal(); });
  document.body.appendChild(m); if (bind) bind(m);
}
function closeModal(){ var m = $("modal"); if (m) m.remove(); }
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

boot();
})();
</script>
