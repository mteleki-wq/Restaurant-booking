<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff · Bookings</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Service Deluxe — staff page. One copy serves every venue: ?venue=<slug> */
:root{--bg:#F3F1EC;--card:#fff;--ink:#1E2622;--muted:#6B746F;--line:#E3DED5;--accent:#4F6B5C;--soft:#E7EEE9;--warn:#9A3B2E;--amber:#A06A14;--hour:64px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:rgba(243,241,236,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font:400 24px/1 "Instrument Serif",serif;margin:0;white-space:nowrap}
.top h1 small{display:block;font:600 11px Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button.on{background:var(--ink);color:#fff}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
.who button{margin-left:6px}
main{max-width:1400px;margin:0 auto;padding:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=time],input[type=datetime-local],input[type=url],select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-width:0;font-size:15px}
textarea{width:100%;min-height:70px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400}
.g2{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.g3{display:grid;gap:12px}
h2{font:400 28px/1.1 "Instrument Serif",serif;margin:0}
h3{margin:0 0 10px;font-size:15px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--accent)}
.pill.cancelled{background:#F4E4E1;color:var(--warn)} .pill.no_show{background:#F6EBD6;color:var(--amber)} .pill.completed{background:#E6E8E7;color:#555}
/* login */
.login{max-width:380px;margin:12vh auto;display:grid;gap:12px}
.login h2{text-align:center}
.err{color:var(--warn);font-size:14px}
/* calendar */
.calbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.calbar .date{font:400 26px/1 "Instrument Serif",serif;margin:0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--soft);color:var(--accent)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.stat{background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted)}
.stat b{color:var(--ink);font-size:16px;margin-right:4px}
.calwrap{background:var(--card);border-radius:16px;overflow:auto;max-height:calc(100vh - 210px);-webkit-overflow-scrolling:touch}
.cal{display:grid;position:relative;min-width:max-content}
.cal .hd{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line);padding:10px 8px;font-weight:700;font-size:13px;text-align:center;white-space:nowrap}
.cal .hd small{display:block;font-weight:500;color:var(--muted)}
.cal .tcol{position:sticky;left:0;z-index:2;background:var(--card);border-right:1px solid var(--line)}
.cal .hd.corner{left:0;z-index:4}
.tlab{height:var(--hour);font-size:11px;color:var(--muted);text-align:right;padding:0 8px;transform:translateY(-7px)}
.colb{position:relative;border-right:1px solid var(--line);min-width:150px}
.colb .hl{height:var(--hour);border-top:1px solid #F0ECE5}
.colb .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#F6F4F0 0 6px,#EFECE6 6px 12px)}
.ap{position:absolute;left:4px;right:4px;border-radius:9px;padding:4px 7px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;background:var(--soft);border-left:3px solid var(--accent);color:var(--ink)}
.ap b{display:block;font-size:12.5px}
.ap.cancelled{opacity:.45;text-decoration:line-through}
.ap.no_show{background:#F6EBD6;border-left-color:var(--amber)}
.ap.completed{background:#ECEDEC;border-left-color:#888}
.ap .buf{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 4px,rgba(0,0,0,.05) 4px 8px)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--warn);z-index:1}
/* lists */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid #F0ECE5;vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:#FAF9F6}
.items{display:grid;gap:10px}
.item{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.item .main{flex:1;min-width:200px}
.item .main b{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;background:var(--bg);border-radius:999px;padding:2px 9px;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 14px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px}
.week{display:grid;gap:8px}
.wd{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}
.wd .ranges{display:flex;flex-direction:column;gap:6px}
.wd .rg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(20,24,22,.35);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;right:0;top:0;bottom:0;width:min(520px,100%);padding:20px;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.sheet .x{float:right}
.sheet dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:14px 0}
.sheet dt{color:var(--muted)} .sheet dd{margin:0;font-weight:600;word-break:break-word}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;max-height:220px;overflow:auto}
.slot{padding:8px 0;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-weight:600}
.slot.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-size:14px}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.mbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:#C2410C;color:#fff;font-size:11px;font-weight:800;vertical-align:1px}
.mbadge[hidden]{display:none}
.mcard{margin-bottom:10px}.mcard.done{opacity:.6}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1><small>Staff</small><span id="vname">Bookings</span></h1>
  <nav class="tabs hide" id="tabs">
    <button data-tab="cal" class="on">Calendar</button>
    <button data-tab="list">Bookings</button>
    <button data-tab="msg">Messages<span id="msgBadge" class="mbadge" hidden></span></button>
    <button data-tab="svc">Treatments</button>
    <button data-tab="team">Team</button>
    <button data-tab="rooms">Rooms</button>
    <button data-tab="hours">Hours &amp; closures</button>
    <button data-tab="set">Settings</button>
  </nav>
  <div class="who hide" id="who"><span id="whoem"></span><button class="btn sm" id="logout">Sign out</button></div>
</div></header>
<main id="app"><div class="spin"></div></main>
<div id="layer"></div>

<script>
/* ======================= CONFIG ======================= */
var CONFIG = {
  supabaseUrl: "https://tehxobdokbvqtwtgqzrh.supabase.co",
  supabaseKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlaHhvYmRva2J2cXR3dGdxenJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwOTA0MzEsImV4cCI6MjA5NzY2NjQzMX0.ofwrtvy7T4_uDP4hcWdO9roO2viWEmrplp8CCpFNupE",
  venue: "serenity-spa",
  bookingPage: "service-booking.html",   // client booking page (relative or full URL)
  startPage: "service-start.html",       // sign-up / add-a-business page
  practitionerWord: "therapist"
};
/* ====================================================== */
var BASE = CONFIG.supabaseUrl.replace(/\/+$/, "").replace(/\/rest(\/v1)?$/, "");
var q = new URLSearchParams(location.search);
var VENUE = (q.get("venue") || CONFIG.venue).trim().toLowerCase();
var WORD = q.get("word") || CONFIG.practitionerWord, SW = "treatment", MINE = null;
var TZ = "Australia/Sydney", VID = null, VENUE_ROW = null;
var D = { services: [], providers: [], links: [], rooms: [], hours: [], timeoff: [], settings: null };
var V = { tab: (function () { var t = new URLSearchParams(location.search).get("tab") || ""; return /^(cal|list|msg|svc|team|rooms|hours|set)$/.test(t) ? t : "cal"; })(), date: null, mode: "provider" };
var SES = null;
var $ = function (id) { return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function money(c){ return c == null ? "" : c === 0 ? "Free" : "$" + (c / 100).toFixed(c % 100 ? 2 : 0); }
function toast(t){ var d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2600); }

/* ---------- time zone helpers (venue local <-> UTC) ---------- */
function partsIn(date){
  var o = {}; new Intl.DateTimeFormat("en-CA", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" })
    .formatToParts(date).forEach(function (p) { o[p.type] = p.value; });
  return o;
}
function localToUtc(ds, hm){
  var y = +ds.slice(0, 4), m = +ds.slice(5, 7) - 1, d = +ds.slice(8, 10), h = +hm.slice(0, 2), mi = +hm.slice(3, 5);
  var guess = Date.UTC(y, m, d, h, mi);
  for (var i = 0; i < 2; i++) {
    var p = partsIn(new Date(guess));
    var asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    guess += Date.UTC(y, m, d, h, mi) - asUtc;
  }
  return new Date(guess);
}
function localDate(d){ var p = partsIn(new Date(d)); return p.year + "-" + p.month + "-" + p.day; }
function localTime(d){ var p = partsIn(new Date(d)); return p.hour + ":" + p.minute; }
function minsOfDay(d){ var p = partsIn(new Date(d)); return +p.hour * 60 + +p.minute; }
function today(){ return localDate(new Date()); }
function addDays(ds, n){ var d = new Date(ds + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dow(ds){ return new Date(ds + "T12:00:00Z").getUTCDay(); }
function fmtDay(ds, o){ return new Date(ds + "T12:00:00Z").toLocaleDateString("en-AU", Object.assign({ timeZone: "UTC" }, o)); }
var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

/* ---------- Supabase REST with the staff session ---------- */
function saveSes(s){ SES = s; try { localStorage.setItem("svc_staff_session", JSON.stringify(s)); } catch (e) {} }
function loadSes(){ try { return JSON.parse(localStorage.getItem("svc_staff_session") || "null"); } catch (e) { return null; } }
function auth(path, body){
  return fetch(BASE + "/auth/v1/" + path, { method: "POST", headers: { apikey: CONFIG.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "Sign-in failed"); return j; }); });
}
function fresh(){
  if (!SES) return Promise.reject(new Error("Not signed in"));
  if (SES.expires_at && SES.expires_at * 1000 - Date.now() > 60000) return Promise.resolve(SES.access_token);
  return auth("token?grant_type=refresh_token", { refresh_token: SES.refresh_token }).then(function (s) { saveSes(s); return s.access_token; });
}
function api(method, path, body, prefer){
  return fresh().then(function (tok) {
    var h = { apikey: CONFIG.supabaseKey, Authorization: "Bearer " + tok, "Content-Type": "application/json" };
    if (prefer) h.Prefer = prefer;
    return fetch(BASE + "/rest/v1/" + path, { method: method, headers: h, body: body == null ? undefined : JSON.stringify(body) });
  }).then(function (r) {
    return r.text().then(function (t) {
      var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
      if (!r.ok) {
        var msg = (j && (j.message || j.details)) || ("Error " + r.status);
        if (/svc_no_provider_clash/.test(msg)) msg = "That " + WORD + " is already booked at that time.";
        if (/svc_no_room_clash/.test(msg)) msg = "That room is already booked at that time.";
        if (r.status === 401) { saveSes(null); }
        throw new Error(msg);
      }
      return j;
    });
  });
}
var get = function (p) { return api("GET", p); };
var post = function (p, b) { return api("POST", p, b, "return=representation"); };
var patch = function (p, b) { return api("PATCH", p, b, "return=representation"); };
var del = function (p) { return api("DELETE", p); };
function rpc(fn, args){ return api("POST", "rpc/" + fn, args); }

/* ---------- boot / sign in ---------- */
function boot(){
  SES = loadSes();
  fetch(BASE + "/rest/v1/rpc/svc_get_catalog", { method: "POST", headers: { apikey: CONFIG.supabaseKey, Authorization: "Bearer " + CONFIG.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify({ p_venue: VENUE }) })
    .then(function (r) { return r.json(); })
    .then(function (c) {
      if (!c || !c.ok) { $("app").innerHTML = '<div class="card login"><h2>Unknown business</h2><p class="muted">No venue called “' + esc(VENUE) + '”. Check the ?venue= part of the link.</p></div>'; return; }
      VID = c.venue.id; VENUE_ROW = c.venue; TZ = c.venue.timezone || TZ;
      if (!q.get("word") && c.settings.practitioner_word) WORD = c.settings.practitioner_word;
      if (c.settings.service_word) SW = c.settings.service_word;
      var tb = document.querySelector('[data-tab="svc"]'); if (tb) tb.textContent = cap(SW) + "s";
      $("vname").textContent = c.venue.name; document.title = "Staff · " + c.venue.name;
      V.date = today();
      if (SES) enter(); else loginView();
    }).catch(function (e) { $("app").innerHTML = '<div class="card login"><p class="err">' + esc(e.message) + "</p></div>"; });
}
function loginView(msg){
  $("tabs").classList.add("hide"); $("who").classList.add("hide");
  $("app").innerHTML = '<form class="card login" id="lf"><h2>Staff sign in</h2><p class="muted" style="text-align:center;margin:0">' + esc(VENUE_ROW.name) + '</p>' +
    '<label class="f">Email<input type="email" id="le" autocomplete="username" required></label>' +
    '<label class="f">Password<input type="password" id="lp" autocomplete="current-password" required></label>' +
    '<button class="btn pri" type="submit">Sign in</button><div class="err" id="lerr">' + esc(msg || "") + "</div>" +
    '<p class="muted" style="font-size:13px;text-align:center;margin:4px 0 0"><a href="' + esc(new URL(CONFIG.startPage, location.href).toString() + "?mode=signin") + '">Forgot password</a> · <a href="' + esc(new URL(CONFIG.startPage, location.href).toString()) + '">Set up a new business</a></p></form>';
  $("lf").onsubmit = function (ev) {
    ev.preventDefault();
    auth("token?grant_type=password", { email: $("le").value.trim(), password: $("lp").value })
      .then(function (s) { saveSes(s); enter(); })
      .catch(function (e) { $("lerr").textContent = e.message; });
  };
}
function enter(){
  rpc("svc_is_staff", { p_venue: VID }).then(function (ok) {
    return rpc("svc_my_venues", {}).then(function (m) {
      MINE = m;
      $("who").classList.remove("hide"); $("whoem").textContent = (SES.user && SES.user.email) || "";
      if (!ok) return notMine(m);
      $("tabs").classList.remove("hide");
      switcher(m);
      return loadAll().then(function () { show(); loadMsgBadge(); });
    });
  }).catch(function (e) { saveSes(null); loginView(e.message); });
}
$("logout").onclick = function () { saveSes(null); $("bizsw") && $("bizsw").remove(); loginView(); };
function staffUrl(slug){ var u = new URL(location.href); u.search = ""; u.hash = ""; u.searchParams.set("venue", slug); return u.toString(); }
function notMine(m){
  var list = (m && m.venues) || [];
  $("tabs").classList.add("hide");
  $("app").innerHTML = '<div class="card login"><h2>Not on this team</h2><p class="muted">This login isn\'t on the staff list for ' + esc(VENUE_ROW.name) + '. Ask the owner for an invite link' + (list.length ? ", or open one of your businesses:" : ".") + "</p>" +
    list.map(function (v) { return '<a class="btn" style="text-align:center;text-decoration:none" href="' + esc(staffUrl(v.slug)) + '">' + esc(v.name) + "</a>"; }).join("") +
    '<a class="btn" style="text-align:center;text-decoration:none" href="' + esc(new URL(CONFIG.startPage, location.href).toString()) + '">Set up a new business</a></div>';
}
function switcher(m){
  var list = (m && m.venues) || [];
  if (list.length < 2 || $("bizsw")) return;
  var s = document.createElement("select"); s.id = "bizsw"; s.title = "Switch business";
  s.style.cssText = "max-width:200px;font-size:13px;padding:6px 8px";
  s.innerHTML = list.map(function (v) { return '<option value="' + esc(v.slug) + '"' + (v.slug === VENUE ? " selected" : "") + ">" + esc(v.name) + "</option>"; }).join("");
  s.onchange = function () { location.href = staffUrl(s.value); };
  $("who").insertBefore(s, $("who").firstChild);
}
function loadAll(){
  var v = "venue_id=eq." + VID;
  return Promise.all([
    get("svc_services?" + v + "&order=sort,name"), get("svc_providers?" + v + "&order=sort,name"),
    get("svc_provider_services?" + v), get("svc_rooms?" + v + "&order=sort,name"),
    get("svc_hours?" + v + "&order=weekday,start_time"),
    get("svc_time_off?" + v + "&ends_at=gte." + encodeURIComponent(new Date(Date.now() - 864e5).toISOString()) + "&order=starts_at"),
    get("svc_settings?" + v)
  ]).then(function (r) {
    D.services = r[0]; D.providers = r[1]; D.links = r[2]; D.rooms = r[3]; D.hours = r[4]; D.timeoff = r[5]; D.settings = r[6][0] || null;
  });
}
document.querySelectorAll("[data-tab]").forEach(function (b) {
  b.onclick = function () { V.tab = b.getAttribute("data-tab"); document.querySelectorAll("[data-tab]").forEach(function (x) { x.classList.toggle("on", x === b); }); show(); };
});
document.querySelectorAll("[data-tab]").forEach(function (x) { x.classList.toggle("on", x.getAttribute("data-tab") === V.tab); });
function show(){
  closeSheet();
  ({ cal: viewCal, list: viewList, msg: viewMessages, svc: viewServices, team: viewTeam, rooms: viewRooms, hours: viewHours, set: viewSettings })[V.tab]();
}
function byId(list, id){ return list.filter(function (x) { return x.id === id; })[0]; }

/* =================== CALENDAR =================== */
var APPTS = [];
function viewCal(){
  $("app").innerHTML = '<div class="calbar"><button class="btn" id="cp">‹</button><button class="btn" id="ct">Today</button><button class="btn" id="cn">›</button>' +
    '<input type="date" id="cd" value="' + V.date + '"><span class="date" id="clabel"></span><span class="sp"></span>' +
    '<span class="seg"><button data-m="provider" class="' + (V.mode === "provider" ? "on" : "") + '">' + cap(WORD) + 's</button><button data-m="room" class="' + (V.mode === "room" ? "on" : "") + '">Rooms</button></span>' +
    '<button class="btn acc" id="newb">+ New booking</button><button class="btn" id="blk">Block time</button></div><div class="stats" id="stats"></div><div class="calwrap" id="cw"><div class="spin"></div></div>';
  $("cp").onclick = function () { V.date = addDays(V.date, -1); viewCal(); };
  $("cn").onclick = function () { V.date = addDays(V.date, 1); viewCal(); };
  $("ct").onclick = function () { V.date = today(); viewCal(); };
  $("cd").onchange = function () { if (this.value) { V.date = this.value; viewCal(); } };
  document.querySelectorAll("[data-m]").forEach(function (b) { b.onclick = function () { V.mode = b.getAttribute("data-m"); viewCal(); }; });
  $("newb").onclick = function () { bookingSheet({ date: V.date }); };
  $("blk").onclick = function () { blockSheet({ date: V.date }); };
  $("clabel").textContent = fmtDay(V.date, { weekday: "long", day: "numeric", month: "long" });
  var a = localToUtc(V.date, "00:00").toISOString(), b = localToUtc(addDays(V.date, 1), "00:00").toISOString();
  get("svc_appointments?venue_id=eq." + VID + "&starts_at=gte." + encodeURIComponent(a) + "&starts_at=lt." + encodeURIComponent(b) + "&order=starts_at")
    .then(function (rows) { APPTS = rows; drawCal(); })
    .catch(function (e) { $("cw").innerHTML = '<div class="card err">' + esc(e.message) + "</div>"; });
}
function venueWindows(ds){ return D.hours.filter(function (h) { return !h.provider_id && h.weekday === dow(ds); }); }
function hm2m(t){ return +t.slice(0, 2) * 60 + +t.slice(3, 5); }
function drawCal(){
  var ds = V.date, wins = venueWindows(ds);
  var live = APPTS.filter(function (x) { return x.status !== "cancelled"; });
  var start = 8 * 60, end = 20 * 60;
  if (wins.length) { start = Math.min.apply(null, wins.map(function (w) { return hm2m(w.start_time); })); end = Math.max.apply(null, wins.map(function (w) { return hm2m(w.end_time); })); }
  APPTS.forEach(function (x) { start = Math.min(start, minsOfDay(x.starts_at)); end = Math.max(end, minsOfDay(x.block_until) || 1440); });
  start = Math.floor(start / 60) * 60; end = Math.min(1440, Math.ceil(end / 60) * 60);
  var HP = 64, px = function (m) { return (m - start) / 60 * HP; };
  var revenue = live.filter(function (x) { return x.status !== "no_show"; }).reduce(function (s, x) { return s + (x.price_cents || 0); }, 0);
  $("stats").innerHTML = '<span class="stat"><b>' + live.length + "</b>bookings</span>" +
    '<span class="stat"><b>' + money(revenue) + "</b>booked value</span>" +
    '<span class="stat"><b>' + APPTS.filter(function (x) { return x.status === "cancelled"; }).length + "</b>cancelled</span>" +
    (wins.length ? '<span class="stat">Open ' + wins.map(function (w) { return w.start_time.slice(0, 5) + "–" + w.end_time.slice(0, 5); }).join(", ") + "</span>" : '<span class="stat" style="color:var(--warn)">Closed (no opening hours today)</span>');

  var cols;
  if (V.mode === "provider") {
    cols = D.providers.filter(function (p) { return p.active; }).map(function (p) { return { id: p.id, name: p.name, sub: p.title || "", key: "provider_id" }; });
    if (live.some(function (x) { return !x.provider_id; })) cols.push({ id: null, name: "No " + WORD, sub: "room-only", key: "provider_id" });
  } else {
    cols = D.rooms.filter(function (r) { return r.active; }).map(function (r) { return { id: r.id, name: r.name, sub: r.room_type || "", key: "room_id" }; });
    if (live.some(function (x) { return !x.room_id; })) cols.push({ id: null, name: "No room", sub: "e.g. consults", key: "room_id" });
  }
  if (!cols.length) { $("cw").innerHTML = '<div class="card muted">Add ' + (V.mode === "provider" ? WORD + "s in Team" : "rooms in Rooms") + " to see the calendar.</div>"; return; }

  var hoursH = "";
  for (var m = start; m < end; m += 60) hoursH += '<div class="tlab">' + (m === start ? "" : String(m / 60).padStart(2, "0") + ":00") + "</div>";
  var html = '<div class="cal" style="grid-template-columns:56px repeat(' + cols.length + ',minmax(150px,1fr))"><div class="hd corner tcol"></div>';
  cols.forEach(function (c) { html += '<div class="hd">' + esc(c.name) + "<small>" + esc(c.sub) + "</small></div>"; });
  html += '<div class="tcol" style="padding-top:0">' + hoursH + "</div>";
  cols.forEach(function (c) {
    var body = "";
    for (var mm = start; mm < end; mm += 60) body += '<div class="hl"></div>';
    // shade non-working time
    var work = [];
    if (V.mode === "provider" && c.id) {
      var own = D.hours.filter(function (h) { return h.provider_id === c.id; });
      work = (own.length ? own.filter(function (h) { return h.weekday === dow(ds); }) : wins);
    } else work = wins;
    work = work.map(function (w) { return [hm2m(w.start_time), hm2m(w.end_time)]; }).sort(function (a, b) { return a[0] - b[0]; });
    var cur = start;
    work.concat([[end, end]]).forEach(function (w) { if (w[0] > cur) body += '<div class="off" style="top:' + px(cur) + "px;height:" + (px(w[0]) - px(cur)) + 'px"></div>'; cur = Math.max(cur, w[1]); });
    // time off blocks
    D.timeoff.forEach(function (t) {
      var hit = (!t.provider_id && !t.room_id) || (V.mode === "provider" && t.provider_id === c.id && c.id) || (V.mode === "room" && t.room_id === c.id && c.id);
      if (!hit) return;
      var s = new Date(t.starts_at), e = new Date(t.ends_at), d0 = localToUtc(ds, "00:00"), d1 = localToUtc(addDays(ds, 1), "00:00");
      if (e <= d0 || s >= d1) return;
      var sm = s < d0 ? start : minsOfDay(s), em = e >= d1 ? end : minsOfDay(e);
      body += '<div class="off" data-to="' + t.id + '" style="cursor:pointer;top:' + px(Math.max(sm, start)) + "px;height:" + Math.max(8, px(Math.min(em, end)) - px(Math.max(sm, start))) + 'px;background:repeating-linear-gradient(135deg,#F1E3DF 0 6px,#EAD7D2 6px 12px)" title="' + esc(t.reason || "Blocked") + '"></div>';
    });
    APPTS.filter(function (x) { return (x[c.key] || null) === c.id && (x.status !== "cancelled" || V.showCancelled); }).forEach(function (x) {
      var sm = minsOfDay(x.starts_at), em = sm + (new Date(x.ends_at) - new Date(x.starts_at)) / 6e4, bm = sm + (new Date(x.block_until) - new Date(x.starts_at)) / 6e4;
      var other = V.mode === "provider" ? (x.room_id ? (byId(D.rooms, x.room_id) || {}).name : "") : (x.provider_id ? (byId(D.providers, x.provider_id) || {}).name : "");
      var h = px(bm) - px(sm), bh = px(bm) - px(em);
      body += '<div class="ap ' + x.status + '" data-ap="' + x.id + '" style="top:' + px(sm) + "px;height:" + Math.max(18, h - 2) + 'px">' +
        "<b>" + localTime(x.starts_at) + " " + esc(x.client_name) + "</b>" + esc(x.service_name) + (other ? '<br><span class="muted">' + esc(other) + "</span>" : "") +
        (bh > 0 ? '<span class="buf" style="height:' + bh + 'px"></span>' : "") + "</div>";
    });
    if (ds === today()) { var nm = minsOfDay(new Date()); if (nm >= start && nm <= end) body += '<div class="nowline" style="top:' + px(nm) + 'px"></div>'; }
    html += '<div class="colb" style="height:' + px(end) + 'px">' + body + "</div>";
  });
  html += "</div>";
  $("cw").innerHTML = html;
  $("cw").querySelectorAll("[data-ap]").forEach(function (el) { el.onclick = function () { apptSheet(byId(APPTS, el.getAttribute("data-ap"))); }; });
  $("cw").querySelectorAll("[data-to]").forEach(function (el) {
    el.onclick = function () {
      var t = byId(D.timeoff, el.getAttribute("data-to"));
      if (confirm("Remove this block" + (t.reason ? " (" + t.reason + ")" : "") + "?")) del("svc_time_off?id=eq." + t.id).then(loadAll).then(function () { toast("Block removed"); viewCal(); }).catch(function (e) { alert(e.message); });
    };
  });
}

    (x.status !== "completed" ? '<button class="btn sm" data-st="completed">Mark completed</button>' : "") +

  $("savm").onclick = function () { patch("svc_appointments?id=eq." + x.id, { provider_id: $("cpr").value || null, room_id: $("crm").value || null }).then(after("Updated")).catch(fail); };
  document.querySelectorAll("[data-st]").forEach(function (b) {

function notifyHook(){ /* emails are sent by the database itself (Supabase function svc-booking-email) */ }
function bookingSheet(o){
  var sv = D.services.filter(function (s) { return s.active; });
  openSheet('<button class="btn sm x">Close</button><h2>' + (o.replace ? "Reschedule" : "New booking") + '</h2><p class="muted">Phone or walk-in booking. Availability rules apply; the custom time skips the online notice period.</p><div class="g2">' +
    '<label class="f">' + cap(SW) + '<select id="bs">' + sv.map(function (s) { return '<option value="' + s.id + '"' + (s.id === o.service ? " selected" : "") + ">" + esc(s.name) + " (" + s.duration_min + " min)</option>"; }).join("") + "</select></label>" +
    '<label class="f">' + cap(WORD) + '<select id="bp"></select></label>' +
    '<label class="f">Date<input type="date" id="bd" value="' + (o.date || V.date) + '"></label>' +
    '<label class="f">Custom time<input type="time" id="bt" step="300"></label></div>' +
    '<h3 style="margin-top:14px">Free times</h3><div class="slots" id="bsl"><div class="spin"></div></div>' +
    '<h3 style="margin-top:14px">Client</h3><div class="g2"><label class="f">Name<input type="text" id="bn" value="' + esc(o.name || "") + '"></label>' +
    '<label class="f">Phone<input type="tel" id="bph" value="' + esc(o.phone || "") + '"></label>' +
    '<label class="f">Email<input type="email" id="be" value="' + esc(o.email || "") + '"></label>' +
    '<label class="f">Notes<input type="text" id="bno" value="' + esc(o.notes || "") + '"></label></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn pri" id="bgo">' + (o.replace ? "Book new time & cancel old" : "Book") + '</button><span class="err" id="berr"></span></div>');
  var pick = null;
  var fillPros = function () {
    var sid = $("bs").value, s = byId(D.services, sid);
    var pros = D.providers.filter(function (p) { return p.active && D.links.some(function (l) { return l.provider_id === p.id && l.service_id === sid; }); });
    $("bp").innerHTML = s && !s.needs_provider ? '<option value="">Not needed</option>' : '<option value="">Anyone available</option>' + pros.map(function (p) { return '<option value="' + p.id + '"' + (p.id === o.provider ? " selected" : "") + ">" + esc(p.name) + "</option>"; }).join("");
    $("bp").disabled = s && !s.needs_provider;
  };

    rpc("svc_get_slots", { p_venue: VENUE, p_service: $("bs").value, p_date: $("bd").value, p_provider: $("bp").value || null }).then(function (r) {
      var sl = (r && r.slots) || [];
      $("bsl").innerHTML = sl.length ? sl.map(function (s) { return '<button class="slot" data-s="' + s.start + '">' + s.time + "</button>"; }).join("") : '<span class="muted">No free times — try a custom time or another day.</span>';
      $("bsl").querySelectorAll("[data-s]").forEach(function (b) { b.onclick = function () { pick = b.getAttribute("data-s"); $("bt").value = ""; $("bsl").querySelectorAll(".slot").forEach(function (z) { z.classList.toggle("sel", z === b); }); }; });
    }).catch(function (e) { $("bsl").innerHTML = '<span class="err">' + esc(e.message) + "</span>"; });
  };
  fillPros(); loadS();
  $("bs").onchange = function () { fillPros(); loadS(); };
  $("bp").onchange = loadS; $("bd").onchange = loadS;
  $("bt").oninput = function () { pick = null; $("bsl").querySelectorAll(".slot").forEach(function (z) { z.classList.remove("sel"); }); };
  $("bgo").onclick = function () {
    var start = pick || ($("bt").value ? localToUtc($("bd").value, $("bt").value).toISOString() : null);
    if (!start) { $("berr").textContent = "Pick a free time or enter a custom time."; return; }
    if (!$("bn").value.trim()) { $("berr").textContent = "Client name is needed."; return; }
    if (!$("bph").value.trim() && !$("be").value.trim()) { $("berr").textContent = "Add a phone or email for the client."; return; }
    var b = $("bgo"); b.disabled = true;
    var go = function () {
      return rpc("svc_book", { p_venue: VENUE, p_service: $("bs").value, p_start: start, p_provider: $("bp").value || null, p_name: $("bn").value, p_email: $("be").value, p_phone: $("bph").value, p_notes: $("bno").value, p_source: "staff" });

function blockSheet(o){

    post("svc_time_off", row).then(loadAll).then(function () { toast("Blocked"); closeSheet(); if (V.tab === "cal") viewCal(); else show(); }).catch(function (er) { $("kerr").textContent = er.message; });
  };
  document.querySelectorAll("[data-rmto]").forEach(function (b) { b.onclick = function () { del("svc_time_off?id=eq." + b.getAttribute("data-rmto")).then(loadAll).then(function () { toast("Removed"); blockSheet(o); }); }; });

/* =================== BOOKINGS LIST =================== */
function viewList(){
  $("app").innerHTML = '<div class="row" style="margin-bottom:12px"><h2>Bookings</h2><span class="sp"></span><input type="text" id="ls" placeholder="Search name, email, phone, ref" style="min-width:240px">' +
    '<select id="lr"><option value="up">Upcoming</option><option value="past">Past 30 days</option><option value="all">Everything</option></select><button class="btn" id="lcsv">Export CSV</button></div><div class="card" id="lt"><div class="spin"></div></div>';
  var rows = [];
  var load = function () {
    var r = $("lr").value, now = new Date().toISOString(), p = "svc_appointments?venue_id=eq." + VID;
    if (r === "up") p += "&starts_at=gte." + encodeURIComponent(now) + "&order=starts_at&limit=500";
    if (r === "past") p += "&starts_at=lt." + encodeURIComponent(now) + "&starts_at=gte." + encodeURIComponent(new Date(Date.now() - 30 * 864e5).toISOString()) + "&order=starts_at.desc&limit=500";
    if (r === "all") p += "&order=starts_at.desc&limit=1000";
    get(p).then(function (x) { rows = x; draw(); }).catch(function (e) { $("lt").innerHTML = '<span class="err">' + esc(e.message) + "</span>"; });
  };

function bindWeek(id){
  var root = $(id);

    var t = ev.target;
    if (t.hasAttribute("data-addr")) { t.parentNode.insertAdjacentHTML("beforebegin", rangeRow(null)); }
    if (t.hasAttribute("data-rmr")) { t.parentNode.remove(); }
  });

function readWeek(id){
  var out = [], bad = null;
  $(id).querySelectorAll(".wd").forEach(function (wd) {
    var w = +wd.getAttribute("data-w");
    wd.querySelectorAll(".rg").forEach(function (rg) {
      var s = rg.querySelector("[data-s]").value, e = rg.querySelector("[data-e]").value;
      if (!s || !e) return;
      if (e <= s) bad = DAYS[w] + ": end must be after start";
      out.push({ weekday: w, start_time: s, end_time: e });
    });
  });
  if (bad) throw new Error(bad);
  return out;
}

  $("tol").innerHTML = D.timeoff.length ? "<table>" + D.timeoff.map(function (t) {
    var w = t.provider_id ? (byId(D.providers, t.provider_id) || {}).name : t.room_id ? (byId(D.rooms, t.room_id) || {}).name : "Whole business";
    return "<tr><td><b>" + esc(w) + "</b><br><span class=\"muted\">" + esc(t.reason || "") + "</span></td><td>" + new Date(t.starts_at).toLocaleString("en-AU", { timeZone: TZ, dateStyle: "medium", timeStyle: "short" }) + "<br>→ " + new Date(t.ends_at).toLocaleString("en-AU", { timeZone: TZ, dateStyle: "medium", timeStyle: "short" }) + '</td><td><button class="btn sm danger" data-rmto="' + t.id + '">Remove</button></td></tr>';
  }).join("") + "</table>" : '<p class="muted">Nothing blocked.</p>';
  document.querySelectorAll("[data-rmto]").forEach(function (b) { b.onclick = function () { del("svc_time_off?id=eq." + b.getAttribute("data-rmto")).then(loadAll).then(function () { toast("Removed"); viewHours(); }); }; });
  $("hblk").onclick = function () { blockSheet({ date: today() }); };
  $("hsave").onclick = function () {
    var hrs; try { hrs = readWeek("vweek"); } catch (e) { $("herr").textContent = e.message; return; }
    del("svc_hours?venue_id=eq." + VID + "&provider_id=is.null")
      .then(function () { if (hrs.length) return post("svc_hours", hrs.map(function (h) { return Object.assign({ venue_id: VID, provider_id: null }, h); })); })
      .then(loadAll).then(function () { toast("Opening hours saved"); viewHours(); }).catch(function (e) { $("herr").textContent = e.message; });
  };
}

/* =================== SETTINGS =================== */
function copyBtn(id, text){ var b = $(id); if (!b) return; b.onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { b.textContent = "Copied ✓"; setTimeout(function () { b.textContent = "Copy"; }, 2000); }, function () { prompt("Copy this link:", text); }); }; }
function viewSettings(){
  var s = D.settings || {};
  var link = new URL(CONFIG.bookingPage, location.href); link.search = ""; link.searchParams.set("venue", VENUE);
  var inv = new URL(CONFIG.startPage, location.href); inv.search = ""; inv.searchParams.set("join", VENUE); inv.searchParams.set("k", s.join_key || "");
  var amOwner = (MINE && MINE.admin) || ((MINE && MINE.venues) || []).some(function (v) { return v.slug === VENUE && v.role === "owner"; });
  $("app").innerHTML = '<div class="g2">' +
    '<div class="card"><h2>Your business</h2><div class="g2" style="margin-top:14px">' +
    '<label class="f">Business name<input type="text" id="bz1" value="' + esc(VENUE_ROW.name) + '"></label>' +
    '<label class="f">Phone<input type="tel" id="bz2" value="' + esc(VENUE_ROW.phone || "") + '"></label>' +
    '<label class="f">Email (gets booking copies)<input type="email" id="bz3" value="' + esc(VENUE_ROW.email || "") + '"></label>' +
    '<label class="f">Word for your people<input type="text" id="bz4" value="' + esc(s.practitioner_word || WORD) + '" placeholder="therapist, doctor…"></label>' +
    '<label class="f">Word for what you offer<input type="text" id="bz5" value="' + esc(s.service_word || SW) + '" placeholder="treatment, appointment…"></label></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn pri" id="bzsave"' + (amOwner ? "" : " disabled title=\"Owner only\"") + '>Save</button><span class="err" id="bzerr"></span></div></div>' +

    '<div class="card"><h2>Links</h2><p class="muted" style="margin-bottom:6px">Booking page — put it on your website, Instagram and Google profile:</p>' +
    '<p style="word-break:break-all;margin:0 0 8px"><a href="' + esc(link) + '" target="_blank">' + esc(link) + '</a></p><button class="btn sm" id="cpb">Copy</button>' +
    '<p class="muted" style="margin:18px 0 6px">Staff invite link — whoever opens it and signs in joins your team:</p>' +
    '<p style="word-break:break-all;margin:0 0 8px;font-size:13px"><code>' + esc(inv) + '</code></p><div class="row"><button class="btn sm" id="cpi">Copy</button>' +
    (amOwner ? '<button class="btn sm" id="newinv">Make a new link</button>' : "") + '</div>' +
    '<p class="muted" style="font-size:12px;margin-top:6px">Making a new link stops the old one working. People already on the team stay.</p></div>' +

    '<div class="card"><h2>Team logins</h2><p class="muted">People who can open this calendar.</p><div id="logins"><div class="spin"></div></div></div>' +

    '<div class="card"><h2>Online booking rules</h2><div class="g2" style="margin-top:14px">' +
    '<label class="f">Time steps (min)<select id="st1">' + [5, 10, 15, 20, 30, 60].map(function (v) { return "<option" + ((s.slot_step_min || 15) === v ? " selected" : "") + ">" + v + "</option>"; }).join("") + "</select></label>" +
    '<label class="f">Minimum notice (hours)<input type="number" id="st2" min="0" step="0.5" value="' + ((s.lead_time_min != null ? s.lead_time_min : 120) / 60) + '"></label>' +
    '<label class="f">Book up to (days ahead)<input type="number" id="st3" min="1" max="365" value="' + (s.max_days_ahead || 60) + '"></label>' +
    '<label class="f">Online cancel cut-off (hours)<input type="number" id="st4" min="0" value="' + (s.cancel_hours != null ? s.cancel_hours : 24) + '"></label></div>' +
    '<label class="f" style="margin-top:12px">Note shown before confirming<textarea id="st5">' + esc(s.booking_note || "") + "</textarea></label>" +
    '<p class="muted" style="margin:12px 0 0;font-size:13px">Confirmation, cancellation and day-before reminder emails are sent automatically.</p>' +
    '<div class="row" style="margin-top:14px"><button class="btn pri" id="stsave">Save</button><span class="err" id="sterr"></span></div>' +
    '<p class="muted" style="margin-top:14px;font-size:13px">Link straight to one ' + esc(SW) + ' by adding <code>&amp;service=&lt;id&gt;</code> to the booking link:</p><table>' + D.services.map(function (x) { return "<tr><td>" + esc(x.name) + '</td><td><code style="font-size:11px">' + x.id + "</code></td></tr>"; }).join("") + "</table>" +
    '<p class="muted" style="margin-top:14px;font-size:13px">Business code: <b>' + esc(VENUE) + "</b> · time zone " + esc(TZ) + '<br><a href="' + esc(new URL(CONFIG.startPage, location.href).toString()) + '">Set up another business</a></p></div>' +
    "</div>";
  copyBtn("cpb", link.toString()); copyBtn("cpi", inv.toString());
  var ni = $("newinv");
  if (ni) ni.onclick = function () {
    if (!confirm("Make a new invite link? The current one will stop working.")) return;
    var k = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function (c) { return (c ^ Math.random() * 16 >> c / 4).toString(16); });
    patch("svc_settings?venue_id=eq." + VID, { join_key: k }).then(loadAll).then(function () { toast("New invite link made"); viewSettings(); }).catch(function (e) { alert(e.message); });
  };
  var drawLogins = function () {
    rpc("svc_team_logins", { p_venue: VID }).then(function (list) {
      $("logins").innerHTML = (list || []).length ? "<table>" + list.map(function (l) {
        return "<tr><td>" + esc(l.email) + (l.me ? ' <span class="pill">you</span>' : "") + '</td><td><span class="pill">' + esc(l.role) + "</span></td><td>" +
          (amOwner && !l.me ? '<button class="btn sm danger" data-rmu="' + l.user_id + '">Remove</button>' : "") + "</td></tr>";
      }).join("") + "</table>" : '<p class="muted">Only Webescapade admin so far. Send the invite link to give staff their own login.</p>';
      document.querySelectorAll("[data-rmu]").forEach(function (b) {
        b.onclick = function () {
          if (!confirm("Remove this login from " + VENUE_ROW.name + "?")) return;
          rpc("svc_remove_login", { p_venue: VID, p_user: b.getAttribute("data-rmu") }).then(function (r) { if (!r.ok) return alert(r.error); toast("Removed"); drawLogins(); });
        };
      });
    }).catch(function (e) { $("logins").innerHTML = '<span class="err">' + esc(e.message) + "</span>"; });
  };
  drawLogins();
  $("bzsave").onclick = function () {
    rpc("svc_update_business", { p_venue: VID, p_name: $("bz1").value, p_phone: $("bz2").value, p_email: $("bz3").value, p_word: $("bz4").value, p_service_word: $("bz5").value })
      .then(function (r) {
        if (!r.ok) { $("bzerr").textContent = r.error; return; }
        VENUE_ROW.name = $("bz1").value.trim(); VENUE_ROW.phone = $("bz2").value.trim(); VENUE_ROW.email = $("bz3").value.trim();
        WORD = $("bz4").value.trim().toLowerCase() || WORD; SW = $("bz5").value.trim().toLowerCase() || SW;
        $("vname").textContent = VENUE_ROW.name; document.querySelector('[data-tab="svc"]').textContent = cap(SW) + "s";
        return loadAll().then(function () { toast("Saved"); });
      }).catch(function (e) { $("bzerr").textContent = e.message; });
  };
  $("stsave").onclick = function () {
    var row = { venue_id: VID, slot_step_min: +$("st1").value, lead_time_min: Math.round(+$("st2").value * 60), max_days_ahead: +$("st3").value, cancel_hours: +$("st4").value, booking_note: $("st5").value.trim() || null, updated_at: new Date().toISOString() };
    api("POST", "svc_settings?on_conflict=venue_id", row, "resolution=merge-duplicates,return=representation")
      .then(loadAll).then(function () { toast("Settings saved"); }).catch(function (e) { $("sterr").textContent = e.message; });
  };
}

boot();
</script>
</body>
</html>
