<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Client Setup · Service Deluxe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EC;--paper:#fff;--paper2:#EFEAE0;--ink:#18201C;--ink2:#2B3530;--muted:#66706A;--line:#E2DCD0;--sage:#4F6B5C;--mint:#E4ECE6;--clay:#C98C6B;--ok:#2F7D55;--warn:#B7791F;--bad:#B42318;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
a{color:var(--sage)}
h1,h2,h3{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-.01em;margin:0}
h1{font-size:34px}h2{font-size:28px}h3{font-size:22px}
em{font-style:italic;color:var(--sage)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .w{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .m{width:32px;height:32px;border-radius:9px;background:var(--sage);color:#fff;display:grid;place-items:center;font:400 20px "Instrument Serif",serif}
.brand b{font:400 21px "Instrument Serif",serif}.brand small{display:block;font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:-3px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--paper2);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.w{max-width:1180px;margin:0 auto;padding:0 20px}
main{padding:28px 0 80px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;background:var(--paper2);color:var(--ink);white-space:nowrap}
.btn.p{background:var(--ink);color:#fff}.btn.s{background:var(--sage);color:#fff}.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
label{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink2)}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:15px;font-weight:500;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sage)}
input[type=checkbox]{width:auto}
.g2{display:grid;gap:14px}@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}}
.g3{display:grid;gap:14px}@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}
.muted{color:var(--muted)}.small{font-size:13px}
.msg{font-size:14px;margin-top:10px;min-height:20px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.login{max-width:420px;margin:60px auto}
.login h1{margin-bottom:6px}
.login form{display:grid;gap:12px;margin-top:18px}
/* overview */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:18px 0 22px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font:400 34px/1 "Instrument Serif",serif}.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input{max-width:280px}
.bar select{max-width:180px}
.clients{display:grid;gap:12px}
.cl{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.cl:hover{border-color:var(--sage);box-shadow:0 10px 24px -18px rgba(0,0,0,.4)}
.cl h3{font-size:22px}
.cl .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--paper2);color:var(--ink2)}
.tag.prem{background:#F3E8D8;color:#8A5A2B}.tag.trial{background:#E6EEF8;color:#2A5A8C}.tag.active{background:#E2F2E8;color:var(--ok)}.tag.bad{background:#FBE9E7;color:var(--bad)}.tag.warn{background:#FFF4DE;color:var(--warn)}
.prog{width:170px}
.prog .t{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted)}
.prog .b{height:8px;border-radius:9px;background:var(--paper2);overflow:hidden;margin-top:5px}
.prog .b i{display:block;height:100%;background:var(--sage);border-radius:9px}
@media(max-width:640px){.cl{grid-template-columns:1fr}.prog{width:100%}}
/* drawer */
.dim{position:fixed;inset:0;background:rgba(10,14,12,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4);animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer .hd{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;gap:12px;z-index:2}
.drawer .hd .x{margin-left:auto;border:0;background:var(--paper2);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
.drawer .bd{padding:20px 22px 60px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.drawer .bd>*,.lk,.ck>div{min-width:0}
.ck>div:not(.act){flex:1}
.sec h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.check{display:grid;gap:2px}
.ck{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border:0}
.ck .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--paper2);color:var(--muted)}
.ck.done .ic{background:var(--mint);color:var(--ok)}
.ck b{display:block;font-size:14.5px}.ck span{font-size:13px;color:var(--muted)}
.ck .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ck input[type=checkbox]{width:20px;height:20px;margin:2px 2px 0;accent-color:var(--sage);flex:none}
.links{display:grid;gap:8px}
.lk{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lk b{font-size:13.5px;min-width:130px}
.lk code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--muted)}
@media(max-width:560px){.lk{flex-wrap:wrap}.lk code{flex-basis:100%;order:3}}
.plans{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.plan{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer}
.plan input{position:absolute;opacity:0}
.plan b{display:block;font:400 22px "Instrument Serif",serif}
.plan span{font-size:13px;color:var(--muted)}
.plan:has(input:checked){border-color:var(--sage);box-shadow:0 0 0 2px var(--sage) inset;background:var(--mint)}
.steps{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.steps span{font-size:12.5px;font-weight:800;color:var(--muted);background:var(--paper2);border-radius:999px;padding:6px 12px}
.steps span.on{background:var(--ink);color:#fff}
.res{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.res .card h3{margin-bottom:10px}
.res ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.res li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;border-bottom:1px solid var(--line);padding:6px 0}
.res li:last-child{border:0}
.res li a{font-weight:700;text-decoration:none}
.res li span{color:var(--muted);font-size:12.5px;text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;z-index:60}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.note{background:var(--mint);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}
.note.warn{background:#FFF4DE}
textarea{min-height:90px;resize:vertical}
.ed{display:grid;gap:10px}
.er{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.er .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:19px}
.er div{flex:1;min-width:0}.er b{display:block;font-size:15px}.er span{display:block;font-size:13px;color:var(--muted)}
.er .act{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.egrp{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.egrp h3{font-size:24px}.egrp p{margin:0;font-size:13px;color:var(--muted)}
@media(max-width:600px){.er{flex-wrap:wrap}.er .act{width:calc(100% - 52px);justify-content:flex-start;margin-left:52px}}
[hidden]{display:none!important}
@media(max-width:760px){.top .w{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:10px;gap:10px}.tabs{order:3;width:100%;margin:0;overflow-x:auto}.tabs button{flex:1}.who{margin-left:auto}#whoE{display:none}.drawer .hd,.drawer .bd{padding-left:16px;padding-right:16px}.ck{flex-wrap:wrap}.ck .act{margin-left:36px}h1{font-size:30px}}
</style>
</head>
<body>
<header class="top"><div class="w">
  <a class="brand" href="./"><span class="m">S</span><span><b>Service Deluxe</b><small>Client setup</small></span></a>
  <nav class="tabs" id="tabs" hidden><button data-t="clients" class="on">Clients</button><button data-t="new">+ New client</button><button data-t="edit">✏️ Edit</button><button data-t="res">Resources</button></nav>
  <div class="who" id="who" hidden><span id="whoE"></span><button class="btn sm" id="out">Sign out</button></div>
</div></header>
<main class="w" id="app"></main>

<script>
(function(){
var SB = "https://tehxobdokbvqtwtgqzrh.supabase.co";
var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlaHhvYmRva2J2cXR3dGdxenJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwOTA0MzEsImV4cCI6MjA5NzY2NjQzMX0.ofwrtvy7T4_uDP4hcWdO9roO2viWEmrplp8CCpFNupE";
var SITE = "https://webescapade.com";
var L = {
  booking: SITE + "/service/service-booking.html",
  staff: SITE + "/service/service-staff.html",
  start: SITE + "/service/service-start.html",
  trial: SITE + "/service/service-start.html?code=ESCAPADE-01AC",
  sales: SITE + "/service/",
  videos: SITE + "/service/tour/",
  vSetup: SITE + "/service/tour/?v=setup", vEditor: SITE + "/service/tour/?v=editor", vPremium: SITE + "/service/tour/?v=premium", vSalon: SITE + "/service/tour/?v=salon",
  ytTour: "https://youtu.be/wEmL6nPHgO0", ytSetup: "https://youtu.be/TIrD-DhMVDw", ytEditor: "https://youtu.be/6OuMtkKCxrw", ytPremium: "https://youtu.be/GtzMh5USIoA", ytSalon: "https://youtu.be/B-1hhWIhQh4",
  demoBasic: SITE + "/service/demo/", demoPrem: SITE + "/service/demo-premium/",
  tplBasic: "service/demo/source/site-editable.html", tplPremium: "service/demo-premium/source/site-editable.html",
  crm: SITE + "/CRM/", studio: SITE + "/CRM/restaurant-deluxe-email-studio.html",
  supa: "https://supabase.com/dashboard/project/tehxobdokbvqtwtgqzrh", repo: "https://github.com/mteleki-wq/Restaurant-booking"
};
var PREM_DEMO = { spa: "", salon: "salon/", clinic: "clinic/", physio: "clinic/", dental: "dental/", other: "" };
var PLANS = [
  { k: "Bookings", price: 39, d: "Booking page, calendar, emails. Keeps their own website. Up to 3." },
  { k: "Basic", price: 59, d: "Editable website + bookings. Up to 3." },
  { k: "Premium", price: 79, d: "Premium website + AI assistant. Up to 3." },
  { k: "Team", price: 89, d: "Basic for 4–10 practitioners." }
];
var SETUPS = [{ k: "self", label: "They set it up themselves", fee: 0 }, { k: "quick", label: "Quick connect — $40 + GST", fee: 40 }, { k: "done", label: "Done for you — $250 + GST", fee: 250 }];
var TYPES = { spa: "Day spa / massage", salon: "Hair & beauty", clinic: "Medical clinic", dental: "Dental", physio: "Physio / allied health", other: "Other" };
var MANUAL = [
  ["welcome", "Welcome email sent", "Invite link, booking page and the setup video."],
  ["domain", "Domain connected", "Their website on their own domain (Quick connect / Done for you)."],
  ["content", "Words & photos loaded", "Done for you: services, team, photos and text in the website."],
  ["share", "Booking link shared", "On their website, Google Business Profile and Instagram."],
  ["call", "Walk-through call done", "Show the staff calendar, emails and the editor."],
  ["billing", "Billing set up", "First invoice sent / payment arranged."]
];

var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var app = $("#app"), DATA = [], TAB = "clients", OPEN = null;
function toast(t){ var d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2200); }
function copy(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast("Copied"); }, function () { prompt("Copy this:", t); }); }

/* ---------- auth ---------- */
var S = {};
try { S = JSON.parse(localStorage.getItem("svcAdminSess") || "{}") || {}; } catch (e) {}
function saveS(){ try { localStorage.setItem("svcAdminSess", JSON.stringify(S)); } catch (e) {} }
function authFetch(path, body){
  return fetch(SB + "/auth/v1/token?grant_type=" + path, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}
function refresh(){
  if (!S.refresh) return Promise.reject(new Error("signin"));
  return authFetch("refresh_token", { refresh_token: S.refresh }).then(function (d) {
    if (!d.access_token) throw new Error("signin");
    S.token = d.access_token; S.refresh = d.refresh_token; S.exp = Date.now() + (d.expires_in || 3600) * 1000; saveS();
  });
}
function rpc(fn, args, retried){
  var go = function () {
    return fetch(SB + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + S.token, "Content-Type": "application/json" }, body: JSON.stringify(args || {}) })
      .then(function (r) {
        if (r.status === 401 && !retried) return refresh().then(function () { return rpc(fn, args, true); });
        return r.json().then(function (j) { if (!r.ok) throw new Error((j && (j.message || j.error)) || ("Error " + r.status)); return j; });
      });
  };
  if (S.exp && Date.now() > S.exp - 60000 && !retried) return refresh().then(go);
  return go();
}
function signOut(){ S = {}; saveS(); $("#tabs").hidden = true; $("#who").hidden = true; login(); }
$("#out").onclick = signOut;

function login(msg){
  app.innerHTML = '<div class="card login"><h1>Client <em>setup</em></h1><p class="muted">Sign in with your Webescapade admin login.</p>' +
    '<form id="lf"><label>Email<input id="le" type="email" autocomplete="username" required></label><label>Password<input id="lp" type="password" autocomplete="current-password" required></label>' +
    '<button class="btn p" type="submit">Sign in</button><div class="msg err" id="lm">' + esc(msg || "") + '</div></form></div>';
  $("#lf").onsubmit = function (e) {
    e.preventDefault(); var m = $("#lm"); m.className = "msg"; m.textContent = "Signing in…";
    authFetch("password", { email: $("#le").value.trim(), password: $("#lp").value }).then(function (d) {
      if (!d.access_token) { m.className = "msg err"; m.textContent = d.error_description || d.msg || "That didn't match."; return; }
      S = { token: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in || 3600) * 1000, email: (d.user && d.user.email) || $("#le").value.trim() }; saveS();
      start();
    }).catch(function () { m.className = "msg err"; m.textContent = "Couldn't reach the server."; });
  };
}

function start(){
  app.innerHTML = '<div class="empty">Loading your clients…</div>';
  load().then(function () {
    $("#tabs").hidden = false; $("#who").hidden = false; $("#whoE").textContent = S.email || "";
    show(TAB);
  }).catch(function (e) {
    if (e.message === "signin") return login("Please sign in again.");
    if (/admin only/i.test(e.message)) { S = {}; saveS(); return login("This login isn't a Webescapade admin."); }
    app.innerHTML = '<div class="card"><h3>Something went wrong</h3><p class="muted">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>';
  });
}
function load(){
  return rpc("svc_admin_overview").then(function (d) { if (!d || !d.ok) throw new Error((d && d.error) || "Couldn't load"); DATA = d.clients || []; });
}

/* ---------- helpers ---------- */
function links(c){
  var inv = L.start + "?join=" + encodeURIComponent(c.slug) + "&k=" + encodeURIComponent(c.join_key || "");
  var prem = /premium/i.test(c.plan || "");
  return {
    booking: L.booking + "?venue=" + encodeURIComponent(c.slug),
    staff: L.staff + "?venue=" + encodeURIComponent(c.slug),
    invite: inv,
    website: c.website_url || "",
    editor: c.website_url && /webescapade\.com\/service\/sites\//.test(c.website_url) ? c.website_url.replace(/\/?$/, "/") + "source/site-editable.html" : "",
    demo: prem ? L.demoPrem + (PREM_DEMO[c.business_type] || "") : L.demoBasic
  };
}
function steps(c){
  var prem = /premium/i.test(c.plan || ""), noSite = /bookings/i.test(c.plan || ""), ck = c.checklist || {}, ln = links(c);
  var setup = c.setup_option || "self";
  var A = [
    { k: "biz", t: "Business created", s: "Booking system ready: " + esc(c.slug), done: true },
    { k: "plan", t: "Plan & trial set", s: c.plan ? esc(c.plan) + (c.stage ? " · " + esc(c.stage) : "") + (c.trial_ends_on ? " · trial ends " + fmtD(c.trial_ends_on) : "") : "Choose their plan below.", done: !!c.plan },
    { k: "owner", t: "Owner has their own login", s: c.owner_logins ? "Joined with the invite link." : "Send them the invite link.", done: c.owner_logins > 0, act: '<button class="btn sm" data-copy="' + esc(ln.invite) + '">Copy invite link</button>' },
    { k: "svc", t: "Services & prices", s: c.services + " services, " + c.priced_services + " with a price.", done: c.services > 0 && c.priced_services === c.services, act: '<a class="btn sm" target="_blank" href="' + esc(ln.staff) + '">Open staff page</a>' },
    { k: "team", t: "Team added", s: c.providers + " " + esc(c.practitioner_word || "practitioner") + (c.providers === 1 ? "" : "s") + (c.rooms ? ", " + c.rooms + " rooms/chairs" : ""), done: c.providers > 0 },
    { k: "hours", t: "Opening hours", s: c.hours_rows ? c.hours_rows + " opening times set." : "No opening hours yet.", done: c.hours_rows > 0 },
  ];
  if (!noSite) A.push({ k: "site", t: "Website live", s: c.website_url ? esc(c.website_url) : "Create it from the " + (prem ? "Premium" : "Basic") + " template below, or add their address.", done: !!c.website_url });
  if (prem) A.push({ k: "ast", t: "AI assistant on", s: c.assistant ? (c.assistant.enabled ? "On as “" + esc(c.assistant.name) + "” · " + c.assistant.notes + " characters of notes · " + c.assistant_month + " questions this month" : "Set up but switched off.") : "Owner (or you) sets it up in the website editor › 🤖 Assistant.", done: !!(c.assistant && c.assistant.enabled) });
  A.push({ k: "first", t: "First booking", s: c.last_booking_at ? "Last booking " + fmtD(c.last_booking_at) + " · " + c.upcoming + " upcoming" : "No bookings yet.", done: !!c.last_booking_at });
  var M = MANUAL.filter(function (m) { if (m[0] === "domain" && (noSite || setup === "self")) return false; if (m[0] === "content" && setup !== "done") return false; return true; })
    .map(function (m) { return { k: m[0], t: m[1], s: m[2], done: !!ck[m[0]], manual: true }; });
  return A.concat(M);
}
function pct(c){ var s = steps(c); return Math.round(100 * s.filter(function (x) { return x.done; }).length / s.length); }

/* ---------- create a website from the template (GitHub) ---------- */
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function makeSite(c, tpl, token, m){
  if (!token) { m.className = "msg small err"; m.textContent = "Add your GitHub token first (the same one you use to Deploy)."; return; }
  try { localStorage.setItem("svcsite_gh_token", token); } catch (e) {}
  var dir = "service/sites/" + c.slug, master = dir + "/source/site-editable.html", live = dir + "/index.html";
  var api = "https://api.github.com/repos/mteleki-wq/Restaurant-booking/contents/";
  var H = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" };
  var getSha = function (p) { return fetch(api + p + "?ref=main", { headers: H }).then(function (r) { return r.status === 404 ? null : r.json().then(function (j) { if (!r.ok) throw new Error(j.message || r.status); return j.sha; }); }); };
  var put = function (p, html, msg) { return getSha(p).then(function (sha) { var b = { message: msg, content: b64(html), branch: "main" }; if (sha) b.sha = sha; return fetch(api + p, { method: "PUT", headers: H, body: JSON.stringify(b) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || r.status); }); }); }); };
  if (c.website_url && !confirm("This replaces the website files in " + dir + ". Continue?")) return;
  m.className = "msg small"; m.textContent = "Copying the " + tpl + " template…";
  fetch(SITE + "/" + (tpl === "premium" ? L.tplPremium : L.tplBasic) + "?v=" + Date.now()).then(function (r) { if (!r.ok) throw new Error("Couldn't read the template (" + r.status + ")"); return r.text(); })
    .then(function (h) {
      var set = function (attr, val) { var re = new RegExp('(\\s' + attr + '=")[^"]*(")'); if (re.test(h)) h = h.replace(re, "$1" + val + "$2"); else h = h.replace("<body", "<body " + attr + '="' + val + '"'); };
      set("data-venue", c.slug); set("data-gh-live", live); set("data-gh-master", master); set("data-gh-owner", "mteleki-wq"); set("data-gh-repo", "Restaurant-booking"); set("data-gh-branch", "main");
      if (tpl === "premium" && /^(spa|salon|clinic|dental)$/.test(c.business_type)) { set("data-look", c.business_type); h = h.replace(/("look":")[a-z]+(")/, "$1" + c.business_type + "$2"); }
      if (tpl === "premium" && c.business_type === "physio") { set("data-look", "clinic"); h = h.replace(/("look":")[a-z]+(")/, "$1clinic$2"); }
      h = h.replace(/<title>[^<]*<\/title>/, "<title>" + esc(c.name) + "</title>");
      var pub = h.replace(/<!--ENGINE-START-->[\s\S]*?<!--ENGINE-END-->/g, "").replace(/\/\*ENGINE-CSS-START\*\/[\s\S]*?\/\*ENGINE-CSS-END\*\//g, "").replace(/\sdata-gh-[a-z]+="[^"]*"/g, "");
      m.textContent = "Saving the editable master…";
      return put(master, h, "New client website: " + c.name + " (master)").then(function () { m.textContent = "Publishing the first live version…"; return put(live, pub, "New client website: " + c.name); });
    })
    .then(function () {
      var url = SITE + "/" + dir + "/";
      return rpc("svc_admin_account_save", { p_venue: c.id, p: { website_url: url } }).then(load).then(function () {
        m.className = "msg small ok"; m.innerHTML = "✓ Created. GitHub publishes it in about a minute: <a target=\"_blank\" href=\"" + url + "source/site-editable.html\">open the editor</a>.";
        setTimeout(reopen, 2500);
      });
    })
    .catch(function (e) { m.className = "msg small err"; m.textContent = "✗ " + e.message; });
}

  app.innerHTML = '<h1>' + esc(c.name) + ' <em>is created</em></h1><p class="muted" style="margin:6px 0 18px">Booking page: <a target="_blank" href="' + esc(links(c).booking) + '">' + esc(links(c).booking) + '</a></p>' +
    '<div class="steps"><span>1 · Business ✓</span><span class="on">2 · Plan</span><span>3 · Checklist</span></div>' +
    '<form class="card" id="pf"><div class="plans">' + PLANS.map(function (p, i) { return '<label class="plan"><input type="radio" name="plan" value="' + p.k + '"' + (i === 2 ? " checked" : "") + '><b>' + p.k + '</b><span>$' + p.price + '/mo + GST<br>' + p.d + '</span></label>'; }).join("") + '</div>' +
    '<div class="g3" style="margin-top:16px"><label>Website setup<select id="ps">' + SETUPS.map(function (s) { return '<option value="' + s.k + '">' + s.label + '</option>'; }).join("") + '</select></label>' +
    '<label>Stage<select id="pst"><option value="trial">Free trial</option><option value="active">Paying</option></select></label><label>Trial ends<input id="pt" type="date" value="' + trial + '"></label></div>' +
    '<div class="g3" style="margin-top:14px"><label>Contact name<input id="pcn" value="' + esc(owner) + '"></label><label>Contact email<input id="pce" type="email" value="' + esc(email) + '"></label><label>Contact phone<input id="pcp" value="' + esc(phone) + '"></label></div>' +
    '<label style="margin-top:14px">Notes<textarea id="pn" placeholder="How you met, what they need, follow-ups…"></textarea></label>' +
    '<div class="bar" style="margin:16px 0 0"><button class="btn p" type="submit">Save & open checklist →</button><button class="btn" type="button" id="pskip">Skip for now</button><span class="msg" id="pm"></span></div></form>';
  $("#pskip").onclick = function () { show("clients"); openClient(c.id); };
  $("#pf").onsubmit = function (e) {
    e.preventDefault(); var m = $("#pm"); m.className = "msg"; m.textContent = "Saving…";
    var plan = $('#pf input[name=plan]:checked').value, P = PLANS.filter(function (x) { return x.k === plan; })[0], S2 = SETUPS.filter(function (x) { return x.k === $("#ps").value; })[0];
    var stage = $("#pst").value;
    rpc("svc_admin_account_save", { p_venue: c.id, p: { plan: plan, monthly_fee: P.price, setup_option: S2.k, setup_fee: S2.fee, stage: stage, trial_ends_on: stage === "trial" ? $("#pt").value : "", started_on: stage === "active" ? new Date().toISOString().slice(0, 10) : "",
      contact_name: $("#pcn").value, contact_email: $("#pce").value, contact_phone: $("#pcp").value, notes: $("#pn").value } })
      .then(function (r) { if (!r.ok) throw new Error(r.error); return load(); })
      .then(function () { show("clients"); openClient(c.id); })
      .catch(function (e) { m.className = "msg err"; m.textContent = e.message; });
  };
}

    { slug: "serenity-spa", name: "Serenity Day Spa", ic: "🌿", note: "Spa demo · Ivy" },

      DEMO.map(function (d) {
        return row(d.ic, d.name, d.note + " · staff calendar to edit services, team & hours", L.staff + "?venue=" + d.slug, L.booking + "?venue=" + d.slug,
          '<a class="btn sm" target="_blank" rel="noopener" href="' + esc(L.demoPrem + (PREM_DEMO[{ "serenity-spa": "spa", "atelier-hair": "salon", "northside-medical": "clinic", "brightside-dental": "dental" }[d.slug]] || "")) + '">Premium demo</a>');
      }).join("") +
      row("📅", "Booking page (all businesses)", "One page for every business, opened with ?venue=their-code", "", L.booking + "?venue=serenity-spa") +
      row("👋", "Sign-up / add a business", "Where clients create their business and staff join with an invite link", "", L.start) +
    '</div>' +
    '<div class="egrp"><h3>Client websites</h3><p>Websites made with Create website</p></div><div class="ed">' +
      (sites.length ? sites.map(function (c) { var ln = links(c); return row("🏷", esc(c.name), esc(c.plan || "") + " · " + esc(c.website_url), ln.editor, ln.website, '<a class="btn sm" target="_blank" rel="noopener" href="' + esc(ln.staff) + '">Bookings</a>'); }).join("")
        : '<div class="empty" style="padding:18px">No client websites yet. Open a client and use <b>Create website</b>.</div>') +
    '</div>' +
    '<div class="egrp"><h3>Client bookings</h3><p>Staff calendar for every business</p></div><div class="ed">' +
      DATA.filter(function (c) { return DEMO.every(function (d) { return d.slug !== c.slug; }); }).map(function (c) { var ln = links(c); return row("📋", esc(c.name), esc(TYPES[c.business_type] || "") + (c.plan ? " · " + esc(c.plan) : ""), ln.staff, ln.booking); }).join("") || '<div class="empty" style="padding:18px">No clients yet — add one with + New client.</div>' +
    '</div>';
}
