<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

</style></head><body><div class="c" id="c">
<h1>Unsubscribe</h1><p>Press the button to stop receiving news and offers by email.</p>
<button id="go" type="button">Unsubscribe me</button>
<small>You will still receive emails about your own bookings and orders.</small></div>
<script>
(function(){
  var URL_='https://tehxobdokbvqtwtgqzrh.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlaHhvYmRva2J2cXR3dGdxenJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwOTA0MzEsImV4cCI6MjA5NzY2NjQzMX0.ofwrtvy7T4_uDP4hcWdO9roO2viWEmrplp8CCpFNupE';
  var t=new URLSearchParams(location.search).get('t')||'', c=document.getElementById('c'), b=document.getElementById('go');
  function done(name){ c.innerHTML='<h1>You are unsubscribed</h1><p>'+(name?'You will no longer receive news and offers from <b>'+name.replace(/[&<>"]/g,'')+'</b>.':'You will no longer receive these emails.')+'</p><small>Changed your mind? Just tick “Keep me posted” next time you contact them.</small>'; }
  if(!/^[0-9a-f-]{36}$/i.test(t)){ if(t==='test'||t==='preview'){ b.onclick=function(){ done(''); }; return; } c.innerHTML='<h1>Link not recognised</h1><p>This unsubscribe link looks incomplete. Please reply to the email and ask to be removed.</p>'; return; }
  b.onclick=function(){
    b.disabled=true; b.textContent='One moment…';
    fetch(URL_+'/rest/v1/rpc/builder_unsubscribe',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t})})

  };
})();
