<style>
:root{--bg:#F5F2EC;--card:#fff;--ink:#14202C;--soft:#5F6A75;--faint:#7d8690;--line:#e0dad0;--blush:#FCE8DB;--bur:#14202C;--bur2:#C94A12;--gold:#E8591A;--champ:#F4A57A;
 --ok:#2F7A55;--okbg:#e5f2ea;--warn:#b8741a;--warnbg:#fbefdc;--bad:#a3394f;--badbg:#f8e3e7;--blue:#2a5d8f;--bluebg:#e4edf7;
 --fs:'Instrument Serif',Georgia,serif;--fd:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fd);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bur2)}
.demo{background:var(--bur);color:#fff;font-size:13px;text-align:center;padding:8px 14px}
.demo a{color:var(--champ);font-weight:700}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .w{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;max-width:1240px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:11px;background:var(--gold);color:#fff;display:grid;place-items:center}.logo svg{width:22px;height:22px}
.ttl b{display:block;font-size:16px;line-height:1.2}.ttl small{color:var(--soft);font-size:12.5px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{white-space:nowrap;flex:none;border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--soft);cursor:pointer;position:relative}

nav.tabs .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;margin-left:6px;padding:0 6px}
main{max-width:1240px;margin:0 auto;padding:22px 20px 80px}
h1,h2,h3{font-family:var(--fs);font-weight:400;margin:0;line-height:1.1}
h1{font-size:40px}h2{font-size:30px}h3{font-size:22px}
.sub{color:var(--soft);margin:6px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.kpi b{display:block;font:400 32px var(--fs);margin-top:2px}.kpi span{font-size:12.5px;color:var(--soft)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h3{margin-bottom:4px}.panel .sub{margin:2px 0 12px;font-size:13.5px}
.group{margin-top:14px}.group>h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.group>h4 i{font-style:normal;background:var(--blush);color:var(--bur2);border-radius:999px;padding:1px 8px;letter-spacing:0}
.task{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;background:#fff}
.task .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--blush)}
.task.urgent .ic{background:var(--badbg)}.task.soon .ic{background:var(--warnbg)}
.task .tx{flex:1;min-width:0}.task .tx b{display:block;font-size:14.5px}.task .tx span{display:block;color:var(--soft);font-size:13px}
.task .due{font-size:12px;font-weight:700;white-space:nowrap}.task.urgent .due{color:var(--bad)}.task.soon .due{color:var(--warn)}
.task .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1.5px solid transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;background:var(--bur);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bur2)}.btn.ghost{background:transparent;color:var(--bur);border-color:var(--line)}.btn.ghost:hover{border-color:var(--bur2)}

.empty{color:var(--soft);font-size:14px;padding:10px 0}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}

.pipe b{display:block;font:400 28px var(--fs)}.pipe small{font-size:12px;color:var(--soft);font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:#fff;min-width:200px}
table.list{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}

.list td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.list tr:last-child td{border-bottom:0}.list tbody tr{cursor:pointer}.list tbody tr:hover{background:#faf7f2}
.list td small{display:block;color:var(--soft);font-size:12.5px}
.month{font:600 13px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--bur2);background:#f3eee6!important;cursor:default!important}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px;max-width:140px}.bar i{display:block;height:100%;background:var(--ok)}

.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:50;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);z-index:60;transform:translateX(105%);transition:transform .25s;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.drawer .hd{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.drawer .hd h2{font-size:28px}.drawer .bd{padding:16px 18px 40px}
.x{margin-left:auto;border:0;background:var(--blush);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13.5px}
.facts small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800}
.sec{margin-top:18px}.sec>h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.checks label{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:14px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--ok)}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 10px 16px;font-size:13.5px}.tl li:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl small{color:var(--faint);display:block;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%}
textarea.inp{resize:vertical;min-height:90px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:10px}label.f .inp{margin-top:5px}
/* email studio */
.es{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.tpl{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.tpl.on{border-color:var(--bur);box-shadow:0 0 0 2px var(--bur) inset}.tpl b{display:block;font-size:14px}.tpl small{color:var(--soft);font-size:12.5px}
.tpl .sw{float:right;font-size:11px;font-weight:800;color:var(--ok)}.tpl .sw.off{color:var(--faint)}
.seg{display:inline-flex;background:var(--blush);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--soft)}.seg button.on{background:#fff;color:var(--bur);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pv{background:#e9e4db;border-radius:16px;padding:14px;min-height:420px}
.pv iframe{width:100%;height:640px;border:0;border-radius:10px;background:#fff}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:-4px 0 10px}.tags button{border:1px dashed var(--line);background:#fff;border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--soft)}
.aud{display:grid;gap:6px;margin-bottom:10px}.aud label{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;font-size:14px}
.aud label b{margin-left:auto;font-size:13px;color:var(--soft)}
.sent li{font-size:13.5px;margin-bottom:6px}
/* modal */
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(10,16,22,.5);padding:16px}.modal.on{display:grid}
.mbox{background:var(--bg);border-radius:20px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mbox .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0}
.mbox .bd{padding:14px 16px}.mbox iframe{width:100%;height:560px;border:0;border-radius:12px;background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:600;z-index:99;display:none;max-width:92vw}
.note{background:var(--warnbg);border-radius:12px;padding:10px 12px;font-size:13px;color:#6a4510;margin-bottom:12px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.es,.editor{grid-template-columns:1fr}.pipe{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}h1{font-size:32px}.list .hide-s{display:none}nav.tabs{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}.pv iframe{height:520px}}
</style>
</head>
<body>

<script>
(function(){
"use strict";
/* ================= helpers ================= */
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var TODAY=new Date();TODAY.setHours(0,0,0,0);var T=iso(TODAY);
var add=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
var diff=function(a,b){return Math.round((parse(a)-parse(b))/864e5)};
var off=function(n){return add(T,n)};
var money=function(n){return '$'+Math.round(n||0).toLocaleString('en-AU')};
var nice=function(s,y){return parse(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:y?'numeric':undefined})};
var long=function(s){return parse(s).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})};
var rel=function(s){var d=diff(s,T);return d===0?'today':d===1?'tomorrow':d===-1?'yesterday':d>0?'in '+d+' days':Math.abs(d)+' days ago'};
var store={get:function(k,d){try{var v=localStorage.getItem('tdcrm_'+k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem('tdcrm_'+k,JSON.stringify(v))}catch(e){}}};
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},3200)}
var first=function(n){return String(n||'').trim().split(/\s+/)[0]||'there'};
var fmtMin=function(m){var h=Math.floor(m/60),mm=m%60,ap=h>=12?'pm':'am',h12=h%12||12;return h12+(mm?':'+pad(mm):'')+ap};

/* ================= the business (from the demo booking page when it has been opened) ================= */
var APP=(function(){try{return JSON.parse(localStorage.getItem('tradeDeluxeDemo_v1')||'null')}catch(e){return null}})();
var B=(APP&&APP.biz)||{};
var BIZ={name:B.name||'Sparks & Pipes Co.',addr:(B.base||'Marrickville')+', Sydney',email:B.email||'jobs@sparksandpipes.com.au',phone:B.phone||'02 9000 1234',owner:'Dave',quoteDays:B.quoteValidDays||30};
var TEAM={t1:'Dave Kowalski',t2:'Priya Nair',t3:'Tom Reid'};
((APP&&APP.team)||[]).forEach(function(t){TEAM[t.id]=t.name});
var firstOf=function(id){return TEAM[id]?first(TEAM[id]):''};

/* ================= stages ================= */
var STAGES=[
 {id:'request',name:'Quote request',desc:'Waiting for your price'},
 {id:'quoted',name:'Quote sent',desc:'Waiting on the customer'},
 {id:'booked',name:'Booked',desc:'Job in the diary'},
 {id:'done',name:'Job done',desc:'Completed'}];
var STN={};STAGES.forEach(function(s){STN[s.id]=s.name});STN.lost='Lost';

/* ================= follow-up rules (editable in Settings) ================= */
var RULES_DEFAULT={qChase:3,qExpWarn:3,remind:1,thanks:1,check:14,svcLead:30};
var R=Object.assign({},RULES_DEFAULT,store.get('rules',{}));

/* ================= sample jobs (dates relative to today) ================= */
function sample(){
 var S=[
 {name:'Rebecca Lawson',email:'rebecca.lawson@example.com',phone:'0412 340 118',sub:'Leichhardt',seg:'Homes',title:'Switchboard upgrade',trade:'Electrical',tech:'t2',stage:'request',created:-1,value:0,desc:'Old ceramic fuses, lights flicker when the kettle is on. Photos of the switchboard attached.'},

 {name:'Harbour Property Group',contact:'Amy Clarke',email:'amy@harbourpg.example',phone:'02 9550 4100',sub:'Glebe',seg:'Landlords & agents',title:'Smoke alarms, 6 units',trade:'Electrical',tech:'t2',stage:'quoted',created:-29,quoted:-27,value:1260,sentChase:true},
 {name:'Daniel Brooks',email:'dan.brooks@example.com',phone:'0401 778 230',sub:'Petersham',seg:'Homes',title:'Gas continuous-flow hot water',trade:'Plumbing',tech:'t3',stage:'quoted',created:-2,quoted:-1,value:3290},
 {name:'Café Lumen',contact:'Ben Carter',email:'ben@cafelumen.example',phone:'0408 555 662',sub:'Glebe',seg:'Businesses',title:'Drain maintenance (every 4 weeks)',trade:'Plumbing',tech:'t3',stage:'booked',d:1,win:'10am – 12pm',value:240,repeat:28,created:-60},
 {name:'Sophie Turner',email:'sophie.t@example.com',phone:'0433 210 455',sub:'Newtown',seg:'Homes',title:'Ceiling fans × 3',trade:'Electrical',tech:'t2',stage:'booked',d:1,win:'8am – 10am',value:690,created:-5},
 {name:'Mark Ellis',email:'mark.ellis@example.com',phone:'0455 120 774',sub:'Enmore',seg:'Homes',title:'Leaking shower mixer',trade:'Plumbing',tech:'t1',stage:'booked',d:4,win:'1pm – 3pm',value:320,created:-2},
 {name:'Westside Strata',contact:'Kim Patel',email:'kim@westsidestrata.example',phone:'02 9560 7700',sub:'Stanmore',seg:'Strata',title:'Stormwater pit clean',trade:'Plumbing',tech:'t3',stage:'booked',d:6,win:'7am – 9am',value:880,created:-9},
 {name:'Julia Romano',email:'julia.romano@example.com',phone:'0466 902 331',sub:'Dulwich Hill',seg:'Homes',title:'Blocked drain (emergency call-out)',trade:'Plumbing',tech:'t1',stage:'done',d:-1,win:'7:15pm',value:450,emergency:true,created:-1},

 {name:'Redfern Bakehouse',contact:'Tom Hughes',email:'tom@redfernbakehouse.example',phone:'02 9698 2210',sub:'Redfern',seg:'Businesses',title:'Test and tag, 42 items',trade:'Electrical',tech:'t2',stage:'done',d:-340,win:'6am – 8am',value:460,service:{what:'test and tag',every:365},created:-345,sentThanks:true,sentCheck:true},

 return S.map(function(s,i){

   repeat:s.repeat||0,service:s.service||null,desc:s.desc||'',quoteSent:s.quoted!=null?off(s.quoted):'',quoteExp:s.quoted!=null?off(s.quoted+BIZ.quoteDays):'',
   emails:[],timeline:[],done:{},created:off(s.created),notes:'',source:'sample'};
  j.timeline.push({d:j.created,t:(s.stage==='request'||s.quoted!=null?'Quote request from the website':s.emergency?'Emergency booking from the website':'Booked online')+(j.win&&!s.quoted?': '+j.win:'')});
  if(s.quoted!=null)j.timeline.push({d:j.quoteSent,t:'Quote sent: '+money(s.value)+' incl. GST'});

function tasks(){

  var d=diff(due,T); if(d>7)return;
  out.push(Object.assign({j:j,key:key,due:due,days:d,title:title,detail:detail,group:(TPL[key]||{}).group||(extra&&extra.group)||'Quotes'},extra||{}))}
 allJobs().forEach(function(j){
  var dd=j.date?diff(j.date,T):null;
  if(j.stage==='request')push(j,'quote',j.created,'Price this job and send the quote',who(j)+' · '+j.title+' · '+j.cust.suburb,{call:true,group:'Quotes'});
  if(j.stage==='quoted'&&j.quoteSent){
   push(j,'qchase',add(j.quoteSent,R.qChase),'No reply to the quote yet',who(j)+' · '+j.title+(j.value?' · '+money(j.value):''));
   if(j.quoteExp&&diff(j.quoteExp,T)>=0)push(j,'qexpire',add(j.quoteExp,-R.qExpWarn),'Quote expires '+rel(j.quoteExp),who(j)+' · '+j.title+(j.value?' · '+money(j.value):''));}
  if(j.stage==='booked'&&dd!=null&&dd>=0){
   push(j,'remind',add(j.date,-R.remind),'Job '+rel(j.date)+', '+j.win,who(j)+' · '+j.title+' · '+(firstOf(j.tech)||'unassigned'));}
  if(j.stage==='booked'&&dd!=null&&dd<0)push(j,'markdone',j.date,'Was this job finished? Mark it done',who(j)+' · '+j.title+' · '+nice(j.date),{call:true,group:'After the job'});
  if(j.stage==='done'&&dd!=null){
   if(dd>=-30)push(j,'thanks',add(j.date,R.thanks),'Thank-you and review request',who(j)+' · '+j.title+(j.emergency&&!/emergency/i.test(j.title)?' · emergency call-out':''));
   if(dd>=-60&&j.value>=300)push(j,'check',add(j.date,R.check),'Check everything is still working',who(j)+' · '+j.title+' '+rel(j.date));
   if(j.service)push(j,'service',add(svcDue(j),-R.svcLead),'Yearly '+j.service.what+' due '+nice(svcDue(j)),who(j)+' · last done '+nice(j.date,true));}
 });
 return out.sort(function(a,b){return a.days-b.days});
}
