<style>
:root{--bg:#F8F3EE;--card:#fff;--ink:#2a1219;--soft:#6d5560;--faint:#9a8890;--line:#ead9d2;--blush:#f4e4dc;--bur:#4a1528;--bur2:#7A2E3E;--gold:#B8935A;--champ:#E9D3B4;
 --ok:#2F7A55;--okbg:#e5f2ea;--warn:#b8741a;--warnbg:#fbefdc;--bad:#a3394f;--badbg:#f8e3e7;--blue:#2a5d8f;--bluebg:#e4edf7;
 --fs:'Cormorant Garamond',Georgia,serif;--fd:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fd);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bur2)}
.demo{background:var(--bur);color:#fff;font-size:13px;text-align:center;padding:8px 14px}
.demo a{color:var(--champ);font-weight:700}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .w{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;max-width:1240px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:11px;background:var(--bur);color:var(--champ);display:grid;place-items:center;font:600 22px var(--fs)}
.ttl b{display:block;font-size:16px;line-height:1.2}.ttl small{color:var(--soft);font-size:12.5px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{white-space:nowrap;flex:none;border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--soft);cursor:pointer;position:relative}
nav.tabs button.on{background:var(--bur);color:#fff}
nav.tabs .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;margin-left:6px;padding:0 6px}
main{max-width:1240px;margin:0 auto;padding:22px 20px 80px}
h1,h2,h3{font-family:var(--fs);font-weight:600;margin:0;line-height:1.1}
h1{font-size:40px}h2{font-size:30px}h3{font-size:22px}
.sub{color:var(--soft);margin:6px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.kpi b{display:block;font:600 30px var(--fs);margin-top:2px}.kpi span{font-size:12.5px;color:var(--soft)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h3{margin-bottom:4px}.panel .sub{margin:2px 0 12px;font-size:13.5px}
.group{margin-top:14px}.group>h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.group>h4 i{font-style:normal;background:var(--blush);color:var(--bur2);border-radius:999px;padding:1px 8px;letter-spacing:0}
.task{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;background:#fff}
.task .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--blush)}
.task.urgent .ic{background:var(--badbg)}.task.soon .ic{background:var(--warnbg)}
.task .tx{flex:1;min-width:0}.task .tx b{display:block;font-size:14.5px}.task .tx span{display:block;color:var(--soft);font-size:13px}
.task .due{font-size:12px;font-weight:700;white-space:nowrap}.task.urgent .due{color:var(--bad)}.task.soon .due{color:var(--warn)}
.task .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1.5px solid transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;background:var(--bur);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bur2)}.btn.ghost{background:transparent;color:var(--bur);border-color:var(--line)}.btn.ghost:hover{border-color:var(--bur2)}
.btn.sm{padding:5px 11px;font-size:12px}
.empty{color:var(--soft);font-size:14px;padding:10px 0}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.st-enquiry{background:var(--bluebg);color:var(--blue)}.st-hold{background:var(--warnbg);color:var(--warn)}.st-meeting{background:#efe6f6;color:#6a3d8f}
.st-confirmed{background:var(--okbg);color:var(--ok)}.st-paid{background:#dff0ee;color:#127a7a}.st-done{background:#eee;color:#555}.st-lost{background:var(--badbg);color:var(--bad)}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.pipe button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px;text-align:left;cursor:pointer}
.pipe button.on{border-color:var(--bur);box-shadow:0 0 0 2px var(--bur) inset}
.pipe b{display:block;font:600 26px var(--fs)}.pipe small{font-size:12px;color:var(--soft);font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:#fff;min-width:200px}
table.list{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 12px;background:#fcf8f5;border-bottom:1px solid var(--line)}
.list td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.list tr:last-child td{border-bottom:0}.list tbody tr{cursor:pointer}.list tbody tr:hover{background:#fdf9f6}
.list td small{display:block;color:var(--soft);font-size:12.5px}
.month{font:600 13px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--bur2);background:#fbf3ee!important;cursor:default!important}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px;max-width:140px}.bar i{display:block;height:100%;background:var(--ok)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(30,10,16,.45);z-index:50;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);z-index:60;transform:translateX(105%);transition:transform .25s;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.drawer .hd{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.drawer .hd h2{font-size:28px}.drawer .bd{padding:16px 18px 40px}
.x{margin-left:auto;border:0;background:var(--blush);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13.5px}
.facts small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800}
.sec{margin-top:18px}.sec>h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.checks label{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:14px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--ok)}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 10px 16px;font-size:13.5px}.tl li:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl small{color:var(--faint);display:block;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%}
textarea.inp{resize:vertical;min-height:90px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:10px}label.f .inp{margin-top:5px}
/* email studio */
.es{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.tpl{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.tpl.on{border-color:var(--bur);box-shadow:0 0 0 2px var(--bur) inset}.tpl b{display:block;font-size:14px}.tpl small{color:var(--soft);font-size:12.5px}
.tpl .sw{float:right;font-size:11px;font-weight:800;color:var(--ok)}.tpl .sw.off{color:var(--faint)}
.seg{display:inline-flex;background:var(--blush);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--soft)}.seg button.on{background:#fff;color:var(--bur);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pv{background:#efe7e1;border-radius:16px;padding:14px;min-height:420px}
.pv iframe{width:100%;height:640px;border:0;border-radius:10px;background:#fff}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:-4px 0 10px}.tags button{border:1px dashed var(--line);background:#fff;border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--soft)}
.aud{display:grid;gap:6px;margin-bottom:10px}.aud label{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;font-size:14px}
.aud label b{margin-left:auto;font-size:13px;color:var(--soft)}
.sent li{font-size:13.5px;margin-bottom:6px}
/* modal */
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(30,10,16,.5);padding:16px}.modal.on{display:grid}
.mbox{background:var(--bg);border-radius:20px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mbox .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0}
.mbox .bd{padding:14px 16px}.mbox iframe{width:100%;height:560px;border:0;border-radius:12px;background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:600;z-index:99;display:none;max-width:92vw}
.note{background:var(--warnbg);border-radius:12px;padding:10px 12px;font-size:13px;color:#6a4510;margin-bottom:12px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.es,.editor{grid-template-columns:1fr}.pipe{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}h1{font-size:32px}.list .hide-s{display:none}nav.tabs{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}.pv iframe{height:520px}}
</style>
</head>
<body>
<div class="demo">Demo of the Function Deluxe CRM and Email Studio with sample functions. Holds you make on the <a href="./">demo venue website</a> show up here too. No emails are really sent.</div>
<header class="top"><div class="w">
  <div class="logo">A</div><div class="ttl"><b id="vName">Aurelle Function Centre</b><small>Function CRM &amp; Email Studio</small></div>
  <nav class="tabs" id="tabs">
    <button data-t="today" class="on">Follow-ups<span class="n" id="nToday" hidden></span></button>
    <button data-t="functions">Functions</button>
    <button data-t="clients">Clients</button>
    <button data-t="studio">Email Studio</button>
    <button data-t="settings">Settings</button>
  </nav>
</div></header>
<main id="main"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Function details"></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ================= helpers ================= */
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var TODAY=new Date();TODAY.setHours(0,0,0,0);var T=iso(TODAY);
var add=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
var diff=function(a,b){return Math.round((parse(a)-parse(b))/864e5)}; /* a - b in days */
var off=function(n){return add(T,n)};
var money=function(n){return '$'+Math.round(n||0).toLocaleString('en-AU')};
var nice=function(s,y){return parse(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:y?'numeric':undefined})};
var long=function(s){return parse(s).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
var rel=function(s){var d=diff(s,T);return d===0?'today':d===1?'tomorrow':d===-1?'yesterday':d>0?'in '+d+' days':Math.abs(d)+' days ago'};
var store={get:function(k,d){try{var v=localStorage.getItem('fd3_'+k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem('fd3_'+k,JSON.stringify(v))}catch(e){}}};
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},3200)}
var first=function(n){return String(n||'').trim().split(/\s+/)[0]||'there'};

/* ================= venue (from the demo website's saved settings) ================= */
var CFG=store.get('config',null)||{};
var ROOMS={grand:'Grand Ballroom',crystal:'Crystal Room',terrace:'Terrace Lounge'};
(CFG.rooms||[]).forEach(function(r){ROOMS[r.id]=r.name});
var SESS={day:'Day (11am – 4pm)',eve:'Evening (6pm – midnight)'};
(CFG.sessions||[]).forEach(function(s){SESS[s.id]=s.label+(s.time?' ('+s.time+')':'')});
var VENUE={name:'Aurelle Function Centre',addr:'Western Sydney, NSW',email:'events@aurelle.example',phone:'(02) 9000 0000',coord:'Sophie',site:'./'};
var DEP=(CFG.deposit&&CFG.deposit.pct)||0.25, DEPMIN=(CFG.deposit&&CFG.deposit.min)||1000;

/* ================= stages ================= */
var STAGES=[
 {id:'enquiry',name:'Enquiry',desc:'Estimate, no date held'},
 {id:'hold',name:'On hold',desc:'Date held, waiting'},
 {id:'meeting',name:'Meeting',desc:'Consultation booked'},
 {id:'confirmed',name:'Confirmed',desc:'Deposit paid'},
 {id:'paid',name:'Paid in full',desc:'Balance received'},
 {id:'done',name:'Completed',desc:'Function held'}];
var STN={};STAGES.forEach(function(s){STN[s.id]=s.name});STN.lost='Lost / released';

/* ================= follow-up rules (editable in Settings) ================= */
var RULES_DEFAULT={holdWarn:2,meetRemind:1,noReply:3,bal1:60,bal2:30,numbers:10,dietary:21,runsheet:14,thanks:2,anniv:335};
var R=Object.assign({},RULES_DEFAULT,store.get('crm_rules',{}));

/* ================= sample functions (dates relative to today) ================= */
function sample(){
 var S=[
 {name:'Olivia & James Chen',email:'olivia.chen@example.com',phone:'0412 345 678',type:'Wedding',guests:180,room:'grand',sess:'eve',d:46,stage:'confirmed',est:41800,depPaid:-60,look:'White roses, ivory linen, gold chiavari chairs',seg:'Weddings',checks:{dietary:false,seating:false,runsheet:false,numbers:false},created:-75},
 {name:'Priya Sharma',email:'priya.s@example.com',phone:'0423 118 902',type:'Engagement party',guests:120,room:'crystal',sess:'eve',d:34,stage:'confirmed',est:14650,depPaid:-40,look:'Blush roses, white linen',seg:'Engagements',checks:{dietary:true,seating:false,runsheet:false,numbers:false},created:-52},
 {name:'Western Sydney Plumbing Co.',contact:'Mark Davies',email:'mark@wsplumbing.example',phone:'02 9688 1200',type:'Christmas party',guests:90,room:'terrace',sess:'eve',d:12,stage:'paid',est:9850,depPaid:-30,paidAll:-5,look:'',seg:'Corporate',checks:{dietary:true,seating:true,runsheet:false,numbers:false},created:-44},
 {name:'Sofia & Daniel Rossi',email:'sofia.rossi@example.com',phone:'0401 222 333',type:'Wedding',guests:220,room:'grand',sess:'eve',d:118,stage:'meeting',est:48900,meet:{d:1,time:'11:30',mode:'Site visit'},look:'Burgundy & blush, ivory linen, cross-back chairs',seg:'Weddings',created:-6},
 {name:'Hannah Nguyen',email:'hannah.n@example.com',phone:'0433 444 555',type:'Christening',guests:70,room:'crystal',sess:'day',d:33,stage:'hold',holdExp:1,est:6900,look:'White hydrangeas, white linen',seg:'Christenings',created:-6},
 {name:'Parramatta High P&C',contact:'Jenny Walsh',email:'formal@parrahigh.example',phone:'02 9630 4000',type:'Year 12 formal',guests:240,room:'grand',sess:'eve',d:152,stage:'hold',holdExp:5,est:31200,look:'',seg:'Formals',created:-2},
 {name:'Ahmed Khalil',email:'ahmed.k@example.com',phone:'0455 666 777',type:'50th birthday',guests:110,room:'crystal',sess:'eve',d:75,stage:'enquiry',est:13400,look:'Gold balloons, black linen',seg:'Birthdays',created:-4},
 {name:'Lauren & Tom Baker',email:'lauren.baker@example.com',phone:'0466 777 888',type:'Wedding',guests:160,room:'grand',sess:'eve',d:212,stage:'enquiry',est:37600,look:'Peonies, sage linen',seg:'Weddings',created:-1},
 {name:'Blacktown Leagues Juniors',contact:'Craig Morris',email:'craig@btleagues.example',phone:'0477 888 999',type:'Presentation night',guests:150,room:'grand',sess:'eve',d:-3,stage:'done',est:14200,depPaid:-90,paidAll:-20,look:'',seg:'Corporate',created:-120},
 {name:'Grace & Michael Tan',email:'grace.tan@example.com',phone:'0488 111 222',type:'Wedding',guests:140,room:'crystal',sess:'eve',d:-335,stage:'done',est:29800,depPaid:-500,paidAll:-370,look:'Pink & white roses, white linen',seg:'Weddings',created:-540},
 {name:'Emily Wong',email:'emily.w@example.com',phone:'0499 333 444',type:'Engagement party',guests:90,room:'terrace',sess:'eve',d:61,stage:'confirmed',est:11200,depPaid:-10,depEmailSent:false,look:'Fairy lights, white linen',seg:'Engagements',created:-20},
 {name:'Kara Pty Ltd',contact:'Anna Lee',email:'events@kara.example',phone:'02 8800 1111',type:'Awards dinner',guests:200,room:'grand',sess:'eve',d:-40,stage:'lost',est:26000,look:'',seg:'Corporate',created:-80,lostWhy:'Chose a city venue'}];
 return S.map(function(s,i){
  var date=off(s.d),dep=Math.max(DEPMIN,Math.round(s.est*DEP/10)*10);
  var f={id:'S'+(i+1),ref:'FN-'+date.replace(/-/g,'').slice(2)+'-'+(1000+i*37).toString(36).toUpperCase().slice(-4),
   client:{name:s.name,contact:s.contact||'',email:s.email,phone:s.phone,seg:s.seg},
   type:s.type,guests:s.guests,room:s.room,session:s.sess,date:date,stage:s.stage,estimate:s.est,deposit:dep,look:s.look,
   payments:[],checks:s.checks||{dietary:false,seating:false,runsheet:false,numbers:false},emails:[],timeline:[],done:{},created:off(s.created),notes:'',source:'sample'};
  f.timeline.push({d:f.created,t:'Enquiry from the website: estimate '+money(s.est)});
  if(s.holdExp!=null){f.holdExpires=off(s.holdExp);f.timeline.push({d:off(s.holdExp-7),t:'Date held for 7 days'})}
  if(s.meet){f.meeting={date:off(s.meet.d),time:s.meet.time,mode:s.meet.mode};f.timeline.push({d:off(-5),t:'Consultation booked: '+s.meet.mode+', '+nice(f.meeting.date)+' '+s.meet.time})}
  if(s.depPaid!=null){f.payments.push({d:off(s.depPaid),amt:dep,what:'Deposit'});f.timeline.push({d:off(s.depPaid),t:'Deposit received: '+money(dep)});
   if(s.depEmailSent!==false)f.emails.push({key:'deposit',d:off(s.depPaid)})}
  if(s.paidAll!=null){f.payments.push({d:off(s.paidAll),amt:s.est-dep,what:'Balance'});f.timeline.push({d:off(s.paidAll),t:'Balance received: '+money(s.est-dep)})}
  if(s.stage==='done'&&s.d<-2&&s.d>-30){/* thank-you not yet sent */}
  else if(s.stage==='done'){f.emails.push({key:'thanks',d:add(date,2)})}
  if(s.lostWhy){f.timeline.push({d:off(-30),t:'Lost: '+s.lostWhy})}
  /* pretend earlier reminders were sent so today's list stays realistic */
  if(f.stage==='confirmed'&&diff(date,T)<R.bal1)f.emails.push({key:'bal1',d:add(date,-R.bal1)});
  if(f.stage==='confirmed'&&diff(date,T)<R.dietary&&f.checks.dietary)f.emails.push({key:'dietary',d:add(date,-R.dietary)});
  if(f.stage==='paid'){['bal1','bal2','dietary'].forEach(function(k){f.emails.push({key:k,d:off(-20)})})}
  return f});
}

function tasks(){
 var out=[];
 function push(f,key,due,title,detail,extra){
  if(f.done&&f.done[key])return; if(TPL[key]&&sent(f,key))return;
  var d=diff(due,T); if(d>7)return;
  out.push(Object.assign({f:f,key:key,due:due,days:d,title:title,detail:detail,group:(TPL[key]||{}).group||'Hold and meeting'},extra||{}))}
 allFns().forEach(function(f){
  var dd=f.date?diff(f.date,T):null;
  if(f.stage==='hold'&&f.holdExpires){push(f,'holdwarn',add(f.holdExpires,-R.holdWarn),'Hold expires '+rel(f.holdExpires),who(f)+' · '+f.type+' · '+(f.date?nice(f.date):''));}
  if(f.stage==='hold'&&f.holdExpires&&diff(f.holdExpires,T)<0)push(f,'holdcall',f.holdExpires,'Hold expired: call or release the date',who(f)+' · '+f.type,{call:true});
  if(f.meeting&&(f.stage==='meeting'||f.stage==='hold')&&diff(f.meeting.date,T)>=0){
   push(f,'meeting',add(f.meeting.date,-R.meetRemind),'Meeting '+rel(f.meeting.date)+' at '+f.meeting.time,who(f)+' · '+f.meeting.mode);
   if(diff(f.meeting.date,T)===0)push(f,'meettoday',f.meeting.date,'Meeting today at '+f.meeting.time+': prepare the room tour',who(f)+' · '+f.type+' · '+f.guests+' guests',{call:true});}
  if(f.stage==='enquiry')push(f,'noreply',add(f.created,R.noReply),'No reply since the estimate',who(f)+' · '+f.type+' · '+money(f.estimate));
  if(f.stage==='confirmed'&&!sent(f,'deposit'))push(f,'deposit',T,'Deposit received: send the confirmation',who(f)+' · '+money(f.deposit));
  if((f.stage==='confirmed')&&dd!=null&&balance(f)>0){
   push(f,'bal1',add(f.date,-R.bal1),'Balance reminder: '+money(balance(f))+' due',who(f)+' · function '+rel(f.date));
   if(dd<=R.bal2+7)push(f,'bal2',add(f.date,-R.bal2),'Final balance reminder',who(f)+' · '+money(balance(f))+' outstanding');}
  if((f.stage==='confirmed'||f.stage==='paid')&&dd!=null&&dd>=0){
   if(!f.checks.dietary||!f.checks.seating)push(f,'dietary',add(f.date,-R.dietary),'Dietary list and seating plan',who(f)+' · '+f.type+' '+rel(f.date));
   if(!f.checks.runsheet)push(f,'runsheet',add(f.date,-R.runsheet),'Final details and run sheet',who(f)+' · '+f.type+' '+rel(f.date));
   if(!f.checks.numbers)push(f,'numbers',add(f.date,-R.numbers),'Final guest numbers due',who(f)+' · '+f.guests+' guests booked');}
  if((f.stage==='done'||((f.stage==='paid'||f.stage==='confirmed')&&dd!=null&&dd<0))){
   if(dd>=-30)push(f,'thanks',add(f.date,R.thanks),'Thank-you and review request',who(f)+' · '+f.type+' '+rel(f.date));
   if(/wed/i.test(f.type))push(f,'anniv',add(f.date,R.anniv),'Anniversary offer',who(f)+' · married '+nice(f.date,true));}
 });
 return out.sort(function(a,b){return a.days-b.days});
}

 '<div class="row" style="margin-top:14px"><button class="btn ghost" id="rReset">Back to our timings</button><button class="btn ghost" id="dReset">Reset the demo data</button></div></div>'+
 '<div class="panel" style="max-width:720px;margin-top:16px"><h3>In the live version</h3><p class="sub" style="margin-bottom:0">Holds, meetings and deposits come straight from your website and online payments. Emails go from your own address, and replies come back to your inbox. Your team signs in from any device.</p></div>';
 $$('[data-rule]').forEach(function(i){i.onchange=function(){R[i.dataset.rule]=Math.max(0,+i.value||0);store.set('crm_rules',R);render();toast('Saved')}});

}

render();
if(location.hash){var h=location.hash.slice(1);if(['today','functions','clients','studio','settings'].indexOf(h)>-1)setTab(h)}
})();
