<!doctype html><meta charset="utf-8"><title>bridge</title><meta name="robots" content="noindex">
<script>
// Hands Webescapade's own media files to YouTube Studio (same-owner uploads). Only answers studio.youtube.com, only for /media/ files.
var O='https://studio.youtube.com';
addEventListener('message',function(e){
  if(e.origin!==O||!e.data||typeof e.data.get!=='string'||!/^\/media\/[\w.-]+$/.test(e.data.get))return;
  fetch(e.data.get).then(function(r){if(!r.ok)throw r.status;return r.blob()})
   .then(function(b){e.source.postMessage({ok:true,name:e.data.get.split('/').pop(),blob:b},O)})
   .catch(function(x){e.source.postMessage({ok:false,err:String(x)},O)});
});
if(parent!==window)parent.postMessage({ready:true},O);
</script>
